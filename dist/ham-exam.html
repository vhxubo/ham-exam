<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>业余无线电题库 · HAM Exam</title>
<meta name="description" content="业余无线电台操作技术能力验证刷题（A/B/C 类，2025-10 版题库，含解析）">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Ccircle cx='32' cy='40' r='6' fill='%2334d399'/%3E%3Cpath d='M18 26a20 20 0 0 1 28 0' stroke='%2334d399' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M11 17a30 30 0 0 1 42 0' stroke='%2334d399' stroke-width='5' fill='none' stroke-linecap='round' opacity='.45'/%3E%3C/svg%3E">

<style>
/* HAM Exam — 零依赖刷题站。深色为原生主题，浅色为反转。 */
:root {
  --bg: #0b1220;
  --bg-soft: #111a2e;
  --card: #131d33;
  --card-2: #18233c;
  --line: #233150;
  --ink: #e8edf7;
  --ink-2: #a7b4cc;
  --ink-3: #8493b1;
  --accent: #34d399;
  --accent-ink: #06281c;
  --accent-soft: rgba(52, 211, 153, .14);
  --blue: #7cb2ff;
  --blue-soft: rgba(124, 178, 255, .13);
  --red: #ff7b93;
  --red-soft: rgba(255, 123, 147, .13);
  --amber: #ffce6b;
  --amber-soft: rgba(255, 206, 107, .13);
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --radius: 14px;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
}
html[data-theme="light"] {
  --bg: #f4f2ec;
  --bg-soft: #ecead8;
  --card: #fffdf7;
  --card-2: #f7f4ea;
  --line: #ddd8c8;
  --ink: #1c2434;
  --ink-2: #4d5a72;
  --ink-3: #8b96ab;
  --accent: #0e8a5f;
  --accent-ink: #f2fbf7;
  --accent-soft: rgba(14, 138, 95, .11);
  --blue: #2b5fd9;
  --blue-soft: rgba(43, 95, 217, .10);
  --red: #cc3355;
  --red-soft: rgba(204, 51, 85, .09);
  --amber: #a06800;
  --amber-soft: rgba(160, 104, 0, .11);
  --shadow: 0 10px 26px rgba(60, 55, 30, .12);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.65;
  min-height: 100vh;
}
#app { display: flex; flex-direction: column; min-height: 100vh; }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex; align-items: center; gap: 8px;
  color: var(--accent); text-decoration: none; font-weight: 700; font-size: 17px;
  letter-spacing: .02em; white-space: nowrap;
}
.brand span { color: var(--ink); }
.tabs { display: flex; gap: 2px; margin-left: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  color: var(--ink-2); text-decoration: none; font-size: 14.5px; font-weight: 500;
  padding: 6px 12px; border-radius: 9px; white-space: nowrap;
}
.tabs a:hover { color: var(--ink); background: var(--card); }
.tabs a.active { color: var(--accent); background: var(--accent-soft); }
.top-actions { display: flex; align-items: center; gap: 10px; }
.bank-switch {
  display: flex; background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 2px;
}
.bank-switch button {
  border: 0; background: none; color: var(--ink-2); font: inherit; font-weight: 600;
  font-size: 13px; padding: 4px 10px; border-radius: 8px; cursor: pointer;
}
.bank-switch button.on { background: var(--accent); color: var(--accent-ink); }
.icon-btn {
  border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
  width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { color: var(--ink); }
.icon-btn svg { width: 17px; height: 17px; }

/* ---------- 主区 ---------- */
.view { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: 22px 18px 60px; outline: none; }
.view:focus { outline: none; }
.foot {
  display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  padding: 12px 18px 18px; color: var(--ink-2); font-size: 12px;
  max-width: 860px; margin: 0 auto; width: 100%;
}

h1.page-title { font-size: 22px; margin: 4px 0 18px; letter-spacing: .01em; }
h1.page-title small { color: var(--ink-3); font-weight: 400; font-size: 14px; margin-left: 8px; }

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px 20px;
}
.card + .card { margin-top: 14px; }
.card h2 { font-size: 16px; margin: 0 0 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--line); background: var(--card-2); color: var(--ink);
  font: inherit; font-weight: 600; font-size: 14.5px;
  padding: 9px 18px; border-radius: 11px; cursor: pointer; text-decoration: none;
  transition: transform .06s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.ghost { background: none; }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
.btn.sm { padding: 5px 12px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- 首页 ---------- */
.hero { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.hero h1 { font-size: 26px; margin: 0; letter-spacing: .01em; }
.hero p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.mode-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 560px) { .mode-grid { grid-template-columns: repeat(2, 1fr); } }
.mode-card {
  display: flex; flex-direction: column; gap: 6px; padding: 16px 18px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  text-decoration: none; color: var(--ink); transition: border-color .15s, transform .06s;
}
.mode-card:hover { border-color: var(--accent); }
.mode-card:active { transform: scale(.985); }
.mode-card .t { font-weight: 700; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
.mode-card .d { color: var(--ink-2); font-size: 13px; }
.mode-card svg { width: 18px; height: 18px; color: var(--accent); }
.kv { display: flex; gap: 22px; flex-wrap: wrap; justify-content: space-between; }
.kv .item { display: flex; flex-direction: column; gap: 1px; }
.kv .k { font-size: 12px; color: var(--ink-3); }
.kv .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kv .v small { font-size: 12px; color: var(--ink-3); font-weight: 400; }
.meter { height: 7px; border-radius: 99px; background: var(--card-2); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* ---------- 题目 ---------- */
.q-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip {
  font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
  background: var(--blue-soft); color: var(--blue); white-space: nowrap;
}
.chip.green { background: var(--accent-soft); color: var(--accent); }
.chip.amber { background: var(--amber-soft); color: var(--amber); }
.chip.red { background: var(--red-soft); color: var(--red); }
.chip.plain { background: var(--card-2); color: var(--ink-3); }
.q-text { font-size: 17px; font-weight: 600; line-height: 1.7; margin: 2px 0 16px; }
.q-img { max-width: min(420px, 100%); border-radius: 10px; border: 1px solid var(--line); margin: -6px 0 14px; display: block; }
.opts { display: flex; flex-direction: column; gap: 9px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: left;
  border: 1.5px solid var(--line); background: var(--card-2); color: var(--ink);
  font: inherit; font-size: 15px; line-height: 1.6;
  padding: 11px 14px; border-radius: 12px; cursor: pointer; width: 100%;
}
.opt:hover:not(:disabled) { border-color: var(--ink-3); }
.opt .key {
  flex: none; width: 26px; height: 26px; margin-top: 1px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 8px; background: var(--bg-soft); color: var(--ink-2);
  font-weight: 700; font-size: 13px;
}
.opt.picked { border-color: var(--blue); background: var(--blue-soft); }
.opt.picked .key { background: var(--blue); color: var(--bg); }
.opt.correct { border-color: var(--accent); background: var(--accent-soft); }
.opt.correct .key { background: var(--accent); color: var(--accent-ink); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt.wrong .key { background: var(--red); color: var(--bg); }
.opt:disabled { cursor: default; }
.verdict { display: flex; align-items: center; gap: 8px; font-weight: 700; margin: 16px 0 4px; }
.verdict.ok { color: var(--accent); }
.verdict.no { color: var(--red); }
.explain {
  margin-top: 10px; padding: 13px 15px; border-radius: 12px;
  background: var(--bg-soft); border: 1px solid var(--line);
  font-size: 14px; color: var(--ink-2);
}
.explain b { color: var(--ink); display: block; margin-bottom: 3px; font-size: 13px; }
.explain .mnemonic { color: var(--amber); margin-top: 6px; }
.explain .mnemonic::before { content: "💡 "; }

/* 进度条 */
.drill-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.drill-bar .meter { flex: 1; margin: 0; }
.drill-bar .pos { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.drill-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

/* ---------- 列表（章节/错题/搜索） ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 16px; text-decoration: none; color: var(--ink);
}
.row:hover { border-color: var(--ink-3); }
.row .grow { flex: 1; min-width: 0; }
.row .name { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; }
.row .arrow { color: var(--ink-3); flex: none; }
.mini-meter { width: 92px; height: 6px; border-radius: 99px; background: var(--card-2); overflow: hidden; flex: none; }
.mini-meter i { display: block; height: 100%; background: var(--accent); }
.chap-head {
  display: flex; align-items: baseline; gap: 10px; margin: 22px 0 8px;
  font-size: 15px; font-weight: 700;
}
.chap-head .n { color: var(--ink-3); font-weight: 400; font-size: 12.5px; }
.empty { text-align: center; color: var(--ink-3); padding: 46px 0; font-size: 14px; }
.empty svg { width: 44px; height: 44px; display: block; margin: 0 auto 10px; opacity: .5; }

/* ---------- 考试 ---------- */
.exam-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.timer {
  font-family: var(--mono); font-size: 20px; font-weight: 700;
  font-variant-numeric: tabular-nums; letter-spacing: .03em;
  padding: 4px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line);
}
.timer.low { color: var(--red); border-color: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; margin-top: 14px; }
.exam-grid button {
  aspect-ratio: 1; border-radius: 9px; border: 1.5px solid var(--line);
  background: var(--card-2); color: var(--ink-2); font: inherit; font-size: 13px;
  font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums;
}
.exam-grid button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.exam-grid button.cur { outline: 2px solid var(--blue); outline-offset: 1px; }
.exam-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.score-hero { text-align: center; padding: 26px 0 10px; }
.score-hero .big { font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.score-hero .big.ok { color: var(--accent); }
.score-hero .big.no { color: var(--red); }
.score-hero .sub { color: var(--ink-2); font-size: 14px; }
.bar-rows { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13.5px; }
.bar-row .nm { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .pc { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bar-row .meter { grid-column: 1 / -1; margin: 0; }

/* ---------- 表单/杂项 ---------- */
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.seg button { border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.rule-note { font-size: 13px; color: var(--ink-2); background: var(--bg-soft); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
  background: var(--card); border: 1px solid var(--line); color: var(--ink);
  box-shadow: var(--shadow); padding: 10px 20px; border-radius: 12px; font-size: 14px;
  z-index: 100; max-width: 86vw;
}
.dialog-mask {
  position: fixed; inset: 0; background: rgba(4, 8, 16, .6); z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.dialog {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 22px 24px; max-width: 420px; width: 100%;
}
.dialog h3 { margin: 0 0 8px; font-size: 17px; }
.dialog p { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; }
input[type="search"], input[type="text"] {
  font: inherit; color: var(--ink); background: var(--card-2);
  border: 1.5px solid var(--line); border-radius: 11px; padding: 9px 14px; width: 100%;
}
input[type="search"]:focus { outline: none; border-color: var(--blue); }
.search-bar { display: flex; gap: 10px; margin-bottom: 16px; }
mark { background: var(--amber-soft); color: var(--amber); border-radius: 3px; padding: 0 2px; }

@media (max-width: 640px) {
  .topbar { flex-wrap: wrap; padding: 10px 14px; gap: 8px; }
  .brand span { display: none; }
  .tabs { order: 3; width: 100%; }
  .view { padding: 16px 14px 48px; }
  .q-text { font-size: 16px; }
  .exam-grid { grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); }
  .kv { gap: 16px; }
}

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="首页">
      <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><circle cx="32" cy="40" r="6" fill="currentColor"/><path d="M18 26a20 20 0 0 1 28 0" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M11 17a30 30 0 0 1 42 0" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round" opacity=".45"/></svg>
      <span>HAM 题库</span>
    </a>
    <nav class="tabs" id="nav">
      <a href="#/home" data-view="home">首页</a>
      <a href="#/chapters" data-view="chapters">章节</a>
      <a href="#/wrong" data-view="wrong">错题本</a>
      <a href="#/exam" data-view="exam">模拟考试</a>
      <a href="#/stats" data-view="stats">统计</a>
      <a href="#/search/" data-view="search">搜索</a>
    </nav>
    <div class="top-actions">
      <div class="bank-switch" id="bankSwitch" role="tablist" aria-label="题库切换"></div>
      <button class="icon-btn" id="themeBtn" title="主题" aria-label="切换主题"></button>
    </div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
  <footer class="foot">
    <span>题库版本 2025-10（CRAC）· 数据仅供学习</span>
    <span id="footState"></span>
  </footer>
</div>

<script>
window.BANKS=window.BANKS||{};window.BANKS['a']={"id":"a","cls":"A","label":"A 类","version":"2025-10","rule":{"total":40,"singles":32,"multiples":8,"minutes":40,"pass":30},"chapters":{"1":"法律法规与频率管理","2":"操作技术与通联规范","3":"收发信机、天线与馈线","4":"电工电子技术基础","5":"安全防护与电磁环境"},"sections":{"1.1":"无线电管理法规体系与频率划分概念","1.2":"业余无线电台的设置许可与执照","1.3":"操作技术能力验证与 A/B/C 分类","1.4":"业余无线电台呼号","1.5":"业余电台的合法使用与操作规范","1.6":"监督检查与法律责任","1.7":"业余频率的使用规则","2.1":"ITU 分区与字母解释法","2.2":"通联程序与通信日志","2.3":"频率的守听与礼让","2.4":"Q 简语与通信缩语","2.5":"发射类别（emission designator）","2.6":"数字通信模式","3.1":"收发信机及周边设备","3.3":"天线、馈线与电波传播","3.6":"发射调测与收发信机指标","3.8":"卫星通信","4.1":"电工电子基础","4.6":"测量仪表","5.1":"安全防护与电磁环境"},"qs":[{"i":"A-1","j":"LY0001","p":"1.1.1","q":"我国专门针对无线电管理的行政法规及其制定机构是：","o":["《中华人民共和国无线电管理条例》","《中华人民共和国无线电管理办法》","国务院和中央军委","工业和信息化部"],"a":[0,2],"e":"专门针对无线电管理的行政法规是《中华人民共和国无线电管理条例》，由国务院和中央军事委员会制定（AC）。行政法规只能由国务院制定，工信部只能制定部门规章，故D错；B项文件名称根本不存在，故B错。","m":"条例=行政法规，制定者=国务院+中央军委","g":""},{"i":"A-2","j":"LY0002","p":"1.1.1","q":"我国专门针对业余无线电台的管理文件及其制定机构分别是：","o":["《业余无线电台管理办法》","《业余无线电台管理暂行规定》","工业和信息化部","国务院"],"a":[0,2],"e":"业余电台的管理文件是《业余无线电台管理办法》，制定机构是工业和信息化部（AC）。该文件属于部门规章，由工信部制定而非国务院，故D错；B项《暂行规定》是旧称，现行名称为“管理办法”，故B错。","m":"办法是部门规章，制定者=工信部","g":""},{"i":"A-3","j":"LY0004","p":"1.1.1","q":"我国依法负责对业余无线电台实施监督管理的机构是：","o":["国家无线电管理机构和省、自治区、直辖市无线电管理机构","在国家或地方民政部门注册的业余无线电协会","国家体育管理机构和地方体育管理机构","国家和地方公安部门"],"a":[0],"e":"依法对业余无线电台实施监督管理的是国家无线电管理机构和省、自治区、直辖市无线电管理机构（A）。业余无线电协会是民间组织无执法权，体育机构和公安部门也不负责业余电台管理，故B、C、D均错。","m":"监管靠两级：国家无委+省级无委","g":""},{"i":"A-4","j":"LK0007","p":"1.1.1","q":"我国对无线电管理术语“业余业务”、“卫星业余业务”和“业余电台”做出具体定义的法规文件是：","o":["《中华人民共和国无线电频率划分规定》","《中华人民共和国无线电管理条例》","《中华人民共和国电信条例》","《无线电台执照管理规定》"],"a":[0],"e":"“业余业务”“卫星业余业务”“业余电台”的具体定义出自《中华人民共和国无线电频率划分规定》（A），这是我国频率划分与业务定义的基准文件。《无线电管理条例》只作原则性规定而不给术语定义，故B错；C、D文件与术语定义无关。","m":"业务术语定义，看频率划分规定","g":""},{"i":"A-5","j":"LX","p":"1.1.1","q":"最新发布的《业余无线电台管理办法》自何时开始施行：","o":["自 2024年 3月 1日起施行","自 2024年 12月 1日起施行","自 2025年 3月 1日起施行","自 2025年 12月 1日起施行"],"a":[0],"e":"最新版《业余无线电台管理办法》自2024年3月1日起施行（A）。该日期是部令公布的明确施行日，2024年12月1日、2025年两个日期均无依据，故B、C、D错。","m":"新版办法施行日：2024年3月1日","g":""},{"i":"A-6","j":"LY0113","p":"1.1.2","q":"将某个特定的频段列入频率划分表，规定该频段可在指定的条件下供一种或多种地面或空间无线电通信业务或射电天文业务使用，这个过程称为：","o":["划分","分配","指配","授权"],"a":[0],"e":"将频段列入频率划分表、规定供一种或多种业务使用的过程称为“划分”（A）。划分的对象是业务；B“分配”是把频率给部门或区域使用，C“指配”是批准给具体电台，D“授权”不是无线电管理的专用术语。","m":"划分—分给业务，分饼给业务","g":""},{"i":"A-7","j":"LY0114","p":"1.1.2","q":"将无线电频率或频道规定由一个或多个部门，在指定的区域内供地面或空间无线电通信业务在指定条件下使用，这个过程称为：","o":["分配","划分","指配","授权"],"a":[0],"e":"把频率或频道规定由一个或多个部门在指定区域内使用的过程称为“分配”（A）。分配的对象是部门/区域，区别于A项“划分”（对象是业务）和C项“指配”（对象是具体电台），故B、C错；D“授权”非专用术语。","m":"分配—配给部门和区域","g":""},{"i":"A-8","j":"LY0115","p":"1.1.2","q":"将无线电频率或频道批准给无线电台在规定条件下使用，这个过程称为：","o":["指配","划分","分配","授权"],"a":[0],"e":"把频率或频道批准给具体无线电台在规定条件下使用的过程称为“指配”（A）。指配是管理的最末一环、对象精确到台站；B“划分”对象是业务、C“分配”对象是部门区域，均错；D“授权”非专用术语。","m":"指配—指定到具体电台","g":""},{"i":"A-9","j":"LK0140","p":"1.1.2","q":"在频率划分表中，一个频段被标明划分给多种业务时，这些业务被分为下述类别：","o":["主要业务和次要业务","业余业务和非业余业务","民用业务和军用业务","安全业务和一般业务"],"a":[0],"e":"同一频段划分给多种业务时，业务分为主要业务和次要业务两类（A），次要业务不得对主要业务造成有害干扰。B、C、D的分类方式在频率划分表中不存在，故错。","m":"一频多业务：分主要和次要","g":""},{"i":"A-10","j":"LK0125","p":"1.1.2","q":"辐射（radiation）是指任何源的能量流以无线电波的形式向外发出。正确的说法是：","o":["闪电产生的电磁波干扰是一种辐射","沿电源线窜入接收机的差模干扰是一种辐射","射频电路中变压器内磁芯里的磁场是一种辐射","射频电路中电容器内极板间的电场是一种辐射"],"a":[0],"e":"辐射是指能量流以无线电波形式向外发出，闪电产生的电磁波干扰符合定义（A）。B项沿电源线窜入的是传导干扰而非辐射；C、D是器件内部的磁场/电场，没有向外发出无线电波，故错。","m":"辐射=能量向外发出无线电波","g":""},{"i":"A-11","j":"LK0126","p":"1.1.2","q":"发射（emission）是指：由无线电发信电台产生的辐射或辐射产物。正确的说法是：","o":["业余电台向周围发送的杂散产物是一种发射","无线电接收机本地振荡器辐射的能量是一种发射","医用高频电疗机向周围发送的无线电波能量是一种发射","闪电产生的电磁波干扰是一种发射"],"a":[0],"e":"发射专指由无线电发信电台产生的辐射或辐射产物，业余电台的杂散产物属于发射（A）。B项接收机本振辐射、C项医用高频设备、D项闪电均不是“发信电台”产生的，故不属于发射。","m":"发射专指发信电台的辐射","g":""},{"i":"A-12","j":"LX","p":"1.1.2","q":"下列关于无线电的一般术语，说法正确的是：","o":["无线电测定是指利用无线电波的传播特性测定目标的位置、速度和/或其他特性，或获得与这些参数有关的信息","无线电导航是指用于导航（包括障碍物告警）的无线电测定","无线电定位是指用于除无线电导航以外的无线电测定","无线电测向是指利用接收无线电波来确定一个电台或目标的方向的无线电测定"],"a":[0,1,2,3],"e":"四个选项均正确（ABCD）。无线电测定是总概念（利用无线电波传播特性测位置、速度等）；无线电导航是用于导航的测定；无线电定位是除导航外的测定；无线电测向是用接收无线电波确定方向的测定，四者定义互不冲突。","m":"测定总纲：导航+定位+测向","g":""},{"i":"A-13","j":"LX","p":"1.1.2","q":"关于业余无线电台，下列说法正确的是：","o":["业余无线电台是指为开展业余业务（含卫星业余业务）使用的一个或者多个发信机、收信机，或者发信机与收信机的组合（包括附属设备）","一个业余无线电台只能包含一个发信机","一个业余无线电台只能包含一个收信机","一个业余无线电台只能包含一个发信机和一个收信机"],"a":[0],"e":"业余无线电台指为开展业余业务（含卫星业余业务）使用的一台或多台发信机、收信机或其组合（含附属设备）（A）。B、C、D用“只能包含一个”限定数量，与“一个或者多个”的法定定义直接矛盾，故错。","m":"业余电台=一台或多台收发信机","g":""},{"i":"A-14","j":"LX","p":"1.1.2","q":"关于业余业务、卫星业余业务，下列说法正确的是：","o":["业余业务是指供业余无线电爱好者进行自我训练、相互通信和技术研究的无线电通信业务","卫星业余业务是指利用地球卫星上的空间电台开展与业余业务相同目的的无线电通信业务","业余无线电爱好者可以在业余业务、卫星业余业务以及其他的无线电业务相互通信","业余无线电台可以在业余业务、卫星业余业务以及其他的无线电业务进行通信"],"a":[0,1],"e":"业余业务是供爱好者自我训练、相互通信和技术研究的无线电通信业务；卫星业余业务是利用卫星空间电台开展相同目的的业务（AB）。C、D错在“以及其他无线电业务”——业余电台只能在业余业务和卫星业余业务内通信。","m":"业余业务三目的：训练、通信、研究","g":""},{"i":"A-15","j":"LX","p":"1.1.2","q":"关于业余无线电爱好者的定义，下列说法正确的是：","o":["业余无线电爱好者系指经正式批准的、对无线电技术有兴趣的人","其兴趣纯系个人爱好而不涉及谋取利润","其兴趣纯系个人爱好可涉及谋取利润","只有成年人能成为业余无线电爱好者"],"a":[0,1],"e":"业余无线电爱好者是经正式批准、对无线电技术有兴趣的人，其兴趣纯系个人爱好而不涉及谋取利润（AB）。C错在“可涉及谋取利润”，与非营利性质矛盾；D错，法规对爱好者身份没有年龄限制。","m":"爱好者=批准+兴趣+不图利","g":""},{"i":"A-16","j":"LX","p":"1.1.2","q":"关于发射类别，下列说法正确的是：","o":["是指用标准符号标示的某发射的一组特性","标示的特性包含主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性","一个业余无线电台只能包含一个收信机","一个业余无线电台只能包含一个发信机和一个收信机"],"a":[0,1],"e":"发射类别是用标准符号标示的某发射的一组特性，包括主载波调制方式、调制信号、被发送信息的类型及其他信号特性（AB）。C、D谈的是电台收发信机数量，与发射类别的定义无关，是干扰项。","m":"发射类别=发射特性的一组符号","g":""},{"i":"A-17","j":"LX","p":"1.1.2","q":"关于单边带发射，下列说法正确的是：","o":["单边带发射是只传送一个边带的调幅发射","单边带发射是只传送一个边带的调频发射","单边带发射是不传送载波的调幅发射","单边带发射是不传送载波的调频发射"],"a":[0],"e":"单边带发射是指只传送一个边带的调幅发射（A）。SSB是调幅AM的衍生方式，取上边带或下边带之一，故B、D的“调频”错；C错在把“不传送载波”当定义，抑制载波是常见做法但不是定义本身。","m":"单边带=调幅只取一个边带","g":""},{"i":"A-18","j":"LX","p":"1.1.2","q":"关于干扰的定义，下列说法正确的是：","o":["由于一种或多种发射、辐射、感应或其组合所产生的无用能量对无线电通信系统的接收产生的影响","表现为性能下降、误解或信息丢失","若不存在这种无用能量，则此后果可以避免","不会对无线电通信系统的接收产生的影响"],"a":[0,1,2],"e":"干扰是由无用能量对接收产生的影响，表现为性能下降、误解或信息丢失，且若无该无用能量后果可避免（ABC）。D项“不会对接收产生影响”直接否定了干扰的定义，故错。","m":"干扰=无用能量使接收变差","g":""},{"i":"A-19","j":"LX","p":"1.1.2","q":"关于有害干扰的定义，下列说法正确的是：","o":["危害无线电导航或其他安全业务的正常运行的干扰","严重地损害、阻碍、或一再阻断按规定正常开展的无线电通信业务的干扰","产生有害干扰不会受到处罚","使用业余无线电台时，只要不对其他业余无线电台产生干扰即可"],"a":[0,1],"e":"有害干扰指危害无线电导航等安全业务正常运行，或严重损害、阻碍、一再阻断正常无线电通信业务的干扰（AB）。C错，产生有害干扰要受处罚；D错，业余电台不得对任何电台造成有害干扰，不限于业余电台。","m":"有害干扰=害安全、断正常通信","g":""},{"i":"A-20","j":"LX","p":"1.1.2","q":"关于次要业务台站，下列说法正确的是：","o":["不得对业经指配或将来可能指配频率的主要业务电台产生有害干扰","不得对来自业经指配或将来可能指配频率的主要业务电台的有害干扰提出保护要求","可要求保护不受来自将来可能指配频率的同一业务或其他次要业务电台的有害干扰","使用业余无线电台时，只要不对其他业余无线电台产生干扰即可"],"a":[0,1,2],"e":"次要业务台站不得对主要业务电台产生有害干扰，也不得就主要业务的有害干扰要求保护，但可要求保护不受将来同业务或次要业务台站的有害干扰（ABC）。D错，业余电台的干扰义务不限于业余电台之间。","m":"次要业务：不扰主要，不求保护","g":""},{"i":"A-21","j":"LK0177","p":"1.1.2","q":"协调国际无线电管理的国际组织是：","o":["国际电信联盟","国际业余无线电联盟","联合国大会","联合国科教文组织"],"a":[0],"e":"协调国际无线电管理的国际组织是国际电信联盟ITU（A），它制定《无线电规则》并分配全球频率。B国际业余无线电联盟是爱好者组织，C联合国大会、D教科文组织均不负责无线电管理。","m":"国际无线电协调=国际电信联盟","g":""},{"i":"A-22","j":"LK0178","p":"1.1.2","q":"国际业余无线电联盟支持会员协会在发展业余无线电时把它看成一种：","o":["国家资源","拉动经济的措施","休闲娱乐手段","国防后备队伍"],"a":[0],"e":"国际业余无线电联盟（IARU）主张把业余无线电看作一种国家资源（A），以争取各国政策支持。B、C、D（拉动经济、休闲娱乐、国防后备）都不是IARU的正式定位。","m":"IARU：业余无线电是国家资源","g":""},{"i":"A-23","j":"LK0182","p":"1.1.2","q":"下述通信不属于电信（telecommunication）范畴：","o":["邮政通信","有线通信","无线电通信","光通信"],"a":[0],"e":"电信是指利用有线、无线电、光等电磁系统传送信息的通信，邮政通信不靠电磁系统传送信息，故不属于电信（A）。B、C、D（有线、无线电、光通信）都属于电信范畴。","m":"邮政不算电信，电信靠电磁传信","g":""},{"i":"A-24","j":"LK0183","p":"1.1.2","q":"关于无线电通信的正确说法：","o":["无线电通信是指利用无线电波进行的符号、信号、文字、图像、声音或其他信息的传输、发射或接收","无线电通信包括利用光在内的所有电磁波所进行的各种通信","利用无线电波进行的符号、信号、文字、图像、声音以外的信息传输不属于无线电通信","产生无线电波并用其加热属于无线电通信的一种应用"],"a":[0],"e":"无线电通信专指利用无线电波进行的符号、信号、文字、图像、声音等信息的传输、发射或接收（A）。B错，光通信不属于无线电通信；C错，信息类型不限于所列举；D错，加热应用不属于“通信”。","m":"无线电通信=用无线电波传信息","g":""},{"i":"A-25","j":"LK0184","p":"1.1.2","q":"关于地面无线电通信（terrestrial radio communication）的正确说法是：","o":["航空通信属于地面无线电通信","水上通信不属于地面无线电通信","业余电台之间所进行的任何无线电通信都属于地面无线电通信","依靠电离层反射的天波所进行的通信不属于地面无线电通信"],"a":[0],"e":"地面无线电通信指在地球表面及大气层内进行的无线电通信，航空通信属于此类（A）。B错，水上通信也属于；C错，卫星通信不属于地面无线电通信；D错，天波通信仍属地面无线电通信。","m":"地面通信含航空水上，不含卫星","g":""},{"i":"A-26","j":"LK0187","p":"1.1.2","q":"无线电波是指：","o":["频率为 3,000GHz以下的在空间传播的电磁波","频率为 3,000GHz以下的所有电磁波","频率为 30Hz至 30GHz的在空间传播的电磁波","频率为 3,000Hz至 3,000MHz的电磁波"],"a":[0],"e":"无线电波指频率3000GHz以下、在空间传播的电磁波（A）。B错在漏掉“在空间传播”的限定；C、D的频率范围（30Hz–30GHz、3kHz–3000MHz）都窄于法定定义，故错。","m":"无线电波=3000GHz以下空间传播","g":""},{"i":"A-27","j":"LY0023","p":"1.2.1","q":"个人设置、使用业余无线电台应当向无线电管理机构提交的材料为：","o":["一份申请表","身份证明复印件；申请人为未成年人的，还应当提交其监护人身份证明复印件，以及申请人与监护人关系的说明材料","无线电发射设备相关说明材料","本人写的申请书，操作证书的原件、复印件"],"a":[0,1,2],"e":"个人申请需提交：申请表；身份证明复印件（未成年人还需监护人身份证明及关系说明材料）；无线电发射设备相关说明材料（ABC）。D错，“本人申请书、操作证书原件复印件”不是新版办法要求的申请材料。","m":"个人三件套：申请表+身份+设备说明","g":""},{"i":"A-28","j":"LX","p":"1.2.1","q":"单位设置、使用业余无线电台应当向无线电管理机构提交的材料为：","o":["一份申请表","无线电发射设备相关说明材料","单位营业执照等复印件，以及业余无线电台技术负责人为本单位工作人员的说明材料","业余无线电台技术负责人写的申请书，操作证书的原件、复印件"],"a":[0,1,2],"e":"单位申请需提交：申请表；无线电发射设备相关说明材料；单位营业执照等复印件及技术负责人为本单位工作人员的说明材料（ABC）。D错，技术负责人的申请书和操作证书原件不是法定申请材料。","m":"单位三件套：申请表+执照+设备说明","g":""},{"i":"A-29","j":"LX","p":"1.2.1","q":"设置、使用业余无线电台，下列哪些条件符合规定：","o":["使用的无线电发射设备依法取得型号核准","型号核准证载明的频率范围包含业余业务频段","使用的自制、改装、拼装等未取得型号核准的无线电发射设备符合国家标准和国家无线电管理规定","使用的自制、改装、拼装等未取得型号核准的无线电发射设备的无线电发射频率范围仅限于业余业务频段"],"a":[0,1,2,3],"e":"四项条件都符合规定（ABCD）：设备须依法取得型号核准且核准频率范围包含业余频段；自制、改装、拼装等未核准设备须符合国家标准和无线电管理规定，且发射频率范围仅限于业余业务频段。","m":"设备要么有核准，要么限业余频段","g":""},{"i":"A-30","j":"LX","p":"1.2.1","q":"设置、使用业余无线电台拟使用自制、改装、拼装等未取得型号核准的无线电发射设备的，无线电管理机构开展对该设备进行技术检测时：","o":["不得收取任何费用","收取技术检测费","根据业余无线电台类型进行收费","根据爱好者操作类别进行收费"],"a":[0],"e":"对自制、改装、拼装等未取得型号核准的设备进行技术检测时，无线电管理机构不得收取任何费用（A）。这是新版办法明确的免费条款，B、C、D的各类收费说法均错。","m":"自制设备检测，一律免费","g":""},{"i":"A-31","j":"LX","p":"1.2.1","q":"设置、使用 15瓦以上短波业余无线电台以及涉及国家主权、安全的其他重要业余无线电台的，下列说法正确的是：","o":["由国家无线电管理机构作出许可决定","可以委托电台所在地或者申请人住所地的省、自治区、直辖市无线电管理机构对业余无线电台的使用方式、技术条件、安装环境等进行现场核查","由省、自治区、直辖市无线电管理机构作出许可决定","持有 A类业余无线电台操作技术能力验证证书即可申请"],"a":[0,1],"e":"15瓦以上短波业余电台及涉及国家主权、安全的其他重要电台，由国家无线电管理机构作出许可决定，并可委托所在地或申请人住所地省局现场核查（AB）。C错在许可机关，D错在A类证书无权申请此类电台。","m":"15瓦以上短波，归国家局许可","g":""},{"i":"A-32","j":"LX","p":"1.2.1","q":"业余无线电台执照载明了哪些事项：","o":["电台设置、使用人，操作技术能力类别、编号","电台呼号、台址/设置区域、使用频率、发射功率","执照编号、颁发日期、有效期、发证机关，以及特别规定事项","业余中继台、业余信标台执照还应当载明工作模式等事项"],"a":[0,1,2,3],"e":"四项均为执照载明事项（ABCD）：设台人、操作技术能力类别编号；呼号、台址/区域、频率、功率；执照编号、颁发日期、有效期、发证机关及特别规定；中继台、信标台还载明工作模式等。","m":"执照载明：人、证、号、址、频、率","g":""},{"i":"A-33","j":"LX","p":"1.2.1","q":"业余无线电台执照的有效期不超过：","o":["5年","1年","2年","3年"],"a":[0],"e":"业余无线电台执照有效期不超过5年（A）。1年、2年、3年均与法定上限不符，故B、C、D错。","m":"执照有效期：最长五年","g":""},{"i":"A-34","j":"LX","p":"1.2.1","q":"关于业余无线电台执照，下列说法正确的是：","o":["业余无线电台执照可以采用纸质或者电子形式","纸质或者电子业余无线电台执照具有同等法律效力","执照样式由国家无线电管理机构统一规定","业余无线电台执照终身有效"],"a":[0,1,2],"e":"执照可采用纸质或电子形式，两者同等法律效力，样式由国家无委统一规定（ABC）。D错，执照有有效期限制，并非终身有效。","m":"纸电同效，样式全国统一","g":""},{"i":"A-35","j":"LX","p":"1.2.1","q":"关于新版《业余无线电台管理办法》，下列说法正确的是：","o":["新版《办法》施行前依法取得业余无线电台执照的，在执照有效期内可以按照执照载明的参数使用业余无线电台","2012年 11月 5日公布的《业余无线电台管理办法》（工业和信息化部令第 22号）同时废止","新版《办法》自 2025年 3月 1日起施行","新版《办法》施行前依法取得业余无线电台执照的，在执照有效期内需按照新版《办法》使用业余无线电台"],"a":[0,1],"e":"新版办法施行前已依法取得执照的，在有效期内可按执照载明参数使用，且2012年部令第22号旧办法同时废止（AB）。C错，施行日是2024年3月1日；D错，过渡期内不强制按新办法变更使用。","m":"旧执照过渡：按原参数用到期","g":""},{"i":"A-36","j":"LK0027","p":"1.2.1","q":"独立操作具有发信功能业余无线电台的年龄条件是：","o":["具备《业余无线电台操作证书》者操作业余无线电台不受年龄限制","年满十四周岁","年满十六周岁","年满十八周岁"],"a":[0],"e":"具备《业余无线电台操作证书》（验证证书）者操作业余电台不受年龄限制（A），未成年人持证也可独立操作。B、C、D设定的14/16/18周岁门槛在法规中不存在。","m":"持证操作，不限年龄","g":""},{"i":"A-37","j":"LY0026","p":"1.2.1","q":"个人申请设置、使用具有发信功能的业余无线电台的年龄条件是：","o":["未成年人可以申请设置、使用规定条件内的业余无线电台","年满十四周岁","年满十六周岁","年满十八周岁"],"a":[0],"e":"未成年人可以申请设置、使用规定条件内的业余无线电台（A），法规未设最低年龄门槛。B、C、D的14/16/18周岁说法均无依据。","m":"未成年人可按规定设台","g":""},{"i":"A-38","j":"LX","p":"1.2.1","q":"设置、使用有固定台址的业余无线电台，应当向哪个机构提出申请：","o":["电台所在地的省、自治区、直辖市无线电管理机构","设台地的地方无线电民间机构","中国无线电协会","国家无线电管理机构"],"a":[0],"e":"有固定台址的业余电台向电台所在地的省、自治区、直辖市无线电管理机构申请（A）。B民间机构、C协会无许可权；D国家局只管15瓦以上短波等特殊电台，故错。","m":"有固定台址：向设台地省局申请","g":""},{"i":"A-39","j":"LX","p":"1.2.1","q":"设置、使用没有固定台址的业余无线电台，应当向哪个机构提出申请：","o":["申请人住所地的省、自治区、直辖市无线电管理机构","申请人住所地的地方无线电民间机构","中国无线电协会","国家无线电管理机构"],"a":[0],"e":"没有固定台址的业余电台向申请人住所地的省、自治区、直辖市无线电管理机构申请（A）。B民间机构、C协会无许可权；D国家局不管普通电台，故错。","m":"无固定台址：向住所地省局申请","g":""},{"i":"A-40","j":"LY0041","p":"1.2.1","q":"设置、使用业余无线电台，设置业余无线电台应当具备的条件有：","o":["熟悉无线电管理规定","具有相应的操作技术能力，通过相应的操作技术能力验证","使用的无线电发射设备依法取得型号核准，的自制、改装、拼装设备符合国家标准和国家无线电管理规定","加入指定协会、具备当地无线电管理机构规定的操作技术能力"],"a":[0,1,2],"e":"设台条件包括：熟悉无线电管理规定；具有相应操作技术能力并通过验证；设备依法取得型号核准，自制等设备符合国家标准和管理规定（ABC）。D错，法规不要求加入指定协会。","m":"设台三条件：懂规定、有能力、设备合规","g":""},{"i":"A-41","j":"LY0044","p":"1.2.2","q":"业余无线电台执照有效期届满后需要继续使用的，应当在下列期限内向作出许可决定的无线电管理机构申请更换业余无线电台执照：","o":["期限届满 30个工作日前","有效期届满半年之内","有效期届满两个月之内","有效期届满三个月之内"],"a":[0],"e":"执照有效期届满需继续使用的，应在届满30个工作日前向作出许可决定的无委申请更换执照（A）。“半年内”“两个月内”“三个月内”均与法定期限不符，故B、C、D错。","m":"换执照：到期前30个工作日申请","g":""},{"i":"A-42","j":"LY0045","p":"1.2.2","q":"变更业余无线电台执照载明事项的，应当办理下列手续：","o":["及时向作出许可决定的无线电管理机构申请办理变更手续","等执照有效期届满时向核发执照的无线电管理机构申请办理变更手续，换发业余无线电台执照","只要设备型号和产品序列号没有改变，不必申请办理变更手续","只需向核发执照的无线电管理机构进行备案"],"a":[0],"e":"变更执照载明事项应及时向作出许可决定的无委申请办理变更手续（A）。B错，不能等到届满才办；C错，载明事项变更无论设备是否更换都要办；D错，备案不能代替变更许可。","m":"事项变更：及时向原许可机关申请","g":""},{"i":"A-43","j":"LY0046","p":"1.2.2","q":"终止使用业余无线电台的，应向下列哪个机构办理业余无线电台执照注销手续：","o":["作出许可决定的无线电管理机构","国家无线电管理机构","中国无线电协会","地方无线电管理机构所委托的其他单位"],"a":[0],"e":"终止使用业余电台，应向作出许可决定的无线电管理机构办理执照注销手续（A）。B国家局只管特殊电台，C协会、D受托单位均无权办理注销。","m":"注销执照：找原许可机关","g":""},{"i":"A-44","j":"LY0046","p":"1.2.2","q":"关于终止使用业余无线电台的，下列说法正确的是：","o":["应当及时向作出许可决定的无线电管理机构办理业余无线电台执照注销手续","交回执照并自执照注销之日起 60个工作日内拆除业余无线电台及天线等附属设备并妥善处理","交回执照并自执照注销之日起 6个月内拆除业余无线电台及天线等附属设备并妥善处理","只需交回执照"],"a":[0,1],"e":"终止使用应及时办理注销、交回执照，并自注销之日起60个工作日内拆除电台及天线等附属设备并妥善处理（AB）。C错在“6个月”期限；D错，只交回执照而不拆除不符合要求。","m":"注销后60个工作日内拆除设备","g":""},{"i":"A-45","j":"LX","p":"1.2.4","q":"关于业余中继台的说法下列错误的是：","o":["通过对业余无线电信号接收和放大转发，扩大通联范围的业余无线电台","通过发射信标信号，辅助验证电波传播条件的单发业余无线电台","通过对业余无线电信号接收和衰减转发，缩小通联范围的业余无线电台","通过接收信标信号，辅助验证电波传播条件的单发业余无线电台"],"a":[1,2,3],"e":"中继台的正确定义是A（接收并放大转发，扩大通联范围）；B是信标台的定义；C错在“衰减转发、缩小范围”与中继作用相反；D错在“接收信标信号”，信标台是发射而非接收。题目问“错误的是”，故选BCD。","m":"中继=放大转发扩大范围","g":""},{"i":"A-46","j":"LX","p":"1.2.4","q":"关于业余信标台的说法下列错误的是：","o":["通过发射信标信号，辅助验证电波传播条件的单发业余无线电台","通过接收信标信号，辅助验证电波传播条件的单发业余无线电台","通过对业余无线电信号接收和放大转发，扩大通联范围的业余无线电台","通过对业余无线电信号接收和衰减转发，缩小通联范围的业余无线电台"],"a":[1,2,3],"e":"信标台的正确定义是A（发射信标信号、辅助验证传播条件的单发电台）；B错在“接收”；C是中继台的定义；D错在“衰减、缩小范围”。题目问“错误的是”，故选BCD。","m":"信标=单发信号验传播","g":""},{"i":"A-47","j":"LX","p":"1.2.4","q":"关于业余中继台哪下列哪些选项正确：","o":["向其覆盖区域内的业余无线电台提供平等的服务","台址布局应当符合资源共享、集约的要求","仅设置申请人的团队成员优先使用，空闲时方供其他业余电台使用","因中继台购买和维护需要成本，要求业余电台必须付费使用中继台"],"a":[0,1],"e":"中继台应向覆盖区内业余电台提供平等服务，台址布局符合资源共享、集约要求（AB）。C错，中继台不得搞成员优先；D错，不得强制收费，故C、D错。","m":"中继台：平等服务，不得收费","g":""},{"i":"A-48","j":"LX","p":"1.2.4","q":"关于设置业余中继台下列说法正确的是：","o":["台址布局应当符合资源共享、集约的要求","应当向其覆盖区域内的业余无线电台提供平等的服务","明确设台地点、使用频率、技术参数等设置、使用和运行维护要求并向社会公布","业余中继台服务区域超出本行政区域的，应当与地方无线电管理机构做好协调"],"a":[0,1,2,3],"e":"四项都正确（ABCD）：台址布局资源共享集约；向覆盖区内电台平等服务；明确设台地点、频率、技术参数等要求并公布；服务区域超本行政区域时与地方无委协调。","m":"中继设置四要求：共享、平等、公开、协调","g":""},{"i":"A-49","j":"LK0034","p":"1.2.4","q":"业余中继台的设置和技术参数等应满足下列关键条件：","o":["符合国家以及设台地的地方无线电管理机构的规定","符合设台地的地方业余无线电民间组织的规划","仅需符合设台地的地方无线电管理机构的规划及相关规定","符合申请人关于设置中继台的客观需求和技术考虑"],"a":[0],"e":"中继台的设置和技术参数应符合国家以及设台地的地方无委的规定（A）。B民间组织规划、C仅地方规定、D申请人主观需求都没有法定效力，故错。","m":"中继台参数：符合国家+地方无委规定","g":""},{"i":"A-50","j":"LY0020","p":"1.3.1","q":"可以组织 A类和 B类业余无线电台操作技术能力验证的机构是：","o":["国家无线电管理机构和省、自治区、直辖市无线电管理机构","省、自治区、直辖市无线电管理机构","地方教育、体育机构及其相关民间组织","地方业余无线电协会"],"a":[0],"e":"可组织A类和B类验证的是国家无委和省、自治区、直辖市无委（A）。B漏了国家局；C教育体育机构、D地方协会均无权组织验证。","m":"A、B类验证：国家+省级无委组织","g":""},{"i":"A-51","j":"LY0021","p":"1.3.1","q":"负责组织 C类业余无线电台操作技术能力验证的机构是：","o":["国家无线电管理机构","省、自治区、直辖市无线电管理机构","国家无线电管理机构和省、自治区、直辖市无线电管理机构","地方业余无线电协会"],"a":[0],"e":"C类验证由国家无线电管理机构负责组织（A）。B省级无委、C两级、D协会均不符合C类验证的组织层级规定。","m":"C类验证：国家局亲自组织","g":""},{"i":"A-52","j":"LX","p":"1.3.1","q":"参加业余无线电台操作技术能力验证时，下列说法正确的是：","o":["不向参加验证的人员收取考试费用","收取验证考试费","根据爱好者操作类别进行收费","根据业余无线电台类型进行收费"],"a":[0],"e":"参加操作技术能力验证不向参加人员收取考试费用（A），这是新版办法的明确规定。B、C、D的收费说法均错。","m":"验证考试，免费参加","g":""},{"i":"A-53","j":"LY0022","p":"1.3.1","q":"各类业余无线电台操作技术能力证明文件是：","o":["无线电管理机构颁发的“业余无线电台操作技术能力验证证书”","中国无线电运动协会颁发的“业余无线电台操作证书”","地方无线电协会或者其他业余无线电民间组织颁发的“业余无线电台操作证书”","地方无线电协会或者其他业余无线电民间组织出具的盖有公章的证明信件"],"a":[0],"e":"各类操作技术能力的证明文件是无委颁发的“业余无线电台操作技术能力验证证书”（A）。B、C、D的协会证书或证明信件均非法定证明文件。","m":"能力证明=无委颁发的验证证书","g":""},{"i":"A-54","j":"LX","p":"1.3.2","q":"国家无线电管理机构及其委托的机构可以组织实施如下类别的业余无线电台操作技术能力验证：","o":["A类业余无线电台操作技术能力验证","B类业余无线电台操作技术能力验证","C类业余无线电台操作技术能力验证","一级个人业余电台操作证书"],"a":[0,1,2],"e":"国家无委及其委托机构可组织A、B、C三类验证（ABC）。D“一级个人业余电台操作证书”是旧体系称谓，不在新版三类验证之内，故错。","m":"验证分A、B、C三类","g":""},{"i":"A-55","j":"LX","p":"1.3.2","q":"业余无线电台操作技术能力分为哪几类：","o":["A类","B类","C类","D类"],"a":[0,1,2],"e":"操作技术能力分为A类、B类、C类（ABC），对应不同的频率范围和功率权限。D项“D类”不存在，故错。","m":"操作能力三档：A、B、C","g":""},{"i":"A-56","j":"LY0013","p":"1.3.2","q":"不同类别业余无线电台的主要区别在于：","o":["允许工作的频率范围","允许发射的最大发射功率","所用业余无线电台设备的功能","所用业余无线电台的天线高度和长度"],"a":[0,1],"e":"不同类别业余电台的主要区别在于允许工作的频率范围和允许发射的最大发射功率（AB）。C设备功能、D天线高度长度不是类别划分依据，故错。","m":"类别区别：频率范围+最大功率","g":""},{"i":"A-57","j":"LY0014, LY0017","p":"1.3.2","q":"A类业余无线电台允许工作的频率范围和最大发射功率为：","o":["30-3000MHz频段，不大于 25瓦","各 VHF和 UHF频段，不大于 50瓦","各业余业务和卫星业余业务频段，不大于 15瓦","各 VHF和 UHF频段，不大于 15瓦"],"a":[0],"e":"A类允许在30–3000MHz频段工作，最大发射功率不大于25瓦（A）。B、D的50瓦/15瓦功率错，C的“各业余频段”范围错——A类不含30MHz以下频段。","m":"A类：30到3000MHz，25瓦封顶","g":""},{"i":"A-58","j":"LY0015, LY0018","p":"1.3.2","q":"取得 B类业余无线电台操作技术能力验证证书的，可以申请设置、使用业余无线电台的工作频段和最大发射功率为：","o":["30MHz以下频段小于 15瓦，或 30MHz以上频段不大于 25瓦","30MHz以下频段不大于 100瓦，或 30MHz以上频段不大于 25瓦","30MHz以下频段不大于 25瓦，或 30MHz以上频段小于 15瓦","30MHz以下频段不大于 25瓦，或 30MHz以上频段不大于 100瓦"],"a":[0],"e":"B类：30MHz以下频段小于15瓦，或30MHz以上频段不大于25瓦（A）。注意“小于15瓦”不含15瓦；B的100瓦是旧B类/C类权限，C、D的功率与频段搭配均错。","m":"B类：30M以下<15瓦，以上≤25瓦","g":""},{"i":"A-59","j":"LY0016, LY0019","p":"1.3.2","q":"取得 C类业余无线电台操作技术能力验证证书的，可以申请设置、使用业余无线电台的工作频段和最大发射功率为：","o":["30MHz以下频段不大于 1000瓦，或 30MHz以上频段不大于 25瓦","30MHz以下频段不大于 100瓦，或 30MHz以上频段不大于 25瓦","30MHz以下频段不大于 25瓦，或 30MHz以上频段不大于 15瓦","30MHz以下频段不大于 25瓦，或 30MHz以上频段不大于 1000瓦"],"a":[0],"e":"C类：30MHz以下频段不大于1000瓦，或30MHz以上频段不大于25瓦（A）。1000瓦短波是C类的标志性权限；B的100瓦是旧B类，C、D的功率搭配均错。","m":"C类：30M以下1000瓦，以上25瓦","g":""},{"i":"A-60","j":"LX","p":"1.3.2","q":"参加 A类业余无线电台操作技术能力验证应当符合下列哪些要求：","o":["应当熟悉无线电管理规定","具有一定的业余无线电台操作技术能力","应当年满 18周岁","应当年满 16周岁"],"a":[0,1],"e":"参加A类验证应熟悉无线电管理规定、具有一定的操作技术能力（AB）。法规对A类验证没有年龄要求，故C、D的18/16周岁说法错。","m":"A类验证：懂规定、有技术，不限龄","g":""},{"i":"A-61","j":"LX","p":"1.3.2","q":"参加 B类业余无线电台操作技术能力验证应当符合下列哪些要求：","o":["应当依法取得业余无线电台执照 6个月以上","具有相应的实际操作经验","应当年满 18周岁","应当年满 16周岁"],"a":[0,1],"e":"参加B类验证应依法取得业余电台执照6个月以上，并具有相应的实际操作经验（AB）。C、D的年龄要求在法规中不存在，故错。","m":"B类验证：持照半年+有实操经验","g":""},{"i":"A-62","j":"LX","p":"1.3.2","q":"参加 C类业余无线电台操作技术能力验证应当符合下列哪些要求：","o":["应当依法取得载明 30MHz以下频段的业余无线电台执照 18个月以上","具有相应的实际操作经验","应当依法取得载明 30MHz以下频段的业余无线电台执照 6个月以上","应当依法取得载明 30MHz以下频段的业余无线电台执照 12个月以上"],"a":[0,1],"e":"参加C类验证应依法取得载明30MHz以下频段的执照18个月以上，并具有实际操作经验（AB）。C、D的6个月、12个月期限与法定18个月不符，故错。","m":"C类验证：持30M以下执照18个月","g":""},{"i":"A-63","j":"LX","p":"1.3.2","q":"取得 A类业余无线电台操作技术能力验证证书的，可以申请设置、使用如下业余无线电台:","o":["设置、使用最大发射功率不大于 25瓦 VHF频段业余无线电台","设置、使用最大发射功率不大于 25瓦 UHF频段业余无线电台","设置、使用最大发射功率不大于 25瓦 HF频段业余无线电台","设置、使用最大发射功率不大于 15瓦 HF频段业余无线电台"],"a":[0,1],"e":"持A类证可申请设置最大发射功率不大于25瓦的VHF、UHF频段业余电台（AB）。C、D错，A类不允许工作在HF频段（30MHz以下）。","m":"A类设台：25瓦VHF/UHF，无短波","g":""},{"i":"A-64","j":"LX","p":"1.3.2","q":"取得 B类业余无线电台操作技术能力验证证书的，可以申请设置、使用如下业余无线电台:","o":["设置、使用最大发射功率不大于 25瓦 VHF频段业余无线电台","设置、使用最大发射功率不大于 25瓦 UHF频段业余无线电台","设置、使用最大发射功率小于 15瓦 HF频段业余无线电台","设置、使用最大发射功率小于 1瓦（e.i.r.p.）LF频段业余无线电台"],"a":[0,1,2,3],"e":"四项都对（ABCD）：25瓦VHF/UHF；小于15瓦HF；小于1瓦（e.i.r.p.）LF。B类在30MHz以下限15瓦以下（含LF的1瓦e.i.r.p.特别限值）。","m":"B类设台：25瓦VU、15瓦下HF、1瓦LF","g":""},{"i":"A-65","j":"LX","p":"1.3.2","q":"取得 C类业余无线电台操作技术能力验证证书的，可以申请设置、使用如下业余无线电台:","o":["设置、使用最大发射功率不大于 25瓦 VHF频段业余无线电台","设置、使用最大发射功率不大于 25瓦 UHF频段业余无线电台","设置、使用最大发射功率不大于 1000瓦 HF频段业余无线电台","因开展特殊技术试验、通联等活动确需设置、使用大于 25瓦 VHF频段业余无线电台"],"a":[0,1,2,3],"e":"四项都对（ABCD）：25瓦VHF/UHF；不大于1000瓦HF；开展特殊技术试验确需超25瓦VHF的也可申请。C类是短波大功率的唯一合法通道。","m":"C类设台：千瓦短波+特殊试验通道","g":""},{"i":"A-66","j":"LX","p":"1.3.2","q":"关于开展特殊技术试验、通联等活动，下列说法正确的是：","o":["开展特殊技术试验、通联等活动，确需超出业余无线电台执照载明的功率限值使用业余无线电台的，需经颁发业余无线电台执照的无线电管理机构批准","取得 C类业余无线电台操作技术能力验证证书且取得业余无线电台执照的人员，经批准可临时在限定条件下开展电台操作","取得 B类业余无线电台操作技术能力验证证书且取得业余无线电台执照的人员，经批准可临时在限定条件下开展电台操作","取得 A类业余无线电台操作技术能力验证证书且取得业余无线电台执照的人员，经批准可临时在限定条件下开展电台操作"],"a":[0,1],"e":"确需超出执照载明功率限值开展特殊技术试验的，需经颁发执照的无委批准；且只有取得C类证并持照的人员经批准可临时在限定条件下操作（AB）。C、D错，A类、B类无此资格。","m":"超功率试验：C类持照+批准才行","g":""},{"i":"A-67","j":"LX","p":"1.3.2","q":"关于未成年人设置、使用业余无线电台，下列哪些选项为正确：","o":["持有 A类验证证书的可以设置最大发射功率不大于 25瓦 VHF频段业余无线电台","持有 B类验证证书的可以设置最大发射功率不大于 25瓦 VHF频段业余无线电台","持有 A类验证证书的可以设置最大发射功率不大于 15瓦 HF频段业余无线电台","持有 B类验证证书的可以设置最大发射功率不大于 15瓦 HF频段业余无线电台"],"a":[0,1],"e":"未成年人持A类或B类证，只能设置最大发射功率不大于25瓦的VHF频段业余电台（AB）。C、D错，未成年人不得设置HF频段电台（15瓦HF也不行）。","m":"未成年人：只能玩25瓦VHF","g":""},{"i":"A-68","j":"LX","p":"1.3.2","q":"关于业余无线电台操作技术能力验证，下列哪些选项为正确：","o":["业余无线电台操作技术能力验证题库以及验证标准由国家无线电管理机构制定","无线电管理机构或者其委托的机构组织将提前向社会公布验证时间、验证要求等有关事项","参加业余无线电台操作技术能力验证成绩合格的，由无线电管理机构颁发业余无线电台操作技术能力验证证书","不得向参加验证的人员收取费用"],"a":[0,1,2,3],"e":"四项都对（ABCD）：题库和验证标准由国家无委制定；验证时间、要求提前向社会公布；成绩合格颁发验证证书；不得收取费用。","m":"验证四件事：国家出题、提前公布、合格发证、免费","g":""},{"i":"A-69","j":"LX","p":"1.3.2","q":"关于新版《办法》施行前，依法取得 B类业余无线电台操作技术能力验证证书的，下列哪些选项为正确：","o":["可以按照规定的许可权限申请设置、使用工作在 30MHz以下频段且最大发射功率不大于100瓦","可以按照规定的许可权限申请设置、使用工作在 30MHz以上频段且最大发射功率不大于25瓦的业余无线电台","应按照新版《办法》中 B类业余无线电台操作技术能力验证规定的范围设置、使用电台","新版《办法》施行前取得的 B类业余无线电台操作技术能力验证证书不再有效"],"a":[0,1],"e":"新版办法施行前取得的B类证继续有效，可按原许可权限申请30MHz以下不大于100瓦、30MHz以上不大于25瓦的电台（AB）。C错，不强制按新B类范围；D错，旧证并非失效。","m":"旧B类证：按原权限继续有效","g":""},{"i":"A-70","j":"LY0077","p":"1.4.1","q":"《业余无线电台管理办法》规定正确使用业余无线电台呼号的方法是：","o":["使用业余无线电台的单位或者个人应当在每次通信建立及结束时发送本业余无线电台呼号","在通信过程中不定期（间隔不超过 10分钟）发送本业余无线电台呼号","鼓励业余无线电台在通联期间通过技术手段自动发送电台呼号","使用业余无线电台的单位或者个人在通信中可以用姓名、代号、适当的别名或者法规定呼号的部分数字和字母代替完整的业余电台呼号作为电台的标识"],"a":[0,1,2],"e":"正确使用呼号的方法：每次通信建立及结束时发送本台呼号；通信过程中不定期（间隔不超过10分钟）发送；鼓励用技术手段自动发送（ABC）。D错，不得用姓名、代号、别名或呼号片段代替完整呼号。","m":"呼号三报：开头、结尾、十分钟内","g":""},{"i":"A-71","j":"LK0080","p":"1.4.1","q":"业余无线电台呼号的核发流程是：","o":["无线电管理机构颁发业余无线电台执照，应当同时向申请人核发业余无线电台呼号","在向无线电管理机构委托的受理服务机构提交设台申请窗口后，由服务机构核发呼号","无线电管理机构核发业余无线电台执照后，由申请人再向其申请核发呼号","业余无线电台设台人在提交设台申请的同时提出所要求指配的呼号，经服务机构同意后，报无线电管理机构正式核发"],"a":[0],"e":"无委颁发业余电台执照时应同时核发呼号（A），执照与呼号一次办结。B服务机构核发、C先执照后另申请、D自选呼号报批，均不符合法定流程。","m":"执照呼号，一次办结同时核发","g":""},{"i":"A-72","j":"LX","p":"1.4.1","q":"无线电管理机构颁发业余无线电台执照时，若申请人已取得业余中继台、业余信标台呼号以外的其他业余无线电台呼号，无线电管理机构将：","o":["无线电管理机构不再核发新的业余无线电台呼号","由申请人再向其申请核发呼号，无线电管理机构将核发新的业余无线电台呼号","无线电管理机构向其更换业余无线电台呼号","业余无线电台设台人在提交设台申请的同时提出所要求指配的呼号，经服务机构同意后，报无线电管理机构正式核发"],"a":[0],"e":"申请人已取得（中继台、信标台呼号以外的）其他业余电台呼号的，无委不再核发新呼号（A），一人一呼号。B再核发、C更换、D自选报批均错。","m":"一人一呼号，不再重复核发","g":""},{"i":"A-73","j":"LX","p":"1.4.1","q":"业余无线电台呼号停止使用的，下列说法正确的是：","o":["业余无线电台呼号停止使用的，应当依法予以注销","除业余中继台、业余信标台呼号外，其他业余无线电台呼号注销 1年后，无线电管理机构可以将相关电台呼号重新投入分配","业余无线电台呼号停止使用的，不用申请注销","除业余中继台、业余信标台呼号外，其他业余无线电台呼号注销后，无线电管理机构可立即将相关电台呼号重新投入分配"],"a":[0,1],"e":"呼号停止使用应依法注销；除中继台、信标台呼号外，其他呼号注销1年后可重新投入分配（AB）。C错在“不用注销”；D错在“立即”重新分配，须满1年。","m":"呼号注销满一年，才可再分配","g":""},{"i":"A-74","j":"LX","p":"1.4.1","q":"注销的电台呼号重新投入分配前，申请人再次申请设置、使用业余无线电台，下列说法正确的是：","o":["无线电管理机构经审查决定颁发业余无线电台执照的，应当同时核发申请人已注销的电台呼号","无线电管理机构经审查决定颁发业余无线电台执照的，应当同时核发新的的电台呼号","电台呼号注销后，将不再向申请人核发电台呼号","电台呼号注销后，申请人不能再次申请设置、使用业余无线电台"],"a":[0],"e":"注销的呼号在重新投入分配前，申请人再次申请设台获准的，无委应同时核发其已注销的呼号（A），即优先恢复原呼号。B核发新呼号、C不再核发、D不能再申请均错。","m":"重设台：优先恢复原注销呼号","g":""},{"i":"A-75","j":"LX","p":"1.4.1","q":"在他人依法设置的业余无线电台上进行发射操作的，下列说法正确的是：","o":["应当使用所操作业余无线电台的呼号或者实际操作人员取得的呼号","使用实际操作人员取得的呼号的，业余无线电台通联期间发送呼号的格式应当符合国内国际相关要求","不可在他人依法设置的业余无线电台上进行发射操作","业余无线电爱好者只能在自己设置的业余无线电台上进行发射操作"],"a":[0,1],"e":"在他人的合法电台上操作发射，应使用所操作电台的呼号或实际操作人员取得的呼号；用操作者呼号时格式须符合国内外相关要求（AB）。C、D错，在他人电台上操作是允许的。","m":"借台操作：用该台或本人呼号","g":""},{"i":"A-76","j":"LX","p":"1.4.1","q":"满足下列哪些条件，可以临时使用其他业余无线电台呼号？","o":["参加或者举办业余无线电通联比赛以及其他重大业余无线电活动","经比赛（活动）主办方（牵头单位）报国家无线电管理机构批准","其他业余无线电台呼号符合国际规则","何时何地都不能临时使用其他业余无线电台呼号"],"a":[0,1,2],"e":"参加或举办通联比赛等重大业余活动，经主办方报国家无委批准，且呼号符合国际规则的，可临时使用其他业余电台呼号（ABC）。D错，并非任何时候都不能临时使用。","m":"临时借呼号：比赛+国家局批准","g":""},{"i":"A-77","j":"LX","p":"1.4.1","q":"关于业余无线电台呼号，下列说法正确的是：","o":["呼号第一部分为呼号前缀","呼号第二部分为电台种类","呼号第三部分为分区编号","呼号第四部分为呼号后缀"],"a":[0,1,2,3],"e":"呼号由四部分组成：第一部分呼号前缀、第二部分电台种类、第三部分分区编号、第四部分呼号后缀（ABCD），四项缺一不可。","m":"呼号四段：前缀、种类、分区、后缀","g":""},{"i":"A-78","j":"LX","p":"1.4.1","q":"关于业余无线电台呼号前缀，下列说法正确的是：","o":["呼号前缀（呼号第一部分）由一位字母组成","为国际电信联盟分配的呼号前缀字母 B","为国际电信联盟分配的呼号前缀字母 BA","为国际电信联盟分配的呼号前缀字母 A"],"a":[0,1],"e":"呼号前缀（第一部分）由一位字母组成，为ITU分配给中国的呼号前缀字母B（AB）。C的BA、D的A都不是我国业余电台呼号前缀，故错。","m":"呼号前缀：一位字母B","g":""},{"i":"A-79","j":"LX","p":"1.4.1","q":"关于电台种类（呼号第二部分），下列说法正确的是：","o":["字母 G、H、I、D、A、B、C、E、F、K、L用于一般业余无线电台呼号","字母 J用于空间业余无线电台呼号","字母 R用于业余中继台和业余信标台呼号","字母 S、T、Y、Z以及其他字母序列的业余无线电台呼号由国家无线电管理机构保留"],"a":[0,1,2,3],"e":"四项都对（ABCD）：G、H、I、D、A、B、C、E、F、K、L用于一般电台；J用于空间业余电台；R用于中继台和信标台；S、T、Y、Z等由国家无委保留。","m":"种类字母：一般多字母，J空间R中继","g":""},{"i":"A-80","j":"LX","p":"1.4.1","q":"关于分区编号（呼号第三部分），下列说法正确的是：","o":["由一位数字组成","用于表示业余无线电台分区号","空间业余无线电台分区号为 1","空间业余无线电台分区号为 2"],"a":[0,1,2],"e":"分区编号（第三部分）由一位数字组成，表示业余电台分区号；空间业余电台分区号为1（ABC）。D错，空间电台分区号不是2。","m":"分区编号：一位数字，空间台为1","g":""},{"i":"A-81","j":"LX","p":"1.4.1","q":"关于呼号后缀（呼号第四部分），下列说法正确的是：","o":["由 1～4位的字母或者字母和数字的组合组成","1位、4位呼号后缀，以及带有数字的呼号后缀由国家无线电管理机构保留","QOA～QUZ及 SOS、XXX、TTT等可能与遇险信号或类似性质的其他信号混淆的字母组合不用作呼号后缀","呼号后缀由 1～4位数字组成"],"a":[0,1,2],"e":"呼号后缀由1～4位字母或字母数字组合组成；1位、4位及带数字的后缀由国家无委保留；QOA～QUZ及SOS等易混淆组合不用作后缀（ABC）。D错，后缀不只是数字。","m":"后缀1到4位，避用SOS等混淆组合","g":""},{"i":"A-82","j":"LX","p":"1.4.1","q":"各省、自治区、直辖市无线电管理机构核发一般业余无线电台呼号时，下列说法正确的是：","o":["呼号第二部分按照 G、H、I、D、A、B、C、E、F、K、L顺序","第四部分按照双字母、三字母组合顺序依次编制并核发业余无线电台呼号","各省、自治区、直辖市无线电管理机构核发的业余无线电台呼号前缀都相同","各省、自治区、直辖市无线电管理机构核发的业余无线电台呼号的分区号都相同"],"a":[0,1,2],"e":"省局核发一般呼号时：第二部分按G、H、I、D、A、B、C、E、F、K、L顺序，第四部分按双字母、三字母组合顺序编制；前缀全国相同（ABC）。D错，各省分区号不同。","m":"省局发呼号：种类按序，后缀双三字母","g":""},{"i":"A-83","j":"LK0081","p":"1.4.1","q":"业余无线电爱好者对已核发给自己的电台呼号不满意，是否可以申请另行核发业余无线电台呼号？","o":["不可以。颁发业余无线电台执照的无线电管理机构已经为申请人核发业余无线电台呼号的，不另行核发其他业余无线电台呼号","更新所设置的业余无线电台类别时可以申请另行核发业余无线电台呼号","可以申请另行核发业余无线电台呼号，但须缴纳额外的费用","业余无线电台执照有效期届满、设台人向核发执照的无线电管理机构申请办理延续手续时可以申请另行核发业余无线电台呼号"],"a":[0],"e":"对已核发的呼号不满意也不能申请另行核发（A），颁发执照的无委已核发呼号的不再另行核发。B更新类别、C缴费、D延续时申请，均无此规定。","m":"呼号不满意，也不能换","g":""},{"i":"A-84","j":"LK0082","p":"1.4.1","q":"各地业余无线电台呼号前缀字母和后缀字符的可用范围的确定方法是：","o":["由国家无线电管理机构编制和分配","地方无线电管理机构根据当地呼号资源的使用情况自行分配","地方无线电民间组织提出建议，当地无线电管理机构批准","由业余无线电爱好者根据需求提出建议，当地无线电管理机构批准"],"a":[0],"e":"各地呼号前缀字母和后缀字符的可用范围由国家无委编制和分配（A），全国统一管理。B地方自行分配、C民间建议、D爱好者建议均无依据。","m":"呼号资源：国家无委统一编制分配","g":""},{"i":"A-85","j":"LX","p":"1.4.1","q":"关于使用业余无线电台呼号正确的是：","o":["应当在每次通信建立时主动发送（报出）本台业余无线电台呼号","应当在每次通信结束时主动发送（报出）本台业余无线电台呼号","应当在每次通信过程中每十分钟发送（报出）本台业余无线电台呼号","应当在每次通信过程中主动发送（报出）自造的呼号作为本台业余无线电台呼号的补充"],"a":[0,1,2],"e":"每次通信建立时、结束时应主动发送本台呼号，通信过程中每十分钟应发送一次（ABC）。D错，不得自造呼号作为补充标识。","m":"呼号三报：开头结尾加十分钟","g":""},{"i":"A-86","j":"LX","p":"1.4.1","q":"业余无线电台呼号由下列哪些部分组成：","o":["呼号前缀","电台种类","分区编号","呼号后缀"],"a":[0,1,2,3],"e":"呼号由呼号前缀、电台种类、分区编号、呼号后缀四部分组成（ABCD），与LY0077题的四部分划分一致，四项缺一不可。","m":"呼号四段：前缀、种类、分区、后缀","g":""},{"i":"A-87","j":"LK1071","p":"1.4.1","q":"《业余无线电台管理办法》要求业余电台在建立和结束通信时主动发送本台呼号。允许使用呼号的一部分（比如后缀）替代完整呼号的情况包括：","o":["在任何情况下都必须使用完整的呼号","联络相识的友台时可将呼号的后缀用作电台标识","在 VHF/UHF等本地频段建立通信时可将呼号的后缀用作电台标识","在 HF频段联络国内电台时可将呼号的后缀用作电台标识，但是 DX联络不可以"],"a":[0],"e":"任何情况下都必须使用完整呼号（A），不允许用呼号片段（如后缀）代替。B、C、D以“相识友台”“本地频段”“国内通联”为由用不完整呼号的做法均违反规定。","m":"任何情况，都必须用完整呼号","g":""},{"i":"A-88","j":"LK1072","p":"1.4.1","q":"在业余无线电通联中，是否可将本台或对方电台呼号之中的地区码加后缀视作《业余无线电台管理办法》中的“电台呼号”？","o":["不可以。这是对呼号的不完整表述。其不具标识意义，不能视作电台呼号","与熟悉的友台通联就可以使用这种不完整呼号。这就如同将对方称为 OM","在 VHF/UHF等频段进行通联可以使用这种不完整呼号。这会增加亲切感","在 HF进行国内通联可以使用这种不完整呼号。但是如遇 DX电台则不可以"],"a":[0],"e":"不可以把地区码加后缀视作电台呼号（A），这是不完整的表述，不具标识意义。B、C、D以熟悉程度或频段为由使用不完整呼号的做法均错。","m":"地区码加后缀≠完整呼号","g":""},{"i":"A-89","j":"LX","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 1的省（自治区、直辖市）为：","o":["北京","黑龙江","河北","上海"],"a":[0],"e":"业余分区号为1的是北京（A）。黑龙江、吉林、辽宁是2区，上海是3区，故B、C、D错。","m":"1区北京，首都分区号最小","g":""},{"i":"A-90","j":"LX","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 2的省（自治区、直辖市）为：","o":["黑龙江","吉林","辽宁","广东"],"a":[0,1,2],"e":"业余分区号为2的是黑龙江、吉林、辽宁（ABC），即东北三省。D广东是7区，故错。","m":"2区=东北三省：黑吉辽","g":""},{"i":"A-91","j":"LX","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 3的省（自治区、直辖市）为：","o":["天津","内蒙古","河北","山西"],"a":[0,1,2,3],"e":"分区号 3 覆盖华北地区：天津（3 字头）、河北、山西和内蒙古同属分区 3，均为相邻省份。四个选项均为该分区省份，故 ABCD 全选。区分重点在分区 3 包括天津，常见错项是误入其他分区。","m":"三分天京蒙，天蒙山河西：天津内蒙古河北山西","g":""},{"i":"A-92","j":"LX","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 4的省（自治区、直辖市）为：","o":["上海","山东","江苏","海南"],"a":[0,1,2],"e":"分区号 4 覆盖华东：上海、江苏、山东同属分区 4，官方答案为 ABC。海南属于分区 7，故 D 错误。记住 4 区是“江沪鲁”，即可排除海南。","m":"四分沪苏鲁，江沪山东齐","g":""},{"i":"A-93","j":"LX","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 5的省（自治区、直辖市）为：","o":["浙江","江西","福建","广西"],"a":[0,1,2],"e":"分区号 5 覆盖东南沿海：浙江、福建、江西同属分区 5，官方答案为 ABC。广西属于分区 7，故 D 错误。记忆要点是闽浙赣同为 5 区。","m":"五分浙闽赣：浙江福建江西","g":""},{"i":"A-94","j":"LX","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 6的省（自治区、直辖市）为：","o":["安徽","河南","湖北","四川"],"a":[0,1,2],"e":"分区号 6 覆盖中原：安徽、河南、湖北同属分区 6，官方答案为 ABC。四川属于分区 8，故 D 错误。记住“皖豫鄂”为 6 区即可答对。","m":"六分皖豫鄂：安徽河南湖北","g":""},{"i":"A-95","j":"LX","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 7的省（自治区、直辖市）为：","o":["湖南","广东","广西","海南"],"a":[0,1,2,3],"e":"分区号 7 覆盖中南华南：湖南、广东、广西、海南同属分区 7，故 ABCD 全选。这四个省份在地理上连续，经常成组考。答案没有排除项，直接全选即可。","m":"七分湘粤桂琼：湖南广东广西海南","g":""},{"i":"A-96","j":"LX","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 8的省（自治区、直辖市）为：","o":["四川","重庆","贵州","云南"],"a":[0,1,2,3],"e":"分区号 8 覆盖西南：四川、重庆、贵州、云南同属分区 8，故 ABCD 全选。注意重庆与四川同属 8 区，不要误把重庆归入 0 区或其他区。","m":"八分川渝贵滇：四川重庆贵州云南","g":""},{"i":"A-97","j":"LX","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 9的省（自治区、直辖市）为：","o":["陕西","甘肃","宁夏","青海"],"a":[0,1,2,3],"e":"分区号 9 覆盖西北东部：陕西、甘肃、宁夏、青海同属分区 9，故 ABCD 全选。四个均为西北邻省，记忆为“陕甘宁青”成组。","m":"九分陕甘宁青：陕西甘肃宁夏青海","g":""},{"i":"A-98","j":"LX","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 0的省（自治区、直辖市）为：","o":["新疆","西藏","上海","重庆"],"a":[0,1],"e":"分区号 0 覆盖西北西部和西藏：新疆和西藏同属分区 0，官方答案为 AB。上海属 4 区、重庆属 8 区，故 C、D 错误。记住“新藏为零”。","m":"零分新藏记：新疆西藏","g":""},{"i":"A-99","j":"LY0006","p":"1.5.1","q":"合法设置、使用业余电台的必要步骤是：","o":["按照《业余无线电台管理办法》的规定向无线电管理机构提出申请，取得业余无线电台执照","加入指定的业余无线电民间组织，并按其章程规定的办法办理申请手续","经过业余无线电协会或无线电运动协会同意","经过所在单位或居委会批准"],"a":[0],"e":"《业余无线电台管理办法》规定，设置使用业余电台必须向无线电管理机构提出申请并取得电台执照，故答案为 A。B、C、D 所列的协会、单位或居委会都没有发证权力，属常见干扰项。","m":"设台先办证，找无委才管用","g":""},{"i":"A-100","j":"LY0008","p":"1.5.1","q":"业余无线电台的法定用途为：","o":["用于相互通信、技术研究和自我训练","供公民在业余时间进行与个人生活事务有关的通信","供公民在业余时间进行休闲娱乐","供私家车主或者相应组织作为行车安全保障和途中消遣工具"],"a":[0],"e":"业余电台的法定用途是“相互通信、技术研究和自我训练”，故答案为 A。B、C、D 把电台当作生活聊天、娱乐或行车工具，超出法定用途，均为错误。","m":"三用途：通信研究自我训练","g":""},{"i":"A-101","j":"LY0010","p":"1.5.1","q":"申请设置使用配备有多台业余无线电发射设备的业余无线电台，应该：","o":["视为一个业余电台，指配一个电台呼号，但所有设备均应经过核定并将参数载入电台执照","视为一个业余电台，指配一个电台呼号，其中只需有一台设备加以核定并将参数载入电台执照","每台设备视为一个业余电台，各指配一个电台呼号，并都应经过核定并将参数载入电台执照","视为一个业余电台，指配一个电台呼号，每个频段选择一台设备加以核定并将参数载入电台执照"],"a":[0],"e":"多台设备的业余电台视为一个业余电台，指配一个呼号，但每台发射设备都要经核定、参数载入执照，故答案为 A。B、D 的“只需核定其中一台”违反“所有设备均核定”要求，C 的“每台一个呼号”不符合“一个电台一个呼号”原则。","m":"一台一呼号，多机全要核","g":""},{"i":"A-102","j":"LK0035","p":"1.5.1","q":"业余中继台必备的技术措施为：","o":["设专人负责监控和管理工作，配备有效的遥控手段，保证造成有害干扰时及时停止发射","技术加密措施，防止未经设台人允许的业余无线电台启用中继","尽量提高发射功率，以便压制覆盖区内的其他强信号干扰","设热备份系统，保证不间断工作"],"a":[0],"e":"业余中继台必须有专人负责监控管理，并配备有效遥控手段，保证在产生有害干扰时能及时停发，故答案为 A。B 的加密防接入、C 的加大功率压制干扰、D 的热备份均非法规要求的必备措施，且加大功率本身违法。","m":"中继必备：专人看管加遥控","g":""},{"i":"A-103","j":"LK0036","p":"1.5.1","q":"某团体依法设置了一部业余中继台。其正确做法是：","o":["向其覆盖区域内的所有业余无线电台提供平等的服务，并将使用业余中继台所需的各项技术参数公开","中继台是设台者出资建设和维护的，因此仅供经设置者允许的业余电台使用","中继台是设台者出资建设和维护的，因此仅供本团体成员优先使用，空闲时方供其他业余电台使用","为保证中继台正常运行，要求覆盖区内所有业余电台缴纳维护成本，否则不准使用"],"a":[0],"e":"业余中继台是对全体爱好者开放的公共资源，应向覆盖区内所有业余电台平等提供服务并公开技术参数，故答案为 A。B、C 的“仅供出资者或成员使用”、D 的“收费才准用”都违反平等服务原则，均错误。","m":"中继人人用，参数全公开","g":""},{"i":"A-104","j":"LK0037","p":"1.5.1","q":"选择 144MHz或 430MHz业余模拟调频中继台同频段收发频差的原则是：","o":["采用业余无线电标准频差，即 144MHz频段 600kHz，430MHz频段 5MHz","尽量采用非标准频差以阻止一般业余无线电台占用","采用经常变换频差的办法减少占用度","可以在国家《无线电频率划分规定》所规定业余频率范围内任意选择"],"a":[0],"e":"国内业余模拟调频中继台采用标准频差：144MHz 频段 600kHz、430MHz 频段 5MHz，故答案为 A。B 的非标准频差、C 的随意变频、D 的任意选频都不符合规范，会造成互操作混乱，故错误。","m":"频差记牢：144 六百，430 五兆","g":""},{"i":"A-105","j":"LY0038","p":"1.5.1","q":"业余无线电台使用的无线电发射设备必须符合下列条件：","o":["商品设备应依法取得型号核准，型号核准证载明的频率范围包含业余业务频段","自制、改装、拼装设备应符合国家标准和国家无线电管理规定，且无线电发射频率范围仅限于业余业务频段","自制、改装、拼装设备不受限制","国外商品设备符合国际流行技术标准即可"],"a":[0,1],"e":"商品设备须依法取得型号核准且核准频率范围包含业余频段（A）；自制、改装、拼装设备须符合国家标准和管理规定且发射频率仅限业余频段（B），故答案为 AB。C 的“自制不受限制”和 D 的“国际标准即可”都违反法规，错误。","m":"商品看核准，自制限业余","g":""},{"i":"A-106","j":"LK0051","p":"1.5.1","q":"“我不是业余无线电爱好者，申请设置业余电台只是为了行车方便，不需要遵守业余无线电的规范”。这种说法：","o":["是错误的，也是不具备“熟悉无线电管理规定”设台条件的表现","有一定道理，既然行车通信有需求，法规管理应该迎合个人需求","有一定道理，只要是遵守规定，业余电台也可以为非业余无线电爱好者所用","很难说对错，业余电台的定义可以因人而异"],"a":[0],"e":"申请设台必须熟悉无线电管理规定并遵守业余无线电规范，“只为行车方便、不遵守规范”的说法错误，故答案为 A。B 的“法规迎合个人需求”、C 的“非爱好者可用”、D 的“定义因人而异”都曲解了设台条件。","m":"不守规矩，设台没资格","g":""},{"i":"A-107","j":"LY0056","p":"1.5.2","q":"某业余电台操作者听到业余专用频率上出现某种显然出自非业余电台的人为干扰发射，于是按下话筒向该发射者宣传无线电管理法规知识。对这种做法的评论应该是：","o":["错误；违反“业余无线电台只能用于相互通信、技术研究和自我训练”规定","正确；但有干扰，不予提倡","正确；抓机遇宣传法规，应该提倡","正确；但需注意态度耐心、用语文明"],"a":[0],"e":"业余频率上出现非业余干扰发射时，按规定业余台只能用于相互通信、技术研究和自我训练，按住话筒去“普法”本身就是违法通信，故答案为 A。B、C、D 把这种违规行为说成正确或提倡，均错误。","m":"遇干扰别喊话，喊话就违规","g":""},{"i":"A-108","j":"LY0057","p":"1.5.2","q":"在业余无线电台中转发广播电台、互联网聊天、电话通话、其他电台的联络信号，这类行为的性质是：","o":["错误行为；违反“业余无线电台只能用于相互通信、技术研究和自我训练”规定，因为通信中产生信息的一方不是业余无线电台","正确行为；既然可以联络，不必要限制向话筒送什么内容","如果转发的目的是进行技术调试、用转发信号作为测试信号的话，就是正常行为","不算错误但也不值得提倡"],"a":[0],"e":"转发广播、互联网聊天、电话和其他电台的联络信号，信息产生方不是业余电台，违反了业余台“只能用于相互通信、技术研究和自我训练”的规定，故答案为 A。B 的“送什么都行”、C 的“调试例外”、D 的“不算错误”都不成立。","m":"转发外来信号，业余台禁行","g":""},{"i":"A-109","j":"LY0058","p":"1.5.2","q":"业余电台在通信中为其他人或者单位、组织转达信息。对这种做法的评论应该是：","o":["违法行为；违反“业余无线电台只能用于相互通信、技术研究和自我训练”的规定","只要所转达的信息在内容上不违反《业余电台管理法规》的禁止规定就是合法行为","只要转达信息是无偿的，就是合法行为","只要所转达的信息是有利于社会的公益信息，就是合法行为"],"a":[0],"e":"为他人、单位或组织转达信息属于“第三方通信”，违反业余台法定用途，故为违法行为，答案为 A。B、C、D 的“内容不违法就行”“无偿就行”“公益就行”都不改变其违法性质。","m":"替人传话，业余台违法","g":""},{"i":"A-110","j":"LY0059","p":"1.5.2","q":"某业余无线电协会在发射操作中向其会员播发公益性通知和技术训练讲座，但未得到相应无线电管理机构的批准。对这种做法的评论应该是：","o":["违法行为；违反“未经批准，业余无线电台不得以任何方式进行广播或者发射通播性质的信号”的规定","只要所播发的通知或讲座有利于当地业余无线电爱好者技术水平的提高，不能算违法行为","只要所播发的通知或讲座有利于当地业余无线电应急通信训练，不能算违法行为","只要所播发的通知或讲座是涉及宣传业余电台管理知识的，不能算违法行为"],"a":[0],"e":"未经批准，业余电台不得以任何方式广播或发射通播性质信号，协会向会员播通知、讲座也属此类，故为违法，答案为 A。B、C、D 以“有利提高技术”“应急训练”“宣传法规”为由开脱，均不成立。","m":"未批准先广播，就是违法","g":""},{"i":"A-111","j":"LK0060","p":"1.5.2","q":"关于业余无线电台在通信过程中使用的语言，正确的做法为：","o":["任何时候都应当使用明语或者业余无线电领域公认的缩略语、简语","可以使用虽然不是所有火腿通用、但在某些火腿圈子内部有一定可懂度的新编缩略语或暗语","语言要创新，可以使用自创的特殊缩略语，虽开始时象是暗语，用多了就会变明语","可提倡使用稀有语言或方言，尽量使特定通信对象以外的业余无线电台听不懂，以减少他台呼叫和插入的机会"],"a":[0],"e":"通信中任何时候都应使用明语或业余界公认的缩略语、简语，不得使用暗语，故答案为 A。B、C 的自创缩略语暗语、D 的用方言让人听不懂都违反明语要求，故错误。","m":"通信用明语，暗语不能用","g":""},{"i":"A-112","j":"LK0063","p":"1.5.2","q":"具备国家无线电管理机构规定的操作技术能力并具有法律规定有效证明文件、但还没有获准设置自己的业余电台的人是否可以到业余电台进行发射操作？答案是：","o":["可以。使用所操作业余电台的呼号，由该业余电台的设台人对操作不妥而造成的有害干扰负责","可以。因为自己没有呼号，只能在通信中使用临时自编的呼号，或用姓名代替呼号","不可以","青少年可以，成人不可以"],"a":[0],"e":"有操作能力证明但尚未设台的人，可以在他人业余电台上操作，使用该台呼号，由设台人对不当操作造成的干扰负责，故答案为 A。B 的自编呼号、C 的一律不准、D 的年龄区分均错误。","m":"借台操作，用台主呼号","g":""},{"i":"A-113","j":"LY0064","p":"1.5.2","q":"未取得相应业余无线电台执照或者相应操作技术能力的人员，为提高业余无线电台操作技术能力的需要，可以在他人依法设置的业余无线电台上进行发射操作实习。应遵守的条件是什么？","o":["发射操作实习应当由业余无线电台设置、使用人或者其技术负责人现场监督指导","使用的频率范围和发射功率应当在 B类业余无线电台操作技术能力验证证书确定的范围内","使用的频率范围和发射功率不得超过现场监督指导人员依法取得的业余无线电台操作技术能力验证证书确定的范围","尚未取得关于具备操作技术能力有效证明文件的人任何情况下都不可以进行发射操作"],"a":[0,1,2],"e":"发射操作实习须由设台人或其技术负责人现场监督指导（A），所用频率和功率应在 B 类证书范围内（B）且不得超过监督指导人证书的范围（C），故官方答案为 ABC。D 的“任何情况下都不行”与实习制度矛盾，错误。","m":"实习三条件：有人带、不超限","g":""},{"i":"A-114","j":"LK0065","p":"1.5.2","q":"业余无线电台设置人应对其无线电发射设备担负的法定责任为：","o":["应当确保其无线电发射设备处于正常工作状态，避免对其他无线电业务造成有害干扰","应当确保其无线电发射设备随最先进型号更新，为其他业余电台树立求新的榜样","应当确保其无线电发射设备达到最大发射功率，以克服其他无线电业务的干扰","应当确保其无线电发射设备经常处于工作状态，以提高业余频率的实际占用度"],"a":[0],"e":"设台人对发射设备的法定责任是保证设备正常工作、避免对其他无线电业务造成有害干扰，故答案为 A。B 的追新款、C 的拼功率、D 的常开机都不是法定义务，且可能违法。","m":"设备管好用，不扰他业务","g":""},{"i":"A-115","j":"LK0066","p":"1.5.2","q":"业余无线电爱好者使用业余无线电收信设备应遵守的规定为：","o":["不得接收与业余业务和卫星业余业务无关的信号","只要不造成对其他业务的无线电干扰，接收无线电信号没有限制","只要不被查出来，可以接收任何无线电信号","只要出于个人对信息的兴趣而不涉及赢利，可以接收任何无线电信号"],"a":[0],"e":"业余爱好者使用收信设备只能接收与业余业务和卫星业余业务有关的信号，不得接收无关信号，故答案为 A。B、C、D 的“随便接收”“查不出就行”“个人兴趣就行”都违反规定。","m":"收信有限制，只收业余波","g":""},{"i":"A-116","j":"LK0067","p":"1.5.2","q":"业余无线电爱好者无意接收到非业余业务和卫星业余业务的信息时，应遵守的规则为：","o":["不得传播、公布","只可以在业余无线电台间共享，不得在其他场合公开","只可以用非无线电方式在业余无线电爱好者之间交流，不得以无线电方式转发","既然自己可以收到，别人也一定可以收到，当然可以传播、公布或者利用"],"a":[0],"e":"无意收到非业余业务信息时，不得传播、公布，故答案为 A。B 的台间共享、C 的非无线电方式交流、D 的随便传播利用都违反保密义务，错误。","m":"无意收到的，绝不外传","g":""},{"i":"A-117","j":"LK0068","p":"1.5.2","q":"业余无线电台是否可以发射从广播电台收到的信号、音像节目的录音，或者故意转送电台周围的声音？","o":["不可以，不得发送与业余业务和卫星业余业务无关的信号","可以，因为该类信息没有保密性","可以，用于显示自己发射设备的信号质量","可以，用于提起其他有业余无线电台操作员精神，防止乏困"],"a":[0],"e":"业余电台不得发送与业余业务和卫星业余业务无关的信号，广播录音、周围声音均属此类，故答案为 A。B、C、D 的“无保密性就行”“显示信号质量”“提神”都不是合法理由。","m":"无关信号，一律不发","g":""},{"i":"A-118","j":"LK0069","p":"1.5.2","q":"国家对于利用业余无线电台从事发布、传播违反法律或者公共道德的信息的行为的态度是：","o":["禁止","不提倡","容忍","不可以发布传播违法信息。但违反公共道德的信息属于道德问题，不鼓励就是了"],"a":[0],"e":"利用业余电台发布、传播违反法律或公共道德的信息，国家态度是禁止，故答案为 A。B 的不提倡、C 的容忍、D 的“道德问题不算”都低估了违法性质。","m":"违法违德信息，发布就禁止","g":""},{"i":"A-119","j":"LK0070","p":"1.5.2","q":"出租车安装业余电台并用来传递有关载客的信息，这种行为的性质是：","o":["违法行为，违反了严禁利用业余无线电台谋取商业利益的规定","不太好，因为占用了其他业余电台通信的频率","只要不影响其他业余电台的正常通信就可以","只要管理部门不来查处就可以"],"a":[0],"e":"出租车装业余电台传递载客信息属于谋取商业利益，违反严禁利用业余电台谋利的规定，故答案为 A。B、C、D 的“占频率不好”“不影响就行”“不查就行”都回避了商业用途违法的本质。","m":"电台拉客，谋利违法","g":""},{"i":"A-120","j":"LK0071","p":"1.5.2","q":"利用业余无线电台通信来促销业余无线电产品或者推动与业余无线电活动有关的其他商业性活动，对这类行为的态度应该是：","o":["禁止","不提倡但也不禁止，毕竟有利于业余无线电活动发展","只要是业余无线电民间组织是获利方，即使从事商业或其他营利活动，应支持","如果设台人或者设台单位本身是以这类经营为生的，应适当理解和容忍"],"a":[0],"e":"利用业余电台通信促销产品或推动商业活动属于谋取商业利益，态度是禁止，故答案为 A。B 的“有利于发展”、C 的“组织获利就行”、D 的“经营为生可容忍”都不能成为例外。","m":"电台做广告，一律禁止","g":""},{"i":"A-121","j":"LK0072","p":"1.5.2","q":"利用自己的业余电台强信号故意压制其他业余电台的正常通信，或者在业余无线电频率上转播音乐或广播节目，这些行为的性质属于：","o":["违法行为，违反了严禁阻碍其他无线电台通信的规定","不妥行为，没有考虑到他人的乐趣","正常现象，社会上一些人素质就是如此，应该谅解","不文明行为，对其他业余电台不够礼貌"],"a":[0],"e":"用强信号压制他人正常通信、在业余频率转播音乐广播，违反严禁阻碍其他电台通信的规定，属违法行为，故答案为 A。B、C、D 只说“不妥”“谅解”“不文明”，都弱化了违法性质。","m":"压台播音乐，违法阻通信","g":""},{"i":"A-122","j":"LY0073","p":"1.5.2","q":"业余无线电活动是否有序开展，会影响整个社会的无线电通信的安全和有效，使用不当甚至会导致生命财产损失。业余无线电爱好者在这方的责任是：","o":["业余无线电台设置、使用人应当加强自律","个人没有责任，只能依靠管理部门的监督检查和违法查处","个人没有责任，只能依靠业余无线电民间组织充当“协管”","有了电台执照，日常一切言行当然可以带到电台通信中，无责任可言"],"a":[0],"e":"业余无线电活动影响公共通信安全，设台使用人应当加强自律，故答案为 A。B、C 的“个人无责靠管理或协会”、D 的“有证就可为所欲为”都否定了设台人的自律责任。","m":"用好电台，靠的是自律","g":""},{"i":"A-123","j":"LY0111","p":"1.5.2","q":"业余无线电台可用于下列用途：","o":["相互通信、技术研究和自我训练","救灾抢险、车队联络和广播通信","娱乐休闲、报告路况和公益服务","技术教学、民兵训练和公益服务"],"a":[0],"e":"业余电台法定用途为相互通信、技术研究和自我训练，故答案为 A。B 的救灾车队广播、C 的娱乐路况、D 的民兵训练都不属于业余业务的法定用途。","m":"三用途再记：通信研究训练","g":""},{"i":"A-124","j":"LK0112","p":"1.5.2","q":"符合业余无线电爱好者基本条件的人群是：","o":["对无线电技术有兴趣并经无线电管理机构批准设置使用业余无线电台的人","任何对无线电技术有兴趣的公民","对无线电技术有兴趣并加入业余无线电协会的人","拥有较高无线电技术水平并加入业余无线电协会的人"],"a":[0],"e":"业余无线电爱好者的基本条件是对无线电技术有兴趣并经无线电管理机构批准设台使用，故答案为 A。B 缺批准条件，C、D 把入会或技术水平当必要条件，均错误。","m":"爱好者条件：有兴趣加批准","g":""},{"i":"A-125","j":"LX","p":"1.5.2","q":"业余无线电台禁止从事下列活动：","o":["在我国境内进行电波参数测试或者电波监测","向境外组织或者个人提供涉及国家安全的境内电波参数资料","故意收发无线电台执照许可事项之外的无线电信号","传播、公布或者利用无意接收的信息"],"a":[0,1,2,3],"e":"业余台禁止：在境内做电波参数测试监测（A）、向境外提供涉国家安全电波资料（B）、故意收发执照许可事项之外的信号（C）、传播公布利用无意接收的信息（D），故 ABCD 全选。四项均为管理条例明令禁止行为。","m":"四禁：测波、泄密、越权、泄信","g":""},{"i":"A-126","j":"LX","p":"1.5.2","q":"业余无线电台应当遵守下列哪些规定：","o":["在业余业务或者卫星业余业务频段内收发信号","不得擅自使用无线电频率","不得对依法开展的无线电业务造成有害干扰","不得利用无线电台(站)进行违法犯罪活动"],"a":[0,1,2,3],"e":"业余台应遵守：在业余/卫星业余频段内收发（A）、不得擅自用频（B）、不得对合法业务造成有害干扰（C）、不得利用电台违法犯罪（D），故 ABCD 全选。四项都是基本义务。","m":"四守：守频段、守许可、不干扰、不违法","g":""},{"i":"A-127","j":"LX","p":"1.5.2","q":"以下哪些使用业余无线电台的行为超越了在业余业务频率范围内收发信号的规定：","o":["利用业余无线电台收听民用航空器电台通联","利用业余无线电台收听铁路机车电台通联","利用业余无线电台收听渔船海事电台通联","利用业余无线电台收听国际空间站业余无线电台"],"a":[0,1,2],"e":"收听民用航空、铁路机车、渔船海事电台通联（A、B、C）都超出业余业务范围，属违规；收听国际空间站业余电台（D）是业余业务本身，合法，故答案为 ABC。","m":"空铁海事别偷听，空间站业余可听","g":""},{"i":"A-128","j":"LX","p":"1.5.2","q":"下列哪些未取得型号核准的无线电发射设备不可以作为自制、改装、拼装的业余无线电台设置、使用：","o":["相关企业批量生产的未取得型号核准证的无线电发射设备","已取得型号核准证，但型号核准证载明的频率范围不含业余业务的无线电发射设备","已取得型号核准证，但自行更换设备操作软件将频率范围扩展到业余业务频段的无线电发射设备","依法改装的取得型号核准证载明的频率范围包含业余业务频段的无线电发射设备"],"a":[0,1,2],"e":"企业批量生产未核准的设备（A）、核准频率不含业余的设备（B）、改软件扩频到业余频段的设备（C）都不能作为自制改装业余台使用，故答案为 ABC。D 的依法改装且核准含业余频段是合法的，故不选。","m":"三不能用：无证、频不对、改软件","g":""},{"i":"A-129","j":"LX","p":"1.5.2","q":"使用业余无线电台不得从事下列活动:","o":["发布、传播法律、行政法规禁止发布、传播的信息","用于谋取商业利益等超出业余无线电台使用属性之外的目的","故意干扰、阻碍其他无线电台（站）通信","故意收发业余无线电台执照载明事项之外的无线电信号"],"a":[0,1,2,3],"e":"使用业余台不得：发布传播禁止信息（A）、谋取商业利益等超属性目的（B）、故意干扰阻碍他台通信（C）、故意收发执照载明事项之外的信号（D），故 ABCD 全选。四项均为禁止行为。","m":"四不准：禁言禁商禁扰禁越权","g":""},{"i":"A-130","j":"LX","p":"1.5.2","q":"使用业余无线电台不得从事下列活动:","o":["传播、公布或者利用无意接收的信息","擅自编制、使用业余无线电台呼号","涂改、倒卖、出租或者出借业余无线电台执照","向境外组织或者个人提供涉及国家安全的境内电波参数资料"],"a":[0,1,2,3],"e":"使用业余台不得：传播公布利用无意接收的信息（A）、擅自编制使用呼号（B）、涂改倒卖出租出借执照（C）、向境外提供涉国家安全电波资料（D），故 ABCD 全选。四项均为禁止行为。","m":"四不准续：泄信、假呼号、倒执照、泄密","g":""},{"i":"A-131","j":"LX","p":"1.5.2","q":"使用业余无线电台应当符合如下规定：","o":["定期维护业余无线电台","保证其性能指标符合国家标准","保证其性能指标符合国家无线电管理的有关规定","避免对其他依法设置、使用的无线电台（站）产生有害干扰"],"a":[0,1,2,3],"e":"使用业余台应当：定期维护（A）、性能符合国家标准（B）和无线电管理规定（C）、避免对合法电台产生有害干扰（D），故 ABCD 全选。四项都是设台人的维护义务。","m":"四应当：勤维护、达标准、不干扰","g":""},{"i":"A-132","j":"LX","p":"1.5.2","q":"关于业余无线电台在通信过程中使用的语言，正确的做法为:","o":["在通信过程中使用明语","在通信过程中使用业余无线电领域公认的缩略语、简语","在通信过程中使用公开的技术体制和通信协议","在通信过程中使用自创的特殊缩略语"],"a":[0,1,2],"e":"通信语言正确做法是使用明语（A）、公认缩略语简语（B）、公开技术体制和通信协议（C），故答案为 ABC。D 的自创特殊缩略语等同暗语，违反明语要求，不选。","m":"语言三用：明语、公认语、公开协议","g":""},{"i":"A-133","j":"LK0053","p":"1.5.3","q":"关于业余无线电台的应急通信，正确的叙述是：","o":["在突发重大自然灾害等紧急情况下，业余无线电台才可以和非业余无线电台进行规定内容的通信","在日常应急通信训练中，业余无线电台可以和各种非业余无线电台进行通信","在日常应急通信训练中，业余无线电台可以和地方公益性救援团体的非业余无线电台进行通信","在日常应急通信训练中，业余无线电台可以和地方公益性救援团体的非业余无线电台进行通信，但须经当地业余无线电协会同意"],"a":[0],"e":"只有在突发重大自然灾害等紧急情况下，业余电台才可以和非业余电台进行规定内容的通信，故答案为 A。B、C、D 把日常训练、公益活动也纳入允许范围，扩大了例外，错误。","m":"应急通信：大灾大难才破例","g":""},{"i":"A-134","j":"LK0054","p":"1.5.3","q":"业余无线电台允许与非业余无线电台通信的条件是：","o":["在突发重大自然灾害等紧急情况下，内容限于与抢险救灾直接相关的紧急事务或者应急救援相关部门交办的任务","在当地政府或非盈利机构组织的公益活动中，内容限于与公益事务或者相关的活动组织机构交办的任务","在青少年科技教育活动中，仅可与青少年非业余无线电台通信，内容限于与青少年科技教育直接有关的事务","在无线电技术研究中，仅可与具备其他业务电台执照的对象通信，内容限于技术实验所需的信号"],"a":[0],"e":"业余台与非业余台通信的条件是突发重大自然灾害等紧急情况，且内容限于抢险救灾直接相关的紧急事务或应急部门交办任务，故答案为 A。B、C、D 的公益活动、青少年教育、技术研究都不构成法定例外。","m":"非常之时，非常之联，限救灾","g":""},{"i":"A-135","j":"LK0055","p":"1.5.3","q":"关于业余无线电台的应急通信，正确的叙述是：","o":["在突发重大自然灾害等紧急情况下，业余无线电台的通信内容可以涉及应急救援相关部门交办的任务","在平时的任何时侯，业余无线电台的通信内容可以涉及任何政府组织和非盈利机构交办的任务","平时在专门的应急通信训练活动中，业余无线电台的通信内容可以涉及应急救援相关部门和组织机构交办的任务","在日常公益性社会活动中，业余无线电台的通信内容可以涉及各种公益机构交办的任务"],"a":[0],"e":"在突发重大自然灾害等紧急情况下，业余台通信内容可以涉及应急救援相关部门交办的任务，故答案为 A。B 的平时任何时候、C 的平时训练、D 的日常公益都超出了“突发紧急”的限定，错误。","m":"紧急才接令，平时不越界","g":""},{"i":"A-136","j":"LX","p":"1.5.3","q":"业余无线电爱好者在应对突发事件应急处置应当遵守下列规定：","o":["为突发事件应急处置的需要，业余无线电台可以与非业余无线电台通信","通信内容应当限于与突发事件应急处置直接相关的紧急事务","遇有危及国家安全、公共安全、生命财产安全等紧急情况，可以不经批准临时设置、使用业余无线电台，但应当在 48小时内向电台所在地的无线电管理机构报告","遇有危及国家安全、公共安全、生命财产安全等紧急情况，未经批准临时设置、使用业余无线电台应在紧急情况消除后及时关闭"],"a":[0,1,2,3],"e":"突发事件应急处置中：可与非业余台通信（A）、内容限直接相关紧急事务（B）、危急时可不经批准临时设台但 48 小时内报告（C）、紧急消除后及时关闭（D），故 ABCD 全选。四项均为法规原话。","m":"应急四条：可联、限事、48小时报、事毕关","g":""},{"i":"A-137","j":"LK0074","p":"1.6.1","q":"业余无线电台设置、使用人应当接受下列机构对业余无线电台及其使用情况的监督检查：","o":["无线电管理机构的监督检查","业余无线电民间组织的独立监督检查","单位或所在居委会、村民委员会、物主委员会的监督检查","国家计量监督部门的监督检查"],"a":[0],"e":"业余台设置使用人应接受无线电管理机构的监督检查，故答案为 A。B 的民间组织独立检查、C 的居委会物委会、D 的计量部门都没有法定监督权，故错误。","m":"监督只认无委一家","g":""},{"i":"A-138","j":"LX","p":"1.6.1","q":"关于无线电频谱资源，下列说法正确的是：","o":["无线电频谱资源属于国家所有","国家对无线电频谱资源实行统一规划、合理开发、有偿使用的原则","国家鼓励、支持对无线电频谱资源的科学技术研究和先进技术的推广应用，提高无线电频谱资源的利用效率","根据维护国家安全、保障国家重大任务、处置重大突发事件等需要，国家可以实施无线电管制"],"a":[0,1,2,3],"e":"频谱资源：属国家所有（A）、统一规划合理开发有偿使用（B）、鼓励科研推广提高效率（C）、国家可依法实施无线电管制（D），故 ABCD 全选。四项都是条例总则内容。","m":"频谱四句：国家有、统一管、鼓励研、可管制","g":""},{"i":"A-139","j":"LX","p":"1.6.1","q":"关于无线电频率、业务、台（站），下列说法正确的是：","o":["任何单位或者个人不得擅自使用无线电频率","任何单位或者个人不得对依法开展的无线电业务造成有害干扰","任何单位或者个人不得利用无线电台（站）进行违法犯罪活动","设置、使用业余无线电台需要遵守《中华人民共和国无线电管理条例》"],"a":[0,1,2,3],"e":"任何单位个人不得擅自用频（A）、不得对合法业务造成有害干扰（B）、不得利用电台违法犯罪（C）、设用业余台须遵守无线电管理条例（D），故 ABCD 全选。四项都是基本法律义务。","m":"四不得一遵守，牢记不犯错","g":""},{"i":"A-140","j":"LK0103","p":"1.6.1","q":"违反国家规定，擅自设置、使用无线电台（站），或者擅自使用无线电频率，干扰无线电通讯秩序，情节严重的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；情节特别严重的，处三年以上七年以下有期徒刑，并处罚金。单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照前款的规定处罚。这个规定出自于下列法规律：","o":["中华人民共和国刑法","中华人民共和国民法通则","中华人民共和国无线电管理条例","中华人民共和国电信法"],"a":[0],"e":"擅自设台用频、干扰无线电秩序情节严重的处三年以下有期徒刑等，单位犯罪并罚，这是刑法第 288 条“扰乱无线电通讯管理秩序罪”，故答案为 A。B、C、D 所列法规没有该刑罚条款。","m":"擅设台扰秩序，刑法来治罪","g":""},{"i":"A-141","j":"LK0104","p":"1.6.1","q":"无线电频率的使用必须得到无线电管理机构的批准，基本依据是“无线电频谱资源属于国家所有”，出自于下列法律的第二百五十二条：","o":["中华人民共和国民法典","中华人民共和国宪法","中华人民共和国刑法","中华人民共和国电信法"],"a":[0],"e":"“无线电频谱资源属于国家所有”出自《民法典》第二百五十二条，故答案为 A。B 宪法、C 刑法、D 电信法都没有这一条文表述，故错误。","m":"频谱属国家，民法典二五二","g":""},{"i":"A-142","j":"LK0105","p":"1.6.1","q":"无线电管制是指在下列范围内依法采取的对无线电波的发射、辐射和传播实施的强制性管理：","o":["在特定时间和特定区域内","在全国范围、所有时间内","在特定范围、所有时间内","在例行范围和例行时间内"],"a":[0],"e":"无线电管制是在特定时间和特定区域内依法实施的，故答案为 A。B 的全国所有时间、C 的特定范围所有时间、D 的例行范围时间都扩大了管制的时空限定，错误。","m":"管制记住：特定时空才管","g":""},{"i":"A-143","j":"LK0106","p":"1.6.1","q":"无线电管制是指在特定时间和特定区域内，依法采取的下列性质的管理：","o":["对无线电波的发射、辐射和传播实施的强制性管理","对无线电波的发射、辐射实施的指导和行业自律性管理","对无线电发射设备的生产、销售实施的强制性管理","对无线电发射设备的生产、销售实施的指导和行业自律性管理"],"a":[0],"e":"无线电管制是对无线电波的发射、辐射和传播实施的强制性管理，故答案为 A。B 的指导自律、C、D 的管设备生产销售都混淆了管制对象和性质，错误。","m":"管制管电波，强制才有效","g":""},{"i":"A-144","j":"LK0107","p":"1.6.1","q":"在特定时间和特定区域内实施无线电管制时，与业余无线电有关的管理措施包括：","o":["限制或者禁止业余无线电台（站）的使用，以及对特定的无线电频率实施技术阻断等","限制或者禁止业余无线电台设备的生产和销售","限制、但不会禁止业余无线电台（站）的使用","依法设置的业余电台不在管制范围之内"],"a":[0],"e":"实施管制时可限制或禁止业余台使用，并对特定频率实施技术阻断，故答案为 A。B 的管设备生产销售、C 的只限不禁、D 的依法设台不在管制范围都错误。","m":"管制一到，业余台也得停","g":""},{"i":"A-145","j":"LY0108","p":"1.6.1","q":"决定实施无线电管制的机构为：","o":["在全国范围内或者跨省、自治区、直辖市实施，由国务院和中央军事委员会决定","在省、自治区、直辖市范围内实施，由省、自治区、直辖市人民政府和相关军区决定","在全国范围内或者跨省、自治区、直辖市实施，由国家无线电管理机构决定","在省、自治区、直辖市范围内实施，由相关地方无线电管理机构决定"],"a":[0,1],"e":"全国或跨省管制由国务院和中央军委决定（A），省内管制由省政府和相关军区决定（B），故答案为 AB。C、D 把决定权给了无线电管理机构，级别不够，错误。","m":"管制谁决定：国务军委，省府军区","g":""},{"i":"A-146","j":"LY0109","p":"1.6.1","q":"违反无线电管制命令和无线电管制指令的，由下列机构依法进行处罚：","o":["国家无线电管理机构或者省、自治区、直辖市无线电管理机构","违反治安管理规定者由公安机关处罚","当地业余无线电协会","所在军区派出的专门机构"],"a":[0,1],"e":"违反管制命令的由国家或省级无线电管理机构处罚（A），违反治安管理规定的由公安机关处罚（B），故答案为 AB。C 的协会、D 的军区专门机构没有该处罚权。","m":"违反管制：无委罚，治安公安罚","g":""},{"i":"A-147","j":"LY0110","p":"1.6.2","q":"业余电台违反无线电管制命令和无线电管制指令的，可以依法规受到下列处罚：","o":["责令改正；拒不改正的，关闭、查封、暂扣或者拆除相关设备","情节严重的，吊销电台执照","违反治安管理规定的，由公安机关处罚","处警告或者三万元以下的罚款"],"a":[0,1,2],"e":"业余台违反管制可：责令改正，拒不改正关闭查封暂扣拆除（A）；情节严重吊销执照（B）；违反治安由公安处罚（C），故答案为 ABC。D 的“警告或三万元以下罚款”不是该条的处罚种类。","m":"违管制三罚：改正、吊销、公安罚","g":""},{"i":"A-148","j":"LX","p":"1.6.2","q":"对未经许可擅自使用无线电频率的，无线电管理机构可以根据其具体情况给予下列处罚：","o":["由无线电管理机构责令改正，没收从事违法活动的设备和违法所得，可以并处 5万元以下的罚款","拒不改正的，并处 5万元以上 20万元以下的罚款","劝告拆除非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","责令停止使用非法设置的电台并作出书面检查；情节严 除的，不会采取拘留手段进行处理","产生有害干扰不会受到处罚","使用业余无线电台时，只要不对其他业余无线电台产生干扰即可"],"a":[0],"e":"《治安管理处罚法》规定：故意干扰无线电业务或产生有害干扰、经指出拒不消除的，处 5 日以上 10 日以下拘留，情节严重 10 日以上 15 日以下，故答案为 A。B、C 的“不拘留”“不处罚”、D 的“只不扰业余台”都错误。","m":"恶意干扰不改，拘留五到十五天","g":""},{"i":"A-165","j":"LX","p":"1.6.3","q":"关于《中华人民共和国网络安全法》，下列说法正确的是：","o":["任何个人和组织使用网络应当遵守宪法法律，遵守公共秩序，尊重社会公德，不得危害网络安全","不得利用网络从事危害国家安全、荣誉和利益的活动","不得利用网络编造、传播虚假信息扰乱经济秩序和社会秩序","不得利用网络侵害他人名誉、隐私、知识产权和其他合法权益"],"a":[0,1,2,3],"e":"《网络安全法》要求用网遵守宪法法律公序良俗（A）、不危害国家安全荣誉利益（B）、不编造传播虚假信息扰乱秩序（C）、不侵害他人名誉隐私知识产权（D），故 ABCD 全选。四项均为法条原文。","m":"上网四不：守法、不害国、不造谣、不侵权","g":""},{"i":"A-166","j":"LX","p":"1.6.3","q":"《中华人民共和国国家安全法》中提到，国家安全工作应当坚持总体国家安全观，以人民安全为（），以政治安全为（），以经济安全为（），以军事、文化、社会安全为（），以促进国际安全为依托，维护各领域国家安全，构建国家安全体系，走中国特色国家安全道路。","o":["宗旨、根本、基础、保障","宗旨、基础、保障、根本","根本、基础、保障、宗旨","基础、保障、宗旨、根本"],"a":[0],"e":"《国家安全法》表述为：以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事文化社会安全为保障，故答案为 A。B、C、D 的顺序错乱，不符合法条原文。","m":"国安四定：宗旨根本基础保障","g":""},{"i":"A-167","j":"LX","p":"1.6.3","q":"以下哪些是《中华人民共和国国家安全法》中规定的公民和组织应当履行的义务？","o":["遵守宪法、法律法规关于国家安全的有关规定","及时报告危害国家安全活动的线索","如实提供所知悉的涉及危害国家安全活动的证据","为国家安全工作提供便利条件或者其他协助"],"a":[0,1,2,3],"e":"公民组织国安义务：遵守国安法律法规（A）、及时报告危害国安线索（B）、如实提供证据（C）、为国安工作提供便利协助（D），故 ABCD 全选。四项均为法条原文。","m":"国安四义务：守法、报告、举证、协助","g":""},{"i":"A-168","j":"LK0048","p":"1.7.1","q":"业余无线电台在业余业务、卫星业余业务作为次要业务使用的频率或者与其他主要业务共同使用的频率上发射操作时，应当注意：","o":["遵守无线电管理机构对该频率的使用规定","首先守听频率是否已由其他业务电台占用，如听不到，即可按照先来先用的原则放心使用","只要遵守了《中华人民共和国无线电频率划分规定》的有关规定即可放心使用","可以任意使用，但在遇到其他业务电台使用时要主动避让"],"a":[0],"e":"在业余业务为次要业务或与其他主要业务共用的频率上发射，应遵守无线电管理机构对该频率的使用规定，故答案为 A。B 的“听不到就用”、C 的“只看划分规定”、D 的“任意用再避让”都忽视了管理机构的具体规定。","m":"次要频率用，听无委规定","g":""},{"i":"A-169","j":"LK0049","p":"1.7.1","q":"关于业余频率的使用，正确的叙述是：","o":["业余无线电台在无线电管理机构核准其使用的频段内，享有平等的频率使用权","任何业余无线电台在任何频段都享有平等的频率使用权","业余无线电台在无线电管理机构核准其使用的频段内，不同类别的业余电台享有不同优先程度的频率使用权","依法成立的地方业余无线电民间组织的业余电台，在其常用的台网频率上享有比其他个人设置的业余电台优先的使用权"],"a":[0],"e":"业余台在管理机构核准的频段内享有平等的频率使用权，故答案为 A。B 的“任何频段平等”、C 的“类别不同优先不同”、D 的“协会优先”都错误，核准范围外无使用权，类别间无优先。","m":"核准频段内，人人平等用","g":""},{"i":"A-170","j":"LK0141","p":"1.7.1", 为 3个无线电管理区域的划分办法。制定该方法的国际机构及其公布的文件为：","o":["国际电信联盟（ITU），《无线电规则》","美国业余无线电转信联盟（ARRL），《业余无线电手册》","国际业余无线电联盟（IARU），《IARU新闻》","美国《CQ》杂志，《WAZ奖状规则》"],"a":[0],"e":"把全球分为 3 个无线电管理区域的划分由国际电信联盟（ITU）在其《无线电规则》中制定。ARRL、IARU 的出版物和《CQ》杂志的奖状规则均无此立法效力。","m":"三区划分看ITU无线电规则","g":""},{"i":"A-228","j":"LY0200","p":"2.1.1","q":"ITU的区域划分有一套详尽规则。若概要描述则大致为：","o":["欧洲、俄罗斯亚洲部分、蒙古及部分西北亚国家为一区，南北美洲为二区，亚洲（除俄罗斯、蒙古和部分西北亚洲国家）和大洋洲为三区","欧洲、俄罗斯亚洲部分、蒙古及部分西北亚国家为一区，亚洲（除俄罗斯、蒙古和部分西北亚洲国家）和大洋洲为二区，南北美洲为三区，","南北美洲为一区，欧洲、俄罗斯亚洲部分、蒙古及部分西北亚国家为二区，亚洲（除俄罗斯、蒙古和部分西北亚洲国家）和大洋洲为三区","南北美洲为一区，亚洲（除俄罗斯、蒙古和部分西北亚洲国家）和大洋洲为二区，欧洲、俄罗斯亚洲部分、蒙古及部分西北亚国家为三区"],"a":[0],"e":"ITU 区域划分概要：一区为欧洲、俄罗斯亚洲部分、蒙古及部分西北亚国家；二区为南北美洲；三区为亚洲其余部分和大洋洲，我国属三区。B、C、D 均把二、三区或一区的位置对调，描述错误。","m":"一欧二美三亚太：中国三区","g":""},{"i":"A-229","j":"LX","p":"2.1.2","q":"业余无线电频率划分在 ITU的 3个无线电管理分区中略有不同。ITU三区的 40米业余波段为：","o":["7.000-7.200MHz","7.000-7.300MHz","7.000-7.200MHz专用，7.200-7.300MHz共用","7.000-7.100MHz专用，7.100-7.300MHz共用"],"a":[0],"e":"我国属 ITU 第三区，该区 40 米业余波段为 7.000-7.200MHz。B 项的 7.300 是二区上限，C、D 项虚构了区内再分专用/共用的安排，均不正确。","m":"三区40米：7000到7200","g":""},{"i":"A-230","j":"LX","p":"2.1.2","q":"2米波段的话音联络通常位于 144.035-145.800MHz。这也是 IARU第 3区波段规划中的一个多模式共用细分频段。假设一部业余电台正以 FM方式在该频段参与通联，发射带宽小于 20kHz并且频率容限优于±2kHz，则该台的主载波设置范围可以是：","o":["从 144.047MHz至 145.788MHz","从 144.023MHz至 145.788MHz","从 144.047MHz至 145.812MHz","从 144.023MHz至 145.812MHz"],"a":[0],"e":"FM 带宽 20kHz（左右各 10kHz），频率容限 ±2kHz：下限 = 144.035 + 0.010 + 0.002 = 144.047MHz，上限 = 145.800 - 0.010 - 0.002 = 145.788MHz。B、D 项下限只加了带宽一半或未加容限，C 项上限未扣除容限，均不完整。","m":"FM：上下各加半带宽加容限","g":""},{"i":"A-231","j":"LX","p":"2.1.2","q":"2米波段的话音联络通常位于 144.035-145.800MHz。这也是 IARU第 3区波段规划中的一个多模式共用细分频段。假设一部业余电台正以 USB方式在该频段参与通联，发射带宽小于 3kHz并且频率容限优于±2kHz，则该电台的主载波设置范围可以是：","o":["从 144.037MHz至 145.795MHz","从 144.030MHz至 145.795MHz","从 144.037MHz至 145.805MHz","从 144.030MHz至 145.805MHz"],"a":[0],"e":"USB 语音从 144.035MHz 开始，带宽小于 3kHz（上边带），频率容限 ±2kHz：下限 = 144.035 + 0.002 = 144.037MHz，上限 = 145.800 - 0.003 - 0.002 = 145.795MHz。其他选项的加减组合不符合带宽与容限的要求。","m":"USB：下限加容限，上限减带宽减 o":["呼叫 CQ并报出己方呼号。清晰起见，可重复一两次 CQ并对呼号进行字母拼读","呼叫“有朋友在频率上吗？”，然后报出自己的呼号。清晰起见，可对呼号进行字母拼读","说“CQ”三次，再说“请过来”一次。清晰起见，可对 CQ进行字母拼读","说“CQ”三次，再说“standing by”一次。清晰起见，可对 CQ进行字母拼读"],"a":[0],"e":"发起 CQ 呼叫的标准做法是呼叫 CQ 并报出己方呼号，为清晰起见可重复一两次 CQ 并对呼号进行字母拼读。B 项的寒暄式呼叫、C、D 项的机械重复均不符合业余无线电通信惯例。","m":"发CQ：呼CQ报呼号，拼读更清楚","g":""},{"i":"A-248","j":"LY1097","p":"2.2.1","q":"如何回答一个 CQ呼叫？","o":["报出对方的呼号并报出自己的呼号。清晰起见，可重复关键内容或进行字母拼读","报出自己的呼号并报出对方的呼号。清晰起见，可重复关键内容或进行字母拼读","说“CQ”三次再报出对方的呼号三次。清晰起见，可重复关键内容或进行字母拼读","先给出信号报告再报出自己的呼号。清晰起见，可重复关键内容或进行字母拼读"],"a":[0],"e":"回答 CQ 呼叫时应先报出对方的呼号再报出自己的呼号，为清晰起见可重复关键内容或进行字母拼读。B 项顺序颠倒，C 项重复呼叫 CQ，D 项先给信号报告，均不符合惯例。","m":"应答：先对方呼号，再自己","g":""},{"i":"A-249","j":"LX","p":"2.2.1","q":"业余电台操作员小强呼叫另一业余电台并希望与操作员小明通话的方法是：","o":["报出对方的呼号并报出自己的呼号。建立通信后即可提出与小明通话","报出自己的呼号并报出对方的呼号。建立联络后即可提出与小明通话","说“CQ小明”三次再报出自己的呼号。清晰起见，可对呼号进行字母拼读","说“CQ小明”三次再报出“我是小强”。清晰起见，可对 CQ进行字母拼读"],"a":[0],"e":"呼叫另一业余电台时应先报对方呼号再报自己呼号，建立通信后再提出希望与小明通话。直接呼叫 CQ 加人名或用口语我是小强均不符合呼叫程序。","m":"先对后己：建联后再点名","g":""},{"i":"A-250","j":"LX","p":"2.2.1","q":"业余电台建立通信后，双方应首先交换的必要信息是：","o":["信号报告","操作员名字","操作地点","设备、设施情况"],"a":[0],"e":"业余电台建立通信后双方应首先交换信号报告（RST/RS），这是确认双向通信质量的基础。操作员名字、地点、设备情况是后续寒暄内容，不是首要交换的信息。","m":"建联第一件事：交换信号报告","g":""},{"i":"A-251","j":"LX","p":"2.2.1","q":"为什么业余电台建立通信后总是立即交换信号报告？","o":["双方需要此报告来了解传播情况，安排最适合的操作","这是最基本的报务要求，不必去问，只管去执行就好","双方需要此报告来校准发射功率","决定是否放弃联络，因为低于 S5的信号与奖状无缘"],"a":[0],"e":"立即交换信号报告是为了让双方了解传播情况，从而安排最适合的操作方式（如调整功率、天线或改用其他模式）。它不是无意义的报务形式，也不是校准功率或评奖的工具。","m":"信号报告：摸传播，定打法","g":""},{"i":"A-252","j":"LY0323","p":"2.2.1","q":"在现代业余无线电通信中，信号报告均采用“RST格式”。缩语 RST中的字母 R代表：","o":["信号的可辩度","信号的强度","信号的纯净度","Q简语 QRK"],"a":[0],"e":"RST 中 R 代表 Readability，即信号的可辩度（可读性），分 1-5 级；S 代表信号强度，T 代表电码音调的纯净度。B、C 项分别对应 S 和 T 的含义，D 项的 QRK 与 RST 无关。","m":"RST的R：可辩度Readability","g":""},{"i":"A-253","j":"LX","p":"2.2.1","q":"小明和小强进行 CW和 FM联络，双方的收信机均指示信号强度为“5”。通报时，双方评价听抄顺畅，没有变调等信号缺陷；通话时，双方认为声音易于辩识，没有明显影响听抄的失真。此时，双方应当为 CW和 FM通联给出信号报告：","o":["559和 55","55和 559","不必关心信号强度表的指示，给出 599和 59才是最好的","不必关心信号强度表的指示，给出 59和 599才是最好的"],"a":[0],"e":"CW 用 RST 三位报告（可辩度-强度-音调），FM 话音用 RS 两位报告（可辩度-强度）。题中可辩度 5、强度 5、CW 音调 9，故 CW 为 559、FM 为 55。B 项把两种模式搞反，C、D 项虚报 599/59 不诚实。","m":"CW三位RST，话音两位RS","g":""},{"i":"A-254","j":"LY0235","p":"2.2.2","q":"业余电台在发起呼叫前应先守听。但是，我们有时会因听不到通信中的某一方而误认为频率空闲。此时呼叫“CQ”有可能干扰他人联络。为尽量避免这种情况，我们可以：","o":["询问“有人使用频率吗？”，确认没有应答再发起呼叫","询问“有吗？有吗？请过来。”，确认没有应答再发起呼叫","先启动呼叫再进行通信，等听到确实有电台在工作再让出频率不迟","先启动呼叫再进行通信，只要没有其他电台要求 QSY就持续使用"],"a":[0],"e":"发起呼叫前应先守听，若可能只听到通信一方而误判频率空闲，应先询问有人使用频率吗，确认无应答后再发起呼叫。B 项用语不规范，C、D 项先呼叫后让频会干扰他人正常联络。","m":"呼叫前先问：有人用频吗","g":""},{"i":"A-255","j":"LY0244","p":"2.2.2","q":"BH1ZZZ希望加入两个电台相互之间的联络。正确的方法是：","o":["在一方刚刚停止讲话时迅速发出“插入”或“break”。如得到回应，再说明“BH1ZZZ请求插入”。待对方正式邀请后，开始正式对话","在一方正在讲话时短暂插入一次“break”，向正在收听的一方发出插入请求","短暂发射一次“插入”或“break”。如对方无反应，可以加大功率反复尝试","如果双方都是自己熟悉的业余电台操作员，直接讲进去便是，不必拘泥礼节"],"a":[0],"e":"BH1ZZZ 请求插入的正确方法是：在一方刚停止讲话的间隙迅速发出插入或 break，如获回应再报呼号请求插入，待对方正式邀请后才开始对话。讲话中插入、加大功率强行插入或直接讲进去均不礼貌。","m":"插入三步：间隙喊break，等邀请再说话","g":""},{"i":"A-256","j":"LX","p":"2.2.2","q":"如果在联络中听到有个遇险的电台要求插入，你该怎么做？","o":["立即与该台确认险情并了解其需要什么帮助","立即联系或找人协助联系当地熟悉紧急情况下通信联络的爱好者或爱好者团队","立即变更工作频率","立即停止发射活动"],"a":[0],"e":"联络中听到遇险电台要求插入，应立即与该台确认险情并了解其需要什么帮助，遇险通信具有最高优先级。变更频率、停止发射或转找他人都会延误救援，均不正确。","m":"遇险插入：最高优先，立即确认救援","g":""},{"i":"A-257","j":"LY0245","p":"2.2.2","q":"在请求插入两个电台间的对话之时，一个值得借鉴的经验是：","o":["思考自己的加入是否会影响原通信双方的交谈乐趣","确认自己的信号质量可以得到原通信双方的共同赞赏","确定自己的操作等级与原通信双方的大体相当","确信自己有比原通信双方更具吸引力的谈话内容"],"a":[0],"e":"请求插入他人对话前应先思考：自己的加入是否会影响原通信双方的交谈乐趣，尊重原有联络。信号质量、操作等级、谈话内容都不是插入与否的决定因素。","m":"想插入先想：会不会扫人家的兴","g":""},{"i":"A-258","j":"LK0246","p":"2.2.2","q":"若发现有业余电台的发射操作技巧不够规范，但还不至于造成严重的干扰和影响，正确的做法是：","o":["通过电话、邮件等方式提出善意的改进建议","立即在频率上当面加以指出和纠正","立即报告无线电管理机构进行干涉","立即报告当地业余无线电协会，由其总部电台到频率上进行纠察"],"a":[0],"e":"发现他台操作技巧不规范但未造成严重干扰时，应通过电话、邮件等私下渠道提出善意的改进建议。在频率上当面指正会占用公共频率且伤和气，动辄上报管理机构则小题大做。","m":"小毛病私下说，别在频率上吵","g":""},{"i":"A-259","j":"LK0247","p":"2.2.2","q":"业余电台通信受到违法电台或者不明电台的严重干扰。正确的做法是：","o":["不予理睬，收集有关信息并向无线电管理机构举报","在频率上向其宣传无线电管理法，要求其停止干扰","立即报告无线电管理机构进行干涉","用大功率信号对其进行压制"],"a":[0],"e":"受到违法或不明电台严重干扰时，正确做法是不予理睬，避免与其纠缠，同时收集有关信息并向无线电管理机构举报。在频率上宣传法规、以大功率压制都会加剧干扰、违反规定。","m":"被干扰：不理睬，取证，举报","g":""},{"i":"A-260","j":"LK0274","p":"2.2.2","q":"如果与几十千米以外的某业余电台有很多重要的技术问题和个人情况要交流，应该选用下列通信方式：","o":["电话或者互联网","利用当地的业余中继台","利用 HF频段业余电台","利用天线足够高的 VHF/UHF频段业余电台"],"a":[0],"e":"与几十千米外电台长谈技术和个人话题，应选用电话或互联网，而不应长时间占用业余频率。业余频率是公共资源，长篇闲聊既不符合业余业务宗旨，也挤占他人使用机会。","m":"长聊私事：打电话上网，别占频率","g":""},{"i":"A-261","j":"LK0075","p":"2.2.3","q":"法规和国际业余无线电惯例要求业余电台日志应记载的必要内容是：","o":["通信时间、通信频率、通信模式、对方呼号、双方信号报告","通信对方姓名、对方所在国家或城市、通信模式、双方信号报告","通信时间、通信频率、双方收发信设备和天线、对方台址","通信时间、通信模式、对方信号报告、对方台址、对方天气"],"a":[0],"e":"法规和国际惯例要求业余电台日志记载的必要内容是：通信时间、通信频率、通信模式、对方呼号、双方信号报告。对方姓名、设备、天线、天气等是可选的补充信息，不是必要内容。","m":"日志五要素：时间频率模式呼号报告","g":""},{"i":"A-262","j":"LK0076","p":"2.2.3","q":"法规和国际业余无线电惯例要求业余电台日志应记载的必要内容是：","o":["DATE、TIME、FREQ、MODE、CALL（对方）、RST（双方）","DATE、FREQ、QTH（对方）、RIG（对方）、RST（双方）、WX（对方）","DATE、TIME、MODE、CALL（对方）、QTH（对方）、RST（双方）","CALL（通信对方）、TIME、FREQ、RIG（对方）、RST（双方）、PWR（双方）"],"a":[0],"e":"日志必要内容用英文缩写即 DATE、TIME、FREQ、MODE、CALL（对方）、RST（双方）。B、C、D 项混入了 QTH、RIG、WX、PWR 等非必要项目，不符合法规和惯例要求。","m":"DATE TIME FREQ MODE CALL RST","g":""},{"i":"A-263","j":"LX","p":"2.2.3","q":"业余无线电台交换 QSL卡具有多重意义，包括：","o":["确认本地、国内，甚至世界范围内的无线电联络","掌握包括自制发射机在内的本台设备的运作表现","申请奖状，证明自己在通信、技术等领域的努力","纯粹收集，欣赏，展示来自世界各地的 QSL卡片"],"a":[0,1,2,3],"e":"交换 QSL 卡的意义包括：确认本地、国内乃至世界范围的无线电联络；检验包括自制发射机在内的本台设备运作表现；作为申请奖状的证明；以及纯粹的收集欣赏展示。四项均正确，故选 ABCD。","m":"QSL四用：确认、验设备、申奖状、收藏","g":""},{"i":"A-264","j":"LX","p":"2.2.3","q":"QSL卡片应至少涵盖哪些内容：","o":["联络双方的电台呼号","双方信号报告和联络时间","操作方式及联络频率","操作员签章、本台通信地址"],"a":[0,1,2,3],"e":"QSL卡片是通联的书面凭证，四项缺一不可：双方呼号确认联络对象，信号报告与UTC时间确认联络质量与时刻，模式与频率确认联络方式，签章和通信地址确认卡片真实性与回卡渠道。缺少任一项都会使卡片失去证明效力。","m":"双呼号报告时间，模式频率签章地址","g":""},{"i":"A-265","j":"LK1042","p":"2.2.3","q":"关于 QSL卡片的用法，以下说法正确的是：","o":["如果所交换的 QSL卡片并非用作通联或收听证明，则应在通信方式一栏填写“现场交流”或“Eyeball QSO”等字样。不应赠送空白卡片","业余无线电爱好者的空白 QSL卡片可以用作照片或名片，适合赠送，交换或散发","火腿都是互相的。虽然对方没有联络自己，但是也可以发去确认联络的 QSL卡片","如果在联络中没有听清对方呼号，或在日志中漏填或打错了对方呼号，则在寄发 QSL卡片时可在对方呼号一栏填写对方操作员的名字"],"a":[0],"e":"非通联证明的卡片须在通信方式栏注明“现场交流”或“Eyeball QSO”，且绝不能赠送空白卡片，因为空白卡可能被冒用伪造通联记录。B错在空白卡不可当名片散发；C错在未联络不能发确认卡；D错在呼号栏不能写操作员名字代替。","m":"非通联写Eyeball，空白卡片不能送","g":""},{"i":"A-266","j":"LK1041","p":"2.2.3","q":"收到国外寄来的 QSL卡片时，如果信封中夹带有一张或多张 IRC，则应：","o":["尽快检查电台日志，确认联络的真实性，向对方地址直接寄出自己的 QSL卡片","不必确认联络的真实性，只要尽快向对方地址直接寄出自己的卡片即可","尽快检查电台日志，确认联络的真实性，向国内 QSL卡片管理局寄出自己的卡片","不必理会。操作类别越低越不必理会。低级别业余电台的 QSL卡片通常不具价值"],"a":[0],"e":"IRC是国际回邮券，作用是替对方承担回邮邮资。收到夹带IRC的国外卡片时，应先查日志核实联络真实性，再直接寄往对方地址回卡。B跳过核实不可取；C错在国外来卡应直邮而非经国内卡片局；D无视对方既失礼也浪费了IRC。","m":"先验日志再直邮，IRC专款回邮用","g":""},{"i":"A-267","j":"LK1011","p":"2.2.3","q":"填写和邮寄 QSL卡片的正确做法是：","o":["迫切需要对方回寄卡片时，应直接向对方地址邮寄卡片并附加 SASE","填写错误时应划去或使用涂改液覆盖错误内容并加以改正","自己的邮寄地址与电台的发射地点不同时，应在 QTH栏目内填明详细邮寄地址","通过卡片管理局寄出卡片并希望对方回卡时，应在卡片上注明 PSE QSL DIRECT"],"a":[0],"e":"迫切需要回卡时直接邮寄并附SASE（贴足邮资、写好地址的回邮信封），可最大限度提高回卡率。B错：填错应重写，涂改液会使卡片作废；C错：邮寄地址应填地址栏，QTH栏填的是发射地点；D错：经卡片局寄出就不应再要求对方直接回卡。","m":"急要回卡附SASE，填错重写不涂改","g":""},{"i":"A-268","j":"LY0386","p":"2.2.3","q":"交换 QSL卡片时，我们时有遇见一类特殊的无线电爱好者，他们仅向我们寄发收听卡片。而我们在确认卡片所载内容之后会立即回卡以示敬意。这类爱好者是：","o":["短波收听者（SWL）","广播爱好者","DIY爱好者","业余无线电监测员"],"a":[0],"e":"SWL即短波收听者，只收听不发射，常寄出收听报告卡（SWL卡）请求确认，收到后回卡是国际惯例的礼节。广播爱好者、DIY爱好者、监测员都不是这一行为的主体。","m":"只听不发寄收听卡，SWL回卡是礼节","g":""},{"i":"A-269","j":"LY0272","p":"2.2.4","q":"通过中继台进行通联时，我们应事先设好电台的接收和发射频差，以便顺利应对上行或下行频率上的各种操作，避免边联络边设置，忙中出错。144和 430MHz频段业余中继台的上下行频差分别为：","o":["0.6MHz，5MHz","12.5kHz，25kHz","4MHz，10MHz","2MHz，5MHz"],"a":[0],"e":"我国144MHz频段中继上下行频差为0.6MHz，430MHz频段为5MHz，这是国内中继台的标准设置，事先设好可避免通联中手忙脚乱。B是频道步进值；C、D的数值不符合国内中继规范。","m":"2米差0.6，70厘米差5兆","g":""},{"i":"A-270","j":"LY1096","p":"2.2.4","q":"如果通过中继台呼叫一部业余电台，你应当：","o":["呼叫对方的呼号并报出自己的呼号","呼叫“break, break”，然后说出对方呼号二至三次","呼叫“CQ”三次，然后说出自己的呼号三次","等待，直到你要呼叫的电台通过中继台呼叫 CQ"],"a":[0],"e":"经中继呼叫应报出对方呼号再报自己呼号，清晰表明呼叫对象和身份。“break”是紧急插入用语不可滥用；在中继上呼叫CQ既不礼貌也低效；干等对方呼叫则纯属碰运气。","m":"中继呼叫：先报对方，再报自己","g":""},{"i":"A-271","j":"LY0275","p":"2.2.4","q":"业余中继台的使用原则是：","o":["除必要的简短联络外，业余中继台的上行和下行频率应保持空闲，以备随时响应突发灾害等紧急情况下的呼叫","应使中继台尽量处于接近饱和的忙碌状态，提高使用效率","鼓励业余无线电民间组织（协会）通过中继台向当地会员发布通知","鼓励青少年学生通过中继台交流解题方法和学习心得"],"a":[0],"e":"中继台是应急通信的生命线，使用原则是除必要简短联络外保持上下行频率空闲，随时响应突发灾害等紧急呼叫。B的“接近饱和”与应急备勤相悖；C、D把中继当广播和聊天工具，均属占用公共资源。","m":"中继保持空闲，应急随时能用","g":""},{"i":"A-272","j":"LY0236","p":"2.3.1","q":"业余电台在发起呼叫前应先守听一段时间，然后再询问“有人使用频率吗？”，确认没有应答方可发起呼叫。下列英语短句中不能正确表达这一询问的是：","o":["Calling you, Roger？","Is this frequency in use？","Is anyone at this frequency？","Anybody here？"],"a":[0],"e":"发起呼叫前应守听并询问频率是否空闲，标准问法是Is this frequency in use?等。“Calling you, Roger?”语义不通，不能表达询问是否空闲的意思。B、C、D都是常用正确表达。","m":"问空闲用in use，Calling you不行","g":""},{"i":"A-273","j":"LY0238","p":"2.3.1","q":"业余电台 BH1ZZZ用 FM或 SSB话音发起 CQ呼叫的方法为：","o":["CQ CQ CQ，这里是 BH1ZZZ，Bravo Hotel One Zulu Zulu Zulu，BH1ZZZ 呼叫 CQ，听到请回答","CQ CQ CQ，请您继续","CQ CQ CQ，我是 1ZZZ，请过来","CQ CQ CQ；CQ CQ CQ；CQ CQ CQ，我是 BH1ZZZ，您请讲"],"a":[0],"e":"FM/SSB话音CQ的规范格式是：CQ三遍＋完整呼号＋NATO音标拼读＋说明呼叫CQ等回答。B呼号不全且用语随意；C呼号残缺；D连呼三遍CQ后只说“您请讲”，对象不明。","m":"CQ加全呼号，音标拼读报清楚","g":""},{"i":"A-274","j":"LY0239","p":"2.3.1","q":"业余电台 BH1ZZZ用话音发起 CQ呼叫的方法为：","o":["CQ CQ CQ, this is BH1ZZZ, Bravo Hotel One Zulu Zulu Zulu, BH1ZZZ calling CQ andstanding by","CQ CQ, calling CQ. Go ahead","CQ CQ, calling CQ, this is One Zulu Zulu Zulu. Come on","CQ CQ CQ, CQ CQ CQ, CQ CQ CQ, this is BH1ZZZ. Back to you"],"a":[0],"e":"英文话音CQ同样要求完整呼号＋拼读＋standing by（等回答）。B的Go ahead、C的Come on过于随意且呼号不全；D的Back to you用于已建立联络后交话，不适用于发起CQ。","m":"英文CQ：全呼号拼读加standing by","g":""},{"i":"A-275","j":"LY0241","p":"2.3.1","q":"业余电台 BH1ZZZ用话音呼叫 BH8YYY的方法为：","o":["BH8YYY，BH8YYY，BH8YYY，这里是 BH1ZZZ，Bravo Hotel One Zulu Zulu Zulu，BH1ZZZ呼叫，听到请回答","BH8YYY，我是 BH1ZZZ，我是 BH1ZZZ，我是 BH1ZZZ，您继续","BH8YYY，我是 1ZZZ，请过来","8YYY，BH1ZZZ，听到讲"],"a":[0],"e":"话音呼叫特定电台的规范是：对方呼号三遍＋“这里是”＋本台呼号＋拼读＋“听到请回答”。B、C、D呼号残缺或用语不规范，容易让对方无法确认身份。","m":"叫特定台：对方三遍加自己全呼号","g":""},{"i":"A-276","j":"LY0242","p":"2.3.1","q":"业余电台 BH1ZZZ用话音呼叫 BH8YYY的方法为：","o":["BH8YYY, BH8YYY, BH8YYY, this is BH1ZZZ, Bravo Hotel One Zulu Zulu Zulu,BH1ZZZ calling you and standing by","BH8YYY, Bravo Hotel Eight Yankee Yankee Yankee, BH8YYY, go ahead","BH8YYY, this is One Zulu Zulu Zulu, come on","8YYY, this is BH1ZZZ, over over"],"a":[0],"e":"英文版呼叫特定台同样：对方呼号三遍＋this is＋本台呼号＋拼读＋calling you and standing by。B把己方呼号说成对方，C呼号残缺，D用over over收尾不规范。","m":"英文叫台：对方三遍this is加拼读","g":""},{"i":"A-277","j":"LY0378","p":"2.3.1","q":"建立话音通信后，操作员小明打算给对方电台 BH1ZZZ “57”的信号报告。他可以这样讲：","o":["BH1ZZZ，你的信号 57。是否抄收？","BH1ZZZ，我给你 57的信号可以吗？","57，57，拷贝了吗？","57，57，这里是 BH1ZZZ，听到请回答"],"a":[0],"e":"给信号报告应点名对方呼号，清晰报出“57”，并以“是否抄收？”确认对方收到。B把报告当成征求意见；C、D没有明确呼叫对象，不符合通联规范。","m":"报告点名加确认，是否抄收问一句","g":""},{"i":"A-278","j":"LY0378","p":"2.3.1","q":"建立话音通信后，操作员小明打算给对方电台 BH1ZZZ “57”的信号报告。他可以这样讲：","o":["BH1ZZZ, you are 57, QSL?","BH1ZZZ, may I rate you 57?","Hey, 57, QSL?","Hey 57，this is BH1ZZZ. Roger?"],"a":[0],"e":"英文信号报告规范说法是“BH1ZZZ, you are 57, QSL?”，即点名、给报告、请求确认三要素。B的may I rate、C的Hey开头、D对象错乱，都不符合规范。","m":"英文报告三要素：点名、57、QSL","g":""},{"i":"A-279","j":"LY0321","p":"2.3.1","q":"建立话音通信后，小明打算介绍自己是在成都操作的。他可以这样讲：","o":["我的 QTH是成都","我 QRT在成都","我在成都 QRO","我在成都 QRV"],"a":[0],"e":"QTH的含义就是电台所在地，所以“我的QTH是成都”正确。QRT是关机，QRO是增大功率，QRV是准备好收信，含义都不对。","m":"所在地用QTH，关机加功率都不是","g":""},{"i":"A-280","j":"LY0321","p":"2.3.1","q":"建立话音通信后，小明打算介绍自己是在成都操作的。他可以这样讲：","o":["My QTH is Chengdu","I QRT in Chengdu","I run QRO in Chengdu","I am QRV at Chengdu"],"a":[0],"e":"英文同样用My QTH is Chengdu表示所在地。I QRT（我要关机）、I run QRO（我加大功率）、I am QRV（我准备好）都答非所问。","m":"My QTH is，所在地标准说","g":""},{"i":"A-281","j":"LY0343","p":"2.3.1","q":"收听业余无线电爱好者的 SSB通联时，我们有时会听到 “Cheerio.”、“Ciao ciao.”或“Do svidaniya.”一类的短句。其含义是：","o":["不同国家或地区的爱好者互致美好祝愿并表达再见之意","一些英语词汇","一些非英语词汇","从一种语言至另一种语言的转写"],"a":[0],"e":"Cheerio（英）、Ciao（意）、Dosvidaniya（俄）都是各国语言中的告别祝福，体现了业余无线电跨越国界的友谊。B、C、D只描述了语言现象，没有点出互致祝愿和再见的含义。","m":"多国语言道再见，友谊跨越国界线","g":""},{"i":"A-282","j":"LY0288","p":"2.4.1","q":"QRP操作时如果对方反映信号不好，我们可能会追问是否需要增加功率。此时可发送：","o":["QRO？","QSO？","QRP？","QRS？"],"a":[0],"e":"QRP小功率操作对方反映信号不好时，追问是否需要加功率用QRO?（要我加大功率吗？）。QSO是联络，QRP是减小功率（正好相反），QRS是请发慢。","m":"信号不好问加功率，QRO","g":""},{"i":"A-283","j":"LY0289","p":"2.4.1","q":"通联时，如认为 QRP操作足以保证可靠联络，则可与对方协商降低功率。短句为：","o":["QRP？","May I try QR
