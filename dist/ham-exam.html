O for you？","QRU？","May I try QRT for you？"],"a":[0],"e":"认为QRP功率已够、协商降功率用QRP?（我减小功率好吗？）。B的QRO是加大功率，正好相反；C的QRU是问有无消息；D的QRT是关机。","m":"协商降功率用QRP，QRO是反的","g":""},{"i":"A-284","j":"LX","p":"2.4.1","q":"业余电台以低于 5 瓦的功率开展通信研究或追逐奖状时，常在呼号之后附加操作属性“QRP”。例如：BI9XYZ/QRP。Q简语“QRP”表示：","o":["我已降低发射功率","我已降低发射功率至 5W","我是新手，请发慢一些，照顾一下","我在挑战小功率通信极限，请高速发过来"],"a":[0],"e":"呼号后附加/QRP表示该电台声明自己已降低发射功率进行小功率操作。官方定义即“我已降低发射功率”，B的“至5W”过于具体，C、D与功率无关。","m":"呼号后缀/QRP，声明已降功率","g":""},{"i":"A-285","j":"LY0297","p":"2.4.1","q":"通联时，如果希望对方加快发报速度，我们可以发送：","o":["PSE QRQ","PSE QRS","PSE QRT","PSE QTR"],"a":[0],"e":"请对方加快发报速度用PSE QRQ。QRS是请放慢（正好相反），QRT是关机，QTR不是速度相关简语。","m":"请快发PSE QRQ，快慢QR分清","g":""},{"i":"A-286","j":"LY0296","p":"2.4.1","q":"通联时，如果对方要求加快发报速度，我们可以通过反问来确认。此时可以发送：","o":["QRQ？","QRS？","QRT？","QTR？"],"a":[0],"e":"对方要求加快时，反问确认用QRQ?（要我发快吗？）。QRS是放慢，QRT是关机，QTR无关。","m":"确认加快问QRQ","g":""},{"i":"A-287","j":"LY0299","p":"2.4.1","q":"通联时，如果希望对方放慢发报速度，我们可以发送：","o":["PSE QRS","PSE QRQ","PSE QSY","PSE QSL"],"a":[0],"e":"请对方放慢发报速度用PSE QRS。QRQ是加快（正好相反），QSY是改频率，QSL是确认收妥。","m":"请慢发PSE QRS","g":""},{"i":"A-288","j":"LY0298","p":"2.4.1","q":"通联时，如果对方要求放慢发报速度，我们可以通过反问来确认。此时可以发送：","o":["QRS？","QRQ？","QSY？","QSL？"],"a":[0],"e":"对方要求放慢时，反问确认用QRS?（要我发慢吗？）。QRQ是加快，QSY是改频率，QSL是确认。","m":"确认放慢问QRS","g":""},{"i":"A-289","j":"LY0302","p":"2.4.1","q":"结束当天的通联活动时，业余电台常会发送 Q简语“QRT”。其含义为：","o":["我要关闭收发信机了，再见","我要变更发射频率至 nnnn千赫（或兆赫）","我不再呼叫了，尚未联络的请用 email约起来","我要变更操作方式了，有要联络的请尽快叫过来"],"a":[0],"e":"QRT的含义是“我要关闭收发信机了”，用于结束当天通联活动告别。B是QSY（改频率），C、D是生造的含义。","m":"QRT是要关机，今天到此停","g":""},{"i":"A-290","j":"LY0285","p":"2.4.1","q":"在结束联络之前，我们可以询问对方是否还有消息要传达。此时可以发送：","o":["QRU？","QRL？","QRB？","QRQ？"],"a":[0],"e":"结束联络前询问对方是否还有消息，用QRU?（你还有事吗？）。QRL是问频率忙否，QRB问距离，QRQ是加快发报。","m":"结束前问还有事，QRU","g":""},{"i":"A-291","j":"LY0286","p":"2.4.1","q":"结束联络时，我们可以告诉对方这里已无事。此时可以发送：","o":["QRU","QRL","QRM","QRN"],"a":[0],"e":"告知对方这里已无事用QRU陈述句。QRL是频率忙，QRM是他台干扰，QRN是天电干扰，都不表示“无事”。","m":"无事可报发QRU","g":""},{"i":"A-292","j":"LY0301","p":"2.4.1","q":"通联时，如希望相约对方参加某个业余无线电活动（如，“木兰围场-通联中国之省”），可使用短句：","o":["QRV IN WAPC?","QSY TO WAPC?","QSO WID WAPC?","QRT OVER WAPC?"],"a":[0],"e":"QRV有“准备好、能参加”之意，相约对方参加业余无线电活动用“QRV IN 活动名?”。QSY是改频率，C语义不通，D的QRT是关机。","m":"相约活动问QRV IN","g":""},{"i":"A-293","j":"LX","p":"2.4.1","q":"Q简语“QRV”的含义是：","o":["我准备好收信了","我正忙于（与某台）联络","我有消息要发给你","我要减小发射功率"],"a":[0],"e":"QRV的含义是“我准备好收信了”。B是QRL（正忙于联络），C是QRU（有消息要发），D是QRP（减小功率）。","m":"QRV准备好，收信没问题","g":""},{"i":"A-294","j":"LY0287","p":"2.4.1","q":"进行呼叫时，如果没有听清对方呼号，可使用如下短句请求对方重发：","o":["QRZ？","QRU？","QSY？","QSA？"],"a":[0],"e":"没听清对方呼号请重发用QRZ?（谁在呼叫我？）。QRU是问有无消息，QSY是改频率，QSA问信号强度。","m":"呼号没听清，QRZ请重发","g":""},{"i":"A-295","j":"LY0287","p":"2.4.1","q":"Q简语“QRZ”的含义为：","o":["呼叫你的电台是...；做疑问句时则为：谁在呼叫我？","我准备好了","我正忙于（与某台）联络","我要减小发射功率"],"a":[0],"e":"QRZ陈述为“呼叫你的电台是……”，疑问式为“谁在呼叫我？”。B是QRV，C是QRL，D是QRP的含义。","m":"QRZ问谁在叫我，陈述报呼号","g":""},{"i":"A-296","j":"LY0322","p":"2.4.1","q":"阅读我国早期业余无线电文献，我们可能发现一种用 Q简语和 5个强度等级来表示的信号报告。该 Q简语是：","o":["QSA","QSB","QSD","QSK"],"a":[0],"e":"我国早期文献用QSA加5个等级表示信号报告（QSA1-5为信号强度等级）。QSB是衰落，QSD是键控缺陷，QSK是全插入，都不是强度报告简语。","m":"老文献信号报告，QSA分五级","g":""},{"i":"A-297","j":"LY0304","p":"2.4.1","q":"通联时，如需了解自己的信号是否衰落，可使用短句：","o":["QSB？","QSD？","QRB？","QSP？"],"a":[0],"e":"询问自己信号是否衰落用QSB?。QSD是键控缺陷，QRB问距离，QSP是转信。","m":"信号衰落问QSB","g":""},{"i":"A-298","j":"LY0305","p":"2.4.1","q":"Q简语“QSB”的含义为：","o":["你的信号正在衰落","你的电台存在键控缺陷（交流声、键击声、接触不良或发报手法不佳等）","请重复上一条消息","发报时，我能够在电码的间隙中听到电台的插入"],"a":[0],"e":"QSB的含义是“你的信号正在衰落”。B是QSD（键控缺陷），C是请重复消息，D是QSK（全插入）。","m":"QSB信号衰落，S记Signal衰","g":""},{"i":"A-299","j":"LY0306","p":"2.4.1","q":"小强和小明练习 CW。若小强问“我发报的手法有毛病吗？”，他可以发：","o":["QSD？","QSB？","QSV？","QRM？"],"a":[0],"e":"问自己发报手法有无毛病用QSD?（我的电键发报有毛病吗？）。QSB是衰落，QSV无此意，QRM是干扰。","m":"手法毛病问QSD，D记Defect","g":""},{"i":"A-300","j":"LY0307","p":"2.4.1","q":"小强与小明练习 CW。小明认为小强刚才发字母“Y”时手法不好。他可以拍发：","o":["QSD AT Y","QRH AT Y","QSU AT Y","QSS AT Y"],"a":[0],"e":"指出对方某个字母发得不好用“QSD AT 字母”，如QSD AT Y。B、C、D的简语都没有“键控缺陷”含义。","m":"某字母发得差，QSD AT加字母","g":""},{"i":"A-301","j":"LX","p":"2.4.1","q":"小强与小明练习 CW。小明认为小强发报时有砰然的键击声。他可以拍发：","o":["QSD PSE CK","QRI PSE CK","QRH PSE CK","TVI PSE CK"],"a":[0],"e":"键击声属于键控缺陷（keying defect），请对方检查用“QSD PSE CK”。QRI、QRH、TVI都没有键控缺陷的含义。","m":"键击声是缺陷，QSD请检查","g":""},{"i":"A-302","j":"LX","p":"2.4.1","q":"Q简语“QSK”的含义为：","o":["发报时，我能够在电码的间隙中听到电台的插入","你的信号正在衰落","你的电台存在键控缺陷（交流声、键击声、接触不良或发报手法不佳等）","请重复上一条消息"],"a":[0],"e":"QSK即全插入（full break-in），指发报时能在电码间隙中听到对方电台的插入。B是QSB，C是QSD，D是请重复消息。","m":"QSK全插入，间隙能听对方","g":""},{"i":"A-303","j":"LX","p":"2.4.1","q":"通联时，如需对方电台确认收妥自己发出的消息，可使用短句：","o":["QSL？","QRZ？","QSP？","QRO？"],"a":[0],"e":"请对方确认收妥消息用QSL?。QRZ是问谁呼叫，QSP是转信，QRO是加功率。","m":"请确认收妥，发QSL","g":""},{"i":"A-304","j":"LX","p":"2.4.1","q":"Q简语“QSL”的含义为：","o":["我确认抄收了你所发送的消息","我要寄一张 QSL卡片给你","我刚刚错过了你的消息，请再发一遍","你应当寄一张 QSL卡片给我"],"a":[0],"e":"QSL的含义是“我确认抄收了你所发送的消息”。B、D是QSL卡片层面的引申义，C是请重复消息，都不是QSL简语的本义。","m":"QSL确认抄收，消息已收到","g":""},{"i":"A-305","j":"LY0290","p":"2.4.1","q":"Q简语“QSO”的含义为：","o":["我能够直接或通过他台转信通联（某个电台）；常指业余电台间的当前联络","我可以直接或通过卡片管理局寄发 QSL；常指业余电台交换 QSL卡片的操作","我可以将你的消息转信至某个电台；常指业余电台帮助他台中转消息的操作","我没有需要发送的消息了；常见于业余电台即将结束联络并互致再见之时"],"a":[0],"e":"QSO指业余电台间的（当前）联络，可直接或经转信建立。B是QSL卡片交换，C是QSP转信，D是QRU无事。","m":"QSO就是通联，联络进行中","g":""},{"i":"A-306","j":"LY0314","p":"2.4.1","q":"通联时，如需了解对方电台可否帮助转信至“xxx电台”，可使用短句：","o":["QSP ×××？","QRD ×××？","QSX ×××？","QRV ×××？"],"a":[0],"e":"请对方帮助转信到某电台用“QSP ×××?”。QRD、QSX、QRV都没有转信含义（QSX指在某频率收听）。","m":"请转信用QSP加呼号","g":""},{"i":"A-307","j":"LY0315","p":"2.4.1","q":"Q简语“QSP”的含义为：","o":["我可以将你的消息转信至某个电台；常指业余电台帮助他台中转消息的操作","我可以直接或通过卡片管理局寄发 QSL；常指业余电台交换 QSL卡片的操作","我能够直接或通过他台转信通联（某个电台）；常指业余电台间的当前联络","我没有需要发送的消息了；常见于业余电台即将结束联络并互致再见之时"],"a":[0],"e":"QSP的含义是“我可以将你的消息转信至某个电台”，常指帮助他台中转消息。B是QSL卡片，C是QSO联络，D是QRU无事。","m":"QSP帮转信，中转消息行","g":""},{"i":"A-308","j":"LY0316","p":"2.4.1","q":"通联时，小明希望小强帮忙守听 7074千赫的 FT8操作，他可以发：","o":["QSX MY FT8 ON 7074 KHZ？","QSY MY FT8 ON 7074 KHZ？","QSL MY FT8 ON 7074 KHZ？","QRU MY FT8 ON 7074 KHZ？"],"a":[0],"e":"QSX 的含义是'我在……频率守听'，加问号即请求对方守听，本题就是'请在7074kHz守听我的FT8吗'。QSY 是改频率、QSL 是确认抄收、QRU 是询问有无待发电报，都与'帮忙守听'无关。","m":"QSX 专管守听，X 像竖起的天线。","g":""},{"i":"A-309","j":"LY0317","p":"2.4.1","q":"通联时，小强告诉小明，他正在 7074千赫守听 FT8联络，他可以发送：","o":["QSX FT8 ON 7074 KHZ","QSY FT8 ON 7074 KHZ","QSL FT8 ON 7074 KHZ","QRU FT8 ON 7074 KHZ"],"a":[0],"e":"QSX 也可用陈述句，表示'我正在7074kHz守听FT8联络'。QSY 是改变频率、QSL 是确认收妥、QRU 是询问有无电报，都不能表达'正在守听'的状态。","m":"陈述句 QSX：我正在守听中。","g":""},{"i":"A-310","j":"LY0318","p":"2.4.1","q":"通联时，如需协商对方改频至 nnnn千赫（或兆赫），可使用短句：","o":["QSY nnnn KHZ（或 MHZ）？","QRY nnnn KHZ（或 MHZ）？","QSV nnnn KHZ（或 MHZ）？","QRV nnnn KHZ（或 MHZ）？"],"a":[0],"e":"QSY 含义为'我要改变发射频率至……'，作疑问句即协商对方改频。QRY 是轮次、QSV 是发送调试信号、QRV 是准备好收发，均无改频之意。","m":"QSY 拐个弯，频率要换频。","g":""},{"i":"A-311","j":"LY0319","p":"2.4.1","q":"Q简语“QSY”的含义为：","o":["我要改变发射频率至...千赫（或兆赫）","我要关闭收发信机了，再见","我不再呼叫了，尚未联络的请用 email约起来","我要变更操作方式了，有要联络的请尽快叫过来"],"a":[0],"e":"QSY 直译为'改变发射频率'，后接频率参数使用。关闭电台用 QRT，结束联络互致祝愿用 73，变更操作方式另有说法，均与 QSY 无关。","m":"SY 像 shift，QSY 就是换频率。","g":""},{"i":"A-312","j":"LY0320","p":"2.4.1","q":"通联时，如需了解对方电台的位置，可使用短句：","o":["QTH？","QRA？","QSP？","QSA？"],"a":[0],"e":"QTH 意为'我的位置是……'，加问号即询问对方电台位置。QRA 是电台名称、QSP 是中转、QSA 是信号强度，都不能用来问位置。","m":"QTH 问地头，你人在哪里。","g":""},{"i":"A-313","j":"LY0402","p":"2.4.2","q":"业余无线电爱好者在结束当前联络并互致美好祝愿时经常使用缩语：","o":["73","59","599","99"],"a":[0],"e":"73 是传统告别语，意为'致以最美好的祝愿'，结束联络时互致。59/599 是信号报告，99 无此含义。","m":"结束通联道声好，73 告别最常用。","g":""},{"i":"A-314","j":"LY0325","p":"2.4.2","q":"如在 CW或其他方式的文字通联中须询问对方的 QSL卡片邮寄地址，我们可以发送：","o":["“UR ADR？”或“UR ADDR？”","MY ADDR？","PSE ADR MY QSL INFO","PSE QSL TO UR ADDR"],"a":[0],"e":"UR ADR（ADDR）意为'你的地址'，加问号即询问对方 QSL 卡邮寄地址。MY ADDR 是'我的地址'，其余两项语义颠倒或并非询问地址。","m":"要地址问 UR ADDR，问对方'你的'。","g":""},{"i":"A-315","j":"LY0328","p":"2.4.2","q":"如需对方重复上次的操作，比如重报呼号或信号报告，我们可使用缩语：","o":["AGN","AGC","ABT","ABV"],"a":[0],"e":"AGN 是 AGAIN 的缩写，意为'再一次'，用于请对方重发上次内容。AGC 是自动增益控制、ABT 是大约、ABV 是以上，都无重发之意。","m":"AGN 再来一次，again 的缩写。","g":""},{"i":"A-316","j":"LK0330","p":"2.4.2","q":"业余无线电通信缩语“AHR”的意思是：","o":["另一个","天线","这里","地址"],"a":[0],"e":"AHR 是 ANOTHER 的缩写，意为'另一个'。天线的缩写是 ANT，'这里'是 HR，地址是 ADDR，不可望文生义。","m":"AHR 等于 another，另一个。","g":""},{"i":"A-317","j":"LY0332","p":"2.4.2","q":"“业余无线电测向”的缩语是：","o":["ARDF","ATU","ADDR","ANT"],"a":[0],"e":"ARDF 是 Amateur Radio Direction Finding（业余无线电测向）的英文缩写，即'猎狐'运动。ATU 是天线调谐器，ADDR 是地址，ANT 是天线。","m":"ARDF 猎狐测向，F 是 Finding。","g":""},{"i":"A-318","j":"LK0375","p":"2.4.2","q":"在 CW联络中交换 QSL信息时，我们可能用到“邮政信箱”这个术语。其缩语是：","o":["“BOX”或“P O BOX”","BOX OF MAIL","BURO","QTH"],"a":[0],"e":"邮政信箱英文为 Post Office Box，缩写 BOX 或 P O BOX。BURO 是卡片管理局，QTH 是位置，均不是信箱。","m":"信箱装卡片，BOX 就是信箱。","g":""},{"i":"A-319","j":"LY0340","p":"2.4.2","q":"“QSL卡片管理局”的缩语是：","o":["BURO","BOX","ROUTER","SWITCH"],"a":[0],"e":"QSL 卡片管理局英文为 QSL Bureau，缩写 BURO，负责各国间卡片的集中交换。BOX 只是信箱，与管理局无关。","m":"卡片管理局，BURO 即 Bureau。","g":""},{"i":"A-320","j":"LX","p":"2.4.2","q":"在 CW通联中，我们有时会抄到缩语“CK”，意思是：","o":["检查","钟表","报到","祝贺"],"a":[0],"e":"CK 是 CHECK 的缩写，意为'检查'，竞赛交换序号时常见。钟表是 CLOCK，报到祝贺都无对应缩写，抄收须按英文缩写联想。","m":"CK 等于 check，检查对一遍。","g":""},{"i":"A-321","j":"LX","p":"2.4.2","q":"业余电台发起呼叫时会使用缩语：","o":["CQ","CU AGN","TU","Seek QSOs with you, Roger?"],"a":[0],"e":"CQ 谐音 seek you，是通用呼叫，业余电台发起呼叫时使用。CU AGN 是'下次再见'、TU 是'谢谢'，均为结束语而非呼叫。","m":"CQ 谐音 seek you，呼叫大家来。","g":""},{"i":"A-322","j":"LX","p":"2.4.2","q":"形容某个信号来自远地时，爱好者们经常使用缩语：","o":["DX","DE","DR","DSW"],"a":[0],"e":"DX 取自 distance（X 表远方/未知），指远距离电台或远距离通信。DE 意为'我是/来自'，DR 是 dear（亲爱的），都与远地无关。","m":"DX 追远方，D 是 distance。","g":""},{"i":"A-323","j":"LK0348","p":"2.4.2","q":"在 CW通联中，我们有时会抄到缩语“ES”，意思是：","o":["和","是","从","请等待"],"a":[0],"e":"ES 在电码通联中作 AND 用，意为'和'。这是固定对应关系，需死记；其余选项均为干扰项。","m":"ES 就是 and，电码里说'和'。","g":""},{"i":"A-324","j":"LY0349","p":"2.4.2","q":"在 CW通联中，我们有时会抄到缩语“FB”，意思是：","o":["太棒了，业务精湛","我的反馈如下","保险丝熔断了","从正反两方面说"],"a":[0],"e":"FB 是 fine business 的缩写，意为'太棒了、业务精湛'，用于赞美对方操作。与 feedback（反馈）无关，切勿望文生义。","m":"FB 夸你业务精，fine business。","g":""},{"i":"A-325","j":"LY0351","p":"2.4.2","q":"在 CW通联中，我们有时会抄到缩语“FER”，意思是：","o":["为了，对于","好的，精细的","二月","猎狐"],"a":[0],"e":"FER 是 for 的缩写，意为'为了、对于'。fine 的缩写是 FNE/FB，二月是 FEB，猎狐是 ARDF，不能混淆。","m":"FER 等于 for，为了对于它。","g":""},{"i":"A-326","j":"LK0352","p":"2.4.2","q":"术语“频率”的缩语是：","o":["FREQ","FER","TUNE","FIND"],"a":[0],"e":"FREQ 是 frequency（频率）的标准缩写。TUNE 是调谐、FIND 是寻找，均不是频率的缩写。","m":"FREQ 即 frequency，频率就它。","g":""},{"i":"A-327","j":"LY0353","p":"2.4.2","q":"建立 CW联络后，我们经常值交换信号报告之机向对方表示问候。“下午好”的缩语是：","o":["GA","GE","GN","GM"],"a":[0],"e":"GA = good afternoon（下午好），GE = good evening（晚上好），GM = good morning（早晨好），GN = good night（晚安），按首字母区分时段。","m":"GA 下午好，A 是 afternoon。","g":""},{"i":"A-328","j":"LY0355","p":"2.4.2","q":"建立 CW联络后，我们经常值交换信号报告之机向对方表示问候。“晚上好”的缩语是：","o":["GE","GM","GN","GA"],"a":[0],"e":"GE = good evening（晚上好）。GM 是早晨、GA 是下午、GN 是晚安，记住 E 代表 evening 即可区分。","m":"GE 晚上好，E 是 evening。","g":""},{"i":"A-329","j":"LX","p":"2.4.2","q":"业余无线电爱好者在结束当前联络并祝愿对方好运好成绩时经常使用缩语：","o":["GL","GB","TU","73"],"a":[0],"e":"GL = good luck（好运），结束联络时祝愿对方好运好成绩。GB 是 goodbye（再见），TU 是谢谢，73 是美好祝愿但不特指好运成绩。","m":"GL 祝好运，L 是 luck。","g":""},{"i":"A-330","j":"LK0359","p":"2.4.2","q":"业余无线电通信缩语“GLD”的意思是：","o":["高兴","好运气","再见","地线，地面"],"a":[0],"e":"GLD = glad（高兴）的缩写。好运是 GL，再见是 GB，地线是 GND，注意形近词区分。","m":"GLD 等于 glad，心里很高兴。","g":""},{"i":"A-331","j":"LY0354","p":"2.4.2","q":"建立 CW联络后，我们经常值交换信号报告之机向对方表示问候。“早晨好”的缩语是：","o":["GM","GA","GL","GB"],"a":[0],"e":"GM = good morning（早晨好）。GA 是下午好、GL 是好运、GB 是再见，注意 GM 与 GL 形近但含义完全不同。","m":"GM 早晨好，M 是 morning。","g":""},{"i":"A-332","j":"LY0360","p":"2.4.2","q":"有时，我们通联的 DX电台仍使用“GMT”来表示时间。该时间的含义是：","o":["格林尼治时间","GPS管理区段时间","国际原子时","罗兰 C时间"],"a":[0],"e":"GMT = Greenwich Mean Time（格林尼治时间），是世界时的传统说法，DX 电台仍常用。GPS 时间、国际原子时、罗兰 C 都与 GMT 无关。","m":"GMT 格林尼治，世界时间老名字。","g":""},{"i":"A-333","j":"LK0356","p":"2.4.2","q":"业余无线电通信缩语“GN”的意思是：","o":["晚安","早晨好","好运气","高兴"],"a":[0],"e":"GN = good night（晚安）。GM 是早晨好、GL 是好运、GLD 是高兴，记住 N 代表 night。","m":"GN 道晚安，N 是 night。","g":""},{"i":"A-334","j":"LK0361","p":"2.4.2","q":"业余无线电通信缩语“GND”的意思是：","o":["地面、接地","格林尼治时间","好运气","高兴"],"a":[0],"e":"GND = ground（地面、接地）的缩写。GMT 是格林尼治时间、GL 是好运、GLD 是高兴，注意 GND 与 GMT 形近。","m":"GND 接大地，D 是 ground 尾。","g":""},{"i":"A-335","j":"LY0397","p":"2.4.2","q":"每年的 12月下旬，我们常会在 CW联络中听到缩语“HNY”，意思是：","o":["新年快乐","幸福","希望","圣诞快乐"],"a":[0],"e":"HNY = happy new year（新年快乐），12 月下旬 CW 通联中的季节性问候。圣诞快乐是 MERRY XMAS / HAPPY HOLIDAYS。","m":"HNY 新年好，12 月底常听到。","g":""},{"i":"A-336","j":"LY0363","p":"2.4.2","q":"在 CW通联中，我们有时会抄到缩语“HPE”，意思是：","o":["希望去做某件事","醉心于某件事","是“抄收”的意思","是“这里”的意思"],"a":[0],"e":"HPE = hope（希望）的缩写，意为'希望去做某事'。'抄收'是 CPI/HRD，'这里'是 HR，不可混淆。","m":"HPE 等于 hope，希望能办到。","g":""},{"i":"A-337","j":"LY0364","p":"2.4.2","q":"在 CW通联中，我们有时会抄到缩语“HPY”或“HPI”，意思是：","o":["幸福","希望","抄收","这里"],"a":[0],"e":"HPY/HPI = happy（幸福）的缩写。'希望'是 HPE，'抄收'是 CPI/HRD，'这里'是 HR，形近词要分清。","m":"HPY 等于 happy，幸福满满的。","g":""},{"i":"A-338","j":"LY0334","p":"2.4.2","q":"“快速收发报”的缩语是：","o":["HST","RTTY","CW","RST"],"a":[0],"e":"HST = high speed telegraphy（高速收发报），是高速电报竞赛项目。RTTY 是无线电传，CW 是等幅电报，RST 是信号报告。","m":"HST 高速电报，S 是 speed。","g":""},{"i":"A-339","j":"LX","p":"2.4.2","q":"业余电台完成当前发送并守听任意电台时应使用缩语：","o":["K","GA","PSE","Come on"],"a":[0],"e":"K 意为'发报完毕请讲'，表示守听任意电台呼叫。KN 则专指只守听通联中的对方，PSE 只是'请'，GA 是下午好。","m":"K 请讲，开放守听等你来。","g":""},{"i":"A-340","j":"LX","p":"2.4.2","q":"业余电台完成当前发送并守听通联中的对方电台时可使用缩语：","o":["KN","PSE","Please call one by one","CU"],"a":[0],"e":"KN 意为'只请通联中的对方回答'，在有干扰或多人抢叫时用以点名。K 是守听任意电台，PSE 仅表'请'。","m":"KN 加 N 只收你，点名专收。","g":""},{"i":"A-341","j":"LY0367","p":"2.4.2","q":"在 CW通联中表达“非常感谢”之意时我们发送：","o":["“MNY TNX”或“MNI TNX”","TNX TOO MUCH","VY TNX","I AM GRATEFUL FER UR TNX"],"a":[0],"e":"MNY TNX / MNI TNX 即 many thanks（非常感谢），是 CW 中表达谢意的固定说法。其余选项或语序别扭，或不是惯用缩语。","m":"MNY TNX，many thanks 谢意深。","g":""},{"i":"A-342","j":"LY0365","p":"2.4.2","q":"业余无线电通信缩语“NW”的意思是：","o":["现在","不工作","新的","你和我"],"a":[0],"e":"NW = now（现在）的缩写。不工作常用 NIL，新的缩写是 NEW/NW 另有所指，'你和我'是 U AND I，均不对。","m":"NW 等于 now，就是现在。","g":""},{"i":"A-343","j":"LY0373","p":"2.4.2","q":"通联时，我们有时称对方电台的操作员为“old man”。这是将对方比作亲密无间的队友，因此为“老朋友”、“老伙计”之意且无关年龄。这个称呼的缩语是：","o":["OM","OB","OC","OT"],"a":[0],"e":"OM = old man，是对亲密同好的尊称，意为'老朋友、老伙计'，与年龄无关。OB/OC/OT 均无此含义。","m":"OM 老伙计，M 是 man 的亲切。","g":""},{"i":"A-344","j":"LY0374","p":"2.4.2","q":"“操作员”的缩语是：","o":["OP","OOP","OM","OHM"],"a":[0],"e":"OP = operator（操作员）的缩写。OM 是老朋友，OHM 是欧姆单位，形近但无关。","m":"OP 即 operator，操作员简称。","g":""},{"i":"A-345","j":"LX","p":"2.4.2","q":"在 CW日常通联中，适当使用带“请”字的祈使句可以活跃通联气氛。“请”的缩语是：","o":["PSE、PLS","PSK、ASK","PX、PWM","PWR、PTT"],"a":[0],"e":"PSE（please）/ PLS 都是'请'的缩写，用于礼貌祈使句。PSK 是调制方式，PWR 是功率，PTT 是发射按键，均非'请'。","m":"PSE 请你帮个忙，PLS 也一样。","g":""},{"i":"A-346","j":"LY0404","p":"2.4.2","q":"与“QSL”类似，如果完全抄收了对方所发的消息，我们常以起始语“Roger”开启新的会话。这可向对方主动传达确认之意。“Roger”的缩语是：","o":["R","RX","RIG","RFI"],"a":[0],"e":"R 是 Roger 的缩写，表示'收到、明白'，与 QSL 确认抄收含义相近，可开启新会话。RX 是接收机，RIG 是电台设备。","m":"R 等于 Roger，收到明白。","g":""},{"i":"A-347","j":"LX","p":"2.4.2","q":"业余无线电业务中，“SAE”的含义为：","o":["写好收信人地址的信封","信封","请尽快寄出 QSL卡片","请勿通过卡片管理局交换 QSL卡片"],"a":[0],"e":"SAE = self-addressed envelope（写好收信人地址的信封，英式用法），索取 QSL 卡时附上以便对方回邮。SASE 是美式说法，还要求贴好邮票。","m":"SAE 写好地址的信封，索卡回邮用。","g":""},{"i":"A-348","j":"LY0229","p":"2.4.2","q":"业余无线电爱好者寄送 QSL卡片时常会提及缩语“SASE”，其含义为：","o":["写好收信人地址并贴好邮票（或附有邮资）的信封","国际邮资券","请尽快寄出 QSL卡片","请勿通过卡片管理局交换 QSL卡片"],"a":[0],"e":"SASE = self-addressed stamped envelope（写好收信人地址并贴好邮票的信封），是美式索卡回邮信封。SAE 为英式可不贴票，IRC 才是国际邮资券。","m":"SASE 自贴邮票写地址，回邮索卡。","g":""},{"i":"A-349","j":"LX","p":"2.4.2","q":"在通联中，如需更正刚才发错的内容，我们通常以“抱歉”开启会话，缩语为：","o":["SRI","SNR","STN","SMS"],"a":[0],"e":"SRI = sorry（抱歉）的缩写，更正发错内容时先说抱歉再重发。SNR 是信噪比，STN 是电台，SMS 是短信。","m":"SRI 说抱歉，发错赶紧改。","g":""},{"i":"A-350","j":"LY0387","p":"2.4.2","q":"“温度”的缩语是：","o":["TEMP","TMPO","TUNE","WX"],"a":[0],"e":"TEMP = temperature（温度）的缩写。天气的缩写是 WX，TUNE 是调谐，不要张冠李戴。","m":"TEMP 是温度，天气用 WX 记。","g":""},{"i":"A-351","j":"LX","p":"2.4.2","q":"“谢谢”的缩语是：","o":["TNX、TKS","SRI、SAE","CU、GB","TVI、RFI"],"a":[0],"e":"'谢谢'的缩写是 TNX（thanks）/ TKS。SRI 是抱歉，CU 是再见，TVI/RFI 是干扰类术语。","m":"TNX 谢谢你，TKS 也致谢。","g":""},{"i":"A-352","j":"LY0389","p":"2.4.2","q":"“谢谢你”的缩语是：","o":["TU","ATU","TX","ATT"],"a":[0],"e":"TU = thank you（谢谢你）的缩写。ATU 是天线调谐器，TX 是发射，ATT 是衰减，形近但无关。","m":"TU 谢谢你，U 就是 you。","g":""},{"i":"A-353","j":"LK0401","p":"2.4.2","q":"“你的”或者“你是”可用缩语表示为：","o":["UR","TU","FB","US"],"a":[0],"e":"UR = your / you're（你的/你是）的缩写。TU 是谢谢，FB 是太棒了，US 是我们，均不对。","m":"UR 你的你是，U-R 连读 your。","g":""},{"i":"A-354","j":"LX","p":"2.4.2","q":"在 CW通联中，我们有时会抄到缩语“WL”，意思是：","o":["将要","超级棒","物理","滑铁卢"],"a":[0],"e":"WL = will（将要）的缩写。与物理、滑铁卢无关，缩语须按英文原词联想，不可望文生义。","m":"WL 等于 will，将要做某事。","g":""},{"i":"A-355","j":"LY0398","p":"2.4.2","q":"收听 CW或 SSB联络，我们有时会听到缩语 “XYL”。其含义是：","o":["妻子","晶体","女士","发信机"],"a":[0],"e":"XYL 是对'妻子'的戏称（ex-young lady 的谐音梗）。YL 才是女士，晶体是 XTAL，女士与妻子要分清。","m":"XYL 是妻子，ex 年轻女士。","g":""},{"i":"A-356","j":"LY0399","p":"2.4.2","q":"有一类业余无线电操作员享有称呼“YL”。而有些业余无线电竞赛也为这些人士制定了专享的规则。缩语“YL”的含义是：","o":["女士","好运","你的","领导"],"a":[0],"e":"YL = young lady（女士），竞赛常设 YL 组别。注意 YL 是年轻女士，XYL 才是妻子，两者不同。","m":"YL 年轻女士，竞赛有专组。","g":""},{"i":"A-357","j":"LK0347","p":"2.4.2","q":"术语“单元”通常指天线振子。其缩语是：","o":["EL、ELE或 ELS","YAGI","ANT","UNIT"],"a":[0],"e":"EL / ELE / ELS = element（单元、振子）的缩写，指天线振子。YAGI 是八木天线，ANT 是天线总称，UNIT 不是规范缩写。","m":"EL 振子单元，element 缩写。","g":""},{"i":"A-358","j":"LK0405","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 DP代表：","o":["偶极天线","长线天线","定向天线","垂直天线"],"a":[0],"e":"DP = dipole（偶极天线）的缩写，偶极子是最基本的天线形式。LW 是长线天线，GP 是垂直接地天线，YAGI 是八木天线。","m":"DP 偶极天线，D 是 dipole。","g":""},{"i":"A-359","j":"LK0407","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 GP代表：","o":["垂直接地天线","对数周期天线","偶极天线","定向天线"],"a":[0],"e":"GP = ground plane（垂直接地天线）的缩写。VER 是垂直天线的总称，GP 是其中加装地网的一种，注意区分。","m":"GP 接地平面天线，G 是 ground。","g":""},{"i":"A-360","j":"LK0410","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 VER代表：","o":["垂直天线","垂直接地天线","定向天线","偶极天线"],"a":[0],"e":"VER = vertical（垂直天线）的缩写，是垂直类天线的总称。GP（垂直接地）是其下的一种具体形式。","m":"VER 垂直天线，vertical 缩写。","g":""},{"i":"A-361","j":"LK0406","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 LW代表：","o":["长线天线","偶极天线","定向天线","垂直天线"],"a":[0],"e":"LW = long wire（长线天线）的缩写。DP 是偶极天线，GP 是垂直接地天线，定向天线是 BEAM/YAGI。","m":"LW 长线天线，L-W 长导线。","g":""},{"i":"A-362","j":"LK0409","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 YAGI代表：","o":["八木天线","定向天线","偶极天线","垂直天线"],"a":[0],"e":"YAGI 即八木天线（Yagi-Uda），由引向器、有源振子、反射器组成的定向天线。BEAM 是定向天线的统称，八木是其中最常见的一种。","m":"YAGI 八木天线，引向反射加振子。","g":""},{"i":"A-363","j":"LK0408","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 BEAM代表：","o":["定向天线","八木天线","偶极天线","垂直天线"],"a":[0],"e":"BEAM 是定向天线（波束天线）的统称，八木天线只是其中最常见的一种。BEAM 表类别，YAGI 表具体类型，不可等同。","m":"BEAM 定向波束，八木是其一。","g":""},{"i":"A-364","j":"LK0127","p":"2.5.1","q":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示 CW报的发射类别是：","o":["A1A","J3E","F2B","G2B"],"a":[0],"e":"发射类别三符号：首位 A 表调幅（含键控）、次位 1 表单信道数字信号、末位 A 表电报，CW 报即 A1A。J3E 是单边带话，F2B 是调频电传。","m":"A1A 电报：A 调幅、1 数字、A 电报。","g":""},{"i":"A-365","j":"LK0128","p":"2.5.1","q":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示单边带话的发射类别是：","o":["J3E","A1A","F2B","G2B"],"a":[0],"e":"J 表单边带（抑制载波）、3 表单信道模拟信号、E 表电话，单边带话即 J3E。A1A 是 CW 报，F2B 是调频电传。","m":"J3E 单边带话：J 单边、3 模拟、E 电话。","g":""},{"i":"A-366","j":"LK0131","p":"2.5.1","q":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示用单边带话传输的SSTV信号的发射类别是：","o":["F3F","J3E","F2B","F3E"],"a":[0],"e":"注意陷阱：SSB 传 SSTV 时载波确是单边带调制，但发射类别按'被发送信息类型'划分，图像属传真类（F），故为 F3F。J3E 是语音电话，F3E 是调频话。","m":"SSB 传图像，类别看信息——F3F。","g":""},{"i":"A-367","j":"LK0132","p":"2.5.1","q":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示调频话的发射类别是：","o":["F3E","F3F","J3E","F2B"],"a":[0],"e":"F 表调频、3 表单信道模拟、E 表电话，调频话即 F3E。J3E 是单边带话，F2B 是调频电传。","m":"F3E 调频话：F 调频、E 电话。","g":""},{"i":"A-368","j":"LK0134","p":"2.5.1","q":"发射类别是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示用调频话传输的 SSTV信号的发射类别是：","o":["F3F","F2B","J3E","F3E"],"a":[0],"e":"调频传输 SSTV 图像：F 表调频、3 表模拟信道、F 表图像传真类信息，即 F3F。F3E 是调频话，F2B 是调频电传。","m":"FM 传 SSTV，F3F 图像类。","g":""},{"i":"A-369","j":"LK0135","p":"2.5.1","q":"发射类别是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示调频 ATV信号的发射类别是：","o":["F3F","F2B","F3E","J3E"],"a":[0],"e":"调频 ATV 传送电视图像，信息类型为图像（F），故发射类别为 F3F。F3E 是调频话，J3E 是单边带话。","m":"FM 传电视，信息是图像——F3F。","g":""},{"i":"A-370","j":"LY0136","p":"2.5.1","q":"带外发射是指：","o":["由于调制过程而产生的、刚超出必要带宽的一个或多个频率的发射，但杂散发射除外","由于调制过程而产生的、刚超出占用带宽的一个或多个频率的发射，但杂散发射除外","由于调制过程而产生的、刚超出参考带宽的一个或多个频率的发射，但杂散发射除外","由于调制过程而产生的、刚超出固定带宽的一个或多个频率的发射，但杂散发射除外"],"a":[0],"e":"带外发射指调制过程产生、刚超出必要带宽的发射，但杂散发射除外。定义关键词是'必要带宽'，占用带宽、参考带宽、固定带宽都不是定义用语。","m":"带外发射超'必要'带宽，杂散除外。","g":""},{"i":"A-371","j":"LK0784","p":"2.5.1","q":"业余无线电通信中三种最基本调制的缩写是 AM、FM和 PM。它们的中文名称是：","o":["幅度调制（调幅）、频率调制（调频）、相位调制（调相）","幅度调制（调幅）、频率调制（调频）、脉宽调制（调脉宽）","频率调制（调频）、脉码调制（调脉码）、幅度调制（调幅）","幅度调制（调幅）、频率调制（调频）、电码调制（莫尔斯）"],"a":[0],"e":"AM = 幅度调制（调幅）、FM = 频率调制（调频）、PM = 相位调制（调相），是三种最基本调制。脉宽调制、脉码调制、电码调制都不在三基本之列。","m":"AM 调幅、FM 调频、PM 调相。","g":""},{"i":"A-372","j":"LK1203","p":"2.5.1","q":"以下哪种调制方式被广泛应用于 VHF或 UHF本地通联？","o":["FM","SSB","PSK","AM"],"a":[0],"e":"VHF/UHF 本地通联用 FM，因其抗干扰好、操作简单，中继台也采用 FM，这是业余实践中的标准选择。SSB 多用于弱信号远距离。","m":"V/U 本地通联，FM 最常用。","g":""},{"i":"A-373","j":"LK1202","p":"2.5.1","q":"以下哪种调制方式被广泛应用于长距离和弱信号情况下的 VHF或 UHF话音通联？","o":["SSB","AM","FM","PM"],"a":[0],"e":"长距离和弱信号的 VHF/UHF 话音通联用 SSB，因其带宽窄、功率集中、信噪比高。FM 有门限效应，弱信号时反而不如 SSB。","m":"长距离弱信号，SSB 更给力。","g":""},{"i":"A-374","j":"LX","p":"2.5.1","q":"以下哪种调制方式被广泛应用于 HF话音通联？","o":["SSB","AM","FM","PM"],"a":[0],"e":"HF 话音通联用 SSB，因为频谱资源紧张，SSB 带宽只有 AM 的一半左右且不浪费功率在载波上。FM 带宽太宽不适合 HF。","m":"HF 话音用 SSB，省带宽省功率。","g":""},{"i":"A-375","j":"LX","p":"2.5.1","q":"与 FM相比，SSB方式的优点是什么？","o":["发射带宽较 FM方式窄","同频电台彼此互不干扰","对天电干扰免疫","对主载波的频率误差不敏感"],"a":[0],"e":"SSB 只传一个边带且抑制载波，带宽约 2.7kHz，远窄于 FM 的十几 kHz。B 太绝对（同频仍会互扰），C、D 均非事实。","m":"SSB 省带宽，窄是最大优点。","g":""},{"i":"A-376","j":"LX","p":"2.5.1","q":"相比 SSB方式，FM的主要缺点是什么？","o":["无法同时守听多个信号","抵抗脉冲干扰的能力差","对主载波的频率误差很敏感","含有恒定不变的载波分量，发射功率利用不充分"],"a":[0],"e":"FM 有捕获效应，强信号压制弱信号，故同一频率无法同时守听多个信号；SSB 无此效应可多信号并存。B 说反了（FM 抗脉冲干扰其实较强），D 描述的是 AM。","m":"FM 捕获效应强，一山不容二虎。","g":""},{"i":"A-377","j":"LK1205","p":"2.5.1","q":"在 VHF和 UHF频段进行 SSB通联通常选用哪个边带？","o":["上边带","下边带","抑制边带","残留边带"],"a":[0],"e":"VHF/UHF 的 SSB 通联统一用上边带（USB），这是国际惯例。只有 HF 才以 10MHz 为界分上下边带。","m":"V/U 的 SSB 统一用上边带。","g":""},{"i":"A-378","j":"LX","p":"2.5.1","q":"在 14MHz及以上 HF频段进行语音通信通常选用哪个边带？","o":["上边带","下边带","抑制边带","残留边带"],"a":[0],"e":"14MHz 及以上 HF 频段语音用上边带（USB）。这是沿用至今的国际通联习惯：10MHz 以上用 USB，以下用 LSB。","m":"14MHz 以上用上，USB 记心上。","g":""},{"i":"A-379","j":"LX","p":"2.5.1","q":"在 7MHz及以下频段进行语音通信通常选用哪个边带？","o":["下边带","上边带","抑制边带","残留边带"],"a":[0],"e":"7MHz 及以下频段语音用下边带（LSB）。以 10MHz 为界：以下 LSB、以上 USB，这是国际惯例。","m":"7MHz 以下用下，LSB 在低频。","g":""},{"i":"A-380","j":"LX","p":"2.5.1","q":"为什么业余电台在 10.1MHz以下频段使用下边带进行话音通联，而在 10.1MHz以上频段却使用上边带？","o":["这是各国业余无线电爱好者普遍接受并沿用至今的一种通联习惯","10.1MHz以下频段更利于下边带的传播","10.1MHz以上频段更利于上边带的传播","因为在接收机中设置一个 10.1MHz的 BFO可以同时收听上边带和下边带"],"a":[0],"e":"上下边带的分界纯属历史习惯，并无传播或技术上的必然原因，是早期设备设计沿用下来的国际惯例。B、C、D 都是编造的理由。","m":"边带分界是习惯，无技术必然。","g":""},{"i":"A-381","j":"LX","p":"2.5.1","q":"发起 SSB呼叫时，你与周边电台的频率间隔应至少为：","o":["2-3kHz","150-500Hz","15-50Hz","大约 6kHz"],"a":[0],"e":"SSB 话音带宽约 2.7kHz，发起呼叫时与周边电台至少间隔 2-3kHz，避免边带重叠互扰。150-500Hz 远小于一个话音带宽，不够用。","m":"SSB 间隔 2-3kHz，一个带宽让一让。","g":""},{"i":"A-382","j":"LK1200","p":"2.5.1","q":"下列哪种调制方式可以纳入调幅（AM）的范畴？","o":["单边带调制（SSB）","线性调频（Chirp）","直序扩频（DSSS）","相移键控（PSK）"],"a":[0],"e":"单边带调制（SSB）本质是抑制载波的调幅，属于 AM 范畴。线性调频、直序扩频、相移键控都不属于调幅。","m":"SSB 是调幅的孩子，抑载波单边带。","g":""},{"i":"A-383","j":"LK0785","p":"2.5.1","q":"在业余无线电业务中，有种通信方式的缩写是 CW。其含义为：","o":["等幅电报","莫尔斯编码","幅度键控","频移键控"],"a":[0],"e":"CW = continuous wave（等幅波），指等幅电报（莫尔斯电报）。它不是莫尔斯编码本身，也不是幅度键控/频移键控的规范名称。","m":"CW 等幅电报，continuous wave。","g":""},{"i":"A-384","j":"LK1204","p":"2.5.1","q":"以下哪种调制方式拥有最窄的发射带宽？","o":["CW","单边带话","调频话","ATV"],"a":[0],"e":"带宽排序：CW（几十至几百 Hz）< 单边带话（约 2.7kHz）< 调频话（十几 kHz）< ATV（几 MHz），故最窄的是 CW。","m":"带宽最窄是 CW，电报一线牵。","g":""},{"i":"A-385","j":"LK0230","p":"2.5.1","q":"业余电台一般不用调频话方式进行莫尔斯电码通联。这是因为：","o":["调频话信道带宽超过传输莫尔斯电码的必要带宽，不符合我国《无线电频率划分规定》“电台的技术特性”一章关于 “把带宽保持在技术状态和该项业务的性质所允许的最低值上”的要求","调频话方式不能传输莫尔斯电码","调频话方式传输莫尔斯电码可靠性差","调频话方式传输莫尔斯电码时速度受限制"],"a":[0],"e":"FM 话信道带宽（十几 kHz）远超莫尔斯电码的必要带宽（几百 Hz），违反《无线电频率划分规定》'把带宽保持在技术状态和业务性质所允许的最低值上'的要求。不是不能传，而是不合规。","m":"FM 传电码太浪费，带宽最低是法规。","g":""},{"i":"A-386","j":"LK0782","p":"2.5.1","q":"无论是 FM还是 SSB调制，向发射机的话筒输入端施加 10倍于规定输入电压的音频信号，最可能的结果是：","o":["信号失真。大量的谐波和互调产物还可能促使发射带宽增加，通信质量下降","通信距离有效延长了，信号听起来也更加饱满","通信距离有效延长了，只是信号听上去失真了","发射功率超过额定值，发射机的末级射频功率器件会因此烧毁"],"a":[0],"e":"话筒输入过载 10 倍会导致严重失真，产生大量谐波和互调产物，使发射带宽展宽、通信质量下降。不会延长距离，现代设备有限幅保护也不会直接烧末级。","m":"话筒喊太响，失真带宽涨。","g":""},{"i":"A-387","j":"LX","p":"2.6.3","q":"Yaesu System Fusion简称 YSF，是数字语音和数据传输相互融合的一种通信方式，特点是：","o":["该方式为业余无线电通信广为采用","具备通过中继台转发进行通信的能力","调制方式为 C4FM","使用时分多址技术增加带宽的利用率"],"a":[0,1,2],"e":"YSF是八重洲的数字语音加数据融合系统，业余界广为采用，可经中继台转发，射频调制为C4FM四电平频移键控。故A、B、C正确。时分多址TDMA是DMR的特点，不是YSF。","m":"YSF用C4FM，时分多址是DMR","g":""},{"i":"A-388","j":"LX","p":"2.6.3","q":"Icom D-STAR System提供了一种数据通信方式，特点是：","o":["是业余无线电通信广为采用的一种数字语音和数据传输方式","可以通过中继台扩展 D-STAR用户的通信范围","该方式允许用户通过互联网和 D-STAR热点与其他用户通信","D-STAR支持全球卫星定位和位置报告功能"],"a":[0,1,2,3],"e":"D-STAR是Icom推行的数字语音与数据方式，可经中继台扩大范围，也可经互联网和热点跨区互联，并支持GPS定位与位置报告。故四项特点都成立。","m":"D-STAR能联网，中继热点报位置","g":""},{"i":"A-389","j":"LX","p":"2.6.3","q":"FreeDV是一种数字语音方式。其特点是：","o":["为爱好者提供一种传输带宽较窄，完全适合 HF的数字语音方式","为爱好者提供探索数字通信原理和语音处理技术的可能性","在遵循开源许可协议的前提下可用来研发自己的业余无线电装备","使用 FM手持或车载电台进行 FreeDV通信时音色尤为优美"],"a":[0,1,2],"e":"FreeDV用数字声码器把语音压进很窄带宽，适合HF传播，开源特性便于爱好者研究数字语音原理并自制装备。故A、B、C正确。它面向HF SSB信道，不是FM手台的卖点，D错误。","m":"FreeDV窄带上HF，开源可研习","g":""},{"i":"A-390","j":"LX","p":"2.6.4","q":"数字业余电视（DATV）是将数字音视频压缩编码实验用于实时图像通信的一种方式。通过卫星转发器进行 DATV联络时，爱好者们普遍选用 DVB-S2协议，调制方式可以是：","o":["QPSK","8PSK","16APSK","32APSK"],"a":[0,1,2,3],"e":"DVB-S2是卫星数字电视标准，支持多种调制：QPSK、8PSK以及16APSK、32APSK，爱好者按链路余量选用。故四项都是DATV经卫星转发时可用的调制方式。","m":"DVB-S2调制多，四种都能用","g":""},{"i":"A-391","j":"LX","p":"2.6.4","q":"使用 DRM协议进行数字慢扫描电视（DSSTV）通信时，爱好者总是倾向于通过单边带而非调频话方式来传输在音频范围内生成的 DSSTV基带。主要原因是：","o":["单边带方式完整保留 DSSTV的基带特性，利于衰落信道中的差错控制","使用调频话传输 DSSTV增添门限效应，因此也增加了信号的发射带宽","使用调频话传输 DSSTV虽然可以改善画质，但是无法提高伴音的音质","使用调频话传输 DSSTV虽然可以改善伴音的音质，但是无法提高画质"],"a":[0],"e":"DSSTV的DRM基带含精细的OFDM结构和纠错信息，SSB能完整线性搬移、保留基带特性，利于衰落信道下纠错解码。FM的门限、限幅会破坏基带幅相结构，故不用FM传DSSTV，与画质伴音的说法无关。","m":"DSSTV走SSB，完整保留基带","g":""},{"i":"A-392","j":"LX","p":"3.1.1","q":"什么是收发信机？","o":["一种组合了接收机和发射机的无线电通信设备","一种将收到的信号再行转发的设备","一种将收到的信息解码，纠错并转发的设备","一种将数字话音转换为模拟话音并转发的设备"],"a":[0],"e":"收发信机即收发合一的设备，把接收机与发射机组合在一台机器内，共用部分电路和操作部件。将信号转发的是中继设备，解码纠错转发或数模转换转发都不是收发信机的定义。","m":"收发合一，就是收发信机","g":""},{"i":"A-393","j":"LK0416","p":"3.1.1","q":"一个可以工作的无线电接收系统至少包含哪些部件？","o":["接收天线","解调器","电位器","电源"],"a":[0,1],"e":"可工作的接收系统在信号通道上至少要有接收天线拾取电波，并有解调器从射频信号中取出所传送的信息，二者缺一不可。电位器只是调节元件，题目所问的最小功能构成按官方答案取天线与解调器两项。","m":"接收最少：天线加解调","g":""},{"i":"A-394","j":"LK0417","p":"3.1.1","q":"一个可以工作的无线电发射系统至少包含哪些部件？","o":["射频振荡器","调制器","发射天线","防雷器"],"a":[0,1,2],"e":"发射系统至少要有射频振荡器产生载波、调制器把信息加载到载波上、发射天线把射频能量辐射出去，三者构成完整发射链。防雷器是防护附件，不是发射工作的必要部件。","m":"发射三件：振荡调制天线","g":""},{"i":"A-395","j":"LX","p":"3.1.1","q":"为什么业余无线电收发信机所用的直流电源线要尽量短，尽量粗？","o":["减小发信时电源线上的压降","分流机箱外表面的射频电流","防止收发信机意外滑落摔坏","厂商销售电源线的一种策略"],"a":[0],"e":"发信时电流可达十几安培，电源线电阻引起的压降与线长成正比、与线径成反比；线短而粗可减小压降，保证功放获得足够电压、输出不失真。它与射频电流分流、防摔或销售策略无关。","m":"电源线短粗，压降才小","g":""},{"i":"A-396","j":"LK0279","p":"3.1.1","q":"单工操作（simplex operation）是指：在一条电信通路的两个方向上交替进行传输的一种工作方式。下列通信采用单工操作方式：","o":["两台由 PTT键转换收发状态的业余对讲机之间的通信","两台有线电话座机之间的通信","两台公众移动电话终端（手机）之间的通信","一台业余中继台与一台由 PTT键转换收发状态的业余对讲机之间的通信"],"a":[0],"e":"单工是同一通路两方向交替传输，两台用PTT切换收发的对讲机同一时刻只能一方发、一方收，属典型单工。有线电话和手机可同时说听为双工，中继台与对讲机组合为半双工。","m":"PTT轮流说，就是单工","g":""},{"i":"A-397","j":"LK0280","p":"3.1.1","q":"双工操作（duplex operation）是指：一条电信通路的两个方向能同时进行传输的工作方式。下列通信采用双工操作方式：","o":["由一台连续工作的 430MHz接收机和一台 144MHz发信机组成的地面业余电台与业余卫星之间的通信","两台具有 QSK功能的业余 CW收发信之间的通信","一台业余中继台与一台由 PTT键转换收发状态的业余对讲机之间的通信","两台由 PTT键转换收发状态的业余对讲机之间的通信"],"a":[0],"e":"双工要求两方向同时传输；卫星通信中接收机在430MHz连续接收、发信机在144MHz同时发射，收发互不等待，属双工。QSK电台、中继台与PTT对讲机、两台PTT对讲机均有一端需交替收发，不算完整双工。","m":"异频同时收发，才是双工","g":""},{"i":"A-398","j":"LK0281","p":"3.1.1","q":"半双工操作（semi-duplex operation）是指：电路的一端用单工操作，另一端用双工操作的一种工作方式。下列通信采用半双工操作方式：","o":["一台业余中继台与一台由 PTT键转换收发状态的业余对讲机之间的通信","两台具有 QSK功能的业余 CW收发信之间的通信","两台由 PTT键转换收发状态的业余对讲机之间的通信","两台公众移动电话终端（手机）之间的通信"],"a":[0],"e":"半双工是一端单工、另一端双工：中继台可同时收发属双工一端，对讲机靠PTT交替收发属单工一端，组合即半双工。两台QSK电台、两台PTT对讲机和两部手机分别对应双工、单工和双工。","m":"中继配手台，半双工","g":""},{"i":"A-399","j":"LK0258","p":"3.1.1","q":"收发信机中的 PTT是指什么信号？","o":["按键发射，有信号（一般为对地接通）时发射机由等待转为发射","发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分","收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比"],"a":[0],"e":"PTT即Push To Talk，按键发射：按下时控制信号（一般为对地接通）使发射机由等待转为发射，松开回到接收。语音压缩、前置放大和自动天线调谐是PROC、PRE、AT等其他功能。","m":"PTT：按下去就发射","g":""},{"i":"A-400","j":"LK0259","p":"3.1.1","q":"收发信机面板上或设置菜单中的符号 SQL代表什么功能？","o":["静噪控制，用来调整静噪阈值的大小","发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分","收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比"],"a":[0],"e":"SQL是Squelch静噪控制，用来调整静噪阈值：信号低于阈值时关闭音频输出，高于阈值时打开。语音压缩、前置放大、自动天线调谐分别对应PROC、PRE、AT，与SQL无关。","m":"SQL静噪，调阈值","g":""},{"i":"A-401","j":"LK1130","p":"3.1.1","q":"收发信机设置静噪功能的目的是什么？","o":["在没有信号的情况下关闭音频输出，避免播放刺耳的噪声","滤除所收信号中的噪声，使对方的话音变得清晰","滤除发信方的环境噪声，使发出的话音更为清晰","自动控制收信机的增益，避免信号过强时发生阻塞或失真"],"a":[0],"e":"静噪的作用是在无信号时自动关闭音频输出，避免扬声器持续播放接收机内部噪声和空中的刺耳嘶声。它并不滤除有用信号中的噪声、不处理发信环境噪声，也不是自动增益控制。","m":"静噪：无信号就闭嘴","g":""},{"i":"A-402","j":"LX","p":"3.1.1","q":"需要聆听非常微弱的 FM信号时应如何设置收发信机的静噪？","o":["关闭静噪或将阈值设为 0，使接收机的音频输出不受限制","尽可能调高接收机的音量","关闭 VOX功能","调节 VOX，使之处于最灵敏的状态"],"a":[0],"e":"静噪阈值会把低于门限的微弱信号一并挡掉，聆听极弱FM信号时应关闭静噪或把阈值设为0，让音频输出不受限制。调音量不能解除静噪关断，VOX是发信声控，与接收微弱信号无关。","m":"听弱信号，静噪关到零","g":""},{"i":"A-403","j":"LK0848","p":"3.1.1","q":"用带有静噪功能的 FM收发信机接收 FM话音，我们有时会在发射方松开 PTT的时候听到一种比较短促的“嘶”或“喀拉”的噪声拖尾。这是因为：","o":["此类电路根据接收机鉴频输出的高音频噪声的大小来判断信号消失与否，并据此控制音频输出。这种检测需要一定的时间才能完成，这导致短暂泄漏刺耳的噪声","该噪声是发射台话筒的 PTT键接点跳动所致，发射到接收端时还可能带有“叮”的声音","该噪声是发射台的一种有目的所为，例如是用作结束发射的标志，有时是“嘟”的声音","这是由接收机的自动增益电路的时间常数造成"],"a":[0],"e":"FM静噪电路靠检测鉴频输出中的高频噪声判断信号有无，发射方停发后检测和关断需要短暂时间，噪声便泄漏出来形成短促拖尾。话筒按键跳动、有意结束标志和AGC时间常数都不是这一现象的成因。","m":"拖尾噪声：静噪关晚一步","g":""},{"i":"A-404","j":"LX","p":"3.1.1","q":"收发信机面板上或设置菜单中的符号 VOL代表什么功能？","o":["音量控制，用来调整接收机放出的声音大小","发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分","收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比"],"a":[0],"e":"VOL是Volume音量控制，调节接收机音频输出的响度大小。它只改变听感，不涉及发信语音压缩、接收前置放大或天线自动调谐等射频功能。","m":"VOL：管音量大小","g":""},{"i":"A-405","j":"LK0255","p":"3.1.1","q":"收发信机面板上或设置菜单中的符号 VOX代表什么功能？","o":["发信机声控，接入后将根据对话筒有无语音输入的判别自动控制收发转换","自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分"],"a":[0],"e":"VOX是声控发射，接入后电台检测话筒有无语音输入，自动完成收发转换，无需手按PTT。自动天调、发信ALC和语音压缩是AT、ALC、PROC的功能，与VOX不同。","m":"VOX：有声就自动发射","g":""},{"i":"A-406","j":"LX","p":"3.1.1","q":"既然收发信机已经具备 PTT功能，那为什么有些机型还要提供 VOX？","o":["双手忙于其他工作时，VOX的“免提”特点有助于通联","VOX用于连接蓝牙耳机，提供操作的便捷性","VOX对话音提供更多加工处理，可有效降低发射带宽","VOX对话音提供更多加工处理，可使声音更易于辩识"],"a":[0],"e":"VOX的价值在于免提：双手忙于记录、操作或其他工作时，说话即可自动发射，方便通联。它不依赖蓝牙耳机，也不对话音做降低带宽或提高辨识度的处理。","m":"VOX免提，双手得空","g":""},{"i":"A-407","j":"LK0262","p":"3.1.1","q":"某些对讲机具有发送 CTCSS码的功能。缩写 CTCSS指的是：","o":["亚音调静噪，即从 67-250.3Hz的 38个亚音调频率中选取一个作为选通信号，代表 38种状态之一，接收机没有收到特定的选通信号时自动关闭音频输出","双音多频编码，由 8个音调频率中的两个频率组合成的控制信号，代表 16种状态之一，用于遥控和传输数字等简单字符","数字设备识别码，即在松开 PTT按键时自动发送一串代表设备代号的二进制数据","自动静噪，即在接收机没有收到信号时自动关闭音频输出"],"a":[0],"e":"CTCSS是连续亚音调静噪系统，从67至250.3Hz的38个亚音频率中选一个随话音发送，接收机收到约定亚音才打开静噪。双音多频是DTMF，设备识别码和普通自动静噪都不是CTCSS。","m":"CTCSS：亚音选通三十八","g":""},{"i":"A-408","j":"LK0261","p":"3.1.1","q":"某些对讲机具有发送 DTMF码的功能。缩写 DTMF指的是：","o":["双音多频编码，由 8个音调频率中的两个频率组合成的控制信号，代表 16种状态之一，用于遥控和传输数字等简单字符","亚音调静噪，即从 67-250.3Hz的 38个亚音调频率中选取一个作为选通信号，代表 38种状态之一，接收机没有收到特定的选通信号时自动关闭音频输出","数字设备识别码，即在松开 PTT按键时自动发送一串代表设备代号的二进制数据","自动静噪，即在接收机没有收到信号时自动关闭音频输出"],"a":[0],"e":"DTMF是双音多频，由8个音调频率中取两个组合编码，共代表16种状态，常用于遥控和简单数字传输。亚音静噪是CTCSS，设备识别码与自动静噪也与DTMF定义不符。","m":"DTMF：双音组合十六态","g":""},{"i":"A-409","j":"LK1099","p":"3.1.1","q":"亚音和数字亚音静噪技术都是在调频发射机所发射的语音信号上附加一个人耳不易察觉的低频信号并用来选通接收机的静噪。它们所对应的收发信机设置菜单项有：","o":["CTCSS","DCS","DTMF","SQL"],"a":[0,1],"e":"亚音静噪对应菜单项CTCSS（模拟亚音），数字亚音静噪对应DCS，二者都是在话音上附加低频选通信号控制静噪。DTMF是双音多频遥控编码，SQL只是静噪阈值调节，均非亚音选通制式。","m":"亚音CTCSS，数字DCS","g":""},{"i":"A-410","j":"LK0260","p":"3.1.1","q":"有些调频接收机的参数设置菜单有 NFM和WFM两种选择。它们的含义是：","o":["NFM为窄带调频方式，适用于信道带宽 25kHz/12.5kHz的通信信号；WFM为宽带调频方式，适用于接收信道带宽 180kHz左右的广播信号","NFM代表数字化语音方式，WFM代表模拟语音方式","NFM为调频通信本地方式（较低灵敏度），WFM为调频通信远程方式（最高灵敏度）","NFM为单频率守候方式，WFM为双频率守候方式"],"a":[0],"e":"NFM为窄带调频，适配25kHz或12.5kHz信道间隔的通信信号；WFM为宽带调频，适配约180kHz带宽的调频广播。二者是带宽制式之分，与数字模拟、灵敏度高低或守候方式无关。","m":"NFM窄通信，WFM宽广播","g":""},{"i":"A-411","j":"LK1237","p":"3.1.1","q":"在一些 VHF/UHF业余无线电调频手持对讲机或车载电台的设置菜单中有“全频偏”和“半频偏”的选项。其意义是：","o":["代表与 25kHz或者 12.5kHz标称发射带宽相对应的 5kHz或 2.5kHz调制频偏","同一频段内，全频偏方式下发射机的频率漂移显然是比半频偏的大一倍","全频偏方式适用于收发异频的中继台通信；半频偏方式适用于同频直接联络","全频偏方式压缩 5kHz范围内的话音；半频偏方式只压缩低于 2.5kHz的声音"],"a":[0],"e":"全频偏与半频偏指调制频偏大小：25kHz带宽对应最大频偏5kHz，12.5kHz带宽对应2.5kHz，以便与信道间隔匹配、减少邻道干扰。它不是频率漂移、收发异频方式或话音压缩范围之分。","m":"全偏五千，半偏二千五","g":""},{"i":"A-412","j":"LK1182","p":"3.1.1","q":"如果对方报告你的调频电台发射的信号听起来失真严重，可辨度差，原因可能包括：","o":["电台的电源电压不足，可以检查供电电压或更换电池模块再试","电台所处的位置多径衰落严重，可以挪动几步或变更频率再试","电台的发射频率不准。如确认这种情况，需修好设备之后再试","电台天线承载射频功率的能力不足，需更换高级天线之后再试"],"a":[0,1,2],"e":"FM信号失真可辨度差常见三因：电源电压不足使功放工作异常、多径衰落造成相位畸变、发射频率不准使信号偏离接收通带中心，均可排查。天线功率承载不足主要涉及耐功率与安全，不是这种失真的典型原因。","m":"失真查三样：电源多径频率","g":""},{"i":"A-413","j":"LK1131","p":"3.1.1","q":"如需快速切换至你常用的某个频率，应当如何设置你的电台？","o":["将该频率作为一个频道存储到电台中","打开哑音静噪功能","关闭哑音静噪功能","使用快速扫描功能来切换到那个频率"],"a":[0],"e":"把常用频率连同模式等参数存为一个频道，以后一键即可调出，是快速切换频率的标准做法。开关静噪不改变频率，扫描功能是搜索有信号的频率而非直达指定频率。","m":"常用频率，存成频道","g":""},{"i":"A-414","j":"LK1128","p":"3.1.1","q":"车载电台的直流电源负极应当接在哪里？","o":["接到电池的负极或发动机的接地带上","接在天线座上","可以连在汽车的任意金属部件上","连在固定住电台的挂置架上"],"a":[0],"e":"车载电台负极应接到电池负极或发动机接地带上，保证低阻抗回流路径、减少压降和噪声窜入。随意接任意金属件、挂架或天线座接触电阻不可控，易引入干扰甚至工作异常。","m":"负极接电池或发动机地带","g":""},{"i":"A-415","j":"LK1127","p":"3.1.1","q":"有时，装在汽车上的移动电台可能放出随引擎转速而变的尖利啸声，其来源于：","o":["发电机","火花塞","电动油泵","ABS控制器"],"a":[0],"e":"随转速变化的啸声频率与发电机交流分量相关，是车载电台常见的发电机纹波干扰，经电源线或辐射进入电台。火花塞产生的是脉冲噪声，油泵和ABS控制器不是这种转速相关啸声的典型来源。","m":"啸声随转速，源头发电机","g":""},{"i":"A-416","j":"LK1179","p":"3.1.1","q":"如果别的业余电台报告说你的手持电台发射的 FM信号的频偏过大，你应当怎么做？","o":["尝试切换至 NFM档位进行通联。如已使用 NFM，则试着讲话时离话筒远一点儿","更换一块新电池再试","调至发射功率更大的档位","使用更大的声音对着话筒讲话以触发系统中隐藏的但是非常好用的语音限幅功能"],"a":[0],"e":"频偏过大说明调制过强，应切换到频偏较小的NFM档位；若已在NFM，则讲话离话筒远些以减小音频幅度。换电池、加大功率或更大声讲话都不能减小频偏，后者反而更严重。","m":"频偏大：换NFM，离话筒远","g":""},{"i":"A-417","j":"LK1101","p":"3.1.1","q":"如果其他电台报告说你的发射干扰了相邻频率的通信。你应当做的是：","o":["检查发射机的频率指示是否准确、发射机的杂散发射指标是否合格","换用另一种调制模式试试看","将这种情况通知你的设备制造商","立即增加发射功率"],"a":[0],"e":"干扰邻频首先应自查本机：频率指示不准会使发射偏入邻道，杂散发射超标会直接污染相邻频率。换模式或通知厂商不能替代检查，增加功率只会让干扰更严重。","m":"扰邻频先查：频率和杂散","g":""},{"i":"A-418","j":"LK1102","p":"3.1.1","q":"如果其他电台报告说你在 2米波段的信号本来很强，但是突然就变弱甚至难以辨别了，你应当怎么做？","o":["稍稍移动一下自己的位置。电波传播的多径效应会时而引起信号衰落或解调失真","打开发射机的亚音静噪功能","请对方电台检查一下静噪设置","将你电台中的锂电池换成镍氢的"],"a":[0],"e":"2米波段信号突强突弱多为多径效应：直射与反射波在不同位置相长或相消，移动少许位置即可走出衰落点。亚音静噪、对方静噪设置和电池类型都与传播衰落无关。","m":"信号忽弱，挪步避多径","g":""},{"i":"A-419","j":"LK1122","p":"3.1.3","q":"如果进行 SSB或 CW通联时周边环境嘈杂，哪种设备可以替代电台上的扬声器，改善话音抄收？","o":["耳机","低通滤波器","视频显示器","吊杆胖话筒"],"a":[0],"e":"耳机把声音直接送入耳道，隔绝环境噪声并提高听感信噪比，是嘈杂环境下抄收SSB或CW的简单有效办法。低通滤波器、显示器和吊杆话筒都不能隔离现场噪声对听抄的影响。","m":"环境吵，戴耳机抄收","g":""},{"i":"A-420","j":"LK0249","p":"3.1.3","q":"全功能小型收发信机的面板上常有缩写为“NB”和“SQL”的功能，它们有什么不同？","o":["NB为“抑噪”，切除高于平均信号的大幅度突发脉冲噪声；SQL为“静噪”，信噪比达不到一定水平时自动关闭音频输出","NB和 SQL都是指“抑噪”，收不到有用信号时自动关断背景噪声","NB和 SQL都是指“静噪”，切除高于平均信号的大幅度突发脉冲噪声","NB和 SQL都是指“静噪”，收不到带有预期的特定控制信号时自动关断音频输出"],"a":[0],"e":"NB是噪声抑制器，专门切除幅度高于平均信号的突发脉冲噪声；SQL是静噪，信噪比低于门限时关闭音频输出。二者作用对象和原理不同，不能混为同一种功能。","m":"NB切脉冲，SQL关静音","g":""},{"i":"A-421","j":"LK1132","p":"3.1.3","q":"某些车辆的火花塞辐射脉冲干扰。这可能导致收信机的 AGC过早起控，使正在接收的SSB或 CW信号受到压制，进而影响听抄。遇到这种情况，你应当如何设置你的电台？","o":["打开电台的抑噪（NB）功能","降低静噪（SQL）阀值","将频率稍稍调偏一点儿","反复调节电台的 RIT旋钮"],"a":[0],"e":"火花塞脉冲干扰幅度大、瞬间抬高电平，会使AGC过早起控压制有用信号；打开NB可在AGC检测前切除这些脉冲，恢复正常听抄。调静噪阈值、调偏频率或调RIT都不能消除脉冲对AGC的影响。","m":"脉冲压AGC，开NB切除","g":""},{"i":"A-422","j":"LK0369","p":"3.1.3","q":"全功能小型收发信机面板上的“MODE”代表什么功能：","o":["用来切换工作方式，比如 FM、LSB、USB和 CW等","用来切换静噪方式，比如 CTCSS和 DCS等","用来切换接收机的工作方式，比如射频直采和低中频超外差等","用来切换监听方式，比如单耳音频、双耳音频和 CW立体声等"],"a":[0],"e":"MODE键用于切换工作方式（调制模式），如FM、LSB、USB、CW等。静噪方式、接收机体制和监听声道方式各有专门设置，不是MODE的含义。","m":"MODE：切换工作方式","g":""},{"i":"A-423","j":"LK0253","p":"3.1.3","q":"收发信机面板上的符号 ATT代表什么功能？","o":["收信机输入衰减器，在接收大信号时接入，使信号不致过大而使前级电路过载","自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","发信自动音量控制，对音频输入电平进行检测并反馈控制，以维持其在适当限度之内"],"a":[0],"e":"ATT是接收输入衰减器，接收大信号时接入若干分贝衰减，防止前级电路过载产生失真和互调。自动天调、发信ALC和音频音量控制分别对应AT、ALC等其他符号。","m":"ATT：大信号先衰减","g":""},{"i":"A-424","j":"LK0254","p":"3.1.3","q":"收发信机面板上的符号 AGC代表什么功能？","o":["收信机自动增益控制，对中频级信号电平进行检测并反馈控制，防止电路过载","收信自动音量控制，对音频输出电平进行检测并反馈控制，以维持其在适当限度之内","自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内"],"a":[0],"e":"AGC是接收自动增益控制，检测中频信号电平并反馈调节增益，使强弱信号输出大致恒定并防止电路过载。它作用于接收中频级，与音频音量、天线调谐和发信电平控制不同。","m":"AGC：自动稳住接收增益","g":""},{"i":"A-425","j":"LK0853","p":"3.1.3","q":"既然全功能收信机具有 AGC功能，那为什么好多机型还要装设衰减（ATT）开关？","o":["特强带外信号可以阻塞接收机的前级电路，致使器件非线性工作，产生失真和互调。此时需在接收机的前端电路之前加入衰减器，并用开关控制其切入与否","通常，增益控制旋钮的控制范围不够宽，加入 ATT开关可以拓展增益控制范围","如果遭遇特强带内干扰，那么打开 ATT就可防止过大的音量损坏扬声器或耳机了","这可以防止本台发射机的强信号损坏本台的接收机电路"],"a":[0],"e":"AGC只能调节其环路内增益，无法阻止特强带外信号在接收机最前端造成阻塞和非线性互调；把ATT接在前端电路之前降低信号幅度，才能让前级工作在线性区。拓展音量范围、防喇叭损坏或防本台发射损坏接收机都不是其目的。","m":"强信号堵前端，ATT挡在前","g":""},{"i":"A-426","j":"LK1180","p":"3.1.3","q":"关于接收机的“过载”现象，以下描述正确的是：","o":["输入信号过于强大以至机内电路饱和阻塞，严重时会损坏接收机前端电路的元器件","启用接收机的 ATT功能可消除或缓解过载","接收机消耗的电流过大，致使电源出现过载现象。情况严重时供电装置会烧毁","减小接收机的喇叭音量，可缓解过载现象"],"a":[0,1],"e":"接收过载指输入信号过强使机内电路饱和阻塞、产生失真，严重时可损坏前端器件；接入ATT衰减输入可消除或缓解过载。它不是电源供电过载，减小喇叭音量只降输出响度，对前端饱和无济于事。","m":"过载是信号太强，ATT来挡","g":""},{"i":"A-427","j":"LK0268","p":"3.1.3","q":"应关闭接收机 AGC功能的情况是：","o":["有用微弱信号和强干扰同时出现时","接收微弱信号时","接收特强信号时","有用强信号中夹杂着微弱干扰"],"a":[0],"e":"微弱有用信号与强干扰并存时，AGC会被强干扰控制而压低增益，把弱信号一并压没，此时应关闭AGC手动控制增益。单纯接收弱信号或强信号时AGC反而有助于稳定输出，不应关闭。","m":"弱信号怕强扰：关AGC","g":""},{"i":"A-428","j":"LK0269","p":"3.1.3","q":"应选择较短的 AGC时间常数的情况是：","o":["接收 FM/FSK/PSK等包络幅度恒定的信号","接收 SSB和 AM等正常信号的包络幅度不断变化的信号","将接收机应用于“比幅度法规”测向时","有用微弱信号和强干扰同时出现时"],"a":[0],"e":"FM、FSK、PSK等信号包络恒定，不需要AGC慢慢跟随包络变化，选短时间常数可使增益快速适应电平变化。SSB、AM包络本身起伏大需用长常数，测向比幅度和弱强并存场合也不适用短常数。","m":"恒包络信号，AGC用短","g":""},{"i":"A-429","j":"LK0270","p":"3.1.3","q":"应选择较长的 AGC时间常数的情况是：","o":["接收 SSB和 AM等正常信号的包络幅度不断变化的信号","接收 FM/FSK/PSK等包络幅度恒定的信号遇到变化很快的传播衰落时","将接收机应用于“比幅度法规”测向时","有用微弱信号和强干扰同时出现时"],"a":[0],"e":"SSB和AM的包络随话音不断起伏，AGC时间常数应较长，以免增益追随话音起伏造成呼吸效应和失真。恒包络信号宜短常数，测向和弱强并存场合则有其他专门考虑。","m":"SSB包络变，AGC用长","g":""},{"i":"A-430","j":"LK0256","p":"3.1.3","q":"多数小型全功能收发信机的面板上都可以看到符号 PRE，其代表什么功能？","o":["收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分"],"a":[0],"e":"PRE是接收前置放大器，接收微弱信号时接入以提高灵敏度，代价是动态范围等某些指标可能低于额定值。自动天调、发信ALC、语音压缩分别是AT、ALC、PROC的功能。","m":"PRE前放：弱信号接入","g":""},{"i":"A-431","j":"LK0251","p":"3.1.3","q":"收发信机面板上的符号 ALC代表什么功能？","o":["发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","发信自动音量控制，对音频输入电平进行检测并反馈控制，以维持其在适当限度之内","自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","自动频率控制，对发射频率的漂移进行检测并反馈控制，以维持准确的工作频率"],"a":[0],"e":"ALC是发信自动电平控制，检测射频输出电平并反馈控制驱动，使输出保持在适当限度内、防止过驱动。音频音量控制、天线调谐和频率控制是其他电路的功能。","m":"ALC：稳住发信电平","g":""},{"i":"A-432","j":"LK1029","p":"3.1.3","q":"在单边带发信机中，发信自动电平控制（ALC）的主要作用是：","o":["防止过驱动导致调制失真或引发电路故障","改善发信机的频率稳定度","自动实现天线电路的阻抗匹配","防止话筒过于灵敏带来背景噪声"],"a":[0],"e":"SSB发信机中ALC通过反馈限制驱动电平，主要作用是防止过驱动造成调制失真、互调产物增多，严重时还会引发电路故障。频率稳定靠振荡电路，天线匹配靠调谐网络，话筒灵敏与背景噪声也不是ALC的职责。","m":"ALC防过驱动失真","g":""},{"i":"A-433","j":"LK1030","p":"3.1.3","q":"业余电台进行单边带话音通信时，如果对方反映虽然己方的讲话基本可辨，但是在话音的间隙中夹杂嘈杂的背景噪声。这时应当：","o":["调低发射机的话筒增益。如果发射机带有语音压缩处理功能，则应尝试调低控制深度","调低发射机的射频输出功率","调整发射机的天线匹配电路","调整发射机的 ALC控制深度"],"a":[0],"e":"话音间隙夹杂背景噪声，说明话筒增益过高或语音压缩过深，把环境噪声也放大并在停顿时凸显出来，应调低话筒增益、必要时减小压缩深度。降功率、调天线匹配或ALC深度都不针对噪声被拾取的源头。","m":"间隙有噪声：降话筒增益","g":""},{"i":"A-434","j":"LK1129","p":"3.1.3","q":"即使打开了发射机的 ALC，将话筒的增益调得过高仍可能导致：","o":["发出的信号失真","发射机的功率提升","发射机的频率漂移变大","天线的驻波比增加"],"a":[0],"e":"ALC只能限制射频驱动的上限，话筒增益过高会先在音频和调制级产生削波和互调，信号依旧失真。ALC不会因此提升功率、增大频漂或改变天线驻波比。","m":"话筒增益过高，ALC救不了失真","g":""},{"i":"A-435","j":"LX","p":"3.1.3","q":"为什么使用单边带收发信机发送 AFSK 信号时需要关闭 ALC？","o":["ALC增加 AFSK信号的失真，抬升误码率","ALC使发射功率失控，导致发射机故障","ALC使信号的极性反转，致使无法解码","ALC影响 AFSK信号的频响，使音色变差"],"a":[0],"e":"ALC会随AFSK音频电平起伏不断调整发信增益，使信号包络畸变、产生互调和谐波，从而抬升解码误码率，故发送AFSK时应关闭ALC并控制好音频电平。它不会使功率失控、反转极性或改变音色到无法使用的程度。","m":"发AFSK关ALC，防失真误码","g":""},{"i":"A-436","j":"LK0250","p":"3.1.3","q":"单边带发信机的语音压缩功能有什么作用？","o":["压低较强语音信号的幅度、提升较弱信号的幅度，改善较弱的语音在接收端的信噪比","压低较弱语音信号的幅度、提升较强信号的幅度，增加语音的动态范围和抑扬顿挫感","压低语音信号的低频分量，提升高频分量，增加信号的带宽，使高音更加细腻","压缩信号所占用的频谱宽度，提高无线电频谱的利用率"],"a":[0],"e":"语音压缩压低强语音幅度、提升弱语音幅度，缩小动态范围、提高平均功率，使较弱的话音在接收端也有较好的信噪比和可懂度。它不是扩大动态范围，也不是压缩频谱带宽或改变高低频均衡。","m":"压缩：强压弱提，均值高","g":""},{"i":"A-437","j":"LK0257","p":"3.1.3","q":"收发信机面板上的符号 PROC代表什么功能？","o":["发信语音压缩，对音频输入电平进行检测并反馈控制，以使包络幅度较小语音获得提升","收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内"],"a":[0],"e":"PROC是发信语音压缩（处理器），检测音频输入电平并反馈控制，使幅度较小的语音获得提升、平均电平提高。前置放大、自动天调和发信ALC分别是PRE、AT、ALC的功能。","m":"PROC：发信语音压缩","g":""},{"i":"A-438","j":"LX","p":"3.1.3","q":"发信时，若话音压缩调整不当可能带来什么问题?","o":["可能产生很多互调成分，影响对方收信时的辨识度","可能使话音严重失真，但是不影响对方电台的收信","可能发射很大的交流声","可能使话筒过载损坏"],"a":[0],"e":"话音压缩过深或调整不当时，音频削波和非线性会产生大量互调成分，展宽频谱并降低对方收信的辨识度。失真并非与对方无关，交流声和话筒损坏也不是压缩不当的典型后果。","m":"压缩过头，互调满天飞","g":""},{"i":"A-439","j":"LX","p":"3.1.3","q":"为什么用单边带收发信机发送 AFSK 信号时应关闭语音压缩功能？","o":["语音压缩可能导致信号的包络畸变，破坏基带特征，抬升误码率","经语音压缩处理的信号，其相位变化已不存在，本质上无法解码","经语音压缩处理的信号，其幅度变化已不存在，本质上无法解码","语音压缩提升信号的峰均比，易导致发射机功率放大器过热损坏"],"a":[0],"e":"AFSK依靠音频的幅度与频率特征承载数据，语音压缩会扭曲信号包络、破坏基带特征，使解调误码率上升，故应关闭。压缩并不会抹去相位或幅度信息到本质无法解码，也不是峰均比导致功放过热的问题。","m":"AFSK怕包络畸变，关压缩","g":""},{"i":"A-440","j":"LK0233","p":"3.1.3","q":"业余电台以发射的方法测量发射功率和天线驻波比时必须留意并做到的是：","o":["先将频率设置到无人使用的空闲频率、偏离常用的热点频率","先将天线的发射方向指向正北","先将收发信机的语音压缩功能打开","话筒离嘴距离在 2公分以上，电键按键时间不短于 5秒钟"],"a":[0],"e":"以发射方式测功率和驻波比会真实辐射信号，必须先把频率设到无人使用的空闲频率并避开常用热点频率，以免干扰他人通联。天线指向、开语音压缩、话筒距离和按键时长都不是防干扰的关键要求。","m":"发射测试，先找空闲频率","g":""},{"i":"A-441","j":"LK0234","p":"3.1.3","q":"单边带业余电台测试检查天线驻波比需要发射平稳的连续信号。文明的作法是：","o":["将电台设为 CW方式并按下电键。或者，将电台设为 AM或 FM方式并按下 PTT键（不对话筒说话）以产生连续载波。测试结束后设回 SSB方式","将电台设为 SSB方式，用平稳的气流对话筒吹口哨","将电台设为 SSB方式，深呼吸后用平稳的气流对话筒发长音“啊”","将电台设为 SSB方式，深呼吸后用平稳的气流对话筒发长音“嘻”"],"a":[0],"e":"SSB无载波、靠吹哨或喊话产生的信号不平稳，测驻波不可靠；文明做法是用CW方式按键，或用AM、FM方式按PTT不说话，产生平稳连续载波测完再改回SSB。对着话筒吹气发长音既不稳定又污染频率。","m":"测驻波用CW或FM空载波","g":""},{"i":"A-442","j":"LK0252","p":"3.1.3","q":"收发信机面板上的符号 AT或者 TUNE代表什么功能？","o":["自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","发信自动音量控制，对音频输入电平进行检测并反馈控制，以维持其在适当限度之内","发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","自动频率控制，对发射频率的漂移进行检测并反馈控制，以维持准确的工作频率"],"a":[0],"e":"AT或TUNE是自动天线调谐功能，检测天线电路的电压驻波比并自动补偿，使驻波比维持最小、保护功放。发信音量控制、发信ALC和自动频率控制是其他电路，与天线调谐无关。","m":"AT/TUNE：自动调天线","g":""},{"i":"A-443","j":"LK0271","p":"3.1.3","q":"使用射频/中频增益和音频增益分开控制的通信接收机进行收听时，可以这样设置：","o":["信号特弱时尽量把射频/中频增益开到最大，信号特强时尽量把音频增益开到最大，然后从低到高调整另一个增益以得到适当的音量","信号特弱时尽量把音频增益开到最大，信号特强时尽量把射频/中频增益开到最大，然后从低到高调整另一个增益以得到适当的音量","任何情况下都应将射频/中频增益放在中间位置，然后从低到高调整音频增益以得到适当的音量","任何情况下都应将音频增益放在中间位置，然后从低到高调整射频/中频增益以得到适当的音量"],"a":[0],"e":"增益分配原则是优先保证信噪比：信号特弱时把射频/中频增益开到最大以压低噪声影响，信号特强时把音频增益开到最大、压低射频增益防过载，再调另一增益得到适当音量。固定把某级增益放中间都不符合这一优化原则。","m":"弱信号重射频，强信号重音频","g":""},{"i":"A-444","j":"LX","p":"3.1.3","q":"HF通信与 VHF或 UHF通信相比，最大的不同是什么？","o":["HF通信依靠电离层的反射","HF传播更为稳定，衰落小","HF天线体积小","HF更适合远距离宽带通信"],"a":[0],"e":"HF频段电波能被电离层反射回地面，实现远距离乃至全球传播，这是与主要靠直射传播的VHF、UHF最大的不同。HF传播受电离层变化影响衰落并不小，天线尺寸也更大，且带宽资源不适合宽带通信。","m":"HF靠电离层反射传远","g":""},{"i":"A-445","j":"LK1126","p":"3.1.3","q":"下面哪种方法可以减小话筒或耳机用音频电缆可能感生的射频电流？","o":["在电缆外面穿套铁氧体磁环","在电缆芯线中串联低通滤波器","在电缆前端添置话筒放大器","在电缆芯线中串联带通滤波器"],"a":[0],"e":"音频电缆会像天线一样拾取射频形成共模电流，在电缆外套穿铁氧体磁环可增大共模阻抗、抑制这类感生电流。串联滤波器会改变音频通路特性，加话筒放大器更无抑制作用。","m":"音频线抗射频：套磁环","g":""},{"i":"A-446","j":"LK0420","p":"3.3.1","q":"发射天线的作用是：","o":["把发射机输出的射频信号转化为无线电波","利用天线的增益放大发射机的输出功率","将发射机输出的射频信号转化为音频信号","将发射机输出的射频信号转化为红外线"],"a":[0],"e":"发射天线是将发射机输出的射频电流能量转换为向空间辐射的无线电波的换能器。天线增益是方向性集中的结果，并不能真正“放大”功率；C、D的音频、红外线转换更是概念错误。","m":"发射天线：射频变电波","g":""},{"i":"A-447","j":"LK0421","p":"3.3.1","q":"接收天线的作用是：","o":["把空间的无线电波转化为接收机中的射频电信号","利用天线的增益放大空间的无线电波并将之传向接收机","将空间的无线电波转化为接收机中的音频信号","将空间的无线电波转化为红外线"],"a":[0],"e":"接收天线是将空间无线电波感应为接收机可处理的射频电信号的换能器。天线不放大信号（增益是相对值）；解调出音频是接收机电路的事，红外线则毫不相关。","m":"接收天线：电波变电信号","g":""},{"i":"A-448","j":"LK0926","p":"3.3.1","q":"关于天线的增益，以下说法正确的是：","o":["待测天线最大辐射方向上的辐射功率密度与基准天线对应值的比值","与参考天线相比，被测天线在某个方向上使信号增强的程度","天线辐射的电波功率与输入到天线的射频功率之比","天线发热耗散的功率与输入到天线的射频功率之比"],"a":[0,1],"e":"天线增益的定义是被测天线最大辐射方向的功率密度与基准天线对应值的比值（A），也就是相对参考天线在某方向上信号增强的程度（B）。C描述的是辐射效率，D在物理上没有意义。","m":"增益是方向性比值，不是效率","g":""},{"i":"A-449","j":"LK0929","p":"3.3.1","q":"以 dBi为单位的天线增益是指：","o":["待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的 dB值","待测天线最大辐射方向上的辐射功率密度与半波长偶极天线对应值之比的 dB值","待测天线最大辐射方向上的辐射功率密度与 1/4波长地网天线对应值之比的 dB值","待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的 dB值"],"a":[0],"e":"dBi中的i即isotropic（各向同性），基准是理想点源天线——一种假想的全向辐射体。dBd才以半波偶极子为基准；C、D的基准表述均不用于dBi定义。","m":"dBi的i=理想点源isotropic","g":""},{"i":"A-450","j":"LK0976","p":"3.3.1","q":"什么是“理想点源天线”？对业余无线电又有什么意义？","o":["存在于理论中的一种小到一个点，可将发射机输出的全部射频能量都转化为各向同性且均匀辐射的电磁波的假想天线；用作比较实际天线辐射性能的一种全向基准天线","一种用于专业通信的增益极高的专用天线，在业余无线电中没有应用价值","仅用于无线电测试的一种标准接收天线，发射效果不佳，对业余无线电无用","一种带宽近乎无限的高级天线的专利名称，业余无线电业务不需要宽带天线"],"a":[0],"e":"理想点源天线是理论上的假想天线：尺寸为点、各向均匀辐射、转换全部射频能量；实际中用作衡量各种实际天线方向性增益的全向基准。B、C、D把它说成某种专用或专利实物天线，都是错误的。","m":"点源假想天线，专做全向基准","g":""},{"i":"A-451","j":"LK0930","p":"3.3.1","q":"以 dBd为单位的天线增益是指：","o":["待测天线最大辐射方向上的辐射功率密度与半波长偶极天线对应值之比的 dB值","待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的 dB值","待测天线最大辐射方向上的辐射功率密度与 1/4波长垂直天线对应值之比的 dB值","待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的 dB值"],"a":[0],"e":"dBd中的d即dipole，基准是半波长偶极天线（其自身增益定义为0dBd）。与dBi相差2.15dB；B、C、D的基准都不对。","m":"dBd的d=dipole半波偶极","g":""},{"i":"A-452","j":"LK1112","p":"3.3.1","q":"半波振子是能够辐射电波的一种实用天线。为了获得最低输入阻抗，人们通常从中点为这种振子馈电。这就构成了具有两个 1/4波长不同电极性区域的谐振偶极天线，亦称半波长偶极天线。这种天线的增益规定为 0dBd。那么相比理想点源天线，其增益为：","o":["2.15dBi","6dBi","3dBi","1.64dBi"],"a":[0],"e":"半波偶极天线相对理想点源天线有2.15dB的方向性增益，这是固定换算关系：dBi=dBd+2.15。6dB、3dB、1.64dB均无依据。","m":"0dBd就是2.15dBi，记住2.15","g":""},{"i":"A-453","j":"LK0931","p":"3.3.1","q":"某商品天线说明书给出的天线增益指标以 dB为单位。其意义为：","o":["该指标未指明计算方法和所用基准，缺乏参考价值","待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的 dB值","待测天线最大辐射方向上的辐射功率密度与 1/4波长垂直天线对应值之比的 dB值","待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的 dB值"],"a":[0],"e":"分贝是相对单位，不注明基准（dBi/dBd）就无法换算成绝对意义，这种“dB增益”没有参考价值。厂商若只写dB，通常是含糊其辞的营销数字。","m":"只写dB不写基准，等于没说","g":""},{"i":"A-454","j":"LK0918","p":"3.3.1","q":"我们之所以称垂直接地天线为“全向天线”，是因为：","o":["这种天线在水平方向上没有指向性","这种天线在垂直方向上没有指向性","这种天线的 E面和 H面方向图均为正圆","这种天线辐射各向同性的球面波"],"a":[0],"e":"垂直接地天线（GP）在水平方位角上辐射均匀、无指向性，故称水平面全向天线；它在垂直面（仰角方向）是有方向图的，并非真正的各向同性球面波。","m":"全向指水平面一圈都一样","g":""},{"i":"A-455","j":"LK0904","p":"3.3.1","q":"如需垂直接地天线在大体为零仰角的水平发射方向上具有主辐射瓣并可以与同轴电缆直接耦合，则振子长度应选为：","o":["1/4波长","1/2波长","1/8波长","3/2波长"],"a":[0],"e":"1/4波长垂直振子配合镜像地平面，在接近零仰角的水平方向形成主瓣，且输入阻抗约50欧，可直接接同轴电缆。1/2波长时阻抗很高无法直连；1/8太短、3/2波瓣分裂都不合适。","m":"垂地四分之一波，同轴直连低仰角","g":""},{"i":"A-456","j":"LK0919","p":"3.3.1","q":"关于振子长度为 1/4波长的垂直接地天线的最大辐射方向，以下描述正确的是：","o":["在水平方向上是全向的","在垂直方向上有指向性，且辐射仰角稍大于 0°","其 E面方向图为“8”字形","其 H面方向图为“8”字形"],"a":[0,1],"e":"1/4波长GP的H面（水平面）方向图为正圆即全向（A）；E面（垂直面）有指向性，主瓣仰角略高于地平线（B）。C、D把E面/H面说反了：E面是垂直面、H面是水平面。","m":"H面看水平，E面看垂直","g":""},{"i":"A-457","j":"LK1215","p":"3.3.1","q":"关于大多数手持电台随附的“橡胶天线”，以下说法正确的是：","o":["就电台的一般持握方式而言，电波的垂直极化分量要强一些","相对于全尺寸天线，“橡胶天线”的发射与接收增益都低一些","如果橡胶护套内的天线是螺旋加感的，则电波是旋转极化的","如果橡胶护套某处开裂，则振子会迅速解体，天线随即报废"],"a":[0,1],"e":"手台通常竖直持握，橡胶天线近似垂直振子，故垂直极化分量占优（A）；其电气长度不足、效率低于全尺寸天线（B）。螺旋加感只是缩短振子，并不产生圆极化；护套开裂一般不影响内部振子工作。","m":"胶鞭短小效率低，竖握垂直极化强","g":""},{"i":"A-458","j":"LX","p":"3.3.1","q":"在车内使用手持电台和俗称“橡胶天线”的柔性天线进行通信可能遇到什么问题？","o":["车体的屏蔽作用影响信号强度","大量电波反射回天线，抬升 SWR","影响电台散热","行车噪声影响通话质量"],"a":[0],"e":"汽车是金属封闭体，对车内天线形成法拉第笼式屏蔽，大幅衰减进出信号，这是车内用手台配胶鞭通联困难的主因。B的反射抬SWR、C的散热、D的行车噪声都不是主要矛盾。","m":"车壳是屏蔽罩，车里信号差","g":""},{"i":"A-459","j":"LX","p":"3.3.1","q":"如果架设天线时发现场地附近有电线等市电供电装置，你该怎么办？","o":["应确保在风雨中意外掉落的天线部件不落入供电装置的安全距离内。例如，35千伏及以下电压时至少 1米","应确保供电装置带来的电源噪声不会影响电台接收弱信号的能力。通常，这个距离应至少 10倍于工作波长","必须防止通信和供电两套系统之间发生打火拉弧事故。经验上讲，按照每千伏 1毫米算出的间距是足够的","应确保天线转动到平行于供电系统的电线时，电线不会成为反射单元，即，应至少保持1/4波长以上距离"],"a":[0],"e":"天线架设遇供电线路时，首要风险是风雨中天线部件掉落触碰带电体造成触电/短路，因此必须保证掉落物不落入安全距离内（35千伏及以下至少1米）。B的电源噪声、C的打火间距算法、D的反射单元说法都不是规范要求。","m":"防天线掉落碰电线，35kV留1米","g":""},{"i":"A-460","j":"LK0925","p":"3.3.1","q":"垂直接地天线（GP）由电气长度为 1/4波长的垂直振子加上一个“镜像地平面”构成，因十分简洁而被大量应用于手持和车载业余通信。但是，这种天线的工作有效性往往不如理论预计的那么完美，特别是在波长较长的波段。造成这种情况的原因及改善方法是：","o":["缺乏有效接地镜像；GP天线必须有足够大的导电平面以形成振子镜像，否则谐振频率和阻抗都与理论值有出入。为此，应尽量用大面积金属导体与天线/馈线的接地端相连","1/4波长垂直振子显然是太短了。改成 1/2波长即可解决问题","1/4波长垂直振子显然是太短了。在振子当中串联加感线圈即可解决问题","天线与电缆直接相连，匹配不佳。在天线和电缆之间加接“巴伦”即可解决问题"],"a":[0],"e":"GP天线的1/4波长振子依赖大地（或人工地网）提供镜像，镜像不良则谐振频率与阻抗偏离理论值；有效改善方法是扩大接地导体面积、做好射频接地。加长振子、串加感线圈、加巴伦都不能替代镜像地平面。","m":"GP缺镜像，铺大地网来补","g":""},{"i":"A-461","j":"LX","p":"3.3.1","q":"关于天线的加载，以下描述正确的是","o":["为天线振子串联电感线圈，延长振子的电气长度","为车载天线增添弹簧减震器","为柔性不足的天线基座增加螺旋式延长器","为八木天线的拉纤加接弹性张力器"],"a":[0],"e":"天线加载专指在电短振子中串联电感线圈，用感抗抵消容抗、延长电气长度，使其谐振于工作频率。B、C、D的弹簧、延长器、张力器都是机械件，与电气加载无关。","m":"加载=串电感，电气长度加长","g":""},{"i":"A-462","j":"LK0944","p":"3.3.1","q":"谐振的垂直接地天线的振子长度最短也要 1/4波长。如果架设天线时因条件受限而不得不将振子缩短，那么在振子之中串入电感可以补偿失去的感抗，使天线谐振在所需频率上。为了提高发射效率，应在振子的什么位置串入电感需根据架设条件择优确定。下图给出三种加感方案。假设振子（灰色部分）均等长，则 A、B、C三种方案按发射效率可排列为：","o":["C-顶部加感，B-中部加感，A-底部加感","A-底部加感，B-中部加感，C-顶部加感","A-底部加感，C-顶部加感，B-中部加感","B-中部加感，A-底部加感，C-顶部加感"],"a":[0],"e":"加感线圈应放在电流大的位置才能以最小电感量达到谐振、减少线圈损耗；短振子上电流分布是底部大、顶部小，因此顶部加感（C）电流分布最均匀、效率最高，中部（B）次之，底部（A）最差。排序为C＞B＞A。","m":"加感位置越高，效率越高","g":"data:image/jpeg;base64,QzovVXNlcnMvY3N4dDgvc291cmNlL3JlcG9zL2NyYWMtYW1hdGV1ci1yYWRpby1leGFtLXF1ZXN0aW9ucy0yMDI1LWNzdi9pbWFnZXNfMi9MSzA5NDQuanBn"},{"i":"A-463","j":"LK0206","p":"3.3.1","q":"甲天线增益 6.15dBi，乙天线增益 1dBd。若两副天线按同样条件架设并用同样功率来驱动，则在它们最大发射方向的同一远方地点接收时，两天线给出的信号功率关系为：","o":["甲天线的信号功率为乙天线的两倍","甲天线的信号功率为乙天线的 1/2","甲天线的信号功率为乙天线的 5.15倍","甲天线的信号功率为乙天线的 6.15倍"],"a":[0],"e":"先统一基准：1dBd=3.15dBi，乙天线相当于3.15dBi；甲6.15dBi比乙高3dB，功率比为10^(3/10)≈2倍。C、D是把dB差值直接当倍数用的错误。","m":"dB差3就是功率翻倍","g":""},{"i":"A-464","j":"LK0207","p":"3.3.1","q":"甲天线增益 0dBd，乙天线增益 2dBi。若两副天线按同样条件架设用用同样功率来驱动，则在它们最大发射方向的同一远方地点接收时，两天线给出的信号功率关系为：","o":["甲天线的效果与半波长偶极天线相当，乙天线比甲天线略差","甲天线效果为零，不能工作，乙天线效果比甲天线好 2倍","甲天线的效果与半波长偶极天线相当，乙天线发射的信号强度比甲天线好 2dB","甲、乙天线的效果实际相同"],"a":[0],"e":"0dBd即与半波偶极天线相当；2dBi换算成dBd是2−2.15=−0.15dBd，略低于甲天线。B的“效果为零”误解了0dB的含义（0dB表示与基准相等，不是零）。","m":"0dBd=偶极基准，2dBi还差一线","g":""},{"i":"A-465","j":"LK0932","p":"3.3.1","q":"有两款 VHF垂直全向天线作发射之用。甲天线增益为 4.5dBd，而乙天线的是 5.85dBi。它们在远处某接收天线中产生的信号功率有什么不同？","o":["来自甲天线的信号比乙天线的强 0.8dB","来自乙天线的信号比甲天线的强 1.35dB","来自甲天线的信号比乙天线的强 1.35dB","来自乙天线的信号比甲天线的强 3.5dB"],"a":[0],"e":"统一为dBi：甲4.5dBd=6.65dBi，乙5.85dBi；甲比乙高0.8dB。注意不是数值直接相减（4.5与5.85单位不同），先换算再比较。","m":"先换dBi再相减，甲强0.8","g":""},{"i":"A-466","j":"LK0933","p":"3.3.1","q":"有两款 VHF垂直全向天线作发射之用。甲天线增益为 2.9dBd，而乙天线的是 5.85dBi。它们在远处某接收天线中产生的信号功率有什么不同？","o":["来自乙天线的信号比甲天线的强 0.8dB","来自乙天线的信号比甲天线的强 2.95dB","来自甲天线的信号比乙天线的强 2.95dB","来自乙天线的信号比甲天线的强 7.1dB"],"a":[0],"e":"统一为dBi：甲2.9dBd=5.05dBi，乙5.85dBi；乙比甲高0.8dB。数值上乙只多2.95但单位不同，不能直接减，必须先换算。","m":"单位不同先换算，乙强0.8","g":""},{"i":"A-467","j":"LK1185","p":"3.3.2","q":"业余无线电爱好者讨论天线系统时常会提及术语 “驻波比（SWR）”。其含义为：","o":["连接到传输线终端的负载阻抗与传输线自身的特性阻抗相匹配的程度","负载与传输线完美匹配时，传输线之中没有驻波，因此驻波比为 1:1","如果负载与传输线不匹配，传向负载的部分能量会沿传输线返回始端","如果传输线中出现驻波，则调整传输线始端的信源阻抗可使驻波归零"],"a":[0,1,2],"e":"SWR描述负载阻抗与传输线特性阻抗的匹配程度（A）；完美匹配时无反射、SWR为1:1（B）；失配时部分能量反射回始端形成驻波（C）。D错误：驻波是负载失配造成的，调整始端信源阻抗不能消除馈线上的驻波。","m":"驻波比说匹配，调源头消不掉","g":""},{"i":"A-468","j":"LK1186","p":"3.3.2","q":"通联时，如果收发信机的 SWR表显示读数 4:1，则意味着：","o":["从发射机的输出端口来看，天线系统的整体匹配情况不佳","从发射机的输出端口来看，天线系统的整体阻抗为 200欧或 12.5欧","天线系统的辐射效率仅为 25%","天线系统的整体增益仅为 4dB"],"a":[0],"e":"SWR表接在发射机输出端，4:1说明从该端口看出去的天线系统整体匹配不良。SWR只能给出失配程度，不能反推具体阻抗值（200欧或12.5欧都可能）；更与辐射效率、增益数值无直接换算关系。","m":"4:1=匹配差，别硬算阻抗值","g":""},{"i":"A-469","j":"LK1187","p":"3.3.2","q":"小强用长度不短于 1/4波长的 50欧馈线连接收发信机和天线。发信时，他发现 SWR表的指示为 3:1。该值意味着：","o":["馈线中任意位置上的最大峰值电压与最小峰值电压之比为 3:1","馈线中任意位置上的最大峰值电流与最小峰值电流之比为 3:1","馈线中的驻波致使平均射频电压高于常值，这降低了导体损耗","馈线中的驻波致使平均射频电流高于常值，这降低了介质损耗"],"a":[0,1],"e":"SWR即电压驻波比，3:1表示馈线各处最大与最小峰值电压之比为3:1（A），电流的驻波比同样为3:1（B）。驻波只会增加导体与介质损耗，不会降低损耗，C、D说法相反。","m":"驻波比就是电压驻波比","g":""},{"i":"A-470","j":"LX","p":"3.3.2","q":"多数发射机都在 SWR超过一定值时降低输出功率。这是为了：","o":["保护发射机中的功率半导体器件","防止烧断供电线路中的保险丝","防止传输线上的驻波超过限值","防止发射出去的无线电波带有过大的驻波"],"a":[0],"e":"SWR过高时功放管承受的电压/电流应力剧增，易烧毁末级功率半导体器件，发射机自动降功率是保护电路动作。防止烧保险、限制驻波都不是直接目的；D的“电波带驻波”概念错误。","m":"SWR高降功率，保住末级管","g":""},{"i":"A-471","j":"LK1188","p":"3.3.2","q":"用同轴电缆连接天线时，为什么驻波比趋于 1:1为好？","o":["降低电缆的损耗，使射频能量更有效地传输","防止屏蔽层的外层辐射能量，导致射频干扰（RFI）","延长天线的使用寿命","延长发信机的使用寿命"],"a":[0],"e":"驻波意味着能量在馈线中来回反射，每次往返都叠加导体与介质损耗；SWR趋近1:1时一次传输的能量最多、损耗最低。B的屏蔽层外层辐射是共模电流问题，C、D的寿命说法均非主因。","m":"驻波小，馈线损耗少","g":""},{"i":"A-472","j":"LK1222","p":"3.3.2","q":"以下哪种情况可能导致业余发信机显示的驻波比不稳定？","o":["发信机、馈线或天线某处接触不良","发信机采用相位调制","发信机过调制","馈线温度过高"],"a":[0],"e":"接触不良会使连接点阻抗随机变化，反射系数随之抖动，SWR显示忽高忽低。调制方式、过调制影响的是信号本身而非匹配；馈线温度变化缓慢，不会导致读数不稳定。","m":"驻波乱跳，先查接触不良","g":""},{"i":"A-473","j":"LK1223","p":"3.3.2","q":"SSB通联时，即使天馈系统没有故障，有时候 SWR显示也不稳定。这是因为：","o":["SSB话音的幅度变化本质上影响测量的稳定性。改用 CW方式进行测量效果更好","SSB话音包含幅度与相位两种信息，并非所有天线均能同时给出稳定的响应","出现这种情况是因为发信机过调制，应调整话筒增益以解决","出现这种情况说明发信机出了故障，应停机检修"],"a":[0],"e":"SSB是抑制载波的话音信号，无话音时几乎无功率输出，SWR电桥得不到稳定激励故读数跳动；改用恒包络的CW载波测量才能得到稳定读数。这不是过调制也不是故障。","m":"SSB测驻波，改用CW载波","g":""},{"i":"A-474","j":"LK0701","p":"3.3.2","q":"我们都知道发射机与天线间的馈线应当与天线阻抗匹配。否则，馈线中的驻波会使沿线各处的电压和电流周期性起伏。然而，业余电台所用的发射机与电网中的发电机同属交流电源，我们却从未在连到电网的电线中观察到驻波现象。这是为什么？","o":["电网供电的频率很低，导线长度与波长相比微不足道，驻波现象不明显而已","业余电台所用的馈线和电网中的电线工作原理不同，所以现象不尽相同","适用于供电技术和业余无线电的电学理论本质不同，所以现象自然不同","电网的供电能力远超发射机所能提供的电功率，这就迫使线路各处电压趋同"],"a":[0],"e":"驻波是否明显取决于导线长度与波长的比值：50Hz市电波长约6000公里，导线长度可忽略不计，反射波与入射波几乎同相，驻波现象观察不到。馈线与电线遵循同一电磁理论，并无本质不同。","m":"市电波长六千公里，线太短看不见驻波","g":""},{"i":"A-475","j":"LK1218","p":"3.3.3","q":"对于业余无线电通信，最适合的同轴电缆特性阻抗为：","o":["50欧姆","75欧姆","93欧姆","300欧姆"],"a":[0],"e":"业余无线电设备（收发信机、天线、功放）的射频接口统一按50欧姆设计，馈线用50欧同轴才能全程匹配。75欧是电视/有线系统，93欧、300欧另有专用场合。","m":"业余电台馈线一律50欧","g":""},{"i":"A-476","j":"LK1219","p":"3.3.3","q":"传输线具有多种类型，但是为什么架设业余电台通常选用同轴电缆？","o":["因为它易于使用，与架设环境之中其他物体间的互耦也很低","因为它的损耗比其他任何种类的馈线都低","因为相比其他馈线，它可以传输更大的功率","因为很明显，它比其他任何馈线都便宜"],"a":[0],"e":"同轴电缆的外导体屏蔽使电磁场约束在内外导体之间，与周围物体互耦很低，布线随意且不受环境影响，这是业余架设首选它的主因。它的损耗和功率容量并非各类馈线中最好的，也不一定最便宜。","m":"同轴屏蔽好，布线不怕扰","g":""},{"i":"A-477","j":"LK0910","p":"3.3.3","q":"在为业余电台选购用作天线馈线的同轴电缆时应关注什么电气参数？","o":["特性阻抗","指定频率下每百米的传输损耗","芯线的截面积和最大额定电流","电介质的耐压和最高允许温升"],"a":[0,1],"e":"选馈线关键看两项：特性阻抗（必须与系统50欧匹配）和工作频率下的单位长度损耗（决定有效功率）。芯线截面积/电流、介质耐压温升是次要的工程参数，不是选型首要依据。","m":"买馈线看阻抗和损耗","g":""},{"i":"A-478","j":"LK1217","p":"3.3.3","q":"我们都知道要为业余电台选配损耗较低的馈线。但是，馈线的损耗会导致什么问题？","o":["发信功率降低","收信信噪比下降","驻波比的测量值永远高于 1:1","发出的信号失真"],"a":[0,1],"e":"馈线损耗是双向的：发射时吃掉一部分输出功率（A），接收时在放大前先衰减信号、直接恶化信噪比（B）。损耗不会改善SWR读数，更不会引起信号失真。","m":"馈线损耗：发吃功率，收吃信噪比","g":""},{"i":"A-479","j":"LK1189","p":"3.3.3","q":"受潮是同轴电缆失效损坏的主要原因。湿气渗透会导致：","o":["介质损耗变大","屏蔽层或芯线氧化、锈蚀，甚至断路","速度因子逐渐大于 1","驻波比越来越小于 1"],"a":[0,1],"e":"湿气渗入使介质损耗角增大、损耗上升（A），并导致屏蔽层/芯线氧化锈蚀乃至断路（B）。速度因子恒小于1不会反超；SWR只会变差不会小于1，C、D违背物理常识。","m":"电缆受潮=损耗大+锈断路","g":""},{"i":"A-480","j":"LK1190","p":"3.3.3","q":"将同轴电缆装于室外时，为什么要求电缆外皮（护套）能够耐受紫外线？","o":["如果电缆护套被紫外线破坏，电缆就会受潮损坏","紫外线会激励非线性导行模式，导致互调和谐波发射","紫外线会与射频信号相互混频，导致相当复杂的宽带干扰","紫外线会促使电缆升温，并因此增加电缆的功率损耗"],"a":[0],"e":"紫外线老化使护套龟裂，雨水湿气随之渗入，造成电缆受潮失效；这才是要求护套耐紫外线的真正原因。B、C的互调混频、D的升温损耗都不是紫外线的作用机理。","m":"护套怕晒，晒裂就进水","g":""},{"i":"A-481","j":"LK1191","p":"3.3.3","q":"相比填充有机介质的同轴电缆，空气介质同轴电缆的劣势是什么？","o":["空气介质同轴电缆需要特别措施来防止湿气渗透","空气介质同轴电缆只能用于 30MHz以下业余频段","空气介质同轴电缆的每百米损耗太大","空气介质同轴电缆不能在冰点以下工作"],"a":[0],"e":"空气介质同轴的内外导体靠绝缘子支撑，空气腔一旦进水损耗剧增，故必须采取充气、密封等防潮措施。它的损耗其实更低、可用频率更高，并无B、C、D的限制。","m":"空气介质线，防潮是命门","g":""},{"i":"A-482","j":"LK1220","p":"3.3.3","q":"如果通过同轴电缆的信号频率升高，则同轴电缆的","o":["传输损耗增加","反射功率升高","特性阻抗变高","输入驻波比变大"],"a":[0],"e":"频率升高时趋肤效应加剧、介质损耗角损耗增大，同轴电缆的传输损耗随之增加。特性阻抗由结构决定基本不变；反射功率和输入SWR取决于匹配，与频率无必然关系。","m":"频率越高，电缆吃得越多","g":""},{"i":"A-483","j":"LK1224","p":"3.3.3","q":"以下给出了一些同等外径的馈线。其中哪一种在 VHF/UHF频段损耗更低？","o":["空气介质同轴硬电缆","独立屏蔽分组双绞线","50欧姆同轴软电缆","75欧姆同轴软电缆"],"a":[0],"e":"空气介质的损耗角远小于实心聚乙烯等有机介质，同等外径下空气介质同轴硬电缆在VHF/UHF损耗最低。双绞线根本不用于射频馈线；软电缆的实心介质损耗更大。","m":"VHF/UHF低损耗，首选空气硬电缆","g":""},{"i":"A-484","j":"LK1221","p":"3.3.3","q":"对于 400MHz或更高频率的信号，应当优先选用的同轴电缆连接器是：","o":["N型连接器","M型连接器","RS-213型连接器","DB-23型连接器"],"a":[0],"e":"M型（UHF/SO-239）连接器在400MHz以上阻抗不连续、损耗剧增；N型连接器为恒阻抗精密结构，适用于400MHz及以上。RS-213是电缆型号，DB-23是多针数据接头，均不对。","m":"400M以上换N头，M头到顶了","g":""},{"i":"A-485","j":"LX","p":"3.3.3","q":"关于M 型同轴电缆连接器，以下说法正确的是：","o":["这种连接器广泛应用于 HF和 VHF通信系统","这种连接器使用了先进的螺纹式锁紧技术，防水防盗","这种连接器使用了卡式锁紧技术，便于快拔快插","这种连接器制造成本很高，通常用于微波通信系统"],"a":[0],"e":"M型（俗称UHF接头，公头PL-259/母座SO-239）结构简单便宜，广泛用于HF和VHF业余电台。它用螺纹锁紧但不防水；卡式快插的是BNC；微波用的是N/SMA等精密接头。","m":"M头便宜量大，HF/VHF标配","g":""},{"i":"A-486","j":"LK0988","p":"3.3.4","q":"关于垂直天线，以下说法正确的是：","o":["该天线发射垂直极化波，电场与地面垂直","垂直天线是全向天线，其 H面方向图是全向的","该天线发射垂直极化波，磁场与地面垂直","垂直天线是全向天线，其 E面方向图是全向的"],"a":[0,1],"e":"垂直天线辐射垂直极化波，电场矢量垂直于地面（A）；其H面（水平面）方向图为正圆、全向（B）。C说反了（磁场平行地面）；D说反了（E面是垂直面，有方向性）。","m":"垂直天线电场竖，H面全向","g":""},{"i":"A-487","j":"LK0989","p":"3.3.4","q":"关于水平极化偶极天线，以下描述正确的是：","o":["通过该天线发射的电磁波，电场平行于地面","该天线水平面上的（E面）方向图呈“8”字展开","通过该天线发射的电磁波，电场垂直于地面","该天线垂直面上的（H面）方向图呈“8”字展开"],"a":[0,1],"e":"水平偶极子辐射水平极化波，电场平行于地面（A）；其E面即振子所在的水平面，方向图呈8字形（B）。C、D把极化和E/H面都说反了。","m":"水平偶极电场横，E面8字","g":""},{"i":"A-488","j":"LK0950","p":"3.3.4","q":"甲、乙业余电台相距 10千米，均使用 1/2波长水平偶极天线进行 UHF通联。现其中一方改用 1/2波长垂直偶极天线，则改变前后的通信效果有什么不同？","o":["通信效果变差","通信效果不变","通信效果变好","通信效果的变化不确定"],"a":[0],"e":"原来双方都是水平极化、匹配良好；一方改垂直后极化正交，理论上产生约20dB以上的极化隔离损耗，通信效果明显变差。","m":"极化一正交，信号掉一大截","g":""},{"i":"A-489","j":"LK0951","p":"3.3.4","q":"甲、乙业余电台相距 10千米，分别使用 1/2波长水平和垂直偶极天线进行 UHF通联。现双方都改用 1/2波长垂直偶极天线，则改变前后的通信效果有什么不同？","o":["通信效果变好","通信效果不变","通信效果变差","通信效果的变化不确定"],"a":[0],"e":"原来一方水平、一方垂直，极化失配损耗很大；双方都改垂直后极化一致，极化损耗消失，通信效果变好。","m":"极化对齐了，效果就上来了","g":""},{"i":"A-490","j":"LK0952","p":"3.3.4","q":"甲、乙业余电台相距 10千米，分别使用 1/2波长水平和垂直偶极天线进行 UHF通联。现双方都改用 1/2波长水平偶极天线，则改变前后的通信效果有什么不同？","o":["通信效果变好","通信效果不变","通信效果变差","通信效果的变化不确定"],"a":[0],"e":"原来一水平一垂直、极化失配；双方都改水平后极化一致，损耗消除，通信效果变好。与上一题同理，只是统一到了水平极化。","m":"不管横竖，一致就好","g":""},{"i":"A-491","j":"LK0953","p":"3.3.4","q":"甲、乙业余电台相距 10千米，分别使用左旋圆极化和右旋圆极化天线彼此对指进行 UHF通联。现双方都改用左旋圆极化天线，则改变前后的通信效果有什么不同？","o":["通信效果变好","通信效果不变","通信效果变差","通信效果的变化不确定"],"a":[0],"e":"原来左旋对右旋、旋向相反几乎收不到；双方都改左旋后旋向一致，极化完全匹配，通信效果变好。","m":"旋向从反变同，效果变好","g":""},{"i":"A-492","j":"LK0954","p":"3.3.4","q":"甲、乙业余电台相距 10千米，分别使用左旋圆极化和右旋圆极化天线彼此对指进行 UHF通联。现双方都改用右旋圆极化天线，则改变前后的通信效果有什么不同？","o":["通信效果变好","通信效果不变","通信效果变差","通信效果的变化不确定"],"a":[0],"e":"原来左旋对右旋失配；双方都改右旋后旋向一致，极化匹配，通信效果变好。","m":"旋向统一，满血接收","g":""},{"i":"A-493","j":"LK0955","p":"3.3.4","q":"甲、乙业余电台相距 10千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行UHF通联。现乙台改用半波长垂直极化天线，则改变前后的通信效果有什么不同？","o":["通信效果不变","通信效果变差","通信效果变好","通信效果的变化不确定"],"a":[0],"e":"圆极化天线接收线极化波恒有3dB极化损耗，与线极化是水平还是垂直无关；乙台由水平改垂直，损耗仍是3dB，故通信效果不变。","m":"圆对线极化，横竖都是3dB","g":""},{"i":"A-494","j":"LK0956","p":"3.3.4","q":"甲、乙业余电台相距 10千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行UHF通联。现甲台改用右旋圆极化天线，则改变前后的通信效果有什么不同？","o":["通信效果不变","通信效果变差","通信效果变好","通信效果的变化不确定"],"a":[0],"e":"圆极化对线极化的3dB损耗与圆极化的左/右旋向无关；甲台改旋向后仍是圆对线，损耗不变，通信效果不变。","m":"旋向变了，圆对线照旧3dB","g":""},{"i":"A-495","j":"LK0957","p":"3.3.4","q":"甲、乙业余电台相距 10千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行UHF通联。现乙台改用右旋圆极化天线，则改变前后的通信效果有什么不同？","o":["通信效果变差","通信效果变好","通信效果不变","通信效果的变化不确定"],"a":[0],"e":"原来左旋圆极化对水平线极化，损耗约3dB；乙台改右旋圆极化后变成左旋对右旋、旋向相反，损耗剧增，通信效果变差。","m":"旋向一反，信号全丢","g":""},{"i":"A-496","j":"LK0958","p":"3.3.4","q":"甲、乙业余电台相距 10千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行UHF通联。现乙台改用左旋圆极化天线，则改变前后的通信效果有什么不同？","o":["通信效果变好","通信效果变差","通信效果不变","通信效果的变化不确定"],"a":[0],"e":"原来左旋圆极化对水平线极化有3dB损耗；乙台改左旋圆极化后旋向一致、极化完全匹配，损耗消失，通信效果变好。","m":"旋向相同，损耗清零","g":""},{"i":"A-497","j":"LK0959","p":"3.3.4","q":"甲、乙业余电台相距 10千米，分别使用左旋圆极化和右旋圆极化天线彼此对指进行 UHF通联。现双方均改用半波长水平偶极天线，则改变前后的通信效果有什么不同？","o":["通信效果变好","通信效果不变","通信效果变差","通信效果的变化不确定"],"a":[0],"e":"原来左旋对右旋、旋向相反，几乎无法通信；双方都改半波水平偶极后极化一致，损耗消除，通信效果变好。","m":"从旋向相反到极化一致，变好","g":""},{"i":"A-498","j":"LK0990","p":"3.3.4","q":"假设接收和发射天线均使用半波长偶极天线，则在地面台站间的近距离通联中，接收和发射天线的最佳极化方式应当安排为：","o":["接收和发射天线均位于垂直于两台站连线的平面内，极化保持一致","接收和发射天线均位于垂直于两台站连线的平面内，极化彼此正交","接收和发射天线的极化应当平行于两台站之间的连线","发射天线垂直极化，接收天线的极化应当平行于两台站之间的连线"],"a":[0],"e":"偶极天线辐射最强的方向是垂直于振子的平面；要让两台站互在对方最强辐射方向上，两副天线都应位于垂直于连线的平面内且极化一致。极化正交或沿连线极化都会带来巨大损耗。","m":"天线垂直连线平面，极化同向最强","g":""},{"i":"A-499","j":"LK0992","p":"3.3.4","q":"右旋极化波是指在垂直于传播方向的任意平面上，沿传播方向观察时，电场矢量为随时间向右（顺时针）旋转的椭圆或圆极化波。如果地面上某业余电台在观测业余卫星时发现从卫星到达该台的无线电波的电场是顺时针旋转的，则该信号的极化方式为：","o":["左旋椭圆极化或圆极化","右旋椭圆极化或圆极化","垂直极化","水平极化"],"a":[0],"e":"极化旋向按“沿传播方向观察”定义。卫星信号向地面传播（向下），地面观察者是迎着波前看，看到的顺时针相当于顺传播方向看的逆时针，故为左旋。直接按看到的顺时针判右旋会搞反。","m":"迎波看顺时针，实为左旋","g":""},{"i":"A-500","j":"LK0993","p":"3.3.4","q":"在视距通联中，已知发射天线为指向接收点的左旋圆极化天线，接收天线的最佳极化方式为：","o":["指向发射点的左旋圆极化","指向发射点的右旋圆极化","垂直极化","水平极化"],"a":[0],"e":"圆极化通信要求收发旋向一致才能完全匹配；发射是左旋圆极化，接收也应使用指向发射点的左旋圆极化天线。右旋会正交失配，线极化则固定损失3dB。","m":"圆极化收发，旋向必须相同","g":""},{"i":"A-501","j":"LK0994","p":"3.3.4","q":"某卫星下行链路采用右旋圆极化天线，从北向南飞行，天线始终指向地球的南极。如果地面上某业余电台采用圆极化天线自动跟踪该卫星，则该台所用天线的最佳极化方式应当为：","o":["卫星过顶前为右旋圆极化，过顶后为左旋圆极化","卫星过顶后为右旋圆极化，过顶前为左旋圆极化","最佳方向始终为右旋圆极化","最佳方向始终为左旋圆极化"],"a":[0],"e":"卫星天线始终指向南极（地心方向），过顶前后地面台相对于卫星的观察方向反转了180°，同一物理旋向在过顶前后看起来相反；为保持匹配，过顶前用右旋、过顶后改左旋。","m":"卫星过顶，旋向翻面","g":""},{"i":"A-502","j":"LK0995","p":"3.3.4","q":"已知某卫星下行信号的发射天线是指向地面的偶极天线。由于卫星不断旋转，地面台站所收电波的极化方向就会不断变化。为了不至极化问题致使接收中断，接收天线可以是：","o":["指向卫星的右旋或左旋圆极化天线","垂直极化天线","水平极化天线","极化方向平行于卫星与地面电台之间连线的天线"],"a":[0],"e":"卫星旋转使线极化方向不断变化，线极化接收会周期性正交中断；圆极化天线对任意线极化方向恒有3dB稳定耦合，是卫星通信的常用对策。垂直/水平极化都会遭遇同样问题。","m":"极化乱转，用圆极化来收","g":""},{"i":"A-503","j":"LK0946","p":"3.3.4","q":"某业余电台使用半波垂直偶极天线通联时，对方所收信号的强度为 S4。现发射功率不变，发信方改用增益为 8.15dBi的八木天线（最大辐射方向和极化均不变），则对方所收信号的强度变为：【提示：收信机信号强度指示从 S1至 S9每档增加 6dB】","o":["S5","S6","S7","S8"],"a":[0],"e":"半波垂直偶极增益2.15dBi，八木8.15dBi，相差6dB；S表每档6dB，故S4升1档变为S5。注意先减去原天线的2.15dBi再换算档位。","m":"6dB升一档，S4变S5","g":""},{"i":"A-504","j":"LK0947","p":"3.3.4","q":"某业余电台使用半波长垂直偶极天线发射时，对方所收信号的强度为 S4。现发射功率不变，发信方改用增益为 12dBd的八木天线（最大辐射方向和极化均不变），则对方所收信号的强度变为：【提示：收信机信号强度指示从 S1至 S9每档增加 6dB】","o":["S6","S5","S7","S8"],"a":[0],"e":"原天线增益2.15dBi，12dBd=14.15dBi，相差12dB；每6dB一档，S4升2档变为S6。dBd须先换算成dBi再与原天线比较。","m":"12dB升两档，S4变S6","g":""},{"i":"A-505","j":"LK0948","p":"3.3.4","q":"两位业余爱好者使用半波长垂直偶极天线相互通联，双方所收信号的强度均为 S4。现双方发射功率不变，都改用增益为 8.15dBi的八木天线（最大辐射方向和极化均不变）再次联络，则双方信号的强度变为：【提示：收信机信号强度指示 S1至 S9每档增加 6dB】","o":["S6","S4","S5","S7"],"a":[0],"e":"每方换8.15dBi八木相对2.15dBi偶极各增6dB，收发双方增益都计入链路，总改善12dB；每档6dB，S4升2档变为S6。只算单边会误得S5。","m":"双边各6dB，共升两档到S6","g":""},{"i":"A-506","j":"LK0971","p":"3.3.5","q":"即便是在辽阔的平原或广袤的戈壁，我们所收本地 VHF/UHF信号的强度也会伴随设备的移动而发生周期性的变化。主要原因是：","o":["来自直射和地面反射等多个路径的无线电波相互干涉，相消或相长（多径效应）","发信和收信地点间的气流导致电波传播路径弯曲，发生频率漂移（多普勒效应）","无论收信发信，地面各处的电导率不尽相同会导致设备移动时的接地电阻变化","发信过程中，设备与大地间分布电容的改变导致天线失谐，发射功率随之改变"],"a":[0],"e":"直射波与地面反射波等多径分量到达接收点时相位不同，相互干涉相长或相消；移动设备改变了各路径的相对相位，信号强度便周期性起伏。多普勒、接地电阻、天线失谐都不是主因。","m":"信号忽强忽弱，多径干涉作怪","g":""},{"i":"A-507","j":"LK1065","p":"3.3.5","q":"在 VHF/UHF频段通联时的一个现象，如果远方电台给出的信号报告很差，则仅需移动几步或将工作频率改变数十千赫就可能显著改善通信效果。这是因为：","o":["多径传播。经不同路径达到天线的电波存在相位和幅度差异，相互干涉，相消或相长","发射机与接收机之间的距离，以及工作频率的变化都会显著改变路径损耗","大气扰动影响","地磁活动影响"],"a":[0],"e":"多径干涉的相长/相消取决于各路径的相位差，移动几步或改变几十千赫都会显著改变相位关系，使接收点从相消谷点移出。这是多径衰落的典型特征，与路径损耗、大气扰动、地磁无关。","m":"挪几步就好转，典型多径衰落","g":""},{"i":"A-508","j":"LK1103","p":"3.3.5","q":"多径传播对 UHF或 VHF波段数据通信的影响是：","o":["可能使误码率上升","如果是 FM通联，则影响微不足道，不可察觉","随着传播路径的增加，数据通信速率线性减小","随着传播路径的增加，数据通信速率线性增加"],"a":[0],"e":"多径造成码间干扰和信号深衰落，直接推高数据通信的误码率。FM有一定的抗幅度衰落能力但并非无影响；多径不改变数据速率，更不会线性增减速率。","m":"多径推高误码率","g":""},{"i":"A-509","j":"LK0812","p":"3.3.5","q":"使用 VSB方式进行 ATV通信时，即使信号相对较强，有时所收图像的边缘也有重影。这是因为：","o":["多径传播。来自不同路径的信号到达接收天线的时延不同，造成重影","发射天线的 VSWR过高。如果信号在馈线中多次往返于发射机和天线，会造成重影","天线的极化配置出错。极化不同的信号同时到达天线，导致重影","遭遇了重放干扰。或许是某中继台也转发了这个信号，其到达接收天线，导致重影"],"a":[0,1],"e":"不同路径信号到达时间不同，延迟的信号形成重影（A）；若天线VSWR过高，信号在馈线中多次往返反射，同样产生延迟重影（B）。极化错误只会衰减信号，重放干扰是另一回事。","m":"图像重影，查多径和馈线反射","g":""},{"i":"A-510","j":"LK1068","p":"3.3.6","q":"决定超短波视距传播距离极限的主要因素是：","o":["发射天线和接收天线距地面的相对高度","发射天线和接收天线距海平面的绝对高度","发射天线和接收天线的挂高波长比，即，离地高度除以波长","发射天线和接收天线的增益"],"a":[0],"e":"超短波视距传播的极限距离由地球曲率决定，取决于收发天线相对地面的高度（越高视距越远）。绝对海拔、高度波长比、天线增益都不直接决定几何视距。","m":"视距多远，看天线离地多高","g":""},{"i":"A-511","j":"LK1104","p":"3.3.6","q":"有时，相隔数百千米的业余电台可以实现 VHF/UHF超视距直接联络。可能的原因是：","o":["信号的传播路径中出现了大气波导现象","有飞行器在空中反射了电波","降雨增加了大地电导率，增强了电波传播","每当冬季，植被的减少都有利于电波传播"],"a":[0],"e":"数百千米的VHF/UHF超视距联络最常见的原因是大气波导把电波约束在逆温层中远距离传播。飞机反射、降雨、植被都不是这种稳定超视距传播的主因。","m":"数百公里超视距，想大气波导","g":""},{"i":"A-512","j":"LK1117","p":"3.3.6","q":"有时，我们可以在 6米或 2米业余波段中收到上千千米外的“超视距传播”信号。这与下列哪种现象密切相关？","o":["突发 E层的传播","流星余迹反向散射","D层的吸收所致","灰线传播"],"a":[0],"e":"6米/2米波段上千千米的突发超视距传播是突发E层（Es）反射的典型表现，Es层电子密度高、可反射VHF。流星余迹距离较短且短暂；D层只吸收；灰线是HF现象。","m":"千公里VHF突发，突发E层反射","g":""},{"i":"A-513","j":"LK1120","p":"3.3.6","q":"是什么导致了对流层的大气波导现象？","o":["大气高空逆温","太阳黑子和/或太阳耀斑","飓风或龙卷风所致的上升气流","雷暴时大量闪电所产生的等离子体"],"a":[0],"e":"高空大气逆温使折射率随高度异常变化，形成能捕获电波的波导层。太阳活动、飓风、雷暴等离子体都不是对流层波导的成因。","m":"高空逆温造就大气波导","g":""},{"i":"A-514","j":"LK1116","p":"3.3.6","q":"如果你收到了一个上千千米外的 VHF信号，最可能的原因是：","o":["信号经电离层的突发 E层反射而来","信号由微波接力电台合力 QSP过来","信号被附近的雷雨区反射而来","信号经宇宙射线的电离路径传导过来"],"a":[0],"e":"收到上千千米外的VHF信号，最可能的是突发E层反射，这是VHF DX最常见的传播模式。微波接力QSP、雷雨反射、宇宙射线都不是常规解释。","m":"VHF千公里DX，首选突发E层","g":""},{"i":"A-515","j":"LK1118","p":"3.3.6","q":"有时，VHF/UHF业余波段中可能出现远达 500千米的“超视距传播”信号。这与下列哪种现象密切相关？","o":["对流层散射","D层折射","F2层折射","法拉第旋转"],"a":[0],"e":"约500千米量级的VHF/UHF超视距传播与对流层散射密切相关，散射体将部分能量送到视距之外。D层/F2层反射主要影响HF，法拉第旋转影响极化而非距离。","m":"五百公里超视距，对流层散射","g":""},{"i":"A-516","j":"LK0815","p":"3.6.1","q":"自制业余无线电发射设备，在经无线电检测机构检验合格并取得电台执照之前，应在调测时在设备的天线端口连接（或在串联必要的仪表之后连接）：","o":["假负载","VSWR严格等于 1:1的驻波天线","VSWR严格等于 1:1的行波天线","专门用于测试的标准环形天线"],"a":[0],"e":"未取得执照的自制发射设备调测时绝不能辐射到空中，应接假负载把射频功率耗散为热量以便测量。接任何天线都会实际发射，未验执照前不允许。","m":"调测未领照，天线口接假负载","g":""},{"i":"A-517","j":"LK0418","p":"3.6.1","q":"在无线电发射机中，调制器的作用是：","o":["以原始调制信号控制射频载波的幅度、频率和相位参数","以电能转换效率最高的方式控制线性射频放大器的工作点","调整天馈系统的参数，实现阻抗匹配","自动控制发射信号的频谱，将其保持在核准的必要带宽内"],"a":[0],"e":"调制器用原始信号去控制载波的幅度、频率或相位，分别形成调幅、调频、调相。它不负责放大器工作点、天馈匹配或频谱带宽的自动控制。","m":"调制控载波，幅频相三参","g":""},{"i":"A-518","j":"LK0422","p":"3.6.1","q":"保证业余无线电通信接收机优良接收能力的主要因素是：","o":["良好的抗干扰能力","足够高的整机增益","尽量低的本机噪声","尽量小的信号失真"],"a":[0,1,2,3],"e":"接收机优良接收能力需抗干扰强、增益足够、本机噪声低、信号失真小，四者缺一不可：增益不足听不见，噪声大淹没弱信号，失真大难辨认，抗扰差易被阻塞。故全选。","m":"抗扰增益低噪低失真，四全才优","g":""},{"i":"A-519","j":"LK0423","p":"3.6.1","q":"接收机解调器的作用是：","o":["从接收到的已调射频信号中分离出原始调制信号","对接收到的射频信号进行宽带线性放大","对接收到的射频信号进行与必要带宽相匹配的选频放大","从接收到的已调制射频信号中提取出载波分量"],"a":[0],"e":"解调器即检波器，任务是从已调射频或中频信号中还原原始调制信号。宽带放大、选频放大是放大器和滤波器的事，提取载波只是某些同步解调的辅助环节。","m":"解调还原原信号，已调变回基带","g":""},{"i":"A-520","j":"LK0424","p":"3.6.1","q":"选用解调器的主要应考因素是：","o":["尽量忠实地还原原始调制信号","尽量对已调射频信号加以放大","尽量提升已调射频信号中的载频分量","尽量补偿接所收射频信号的频率偏移"],"a":[0],"e":"选解调器首要看能否忠实还原原始信号，即失真小、与调制方式匹配。放大能力、提升载频或补偿频偏不是解调器的主要考量。","m":"解调器选型，先看还原忠实","g":""},{"i":"A-521","j":"LK0496","p":"3.6.1","q":"亚音频静噪系统（CTCSS）所用的声调大体位于音频中的什么范围？","o":["67-250.3Hz","16Hz-20kHz","16kHz-20kHz","220Hz-2503Hz"],"a":[0],"e":"CTCSS亚音频单音在67.0至250.3Hz范围，低于话音通带而不被听见，用于控制静噪开启。它不是完整音频16Hz至20kHz，也不是超声或把数值错位成220至2503Hz。","m":"亚音频六七起，二五零点三止","g":""},{"i":"A-522","j":"LK0681","p":"3.6.1","q":"对于比较考究的接收机，其说明书中常常列出一项“通带矩形系数”或“通带形状系数”指标，是用来描述：","o":["带通滤波器频率特性曲线两侧斜坡的陡峭程度","矩形波信号通过滤波器后波形两侧的陡峭程度","矩形波信号通过滤波器后谐波成分的损失程度","带通晶体滤波器中石英晶体的切割方向和形状"],"a":[0],"e":"通带矩形系数即形状系数，用不同衰减处带宽之比描述滤波器边沿陡峭程度，越接近1越矩形、选择性越好。与矩形波波形、谐波损失或晶体切割无关。","m":"矩形系数看边沿，越小越陡峭","g":""},{"i":"A-523","j":"LK0682","p":"3.6.1","q":"根据说明书给出的技术指标，两台业余无线电接收机在 USB方式下选择带宽为 2.7kHz的滤波器时具有不同的“通带矩形系数”。接收机 A的“60dB带宽对 6dB带宽的矩形系数”为 3.8，接收机 B的为 5。由此可得出结论：","o":["A机对邻近频道干扰的抑制能力比 B机强","A机对邻近频道干扰的抑制能力比 B机差","A机对镜像频率干扰的抑制能力比 B机强","A机对偏离工作频率±10kHz以外的干扰信号的抑制能力比 B机强"],"a":[0],"e":"矩形系数越小滤波器边沿越陡，邻近频道抑制越强。A为3.8小于B的5，故A邻道抑制更强；这不直接说明镜像抑制或±10kHz外抑制。","m":"3.8小于5，A机邻道更强","g":""},{"i":"A-524","j":"LK0746","p":"3.6.1","q":"接收机前置放大器的主要作用是：","o":["降低接收机内部噪声的影响","提高接收机最终的音频输出功率电平","提高接收机音频输出的保真度","提高接收机的动态范围"],"a":[0],"e":"前置放大器放在接收前端以低噪声放大弱信号，降低后级电路噪声对整机噪声系数的影响，提高灵敏度。它不提高最终音频功率，也不是改善保真度或动态范围，前放过强反而可能压缩动态。","m":"前放压低本噪，灵敏度提高","g":""},{"i":"A-525","j":"LK0783","p":"3.6.1","q":"进行 FM话音通联时，我们能否单凭接收机中传出的对方的声音大小来准确判断对方的信号有多强？","o":["不能。鉴频器所解调的声音，其大小仅取决于中频信号的频偏，与中频信号的幅度无关。况且，中频信号在进入鉴频器之前早已被限幅电路切齐，已无法鉴别强弱","不能。信号越强，自动增益控制的起控程度就越深。增益的急剧下降反而会压低音量","能。最终的信号就是经过放大处理的原始射频信号，当然是信号越强声音越大","能。调频信号的特点是信号越强频偏越大，解调之后的声音当然也越大"],"a":[0],"e":"FM经限幅后幅度信息被切除，鉴频输出只取决于频偏大小，与信号幅度无关，故不能凭音量判断信号强弱。AGC压音量、强信号频偏更大等说法都不符合FM原理，FM频偏由调制决定。","m":"调频限幅去幅度，音量不报强弱","g":""},{"i":"A-526","j":"LK0788","p":"3.6.1","q":"用设置在 NFM方式的对讲机接收WFM信号，效果为：","o":["可以听到信号。如果调制信号幅度较大或音调较高，会听到明显的非线性失真","听不到信号。但是一旦接收到了信号，调频方式所特有的强烈噪声仍然会消失","可以正常听到信号。但是声音的高音频部分衰减较大，缺乏高音","可以正常听到信号，只是声音比较小"],"a":[0],"e":"窄带接收机的中频带宽和鉴频线性范围容不下宽带调频的大频偏，信号幅度大或音调高时频偏更大，便冲出线性区产生明显非线性失真。宽带信号并非完全收不到，失真也不同于单纯音量小或高音衰减。","m":"宽进窄出必失真","g":""},{"i":"A-527","j":"LK0789","p":"3.6.1","q":"用设置在WFM方式的对讲机接收 NFM信号，效果为：","o":["可以正常听到信号，只是声音比较小","可以听到信号。如果调制信号幅度较大或音调较高，会听到明显的非线性失真","听不到信号。但是一旦接收到了信号，调频方式所特有的强烈噪声仍然会消失","可以正常听到信号。但是声音的高音频部分衰减较大，缺乏高音"],"a":[0],"e":"窄带调频的频偏远小于宽带鉴频器的线性范围，所以能正常解调，只是鉴频输出正比于频偏，频偏小则声音小。它不会像大信号冲出窄带通道那样产生明显失真。","m":"窄进宽出声变小","g":""},{"i":"A-528","j":"LK0790","p":"3.6.1","q":"没有信号时，调频接收机会输出一种强烈的沙沙声。关于这种噪声，以下描述正确的是：","o":["天线收到的 QRN与机内电路的固有噪声共同构成一种随机信号。该信号的随机相位变化经鉴频形成强烈的沙沙声。只是，该信号的随机幅度变化与沙沙声没有关系","由天线收到的 QRN的随机幅度变化经放大形成，其大小与 QRN的电压成正比","由天线收到的 QRN的随机幅度变化经放大形成，其大小与 QRN的电压的平方成正比","由天线收到的 QRN的随机幅度变化经放大形成，其大小与 QRN的电压的平方根成正比"],"a":[0],"e":"调频机先限幅再鉴频，限幅消除了随机幅度变化，随机相位变化却被鉴频器变成音频噪声，无信号时便成强烈沙沙声。它源于天线QRN与机内噪声，而非幅度变化经放大形成。","m":"限幅去幅度，相位成沙沙","g":""},{"i":"A-529","j":"LK1176","p":"3.6.1","q":"下列哪种电路可以解调 FM信号？","o":["鉴频器","限幅器","乘积检波器","混频器"],"a":[0],"e":"鉴频器把频率变化转换为幅度变化，正是调频信号的解调器件。限幅器只削平幅度，乘积检波器多用于SSB/AM，混频器只做频率变换。","m":"调频解调找鉴频","g":""},{"i":"A-530","j":"LK0791","p":"3.6.1","q":"什么是“鉴频”？","o":["对调频信号进行解调的过程称为鉴频","判断信号的频率是否超过允许的频率范围的过程称为鉴频","判断信号的频率是否发生了不应有的偏离或者漂移的过程称为鉴频","对调幅信号进行解调的过程称为鉴频"],"a":[0],"e":"鉴频专指对调频信号进行解调、还原调制信号的过程。判断频率是否越界或漂移属于频率监测，对调幅信号解调则称为检波。","m":"鉴频解调FM","g":""},{"i":"A-531","j":"LX","p":"3.6.1","q":"下列哪一项可以解调 AM信号？","o":["检波器","限幅器","鉴频器","反相器"],"a":[0],"e":"检波器能提取调幅波的包络，从而解调AM信号。限幅器会削掉承载信息的幅度变化，鉴频器针对FM，反相器只改变相位。","m":"AM解调靠检波","g":""},{"i":"A-532","j":"LK0792","p":"3.6.1","q":"什么是“检波”？","o":["对调幅信号进行解调的过程称为检波","检查信号的波形是否超过了允许的幅度范围的过程称为检波","检查信号的频率是否发生了不应有的偏离或者漂移的过程称为检波","对调频信号进行解调的过程称为检波"],"a":[0],"e":"检波专指对调幅信号进行解调、从包络中还原调制信号的过程。检查幅度或频率是否越限不是解调，对调频信号解调则称为鉴频。","m":"检波解调AM","g":""},{"i":"A-533","j":"LK1088","p":"3.6.1","q":"关于收发信机的 AGC功能，以下说法正确的有：","o":["AGC实现收信机自动增益控制，对中频信号进行检测并反馈控制，防止电路过载","进行基于 FSK或 PSK的数据通信时，关闭 AGC功能有可能提高弱信号的解码效果","进行太阳噪声测试的时候，需要关闭 AGC功能","AGC实现收信机自动音量控制，对音频电平进行检测并反馈控制，防止扬声器损坏"],"a":[0,1],"e":"AGC检测中频信号电平并反馈控制增益，使强信号不致使后级过载。FSK、PSK弱信号解码时关闭AGC可避免增益随噪声起伏，有时能改善解码；AGC不是检测音频、保护扬声器的音量控制。","m":"AGC控中频防过载","g":""},{"i":"A-534","j":"LK0840","p":"3.6.1","q":"学习现代通信技术或制作业余无线电作品时，我们经常遇到一种工作原理不同于超外差式收信机的“DC式收信机”。其中，缩写 DC是指：","o":["直接变换（Direct-Conversion），即接收到的射频信号在解调之前不做频率变换","直流（Direct Current），指直流电源供电的收信机","介质电容（Dielectric Capacitor），指收信机中用于调谐的电容器所用的特定介质","数字变频（Digital-Conversion），指接收到的射频信号经过了数字化的变频处理"],"a":[0],"e":"DC式收信机中的DC是Direct-Conversion，即直接变换：射频信号直接变到基带解调，解调前不经中频频率变换。它与直流供电、介质电容或数字变频无关。","m":"DC是直接变换","g":""},{"i":"A-535","j":"LX","p":"3.6.1","q":"接收机和发射机中常见的混频器有什么作用？","o":["频率变换。将信号的原始频率变换成另一个频率","混合式调音。将两个信号相互叠加，送往扬声器","变频调速。把直流电变成变频交流电以驱动天调","多频放大器。同时放大具有不同频率的多个信号"],"a":[0],"e":"混频器把输入信号与本振相乘并取差频或和频，将信号由原始频率搬移到另一频率。收发信机靠它实现变频，它不做音频混合、变频调速或单纯放大。","m":"混频就是搬频率","g":""},{"i":"A-536","j":"LK0847","p":"3.6.1","q":"在超外差式收发信机中，混频器的工作方式可分为“上变频”和“下变频”两种，具体指：","o":["中频频率高于输入频率的为上变频方式，中频频率低于输入频率的为下变频方式","输入频率高于中频频率的为上变频方式，输入频率低于中频频率的为下变频方式","本振频率高于输入频率的为上变频方式，本振频率低于输入频率的为下变频方式","输入频率高于本振频率的为上变频方式，输入频率低于本振频率的为下变频方式"],"a":[0],"e":"上、下变频以中频与输入频率的相对高低划分：中频高于输入为上变频，中频低于输入为下变频。判据不是本振与输入谁高谁低，本振位置取决于具体混频方案。","m":"中频更高是上变频","g":""},{"i":"A-537","j":"LK0845","p":"3.6.1","q":"超外差式业余收发信机的面板上经常设有选择中频滤波器带宽的控制部件。这些中频滤波器所抑制的干扰可以分类为：","o":["邻近频率干扰","镜像频率干扰","中频频率干扰","突发脉冲干扰"],"a":[0],"e":"中频滤波器带宽决定整机选择性，收窄带宽可滤除紧邻工作频率的信号，故抑制的是邻近频率干扰。镜像干扰靠前端预选滤波，脉冲干扰靠消噪电路处理。","m":"中频滤波挡邻频","g":""},{"i":"A-538","j":"LK0846","p":"3.6.1","q":"在超外差式业余收发信机中，负责抑制镜像频率干扰的部件是：","o":["变频级之前的波段预选滤波器","变频级之后的中频滤波器","中频放大级中的限幅电路","带有音调控制的音频输出电路"],"a":[0],"e":"镜像信号在混频后与有用信号落到同一中频，中频滤波器已无法区分，必须在变频级之前用波段预选滤波器先行抑制。限幅和音频电路都在其后，同样无能为力。","m":"镜频须在混频前挡","g":""},{"i":"A-539","j":"LK0841","p":"3.6.1","q":"超外差式收信机所收信号的频率要比本振频率低（或高）一个中频。然而，比本振频率高（或低）一个中频的另一个遥相对应的信号也可能经混频窜入中频通道，形成“镜像频率干扰”或“镜频干扰”。如果某对讲机的技术规格书给出的 VHF接收机第一中频为 45.05MHz，那么在 145.00MHz收到的镜频干扰可能来自：","o":["235.10MHz或 54.90MHz","190.05MHz或 99.95MHz","45.05MHz或 90.10MHz","90.10MHz或 180.20MHz"],"a":[0],"e":"镜频与有用频率相距两倍中频：145±2×45.05=145±90.10，得235.10MHz或54.90MHz。选项中只加减一个中频的是本振可能频率，不是镜频。","m":"镜频等于原频加减两倍中频","g":""},{"i":"A-540","j":"LK0842","p":"3.6.1","q":"超外差式收信机所收信号的频率要比本振频率低（或高）一个中频。然而，比本振频率高（或低）一个中频的另一个遥相对应的信号也可能经混频窜入中频通道，形成“镜像频率干扰”或“镜频干扰”。如果某对讲机的技术规格书给出 NFM方式时的第一中频为 47.25MHz，那么在 145.00MHz收到的镜频干扰可能来自：","o":["239.50MHz或 50.50MHz","192.25MHz或 97.75MHz","50.50MHz或 101.00MHz","151.50MHz或.202.00MHz"],"a":[0],"e":"镜频相距两倍中频：145±2×47.25=145±94.50，得239.50MHz或50.50MHz。只相差一个中频的频率是本振频率，不会经混频落入同一中频。","m":"镜频等于原频加减两倍中频","g":""},{"i":"A-541","j":"LK0843","p":"3.6.1","q":"超外差式收信机所收信号的频率要比本振频率低（或高）一个中频。然而，比本振频率高（或低）一个中频的另一个遥相对应的信号也可能经混频窜入中频通道，形成“镜像频率干扰”或“镜频干扰”。如果某对讲机的技术规格书给出 NFM 接收所用的第一中频为47.25MHz，那么在 435.00MHz收到的镜频干扰可能来自：","o":["340.50MHz或 529.50MHz","387.75MHz或 482.25MHz","47.25MHz或 94.50MHz","141.70MHz或.236.25MHz"],"a":[0],"e":"镜频相距两倍中频：435±2×47.25=435±94.50，得340.50MHz或529.50MHz。47.25与94.50分别是中频及其两倍本身，不是镜频位置。","m":"镜频等于原频加减两倍中频","g":""},{"i":"A-542","j":"LK0844","p":"3.6.1","q":"超外差式收信机所收信号的频率要比本振频率低（或高）一个中频。然而，比本振频率高（或低）一个中频的另一个遥相对应的信号也可能经混频窜入中频通道，形成“镜像频率干扰”或“镜频干扰”。如果某对讲机的技术规格书给出的UHF接收机第一中频为58.525MHz，那么在 435.00MHz收到的镜频干扰可能来自：","o":["317.95MHz或 552.05MHz","376.475MHz或 493.525MHz","58.525MHz或 117.05MHz","234.10.05MHz或.468.20MHz"],"a":[0],"e":"镜频相距两倍中频：435±2×58.525=435±117.05，得317.95MHz或552.05MHz。只相差一个中频的是本振可能频率，不是镜像频率。","m":"镜频等于原频加减两倍中频","g":""},{"i":"A-543","j":"LK0813","p":"3.6.1","q":"业余无线电发射机的效率是指：","o":["输出到天线系统的信号功率与发射机所消耗的电源功率之比","通信对象的接收天线得到的信号功率与发射机所消耗的电源功率之比","通信对象的接收天线得到的信号功率与发射机输出到天线系统的信号功率之比","输出到天线系统的有用信号功率与到达天线的包含杂散等无用信号的总功率之比"],"a":[0],"e":"发射机效率定义为输出到天线系统的信号功率除以发射机消耗的电源功率。它不涉及对方天线实际收到的功率，也不只是天线端有用功率占总功率之比。","m":"效率等于输出除以耗电","g":""},{"i":"A-544","j":"LK0814","p":"3.6.1","q":"业余无线电发射机的效率总是明显低于 1。所损耗的那部分能量：","o":["绝大部分转化为热量，极小一部分转化为杂散等无用信号","绝大部分转化为杂散等无用信号并对外辐射","绝大部分因阻抗失配而返回电源，极小一部分转化为热量对外散发","损耗的能量在电容、电感、开关器件等零部件中消失了"],"a":[0],"e":"效率低于1所损耗的功率主要在功放、电源等器件中转化为热量散发，只有极小部分变成杂散等无用信号。损耗不会大部分辐射出去，也不会返回电源或凭空消失。","m":"损耗大半变成热","g":""},{"i":"A-545","j":"LK0457","p":"3.6.1","q":"若一部业余无线电台的工作电压为直流 13.8伏，FM方式的射频输出功率为 N瓦，电源效率约为 80%，则发射时的工作电流约为：","o":["0.091×Ｎ（安）","13.8×Ｎ（安）","13.8/Ｎ×80%（安）","0.058×Ｎ（安）"],"a":[0],"e":"输入功率为N/80%=1.25N瓦，电流I=1.25N/13.8≈0.091N安，故选约0.091×N。未除效率的算法或把电压与功率直接相乘都不符合P=UI。","m":"先除效率再除电压","g":""},{"i":"A-546","j":"LK0458","p":"3.6.1","q":"若一部业余无线电台的工作电压为交流 220伏，FM方式的射频输出功率为 N瓦，电源效率约为 80%，则发射时的工作电流约为：","o":["0.0057×Ｎ（安）","220×Ｎ（安）","200/Ｎ×80%（安）","0.0036×Ｎ（安）"],"a":[0],"e":"输入功率为N/80%=1.25N瓦，电流I=1.25N/220≈0.0057N安。220伏电压高，同功率下电流远小于13.8伏供电的情况。","m":"先除效率再除电压","g":""},{"i":"A-547","j":"LK0459","p":"3.6.1","q":"若一部业余无线电台以 FM方式发射时的射 ，接收微弱信号的能力越强","灵敏度指标的数值越大，接收微弱信号的能力越强","灵敏度指标的数值越小，对与有用信号同时出现的干扰信号的响应越灵敏","灵敏度指标的数值越大，对与有用信号同时出现的干扰信号的响应越灵敏"],"a":[0],"e":"灵敏度是接收机能分辨的最小信号，数值越小说明越微弱的信号也能收，接收弱信号能力越强。它描述的是对有用弱信号的能力，不是对比干扰的响应。","m":"灵敏度越小越灵敏","g":""},{"i":"A-556","j":"LK0817","p":"3.6.3","q":"用功率电平表示接收机的灵敏度具有什么意义？常用单位是什么？","o":["输出信号达到一定质量标准时输入信号的最小功率电平。单位是 dBm或 dBμW","输出信号达到一定质量标准时输出信号与输入信号的功率电平之比。单位是 dB","输出信号达到一定质量标准时输入信号与输出信号的功率电平之比。单位是 dB","输出信号维持一定质量标准时输入信号的最小和最大功率电平之比。单位是 dB"],"a":[0],"e":"以功率表示时，灵敏度是输出达到规定质量时所需的最小输入功率电平，常用dBm或dBμW。它不是输入输出之比，那类无量纲比值才用dB表示增益。","m":"功率灵敏度单位dBm","g":""},{"i":"A-557","j":"LK0818","p":"3.6.3","q":"用电压电平表示接收机的灵敏度具有什么意义？常用单位是什么？","o":["输出信号达到一定质量标准时输入信号的最小电动势。单位是μV、dBμV或 dBmV","输出信号达到一定质量标准时输入信号的最小电压。单位是μV、dBμV或 dBmV","输出信号达到一定质量标准时输入信号的最大电动势。单位是μV或mV","输出信号达到一定质量标准时输出信号与输入信号的电压之比。单位是 dB"],"a":[0],"e":"以电压表示时，灵敏度指输出达到规定质量时输入信号的最小电动势，注意是电动势而非端口电压，单位为μV、dBμV或dBmV。选项把电动势说成端口电压或最大值均不准确。","m":"电压灵敏度指电动势","g":""},{"i":"A-558","j":"LK0839","p":"3.6.3","q":"业余无线电接收机大多具备信号强度指示功能。在 VHF/UHF频段，信号强度的最小刻度S1与输入信号功率电平-141dBm（50Ω上的电压电平 0.02μV）相一致；而在 HF频段，S1则与-121dBm的输入信号（50Ω上的 0.2μV）相对应。这是因为：","o":["HF频段的背景噪声较 VHF/UHF频段为高，使得可感知最小信号电平相应高出约 20dB","由于技术原因，HF接收机的灵敏度都比 VHF/UHF频段的低大约 20dB","HF业余电台功率大一些，而 VHF/UHF的相对较小，这导致信号强度的刻度标准差异","HF业余电台主要用于 DX通信，而 VHF/UHF的面向本地通信，刻度可以更随意一些"],"a":[0],"e":"HF段大气与人为噪声形成的背景噪声远高于VHF/UHF，S表刻度须与实际可感知电平匹配，故HF的S1比V/U段高约20dB。这不是接收机灵敏度差或电台功率大小造成的。","m":"HF噪声高刻度抬高20dB","g":""},{"i":"A-559","j":"LK0820","p":"3.6.3","q":"甲乙两种型号的业余无线电收发信机在技术规格中给出的接收机灵敏度指标分别为 0.1μV和 0.15μV。关于该指标，正确的推论是：","o":["无法比较二者接收微弱信号的能力，测量灵敏度时所用的输出信号质量标准未知","可以推断甲机接收微弱信号的能力比乙机的差，因为灵敏度指标的数值较小","可以推断甲机接收微弱信号的能力比乙机的高，因为可以接收的信号更微弱","可以推断甲机承受强信号的能力比乙机的低，因为其灵敏度数值比较小"],"a":[0],"e":"灵敏度数值必须在同一输出质量标准（如相同信纳比）下才可比较，题中未给甲乙两机的测量标准，故无法推论优劣。仅凭0.1与0.15的数字大小下结论是不严谨的。","m":"标准不明不可比灵敏度","g":""},{"i":"A-560","j":"LK0821","p":"3.6.3","q":"当输出信号满足规定质量标准时，在输入阻抗为 50欧的某接收机天线输入端口处测得的输入信号最小电压为 1μV。如果用电压电平μV表示该机的灵敏度，则为：","o":["2μV","1μV","50μV","0.5μV"],"a":[0],"e":"灵敏度以电动势表示时，匹配状态下端口电压是电动势的一半，故端口测得1μV对应电动势2μV。直接取1μV混淆了端口电压与
