","电源噪声"],"a":[0],"e":"放大增益总可以做得足够高，真正决定弱信号能否从噪声中分辨的是机内噪声，故它制约灵敏度。稳定性与电源噪声是次要因素，不能取代机内噪声这一根本限制。","m":"灵敏度受限于机内噪声","g":""},{"i":"A-569","j":"LK0833","p":"3.6.3","q":"术语“信噪比（SNR）”在业余无线电领域广为使用。它是指：","o":["有用信号功率对噪声功率的比值","有用信号峰值电压对噪声峰值电压的比值","有用信号功率对有用信号功率及噪声功率之和的比值","有用信号峰值电压对有用信号峰值电压及噪声峰值电压之和的比值"],"a":[0],"e":"信噪比SNR定义为有用信号功率与噪声功率之比，比较的是功率而非峰值电压。分母只是噪声功率，不包含信号功率本身。","m":"信噪比是功率之比","g":""},{"i":"A-570","j":"LK0834","p":"3.6.3","q":"对于需要接收微弱信号的业余通信，例如 EME通联，接收机的噪声系数 Fn（以比值的形式表示）是一项重要技术指标。它是指：","o":["接收机输入端信噪比 Si/Ni对输出端信噪比 So/No的比值","接收机输入端无信号时，输出端的噪声功率电平","接收机输出端噪声功率电平与输入端噪声功率电平的比值","接收机输入端噪声功率电平与输出端噪声功率电平的比值"],"a":[0],"e":"噪声系数Fn定义为输入端信噪比与输出端信噪比之比，Fn越大说明设备使信噪比恶化越多。它不是某个单独的噪声功率电平或其倒数关系。","m":"噪声系数是信噪比之比","g":""},{"i":"A-571","j":"LK0819","p":"3.6.3","q":"接收机的静噪灵敏度是指：","o":["能够使静噪电路退出静噪状态的射频信号最小输入电平","关闭静噪功能之后所能接收到的射频信号最小输入电平","带有静噪功能的接收机开启静噪功能后，按照灵敏度定义测得的灵敏度","带有静噪功能的接收机关闭静噪功能后，按照灵敏度定义测得的灵敏度"],"a":[0],"e":"静噪灵敏度是恰能使静噪电路打开、退出静噪状态所需的最小射频输入电平。它不同于关闭静噪后按一般定义测得的普通灵敏度。","m":"打开静噪的最小电平","g":""},{"i":"A-572","j":"LK0835","p":"3.6.3","q":"对于需要接收微弱信号的业余通信，例如 EME通联，接收机的噪声系数 Fn（以比值的形式表示）是一项重要技术指标。关于 Fn的一些基本常识是：","o":["Fn一定大于 1；在同样的灵敏度下，Fn越接近 1越好","Fn一定小于 1；在同样的灵敏度下，Fn越接近 0越好","Fn一定大于 1；在同样的灵敏度下，Fn越大越好","Fn一定小于 1；在同样的灵敏度下，Fn越接近 1越好"],"a":[0],"e":"实际接收机自身必加噪声，输出信噪比总低于输入，故Fn恒大于1，且越接近1说明附加噪声越小、性能越好。Fn不可能小于1，也不是越大越好。","m":"Fn大于1越近1越好","g":""},{"i":"A-573","j":"LK0836","p":"3.6.3","q":"对于需要接收微弱信号的业余通信，例如 EME通联，接收机的噪声指数 NF（以对数表示）是一项重要技术指标。它是指：","o":["接收机输入端信噪比 Si/Ni对输出端信噪比 So/No的比值的对数形式","接收机输入端无信号时，输出端的噪声功率电平的对数形式","接收机输出端噪声功率电平与输入端噪声功率电平的比值的对数形式","接收机输入端噪声功率电平与输出端噪声功率电平的比值的对数形式"],"a":[0],"e":"噪声指数NF是噪声系数Fn的对数形式，即输入与输出信噪比之比取对数（dB）。它不是某端噪声功率的对数，也不是输入输出噪声功率之比的对数。","m":"NF是Fn的对数版","g":""},{"i":"A-574","j":"LK0837","p":"3.6.3","q":"对于需要接收微弱信号的业余通信，例如 EME通联，接收机的噪声指数 NF（以对数表示）是一项重要技术指标。关于 NF的一些基本常识是：","o":["NF一定大于 0；在同样的灵敏度下，NF越接近 0越好","NF一定小于 0；在同样的灵敏度下，NF越接近 0越好","NF一定大于 1；在同样的灵敏度下，NF越大越好","NF一定处于 0和 1之间；在同样的灵敏度下，NF越接近 1越好"],"a":[0],"e":"NF为Fn的dB形式，理想值0dB，实际设备附加噪声使NF恒大于0，越接近0越好。NF不会小于0，也不以1为上限或以大为好。","m":"NF大于0越近0越好","g":""},{"i":"A-575","j":"LK0850","p":"3.6.3","q":"在无线电通信领域中，描述信号源、放大器或接收机等设备或系统组件的内部噪声大小时常用“噪声温度”指标。以接收机为例，等效噪声温度 Te的意义是：","o":["接收机的内部噪声功率等于一个接在天线输入端的优质匹配电阻在产生相同的热噪声功率时该电阻所具有的绝对温度","接收机内部噪声在输出端的功率可以使一个接在输出端上的匹配电阻发热的相对温度","接收机内部噪声在输出端的功率可以使一个接在输出端上的匹配电阻升温的绝对温度","接收机信噪比符合技术指标时所要求的设备工作环境的温度"],"a":[0],"e":"等效噪声温度Te把接收机内部噪声折算为天线输入端一个优质匹配电阻产生相同热噪声功率时的绝对温度。它与输出端电阻发热或环境工作温度无关。","m":"噪声折算成电阻温度","g":""},{"i":"A-576","j":"LK0851","p":"3.6.3","q":"不产生任何内部噪声的理想放大器或接收机的噪声系数 Fn、噪声指数 NF和噪声温度 Te分别为：","o":["1，0dB，0°K","0，0dB，-273°K","0，1dB，17°K","0，0dB，-275°K"],"a":[0],"e":"理想设备不附加任何噪声，输入输出信噪比相等，故Fn=1、NF=10lg1=0dB、Te=0K。Fn取0意味着输出无噪声，与定义及物理意义不符。","m":"理想机1、0、0","g":""},{"i":"A-577","j":"LK0852","p":"3.6.3","q":"假设一个用于卫星业余业务的天线放大器工作在标准温度（17℃）下，其输入端已连接良好匹配的天线。如果放大器所产生的内部噪声与输入的热噪声等效，则该放大器的噪声系数 Fn、噪声指数 NF和噪声温度 Te分别为：","o":["2，3dB，290°K","1，1dB，0°K","2，0dB，17°K","1，0dB，-273°K"],"a":[0],"e":"标准温度17℃即290K，内部噪声与输入热噪声相等使总噪声翻倍，故Fn=2、NF=10lg2≈3dB、Te=290K。噪声相等不是无噪声，不能取Fn=1或NF=0。","m":"噪声翻倍2、3、290","g":""},{"i":"A-578","j":"LK0895","p":"3.8.1","q":"在业余无线电领域中，缩写 AMSAT是指：","o":["美国的业余无线电卫星公司，是一个专注于实验卫星的设计、制造、运行和推进空间教育的非营利性志愿者组织","所有业余无线电卫星的总称","某一系列业余无线电卫星的总称","某一颗业余无线电卫星的名称"],"a":[0],"e":"AMSAT是美国业余无线电卫星公司这一非营利志愿者组织，致力于实验卫星的设计制造运行与空间教育。它不是所有业余卫星、某系列卫星或某一颗卫星的统称。","m":"AMSAT是美国卫星组织","g":""},{"i":"A-579","j":"LK0896","p":"3.8.1","q":"在描述业余无线电卫星时经常用到缩写 OSCAR（奥斯卡），这个名称的由来是：","o":["“搭载有业余无线电装置的地球轨道卫星”的英文缩写","按照发明者奥斯卡的方案设计制造的业余卫星","纪念业余无线电技术先驱者奥斯卡","电影奥斯卡金奖的基金所赞助的业余卫星活动"],"a":[0],"e":"OSCAR是Orbiting Satellite Carrying Amateur Radio的缩写，意为搭载业余无线电装置的地球轨道卫星。与人名奥斯卡、电影奖或赞助基金都无关。","m":"OSCAR即轨道业余卫星","g":""},{"i":"A-580","j":"LK0897","p":"3.8.1","q":"我国发射的第一颗业余卫星的发射年份、名称、国际 OSCAR系列号和转发器模式分别为：","o":["2009年，希望一号（XW-1），HO68，V/U（J）","2008年，希望一号（XW-1），HO68，V/U（J）","2010年，希望一号（XW-1），HO68，V/U（J）","2008年，希望一号（XW-1），无 OSCAR编号，B"],"a":[0],"e":"我国第一颗业余卫星是2009年发射的希望一号XW-1，OSCAR编号HO68，转发器模式V/U（J）。年份2008或2010、以及无编号等说法均与史实不符。","m":"2009希望一号HO68","g":""},{"i":"A-581","j":"LK1047","p":"3.8.1","q":"开展 EME通信试验的最佳时机是：","o":["月亮处于近地点","满月","通信两端天气都好","太阳黑子数高"],"a":[0],"e":"月面反射路径损耗随距离四次方变化，月亮在近地点时距离最短、损耗最小，最适合EME。满月月相、地面天气和太阳黑子数都不决定月距损耗。","m":"EME趁月近地点","g":""},{"i":"A-582","j":"LK0747","p":"3.8.1","q":"在 EME通信等需要接收极微弱信号的场合，安装前置放大器时应做到：","o":["尽量安装在靠近天线的地方，信号特别微弱时对放大器进行冷却以降低热噪声","尽量安装在靠近接收机的地方，放大器最好加热以防止元器件温度过低","尽量安装在靠近接收机的地方，放大器尽量采用较高的电源电压以求更高的增益","尽量安装在远离天线的地方，放大器采用射频正反馈电路以提高增益"],"a":[0],"e":"前置放大器装在天线附近可避免馈线损耗先恶化噪声系数，极弱信号时冷却放大器还能降低热噪声。装在接收机端、加热或用正反馈都只会抬高噪声或降低稳定性。","m":"前放靠天线还能冷却","g":""},{"i":"A-583","j":"LK0703","p":"3.8.1","q":"对于需要接收 VHF/UHF微弱信号的通信场景，比如月面反射实验，爱好者们时常需要在所用八木天线的馈电端处就近加装低噪声前置放大器。相比之下，HF通信爱好者却很少将他们所用的前置放大器装在八木天线或其他收信天线的馈电点处。这是因为：","o":["VHF/UHF频段的背景噪声较 HF频段为低。将放大器置于接收天线处可降低传输线固有噪声的影响，提高收信信噪比。而对于 HF频段，是否这样做，差别并不明显","电缆的固有噪声在 VHF/UHF频段更高","HF频段的放大器体积太大，不适合安装于天线端","HF频段的八木天线体积较大，把放大器装得太近容易引发自激"],"a":[0],"e":"VHF/UHF背景噪声低，馈线损耗对信噪比影响显著，前放装在馈电端可先放大信号压低后续损耗影响；HF段外部噪声本就很高，前放位置带来的差别被掩盖。故HF爱好者较少如此安装。","m":"高段噪声低前放靠天线","g":""},{"i":"A-584","j":"LK1119","p":"3.8.1","q":"下列哪个业余波段最适合流星余迹散射通信？","o":["6米","10米","2米","70厘米"],"a":[0],"e":"流星余迹对50MHz附近反射效果与持续时间最佳，6米是流星散射的经典波段。10米余迹利用率低，2米和70厘米余迹更短暂、反射更弱。","m":"流星散射首选6米","g":""},{"i":"A-585","j":"LX","p":"3.8.1","q":"下列哪些通信方式可用于流星余迹和对流层散射通信实验？","o":["FT4","APRS","QPSK31","MT63"],"a":[0],"e":"FT4专为快速数字通联设计，短时突发信号也能解码，适合流星余迹和对流层散射的短暂传播窗口。APRS是分组定位系统，QPSK31与MT63速率慢、需要持续稳定的传播路径。","m":"短时突发用FT4","g":""},{"i":"A-586","j":"LK1134","p":"4.1.1","q":"导体是易于传导电流的物质或材料。以下关于导体的正确描述是：","o":["导体中存在大量的可自由移动的电子或离子，施加电压可产生电流","多数金属都是导电性能优良的导体，比如银、铜和铝","有些金属在高温下呈现零电阻特性，成为超导体","某些金属具有压电效应，可用来制作电声元件"],"a":[0,1],"e":"导体靠大量自由电子或离子导电，银、铜、铝都是优良金属导体。超导是某些材料在临界低温下电阻为零，并非高温呈现；压电效应是石英等晶体的特性，与导体描述无关。","m":"自由电荷多即导体","g":""},{"i":"A-587","j":"LK1136","p":"4.1.1","q":"关于导体，以下说法正确的是：","o":["霓虹灯中电离发光的气体是导体","酸、碱、盐的水溶液是导体","石墨是导体","云母是导体"],"a":[0,1,2],"e":"电离气体能导电，酸碱盐水溶液靠离子导电，石墨有自由电子也是导体，三项都正确。云母恰是常用绝缘体，不能算导体。","m":"气液石墨都导电云母不","g":""},{"i":"A-588","j":"LK1135","p":"4.1.1","q":"绝缘体是不易传导电流的物质或材料。以下关于绝缘体的正确描述是：","o":["分子中正负电荷紧密束缚，可自由移动的带电粒子极少，呈现很大的电阻","绝缘体也称电介质。有些电介质可用来制作电容器，比如陶瓷和聚苯乙烯","随着所加电场的增强，绝缘体会突然导电而成为导体。这种现象称为击穿","随着温度的升高，绝缘体的绝缘程度下降。使用绝缘体应当关注工作温度"],"a":[0,1,2,3],"e":"四项均为绝缘体特性：自由电荷极少而电阻大，可作电容器介质，强电场下会击穿，温度升高绝缘性能下降。选材和使用绝缘体时都须考虑耐压与温度。","m":"绝缘四性全都对","g":""},{"i":"A-589","j":"LK1137","p":"4.1.1","q":"以下哪些可以用作绝缘材料？","o":["工程塑料","酚醛树脂","二氧化硅","二氧化锡"],"a":[0,1,2],"e":"工程塑料、酚醛树脂和二氧化硅（石英玻璃类）都是常用绝缘材料。二氧化锡是导电氧化物，常作透明导电膜，不能用作绝缘材料。","m":"二氧化锡导电不绝缘","g":""},{"i":"A-590","j":"LK1138","p":"4.1.1","q":"“击穿”是指施加于绝缘介质上的电压高于一定值时，部分介质突然变成导体，导致介质的电阻陡然下降的一种现象。以下哪些是对击穿现象的描述？","o":["电路中的电容在工作电压显著超过标称耐压后变成导体，造成电路短路","天线调谐器工作时，可变电容的极板间出现电弧，导致发射机告警保护","验电笔中的氖灯发光","台灯里的卤钨灯发光"],"a":[0,1,2],"e":"电容超耐压、电容极板间打弧、氖灯中气体电离发光，都是介质或气体被击穿后导电的现象。卤钨灯发光靠灯丝受热辐射，属于热发光而非击穿。","m":"击穿导电卤钨是热发光","g":""},{"i":"A-591","j":"LK0669","p":"4.1.1","q":"业余无线电设备中的射频部件积灰或受潮后，即使没有击穿或漏电，也可能因绝缘体的物理性质发生改变而意外产生：","o":["介质损耗","涡流损耗","磁滞损耗","磁阻损耗"],"a":[0],"e":"绝缘体在交变电场中因极化滞后而发热损耗能量，称为介质损耗；积灰受潮改变了绝缘材料的介电常数与损耗角正切，即使不击穿、不漏电也会增大介质损耗。涡流损耗与磁滞损耗发生在导磁材料中，与绝缘体无关。","m":"灰潮改介质，损耗悄悄增","g":""},{"i":"A-592","j":"LK1156","p":"4.1.1","q":"半导体是导电能力介于导体与绝缘体之间的一类物质或材料。对半导体的正确描述是：","o":["导电特性易于控制。例如，温度、光照或电场的少许变化可显著改变材料的导电性","半导体可分为本征半导体和杂质半导体。后者又有 P型和 N型之分","P型和 N型半导体的交界面称为 PN结，具有内建电动势和单向导电性","硅、锗等半导体材料可用来制作晶体管或集成电路"],"a":[0,1,2,3],"e":"半导体导电性介于导体与绝缘体之间，且易受温度、光照、电场和掺杂控制。掺杂得到P型与N型，二者交界形成PN结，具有内建电势和单向导电性；硅、锗是制作晶体管和集成电路的基础材料，四项均正确。","m":"半导体可控，掺杂分PN","g":""},{"i":"A-593","j":"LK1161","p":"4.1.1","q":"下列哪些器件由半导体材料制成？","o":["双极型三极管","氮化镓三极管","LDMOS三极管","电真空三极管"],"a":[0,1,2],"e":"双极型三极管、氮化镓三极管和LDMOS三极管都是以半导体材料为基础的器件。电真空三极管靠真空中的电子发射工作，属于电真空器件，不含半导体。","m":"真空管无半导体，其余三个都有","g":""},{"i":"A-594","j":"LK1147","p":"4.1.2","q":"静电放电是一种常见电磁现象，时刻伴随日常生活。但是，较强的静电放电却足以损坏电子设备甚至危及人身，需要预防。以下所述与静电有关的是：","o":["刮风时，斜拉天线上出现的直流高压","雷雨时，云层中积蓄的巨大能量","收信时，接收机收到的各种 QRN","发话时，电台馈送到天线的射频能量"],"a":[0,1,2],"e":"风摩擦可使斜拉天线积聚静电荷而形成直流高压；雷云是静电积蓄能量的释放；接收中的QRN主要来自大气静电干扰（如雷电）。发话时馈往天线的是射频交变能量，与静电无关。","m":"风摩天线、雷云、QRN皆静电","g":""},{"i":"A-595","j":"LK1148","p":"4.1.2","q":"如果将导体置于静电场中，导体将呈现如下特点：","o":["静电平衡后，导体是等势体，内部场强为零，外表面出现电荷","外表面曲率很小时，导体表面的电荷会高度聚集。这可能形成尖端放电","静电平衡后，导体是等势体，内部电荷与外表面电荷极性相反","外表面曲率很大时，导体表面的电荷会高度聚集。这可能形成尖端放电"],"a":[0,1],"e":"导体在静电场中达到静电平衡后，内部场强为零、整个导体是等势体，电荷只分布在外表面；表面曲率半径越小处电荷面密度越大，尖端附近场强过高会形成尖端放电。导体内部无净电荷，不存在内外电荷极性相反之说，说曲率半径大处电荷聚集则正好说反。","m":"等势零内场，尖端易放电","g":""},{"i":"A-596","j":"LK1139","p":"4.1.2","q":"直流电（DC）是以电荷的运动方向始终不变来定义的。关于直流电，以下描述正确的是：","o":["直流电源的输出端有正负极之分","电池提供的是直流电","直流电压通常为 13.8伏。这样的低压即使短路也没什么危害","脉动直流电不含交流成分，因为电荷的运动方向始终不变"],"a":[0,1],"e":"直流电方向不变，电源输出有正负极之分，电池正是最常见的直流电源。13.8伏虽低，但短路时电流可达数十安，能熔化导线引发火灾，并非无害；脉动直流是直流与交流纹波的叠加，含有交流成分。","m":"直流分正负，短路低压也危险","g":""},{"i":"A-597","j":"LK1140","p":"4.1.2","q":"交流电（AC）是以电荷的运动方向随时间交替变化来定义的。关于交流电，以下描述正确的是：","o":["交流电源的输出端没有正负极之分，因为极性总在交替变化","220V市电是一种交流电。由于不需区分正负极，所以火线和零线可以混用","交流电均为纯正弦波，仅包含单一频率成分","业余电台所接收的信号不是交流电。那是复杂波形信号，也就是“复信号”"],"a":[0],"e":"交流电极性周期性交替，输出端不固定正负极。市电火线与零线作用不同，绝不可混用；交流波形不限于纯正弦；接收到的无线电信号电流方向同样交替变化，属于交流电。","m":"交流无固定正负，火零不可混","g":""},{"i":"A-598","j":"LK1107","p":"4.1.2","q":"以下哪一个术语可以用来描述交流电每秒改变极性的次数？","o":["频率","速率","波长","脉率"],"a":[0],"e":"交流电压每秒完成周期性变化的次数即频率，单位赫兹，它同时决定了极性翻转的快慢。速率、波长、脉率都不是描述这一概念的术语。","m":"每秒变几次，就叫频率","g":""},{"i":"A-599","j":"LX","p":"4.1.2","q":"业余无线电爱好者经常提及的“波长”与无线电波的频率有什么关系？","o":["波长为光速与频率之比；频率越高，波长越短","波长与真空有些关联，但是在现实生活中无用","很明显，波长为频率的 1/4。这个常数应当牢记","很明显，波长为频率的 4倍。这个常数应当牢记"],"a":[0],"e":"电磁波波长λ等于光速c除以频率f，即λ=c/f，二者成反比：频率越高波长越短，频率越低波长越长。波长与频率之间不存在1/4或4倍的固定数值关系。","m":"波长等于光速除以频率","g":""},{"i":"A-600","j":"LK0428","p":"4.1.2","q":"物理量“电动势”描述的是：","o":["电子器件或装置将某种形式的能量转化为电能的能力","加在电路两端的电源驱动电子流动的力量大小","单位时间内流过电路的电子数量","电源所能供应的电子数量最大值"],"a":[0],"e":"电动势是电源把其他形式能量（化学能、机械能等）转化为电能的本领，等于非静电力移动单位电荷所做的功。驱动电子流动的力量大小是电压的描述；单位时间流过的电荷量是电流。","m":"电动势：能量变电能的本领","g":""},{"i":"A-601","j":"LK0427","p":"4.1.2","q":"物理量“电压”描述的是：","o":["加在电路两端的电源驱动电子流动的力量大小","电子器件或装置将其它形式的能量转化为电能的能力","单位时间内流过电路的电子数量","电源所能供应的电子数量最大值"],"a":[0],"e":"电压是两点间的电位差，表现为驱动电荷（电子）定向流动的力量大小，单位伏特。把其他能量转化为电能的能力是电动势；单位时间流过的电子数量是电流。","m":"电压推电子，电动势造电能","g":""},{"i":"A-602","j":"LK0474","p":"4.1.2","q":"正弦交流电压或电流的峰值（peak value）是指：（“x＾m”表示“x的 m次方”）","o":["从零点算起的最大值","一个周期内瞬时值的平均值乘以 2＾(1/2)","负半周最大幅度与正半周最大幅度的平均值","负半周最大幅度与正半周最大幅度的差值的二次方"],"a":[0],"e":"正弦量的峰值（幅值）就是从零点算起的最大值。平均值乘以根号2是有效值与半周平均值之间的关系，不是峰值的定义；负半周与正半周幅度的平均、差值二次方等说法均无依据。","m":"峰值就是从零起的最大值","g":""},{"i":"A-603","j":"LK0475","p":"4.1.2","q":"正弦交流电压或电流的峰-峰值（peak-to-peak value）是指：","o":["从负半周峰值到正半周峰值之间的差值","从零点算起的最大值","负半周最大幅度与正半周最大幅度的差值的二次方","负半周最大幅度与正半周最大幅度的差值的平方根"],"a":[0],"e":"峰-峰值是正峰值与负峰值之间的差值，对正弦波等于2倍峰值，如峰值100伏时峰-峰值为200伏。从零点算起的最大值是峰值（幅值），不是峰-峰值。","m":"峰到峰，谷到顶量全程","g":""},{"i":"A-604","j":"LK0476","p":"4.1.2","q":"任意交流电压的有效值（RMS voltage）是指：（“x＾m”表示“x的m次方”）","o":["在同一电阻上可以转换出与该交流电压效果相同的热量的直流电压","最终转换成在应用场景中真正发挥作用的有效能量的那部分电压值","电压的平均值乘以 2＾(1/2)","电压的峰值除以 2＾(1/2)"],"a":[0],"e":"有效值的定义是等效发热：在同一电阻上能转换出与该交流电压相同热量的直流电压，即为该交流电压的有效值。平均值乘根号2或峰值除以根号2只对正弦波成立，不能作为任意波形的定义。","m":"有效值看发热，等效直流定","g":""},{"i":"A-605","j":"LK0426","p":"4.1.2","q":"物理量“电流”描述的是：","o":["单位时间内流过电路的电子数量","电源所能供应的电子数量最大值","通电后流过电路的电子数量","电子在导体中的运动速度"],"a":[0],"e":"电流是单位时间内通过导体横截面的电荷量，I=Q/t，单位安培。它描述的是电荷流量的大小，而不是电子的运动速度，也不是电源能供应的电子总量。","m":"电流就是单位时间过多少电荷","g":""},{"i":"A-606","j":"LK0429","p":"4.1.2","q":"物理量“电阻”描述的是：","o":["电路从一点到另一点阻碍电流通过的能力大小","电子克服电路阻力所需的能量大小","电路阻碍电流通过所消耗的能量大小","电路阻断电流所需的过渡时间"],"a":[0],"e":"电阻描述导体对电流的阻碍能力，R=U/I，单位欧姆。它不是克服阻力所需的能量，也不是阻碍所消耗的能量，更不是时间概念。","m":"电阻拦电流，欧姆来度量","g":""},{"i":"A-607","j":"LK0430","p":"4.1.2","q":"物理量“功率”描述的是：","o":["电流在单位时间内所做的功","电子通过电路所获得的能量大小","负载总共消耗的能量","电源所能供应的电子数量最大值"],"a":[0],"e":"功率是单位时间内电流所做的功，即能量转换的速率，P=UI，单位瓦特。总能量是功而非功率；电子获得的能量、电源供应的电子数量都不是功率的定义。","m":"功率是做功的快慢","g":""},{"i":"A-608","j":"LK0440","p":"4.1.2","q":"直流电路欧姆定律是说：","o":["流过电阻的电流 I与电阻两端的电压 U成正比，与阻值 R成反比","电阻两端的电压 U与流过电阻的电流 I成正比，与阻值 R成正比","流过电阻的电流 I与电阻两端的电压 U成正比，与阻值 R成正比","电阻两端的电压 U与流过电阻的电流 I成正比，与阻值 R成反比"],"a":[0,1],"e":"欧姆定律I=U/R表明：电流与电压成正比、与电阻成反比；变形得U=IR，电压与电流、电阻均成正比。把电流说成与电阻成正比、把电压说成与电阻成反比都是错误的。","m":"I等于U除R，U等于I乘R","g":""},{"i":"A-609","j":"LK1141","p":"4.1.2","q":"在电路中不受电阻阻碍的电流，种类如下：","o":["不存在","射频电流","音频电流","直流电流"],"a":[0],"e":"任何实际电流通过电路时都会遇到电阻，导线和器件都有电阻，不存在完全不受电阻阻碍的电流。射频、音频、直流电流概莫能外。","m":"电流过路必遇阻，无一例外","g":""},{"i":"A-610","j":"LX","p":"4.1.2","q":"术语“阻抗”描述的是：","o":["电路从一点到另一点对交流电流阻碍作用的统称","电路从一点到另一点阻断直流电流，通过交流电流的能力大小","电路从一点到另一点阻断交流电流，通过直流电流的能力大小","电路从一点到另一点阻断特定频率交流电流的能力大小"],"a":[0],"e":"阻抗是电阻与电抗的统称，描述电路对交流电流的总体阻碍作用，单位欧姆。它不是对直流或交流的选择性阻断能力，更不限于特定频率。","m":"阻抗是交流阻碍的统称","g":""},{"i":"A-611","j":"LK0435","p":"4.1.3","q":"电动势的单位是：","o":["伏（特）","安（培）","瓦（特）","欧（姆）"],"a":[0],"e":"电动势与电压量纲相同，单位都是伏特，因为电动势本质上也是一种电位差。安培是电流单位，瓦特是功率单位，欧姆是电阻单位。","m":"电动势电压，同用伏特","g":""},{"i":"A-612","j":"LK0432","p":"4.1.3","q":"电压的单位是：","o":["伏（特）","安（培）","瓦（特）","欧（姆）"],"a":[0],"e":"电压（电位差）的单位是伏特，符号V。安培量电流，瓦特量功率，欧姆量电阻，均不是电压的单位。","m":"电压单位伏，电流单位安","g":""},{"i":"A-613","j":"LK0431","p":"4.1.3","q":"电流的单位是：","o":["安（培）","伏（特）","瓦（特）","欧（姆）"],"a":[0],"e":"电流的单位是安培，符号A，与单位时间流过的电荷量相对应。伏特是电压单位，瓦特是功率单位，欧姆是电阻单位。","m":"电流安培，数电荷流量","g":""},{"i":"A-614","j":"LK0433","p":"4.1.3","q":"电阻的单位是：","o":["欧（姆）","安（培）","伏（特）","瓦（特）"],"a":[0],"e":"电阻的单位是欧姆，符号Ω，由欧姆定律R=U/I导出，1欧姆等于1伏特除以1安培。安培、伏特、瓦特分别是电流、电压、功率的单位。","m":"电阻欧姆，伏除以安","g":""},{"i":"A-615","j":"LY0433","p":"4.1.3","q":"阻抗的单位是：","o":["欧（姆）","安（培）","伏（特）","瓦（特）"],"a":[0],"e":"阻抗是电阻与电抗的综合量，量纲与电阻相同，单位同为欧姆。安培、伏特、瓦特分别对应电流、电压、功率，不能用于阻抗。","m":"阻抗电阻同单位，都是欧姆","g":""},{"i":"A-616","j":"LK0434","p":"4.1.3","q":"功率的单位是：","o":["瓦（特）","安（培）","伏（特）","欧（姆）"],"a":[0],"e":"功率的单位是瓦特，符号W，1瓦等于1焦耳每秒，也等于1伏特乘1安培。安培、伏特、欧姆分别是电流、电压、电阻的单位。","m":"功率瓦特，伏乘安培","g":""},{"i":"A-617","j":"LX","p":"4.1.3","q":"频率的单位是：","o":["赫（兹）","亨（利）","法（拉）","库（伦）"],"a":[0],"e":"频率的单位是赫兹，符号Hz，表示每秒的周期数。亨利是电感单位，法拉是电容单位，库伦是电荷量单位。","m":"频率赫兹，电感亨利电容法拉","g":""},{"i":"A-618","j":"LK0466","p":"4.1.3","q":"在法定计量单位中，词头 k的数学意义和文字含义分别为：（“x＾m”表示“x的 m次方”）","o":["10＾3，千","10＾(-3)，毫","10＾6，兆","10＾(-6)，微"],"a":[0],"e":"词头k（千）表示10的3次方，如1kHz等于1000Hz。10的负3次方是毫m，10的6次方是兆M，10的负6次方是微μ，要注意大小写区分。","m":"小k是千，10的3次方","g":""},{"i":"A-619","j":"LK0467","p":"4.1.3","q":"在法定计量单位中，词头 m的数学意义和文字含义分别为：（“x＾m”表示“x的 m次方”）","o":["10＾(-3)，毫","10＾3，千","10＾6，兆","10＾(-6)，微"],"a":[0],"e":"词头m（毫）表示10的负3次方，如1mA等于0.001A。千k为10的3次方，兆M为10的6次方，微μ为10的负6次方，不要与大写M混淆。","m":"小m是毫，千分之一","g":""},{"i":"A-620","j":"LK0468","p":"4.1.3","q":"在法定计量单位中，词头 M的数学意义和文字含义分别为：（“x＾m”表示“x的 m次方”）","o":["10＾6，兆","10＾(-6)，微","10＾3，千","10＾(-3)，毫"],"a":[0],"e":"词头M（兆）表示10的6次方，如1MHz等于1000000Hz。微μ为10的负6次方，千k为10的3次方，毫m为10的负3次方，大写M与小写m含义截然不同。","m":"大M是兆，百万倍","g":""},{"i":"A-621","j":"LK0469","p":"4.1.3","q":"在法定计量单位中，词头μ的数学意义和文字含义分别为：（“x＾m”表示“x的 m次方”）","o":["10＾(-6)，微","10＾6，兆","10＾(-3)，毫","10＾3，千"],"a":[0],"e":"词头μ（微）表示10的负6次方，如1μF等于百万分之一法拉。兆M为10的6次方，毫m为10的负3次方，千k为10的3次方。","m":"μ是微，百万分之一","g":""},{"i":"A-622","j":"LK0470","p":"4.1.3","q":"在法定计量单位中，词头 G的数学意义和文字含义分别为：（“x＾m”表示“x的 m次方”）","o":["10＾9，吉","10＾6，兆","10＾12，太","10＾(-12)，皮"],"a":[0],"e":"词头G（吉）表示10的9次方，如2.43GHz。兆M为10的6次方，太T为10的12次方，皮p为10的负12次方。","m":"G是吉，10的9次方","g":""},{"i":"A-623","j":"LK0471","p":"4.1.3","q":"在法定计量单位中，词头 n的数学意义和文字含义分别为：（“x＾m”表示“x的 m次方”）","o":["10＾(-9)，纳","10＾9，吉","10＾12，太","10＾(-12)，皮"],"a":[0],"e":"词头n（纳）表示10的负9次方，常用于纳亨、纳法等小量。吉G为10的9次方，太T为10的12次方，皮p为10的负12次方。","m":"n是纳，十亿分之一","g":""},{"i":"A-624","j":"LK0472","p":"4.1.3","q":"在法定计量单位中，词头 T的数学意义和文字含义分别为：（“x＾m”表示“x的 m次方”）","o":["10＾12，太","10＾-12，皮","10＾9，吉","10＾(-9)，纳"],"a":[0],"e":"词头T（太）表示10的12次方。皮p为10的负12次方，吉G为10的9次方，纳n为10的负9次方，T与p仅大小写之差，数值却差24个数量级。","m":"大T是太，万亿倍","g":""},{"i":"A-625","j":"LK0473","p":"4.1.3","q":"在法定计量单位中，词头 p的数学意义和文字含义分别为：（“x＾m”表示“x的 m次方”）","o":["10＾(-12)，皮","10＾12，太","10＾(-9)，纳","10＾9，吉"],"a":[0],"e":"词头p（皮）表示10的负12次方，皮法是常见的小电容单位。太T为10的12次方，纳n为10的负9次方，吉G为10的9次方。","m":"小p是皮，万亿分之一","g":""},{"i":"A-626","j":"LK1146","p":"4.1.3","q":"以下哪个业余无线电通信缩语可以表述术语“射频”或特指无线电用途的某个频率？","o":["RF","HF","AF","MF"],"a":[0],"e":"RF是Radio Frequency（射频）的缩写，泛指无线电用途的频率。HF专指短波高频段，AF是音频，MF是中频段，都是具体频段或信号类型，不能泛指射频。","m":"射频就是RF，无线电频率","g":""},{"i":"A-627","j":"LK0495","p":"4.1.3","q":"术语“音频”是指人们可以普遍听到的声音的频率。以下描述正确的是：","o":["音频的频率范围大致为 16Hz-20kHz","音频位于 VLF至MF多个频带内","音频的频率范围大致为 16kHz-20kHz","音频位于 VHF频带内"],"a":[0],"e":"人耳可听范围大致为16Hz到20kHz，这就是音频范围。音频是声频信号本身，不按VLF至MF的无线电频带划分，更不在VHF频带内；16kHz到20kHz只是听觉上限附近的一小段。","m":"音频16到20k，人耳听得见","g":""},{"i":"A-628","j":"LK0849","p":"4.1.3","q":"无线电通信及相关测试设备、电视设备和音频设备常用的传输接口标称阻抗分别为：","o":["50欧、75欧和 600欧","50欧、600欧和 75欧","50欧、50欧和 75欧","75欧、50欧和 16欧"],"a":[0],"e":"无线电通信及测试设备标称阻抗为50欧，电视与视频传输系统为75欧，传统音频传输线路为600欧，这是三类设备的惯例标准。其他选项把数值张冠李戴。","m":"无线电50，电视75，音频600","g":""},{"i":"A-629","j":"LX","p":"4.1.3","q":"1,805,000Hz可以表述为：","o":["1.805MHz","1.805kHz","1.805mHz","1.805GHz"],"a":[0],"e":"换算时除以10的6次方：1805000Hz等于1.805MHz。若写成kHz应为1805kHz，写成GHz应为0.001805GHz，mHz则小了9个数量级。","m":"赫兹变兆赫，除以一百万","g":""},{"i":"A-630","j":"LX","p":"4.1.3","q":"2430MHz可以表示为：","o":["2.43GHz","243GHz","0.00243nHz","24.3kHz"],"a":[0],"e":"1000MHz等于1GHz，故2430MHz等于2.43GHz。243GHz大了100倍，24.3kHz小了10的5次方倍，nHz的写法更不成立。","m":"兆赫变吉赫，除以一千","g":""},{"i":"A-631","j":"LX","p":"4.1.3","q":"将阻值为 1欧的电阻与 13.8伏电源并联，电阻所耗散的功率大约为：","o":["190瓦","13.8伏","13.8安","190伏安"],"a":[0],"e":"由P=U²/R得13.8²÷1≈190瓦。13.8安是流过电阻的电流值，13.8伏是电压本身，伏安不是这里的功率答案，只有190瓦正确。","m":"功率等于电压平方除电阻","g":""},{"i":"A-632","j":"LK0566","p":"4.1.3","q":"5W可以表示为：","o":["37dBm","5dBW","17dBm","35dBμ"],"a":[0],"e":"以1mW为参考，dBm=10lg(P/1mW)，5W等于5000mW，10lg5000≈37dBm。5W换算为dBW约为7dBW；17dBm仅约50mW；以微瓦为参考的dBμ数值也不符合。","m":"5瓦37dBm，记牢常用值","g":""},{"i":"A-633","j":"LK0567","p":"4.1.3","q":"0.25W可以表示为：","o":["54dBμ","6dBW","36dBm","25dBm"],"a":[0],"e":"以1μW为参考，dBμ=10lg(P/1μW)，0.25W等于250000μW，10lg250000≈54dBμ。0.25W换算为dBW是负6dBW，换算为dBm约为24dBm，均与干扰项不符。","m":"0.25瓦，54dBμ","g":""},{"i":"A-634","j":"LK0568","p":"4.1.3","q":"0.4kW可以表示为：","o":["86dBμ","400dBm","6000dBm","34dBm"],"a":[0],"e":"0.4kW等于400W，即4×10的8次方μW，dBμ=10lg(4×10^8)≈86dBμ。其dBm值应为10lg(400000)≈56dBm，400dBm、6000dBm都远超实际。","m":"400瓦86dBμ，微瓦作参考","g":""},{"i":"A-635","j":"LK1141","p":"4.1.4","q":"电源是业余无线电爱好者常用的一种供电装置。我们对电源的理解是：","o":["电源是一种将某种形式的能量转化为电能的供电装置","电池是一种电源，其将化学能转化为电能，也称化学电源","直流电源是将输入交流电或直流电转换成电压和电流符合要求的另一直流电的装置","变压器可将交流电压和电流转换成交流的另一种电压和电流，可用来制作交流电源"],"a":[0,1,2,3],"e":"电源的本质是把其他形式能量转化为电能：电池把化学能变电能，属化学电源；直流电源可把输入的交直流变换为所需的直流；变压器能变换交流电压和电流，可用来制作交流电源。四项均符合对电源的理解。","m":"电源就是能量变电能","g":""},{"i":"A-636","j":"LK0439","p":"4.1.4","q":"电源两端电动势的方向为：","o":["从电源的负极到正极","从电源的正极到负极","取决于负载电阻和电源内阻的相对大小","与电源的电压方向相同"],"a":[0],"e":"电动势的方向规定为在电源内部由负极指向正极，即非静电力把正电荷从低电位搬向高电位的方向。由正极到负极是外电路电压降的方向，与电动势方向相反。","m":"电动势内走，负极到正极","g":""},{"i":"A-637","j":"LK0438","p":"4.1.4","q":"电源两端电压的方向为：","o":["从电源的正极到负极","从电源的负极到正极","取决于负载电阻和电源内阻的相对大小","与电源的电动势方向相同"],"a":[0],"e":"电源两端电压的方向是由正极指向负极，即沿外电路电位降落的方向。它与电源内部电动势的方向（负极到正极）恰好相反，二者不可混同。","m":"电压向外降，正极到负极","g":""},{"i":"A-638","j":"LK1142","p":"4.1.4","q":"为业余无线电设备供电的外置电源具有多种类型。常见的有：","o":["开关电源","线性电源","蓄电池","标准电池"],"a":[0,1,2],"e":"业余电台常用外置电源包括开关电源（体积小、效率高）、线性电源（纹波低）和蓄电池（可移动、停电可用）。标准电池是计量用的电压基准，输出电流极小，不能为电台供电。","m":"开关线性蓄电池，标准电池只计量","g":""},{"i":"A-639","j":"LK1143","p":"4.1.4","q":"下列哪一种电池可以充电？","o":["锂离子电池","钠离子电池","铅酸电池","碱性干电池"],"a":[0,1,2],"e":"锂离子电池、钠离子电池和铅酸电池都是二次电池，可以反复充电。普通碱性干电池是一次电池，设计上不可充电，强行充电有漏液和爆裂风险。","m":"锂钠铅酸可充，碱性干电池不行","g":""},{"i":"A-640","j":"LK1229","p":"4.1.4","q":"如何在电网停电的情况下给一个 12伏的铅酸蓄电池充电？","o":["用适当的连线将待充电蓄电池与汽车的蓄电池并联，然后发动车辆","往蓄电池里加一些酸","将蓄电池放在冰里冷却一会儿","将蓄电池串联一个电灯泡作为限流装置，然后连接到 220伏市电上"],"a":[0],"e":"停电时可将待充的12伏铅酸电池与汽车蓄电池并联，借助汽车发电机充电，这是应急可行办法。加酸、冷冻都不能充电；把电池经灯泡直接接220伏市电会损坏电池并危及人身安全。","m":"停电借车充，并联发动车辆","g":""},{"i":"A-641","j":"LX","p":"4.1.4","q":"使用蓄电池为电台供电时，应如何估算电池供电的时长？","o":["用电池的标称安时数除以收发信机的平均工作电流","用电池的标称瓦时数除以收发信机的发射功率","用电池的标称电压除以收发信机的平均工作电流","用收发信机的发射功率除以电池的标称电压"],"a":[0],"e":"电池容量以安时计，供电时长约等于标称安时数除以设备平均工作电流，例如20Ah电池以2A平均电流工作约10小时。瓦时除以发射功率忽略了收发占空比，电压除以电流量纲也不对。","m":"时长等于安时除以电流","g":""},{"i":"A-642","j":"LK0537","p":"4.1.4","q":"电源的内阻对电路的影响是：","o":["使电源的实际输出电压降低","使电源的电动势降低","使电源的输出功率增加","使电源的自身的能耗降低"],"a":[0],"e":"电源内阻与负载串联，输出电流在内阻上产生压降，使端电压U=E−Ir低于电动势。内阻不改变电动势本身，只会增加电源自身损耗、减少可用输出功率。","m":"内阻分压，端压降低","g":""},{"i":"A-643","j":"LK0698","p":"4.1.4","q":"有些收发信机会在直流 13.8V供电线路中串联一个熔断器，并在其后反向并联一个额定电流很大的二极管作保护之用。该电路利用了二极管的什么特性？是如何工作的？","o":["利用二极管中 PN结的单向导电性；若电源极性接反，近乎短路的电流烧断熔丝，切断供电","在电源过压时利用二极管的击穿特性吸收电流以稳定供电电压","在电源过流时利用二极管的击穿特性吸收电流以稳定供电电压","若设备过热时利用二极管的热失控特性短路电源，烧断熔丝，切断供电"],"a":[0],"e":"该保护利用PN结的单向导电性：极性正确时二极管反偏不导通；一旦接反，二极管正向导通形成近似短路，大电流瞬间烧断串联熔丝从而切断供电。它不是靠击穿稳压，也与热失控无关。","m":"接反二极管短路，烧熔丝保电台","g":""},{"i":"A-644","j":"LK0699","p":"4.1.4","q":"有些收发信机会在 13.8V直流电源插座附近安装一个标有数字的复位按钮。其作用是什么？","o":["当设备过流时切断电源","当电源极性接反时切断电源","如果工作温度超过数字所注的温度值则切断电源","如果工作电压超过数字所注的伏特数则切断电源"],"a":[0,1],"e":"插座旁标数字的复位按钮实为可复位断路器，数字是其额定电流值，当设备过流或电源极性接反引起大电流时跳闸断电，按下即可复位。它不按温度或电压动作，故后两项错误。","m":"复位按钮是断路器，数字指电流","g":""},{"i":"A-645","j":"LK0479","p":"4.6.1","q":"用万用表的直流电压档测量正负对称的方波电压（占空比为 1:1）。所得读数为：","o":["零值","该电压的最大值","该电压最大值的 1/2","该电压最大值的 2倍"],"a":[0],"e":"万用表直流电压档测的是平均值（零频分量）。正负对称方波正半周与负半周面积相等、均值相抵，读数为零。B、C 错误：直流档不响应峰值；D 无依据。","m":"直流档看均值，正负对称两相抵，读数归零","g":""},{"i":"A-646","j":"LK0480","p":"4.6.1","q":"如果用磁电式万用表的交流电压档测量正负对称的方波电压（占空比为 1:1），其指针所示的电压读数：","o":["大于该电压的峰值","为该电压的峰值","为该电压的峰-峰值","为该电压的平均值"],"a":[0],"e":"磁电式交流档实为整流平均值表，按正弦波有效值=1.11×平均值刻度。方波平均值等于峰值，表按 1.11 倍刻度显示，故读数大于峰值（约为 1.11 倍峰值）。它既不是峰值也不是峰-峰值。","m":"整流表按正弦刻度，方波读数虚高一成","g":""},{"i":"A-647","j":"LK0481","p":"4.6.1","q":"用指针式万用表的直流电压档测量最小值为 0的方波电压（占空比为 1:1），得到的读数是该电压的：","o":["峰值的 1/2，亦为有效值","零值","峰值","峰-峰值"],"a":[0],"e":"指针式直流档读平均值：最小值为 0、占空比 1:1 的方波，平均值=峰值×1/2。而方波有效值恰等于峰值（恒幅），故读数既是峰值的一半也是有效值。B、C、D 均不符合平均值定义。","m":"单极性方波占空一半，均值即半峰值，也等于有效值","g":""},{"i":"A-648","j":"LK1198","p":"4.6.1","q":"用万用表的电阻档测量一个电路。最开始，电表指示电路的阻值很小。但是随着测量时间的延长，测量值却变得越来越大。这是因为：","o":["这个电路两端可能存在一个很大的电容","万用表出了故障","这个电路两端可能存在一个很大的电感","这个电路中存在一个周期性的交流电压"],"a":[0],"e":"万用表电阻档靠内部电池供电测量，表笔接上瞬间给被测电路两端的大电容充电，充电电流大故初示值小；随电容充满电流衰减，示值渐增至电路真实电阻。这是电容充电的典型现象，与表故障、交流电压无关；大电感则表现为初值大后减小。","m":"阻值越测越大，必有大电容在充电","g":""},{"i":"A-649","j":"LK0484","p":"4.6.1","q":"测量一个电解电容器是否完好应当使用：","o":["指针式万用表的电阻档","数字万用表的电容测试档（如果仪表具备该功能）","任意一种万用表的电流档","蓄电池充电器并配合进行短路放电实验"],"a":[0,1],"e":"判断电解电容好坏可用指针表电阻档看充放电摆针，也可用数字表电容档直接读容量。电流档内阻极小、易烧表且测不出容量；用充电器短路放电既危险又无法定量判断。","m":"测电容：指针看摆针，数字读法拉","g":""},{"i":"A-650","j":"LK0491","p":"4.6.1","q":"用指针式万用电表的电阻档测量一个常用元件，表笔第一次连接时表针挥动了一下，但很快回到零点。断开表笔重新连接，表针却不再有任何指示。正确的推论是：","o":["该元件可能是一个电解电容器","该元件肯定是一支损坏了的电阻","万用表的准确度肯定有问题","万用表的电池肯定电量不足了"],"a":[0],"e":"表针挥动后回零是电容充电过程；断开重测不再摆动，说明电容已充满电、仍能存电，是完好的电解电容。若电阻损坏通常示值无穷大或固定值；表电池不足表现为全程示值偏小而非单次摆针。","m":"一摆即回零、再测不动弹——电容已充满","g":""},{"i":"A-651","j":"LK0492","p":"4.6.1","q":"指针式万用表的电压档有个“欧姆/伏（每伏欧姆）”指标。越大的每伏欧姆数越说明：","o":["测量电压时电表对电路工作状态的影响小","测量电压时电表对电路工作状态的影响大","可以耐受的电压过载能力强","可以耐受的电压过载能力弱"],"a":[0],"e":"“每伏欧姆”即电压档内阻（量程×Ω/V），内阻越大，从被测电路分流越少，对电路工作状态影响越小。它与过载耐受能力无关。","m":"欧姆每伏越大，内阻越高，测量越不扰民","g":""},{"i":"A-652","j":"LK0493","p":"4.6.1","q":"用数字万用表的直流电压档测量电路两点间某个等幅音频信号的电压，发现读数不为零。交换两支表笔之后再测，所得读数的极性反转。正确的推论是：","o":["音频信号上叠加有直流成分","音频信号含有丰富的谐波","万用表的频率响应太差","表笔导线间的分布电容影响了测量"],"a":[0],"e":"纯交流音频信号的平均值为零，直流档应读零；现读数非零且换表笔极性反转，说明存在不随表笔改变的直流分量叠加在音频上。谐波、频率响应、分布电容都不会产生极性随表笔反转的直流读数。","m":"换笔极性跟着翻，必有直流叠里边","g":""},{"i":"A-653","j":"LK0025","p":"5.1.1","q":"业余无线电发射设备的下列指标必须符合国家的相关规定：","o":["频率容限和杂散域发射功率","频率调制频偏和调制度","频率容限和带外发射","指配频段和必要带宽"],"a":[0],"e":"《业余无线电台管理办法》要求发射设备频率容限和杂散域发射功率符合国家规定，这是发射设备的两大硬指标。B 的调制频偏、C 的带外发射、D 的指配频段都不是该条款的规范对象。","m":"发射设备两大件：频率容限加杂散","g":""},{"i":"A-654","j":"LK0116","p":"5.1.1","q":"业余电台的无线电发射设备应符国家规定的下列主要技术指标：","o":["符合频率容限、符合杂散发射最大允许功率电平","杂散发射不低于最大允许功率电平、电源电压及频率符合国家电网标准、采用标准天线阻抗","杂散发射不低于最大允许功率电平、频率漂移不低于频率容限、电源利用效率满足节能要求","工作频率范围足够宽、杂散发射不低于最大允许功率电平、带宽大于允许最低值"],"a":[0],"e":"业余电台发射设备的主要技术指标是频率容限合格、杂散发射不超过最大允许功率电平。B、C 把“不低于”用反（杂散是上限要求）；D 的宽频率、大带宽不是强制指标。","m":"容限要合规，杂散不能超上限","g":""},{"i":"A-655","j":"LX","p":"5.1.1","q":"频率容限是指：","o":["发射所占频段的中心频率偏离指配频率的最大容许偏差","发射的特征频率偏离参考频率的最大容许偏差","发射所占频段的中心频率偏离最高频率的最大容许偏差","发射的特征频率偏离必要频率的最大容许偏差"],"a":[0,1],"e":"频率容限指发射频率偏离规定值的最大允许偏差，既可表述为所占频段中心频率偏离指配频率，也可表述为特征频率偏离参考频率。C、D 的“最高频率”“必要频率”不是规范术语。","m":"容限即允许偏多少，指配参考两表述","g":""},{"i":"A-656","j":"LY0117","p":"5.1.1","q":"频率容限是发射设备的重要指标，通常用下述单位来表示：","o":["百万分之几","赫兹","百分之几","兆赫"],"a":[0,1],"e":"频率容限是极小的相对偏差，习惯用百万分之几（ppm）表示，绝对值则用赫兹。百分之几、兆赫数量级太大，不适用。","m":"容限小得可怜，ppm加赫兹","g":""},{"i":"A-657","j":"LY0118","p":"5.1.1","q":"杂散域发射功率是发射设备的重要指标，通常用下述单位来表示：","o":["绝对功率 dBm","低于载波发射功率的分贝值 dBc","低于 PEP发射功率的相对值 dB","绝对功率（瓦）"],"a":[0,1,2],"e":"杂散发射功率可用绝对功率 dBm、相对载波的 dBc、相对 PEP 的 dB 三种方式表示；D 的瓦虽也是绝对功率单位，但规范与题库采用前三种表述，D 不在正确组合内。","m":"杂散三单位：dBm、dBc、相对PEP的dB","g":""},{"i":"A-658","j":"LY0137","p":"5.1.1","q":"杂散发射是指：","o":["必要带宽之外的一个或多个频率的发射，其发射电平可降低而不致影响相应信息的传输","杂散发射包括谐波发射、寄生发射","杂散发射包括互调产物、变频产物","杂散发射包括谐波发射、带外发射"],"a":[0,1,2],"e":"杂散发射指必要带宽之外、可降低而不影响信息传输的发射，包括谐波、寄生发射、互调产物和变频产物。D 错误：带外发射紧邻必要带宽、属带外域，不归入杂散域。","m":"杂散在带宽外，谐波寄生互调变频；带外不算杂散","g":""},{"i":"A-659","j":"LY0139","p":"5.1.1","q":"业余无线电专用发射设备必须满足的主要技术指标要求包括：","o":["频率容限和杂散辐射不超过限值，发射频率不超出国家规定的业余业务和卫星业余业务频率","频率容限不低于限值，杂散辐射不超过限值，发射频率不超出国家规定的业余业务和卫星业余业务频率","频率容限和杂散辐射不超过限值，发射频率包括业余业务和卫星业余业务频率","发射功率不低于功率限值，输出阻抗符合工业标准"],"a":[0],"e":"专用发射设备须频率容限与杂散辐射都不超限值，且发射频率不得超出国家规定的业余业务和卫星业余业务频段。B 把容限说成“不低于”方向反了；C 漏了“不超出”的限定；D 的功率下限、工业阻抗无此要求。","m":"容限杂散双不超，频率不出业余段","g":""},{"i":"A-660","j":"LK0186","p":"5.1.1","q":"下列情况会产生减幅波辐射：","o":["电路接触点打火","对讲机按键发射","电视机本振泄漏","医用高频加热器泄漏"],"a":[0],"e":"减幅波是阻尼振荡的断续辐射，电路触点打火产生宽频带阻尼振荡，是典型来源。对讲机按键、电视本振、医用高频设备产生的是连续波或泄漏，不是减幅波。","m":"触点打火冒火花，减幅波辐射就是它","g":""},{"i":"A-661","j":"LY1003","p":"5.1.2","q":"按照国家标准 GB8702-2014《电磁环境控制限值》，从电磁环境保护管理角度，向没有屏蔽空间发射电磁场可以免于管理的有：","o":["频率范围为 0.1-3MHz，等效辐射功率小于 300瓦的无线电通信设施（设备）","频率范围为 3MHz-300GHz，等效辐射功率小于 100瓦的无线电通信设施（设备）","发射频率在 30MHz以下的所有业余电台","发射频率在 30MHz以上的所有业余电台"],"a":[0,1],"e":"GB8702-2014 规定 0.1-3MHz 等效辐射功率小于 300W、3MHz-300GHz 小于 100W 的无线电设施可免于管理。C、D 错误：并非所有业余电台都豁免，须看频率与功率是否落入上述范围。","m":"0.1-3M三百瓦，三M以上一百瓦，超了就得管","g":""},{"i":"A-662","j":"LX","p":"5.1.2","q":"根据国家标准 GB8702-2014《电磁环境控制限值》，公众曝露是指：","o":["公众所受的全部电场、磁场、电磁场照射","职业照射","医疗照射","医学诊断或治疗所受到的辐射照射"],"a":[0],"e":"公众曝露指公众所受的全部电场、磁场、电磁场照射的总和。B 职业照射、C 医疗照射是另行管理的照射类别，D 也属医疗范畴，都不属于公众曝露定义。","m":"公众曝露：公众受到的全部场照射","g":""},{"i":"A-663","j":"LY1236","p":"5.1.2","q":"为什么我国《电磁环境控制限值》标准中的照射限值伴随频率有所不同？","o":["人体对某些特定波长的电磁波有更多的吸收","较低频率的无线电波不会穿透人体","因为自然界中频率较高电磁波并不常见","较低频率的无线电波较更高频率的无线电波拥有更高的能量"],"a":[0],"e":"人体在某些波长（与人体尺寸相当的 VHF/UHF 段）产生谐振吸收，吸收率显著升高，故限值随频率变化。B 错误（低频同样能穿透）；D 错误（光子能量随频率升高而增大，但限值差异主因是吸收特性）。","m":"人体尺寸谐振吸收强，限值随频变","g":""},{"i":"A-664","j":"LX","p":"5.1.2","q":"关于自制、改装、拼装无线电发射设备，下列说法正确的是：","o":["自制、改装、拼装的无线电发射设备，应符合《业余无线电设备射频技术要求及测试方法》（GB/T 32658-2016）所列技术要求","自制、改装、拼装的无线电发射设备，应符合《短波单边带通信设备通用规范》（GB/T16946-2017）所列技术要求","无线电管理机构可根据相关标准规范免费开展有关技术检测","自制、改装、拼装无线电发射设备可不受无线电管理机构的监督管理"],"a":[0,1,2],"e":"自制、改装、拼装设备须符合 GB/T 32658-2016《业余无线电设备射频技术要求及测试方法》，短波单边带设备还须符合 GB/T 16946-2017；无线电管理机构可免费开展技术检测。D 错误：自制设备同样受监督管理。","m":"自制也要合国标，32658加16946，检测还免费","g":""},{"i":"A-665","j":"LK1235","p":"5.1.2","q":"空中的 VHF和 UHF信号属于下面哪一类辐射？","o":["非电离辐射","电离辐射","阿尔法辐射","伽玛辐射"],"a":[0],"e":"VHF/UHF 光子能量远低于电离阈值，不能使原子电离，属非电离辐射。电离辐射指 X、γ 射线等；阿尔法、伽玛是核辐射粒子/射线，与日常无线电无关。","m":"VHF/UHF能量低，电离不了属非电离","g":""},{"i":"A-666","j":"LK0996","p":"5.1.3","q":"业余电台安装防雷装置是为了防止雷电危害。传统防雷装置的主要组成部分包括：","o":["接闪器（避雷针）、引下线、接地体","天线、断路器、地线","避雷针、氖灯、自复保险丝","避雷针、氧化锌过压保护器、断路器"],"a":[0],"e":"传统防雷三件套：接闪器（避雷针）接闪、引下线引流、接地体泄流，缺一不可。B 的断路器、C 的氖灯保险丝、D 的过压保护器都不是传统防雷的基本组成。","m":"防雷三件套：接闪引下加接地","g":""},{"i":"A-667","j":"LK0997","p":"5.1.3","q":"防雷接地的作用是：","o":["把接闪器引入的雷击电流有效地泄入大地","用接闪器感应到的雷电高压启动过压保护电路","有效地阻断接闪器引入的雷击电流使其不致流入大地","当接闪器引入雷击电流时迅速烧断熔丝，阻断其流动"],"a":[0],"e":"防雷接地的唯一作用是把接闪器引入的雷击电流以最低阻抗泄入大地。B、C、D 把接地说成阻断、烧断或启动保护，都是反的——接地是泄放通道不是开关。","m":"接地为泄流，不是为阻断","g":""},{"i":"A-668","j":"LK0998","p":"5.1.3","q":"关于防雷装置的接地，最基本要求为：","o":["要有单独的接地体，接地电阻要小，接闪器到接地体之间的引下线应尽量短而粗","可以利用自来水管作为接地体，如果这种管线有相当长的一段是埋入地下的","交流电网的“零线”在配电系统中已经接地。这可代替防雷接地体及其引下线","接闪器到接地体之间的引下线平时没有电流流过，采用直径 0.5毫米的导线足矣"],"a":[0],"e":"接地基本要求：独立接地体、接地电阻尽量小、引下线短而粗以减小雷电流通道阻抗。水管、零线不能替代专用接地体；0.5mm 细线扛不住数十千安培的雷电流。","m":"接地体要独立，电阻小、引线短而粗","g":""},{"i":"A-669","j":"LK0999","p":"5.1.3","q":"对于一般建筑物，单支避雷针的保护范围至多能有多大：","o":["在避雷针顶点至地面之间，由 60米半径滚球曲线所构成的空间","在任何情况下，避雷针都可以保护其周边低于避雷针高度的空间","在任何情况下，避雷针都可以保护其周边半径 30米之内的物体","从避雷针顶点起、以避雷针高度为半径所做半球体以内的空间"],"a":[0],"e":"按滚球法，单支避雷针的保护范围是以 60 米为半径的滚球在针尖与地面之间滚动所切出的空间。B、C 的“任何情况”、D 的半球体都不符合滚球法计算。","m":"单针保护看滚球，六十米半径滚一圈","g":""},{"i":"A-670","j":"LK1125","p":"5.1.3","q":"下列哪种导电材料最适宜连接天线、塔架和入室馈线等处的各个接地部件？","o":["镀银软铜丝编织扁带","圆形铜包钢单股导线","以太网双绞线","50-3同轴电缆"],"a":[0],"e":"接地连接要求低阻抗、低电感且耐弯折，镀银软铜丝编织扁带截面大、集肤效应小、柔软易施工，最适宜。铜包钢单股电感大，双绞线、同轴电缆根本不是接地材料。","m":"接地连线用扁带，低感柔软银铜编","g":""},{"i":"A-671","j":"LK1228","p":"5.1.3","q":"在为同轴馈线安装避雷器时应当注意什么？","o":["将所有避雷器的地线接到同一个金属条带上，然后将条带可靠连到室外的接地处","在每个避雷器的地线连接处安装开关以在发信时断开，防止射频电流损伤避雷器","将每个避雷器的接地连线都单独引出，然后将它们与电台的地线连在一起","可用廉价的氖灯或气体放电管自制避雷器。这样的 DIY可谓经济实用，效果卓著"],"a":[0],"e":"避雷器地线须接到同一金属条带再统一引至室外接地，保证等电位，避免地电位差反击。发信时断开地线、单独引线再并接都会制造电位差；氖灯自制避雷器不可靠。","m":"避雷器地线先共条带，再一起入地保等电位","g":""},{"i":"A-672","j":"LK1232","p":"5.1.3","q":"以下哪一项是天线铁塔防雷接地的有效措施？","o":["接地连接要尽可能地短而直","确保需要弯折的地线已做干净漂亮的直角弯","为接地系统做好防水处理","打入地下的接地装置应当尽量远离天线塔"],"a":[0],"e":"雷电流是高频大电流，弯折会产生感抗与反击电压，故接地连接务必短而直。做漂亮直角弯反而增大电感；远离塔打接地体增加引线长度，适得其反。","m":"接地线走短直，忌弯折防反击","g":""},{"i":"A-673","j":"LK1000","p":"5.1.4","q":"考虑实际工作环境必然存在一定的湿度，则根据 GB/T 3805－2008《特低电压 ELV限值》在潮湿条件下的限值，当人体握紧某个带电零件时，零件与人体间的电压不可高于：","o":["交流 16V（r.m.s.），直流 33V","交流 24V（r.m.s.），直流 36V","交流 36V（r.m.s.），直流 24V","交流 6.3V（r.m.s.），直流 13.8V"],"a":[0],"e":"GB/T 3805-2008 规定潮湿条件下特低电压限值为交流 16V 有效值、直流 33V（干燥条件更宽松）。B 的 24/36 是误记，C 把交直流值对调，D 的 6.3/13.8 无依据。","m":"潮湿限值记住：交流十六直流三三","g":""},{"i":"A-674","j":"LK1001","p":"5.1.4","q":"假如接触电压相同，则触及带有射频电压（例如，频率不低于 LF）的裸露导线与触及带有直流或交流 50Hz电压的裸露导线相比，人体所受的安全威胁有什么不同？","o":["致死风险有所下降，但是灼伤皮肤或深层皮下组织的风险显著上升","更容易导致神经系统损伤或使心肺功能紊乱，存在更高的致死风险","射频交流电从不威胁人身安全，所以发射机的天线都可以随意触摸","触及不同频率但电压相同的交流电，人体当然面临相同的安全威胁"],"a":[0],"e":"射频电流趋肤效应集中在体表，高频下神经肌肉刺激阈值提高，致死（室颤）风险下降，但集中在浅表的能量极易灼伤皮肤及皮下组织。B 说反了致死风险；C、D 否认射频危害也是错的。","m":"射频不易电死人，却易烧伤皮和肉","g":""},{"i":"A-675","j":"LK1043","p":"5.1.4","q":"如果用两手分别接触电压有效值相同但频率不同的电路的两个端点，则所受安全威胁由大到小可以排序为：","o":["工频交流电、HF射频交流电、UHF射频交流电","UHF射频交流电、HF射频交流电、工频交流电","HF射频交流电、工频交流电、UHF射频交流电","HF射频交流电、UHF射频交流电、工频交流电"],"a":[0],"e":"对人体威胁主要看能否引起室颤：工频 50Hz 最易引发室颤，威胁最大；频率升高刺激效应减弱，故 HF 小于工频、UHF 更小于 HF。","m":"频率越高越安全：工频＞HF＞UHF","g":""},{"i":"A-676","j":"LK1040","p":"5.1.4","q":"如果不得已，必须带电检修由市电供电的无线电设备，则应做到：","o":["双脚与地绝缘，单手操作，另一只手不触摸机壳等任何与电路或接地有关的金属件","双脚与地绝缘，单手操作，另一只手通过触摸机壳或水管等接地物件探测是否有电","只要设备外壳良好接地，双脚是否与地绝缘、双手是否同时操作都不存在安全风险","只要设备外壳与地绝缘，双脚是否与地绝缘、双手是否同时操作都不存在安全关系"],"a":[0],"e":"带电检修保命三原则：双脚对地绝缘切断回路、单手操作避免双手间电流穿过心脏、另一手远离一切接地金属。B 让另一手摸地试探极危险；C、D 的“接地或绝缘就无风险”是麻痹大意。","m":"带电检修：绝缘站立单手干，另一手绝不碰地","g":""},{"i":"A-677","j":"LK1227","p":"5.1.4","q":"设备的外壳带电可能危及人身安全。相关预防措施包括：","o":["对于使用交流市电供电的设备，应将其金属机箱与某个可靠的公共地线相连","应在供电线路中安装漏电保护器，以在发生漏电时迅速切断供电","如果某设备使用了带有单独保护地线的三线插头，则必须确认接地是有效的","公共地线应具有较低的接地电阻，与自来水管道相连是个一劳永逸的好主意"],"a":[0,1,2],"e":"防机壳带电：金属机箱接可靠公共地、供电回路装漏电保护器、三线插头的保护地必须确认有效，三者缺一不可。D 错误：自来水管可能含塑料管段、电阻大且不可靠，不能替代专用地线。","m":"机壳带电三防：接地、漏保、验地线；水管不能当地线","g":""},{"i":"A-678","j":"LK1233","p":"5.1.4","q":"即使设备的电源线已经拔掉，检修时仍可能遇到什么安全风险？","o":["充满高电压的电容器可能让维修者遭遇电击风险","地磁活动可在变压器中激起高压，电到维修人员","打开电源设备或电子管线性放大器的机箱，其内置保险丝就会烧断","如果打开机箱，静电放电就可能损坏设备的接地系统"],"a":[0],"e":"拔掉电源线后，高压滤波电容仍储存足以致命的电荷，检修前必须放电验电。地磁感应、保险丝烧断、静电损坏接地系统都不是拔电后的主要风险。","m":"拔了电源别大意，电容存电仍咬人","g":""},{"i":"A-679","j":"LK1234","p":"5.1.4","q":"自制由 220伏交流市电供电的设备，安全措施应至少包括：","o":["在交流电源入口的火线中串联一个保险丝","在交流供电入口处并联一个交流电压表","在交流供电入口处串联一个电感","在交流供电入口处并联一个电容"],"a":[0],"e":"220V 市电设备须在火线入口串联保险丝，短路过载时熔断保安全，这是最低要求。并联电压表、电感、电容都不提供过流保护。","m":"市电入口火线串保险，短路过载它先断","g":""},{"i":"A-680","j":"LX","p":"5.1.4","q":"如何确保自制的业余无线电作品具有较高的用电安全性？","o":["使用三芯电源线和金属机箱，将机箱与市电插座的地线可靠连接","如果设备内部含有高压整流装置，则为其滤波电容并联泄放电阻","为业余自制的射频功率放大器安装断开市电供应的机箱联动开关","为配电箱和天馈系统的配线柜安装喷淋装置，发现火警立即喷水"],"a":[0,1,2],"e":"自制设备用电安全三招：三芯线加金属机箱可靠接地、高压滤波电容并联泄放电阻、功放机箱装断电联动开关。D 错误：电气火灾用水喷淋会导电扩大事故，应用二氧化碳或干粉灭火器。","m":"接地泄放联动断，电气失火忌用水","g":""},{"i":"A-681","j":"LK1230","p":"5.1.5","q":"使用普通 12伏铅酸蓄电池为电台供电存在什么潜在风险？","o":["如果通风不良，会有爆炸性气体聚集","有高电压，存在触电风险","会释放臭氧，进而污染大气层","若长时间闲置不用就可能自燃"],"a":[0],"e":"铅酸电池充电析出氢气，通风不良时聚集到爆炸极限，遇火花即爆。12V 不存在触电风险；臭氧、自燃都不是其主要风险。","m":"铅酸充电冒氢气，不通风会爆炸","g":""},{"i":"A-682","j":"LK1231","p":"5.1.5","q":"如果铅酸蓄电池的充电或放电过程过快会有什么风险？","o":["电池可能过热，甚至释放氢气，抬升爆炸风险","电压会变为负值，导致电池报废。这就是所谓“反极”","导致“记忆效应”，从而使电池的可用容量下降","可能导致过高的电池电压，抬升触电风险"],"a":[0],"e":"过快充放电使电池内阻发热、温度失控，并加速析氢，爆炸风险陡增。“反极”、记忆效应（镍镉电池的）、触电都不是铅酸快充放的主风险。","m":"快充快放发热快，氢气一冒爆炸来","g":""},{"i":"A-683","j":"LK1039","p":"5.1.5","q":"电台室如遇电气设备、电线电缆或者电源装置失火，正确的处置应当为：","o":["立即切断所有供电，使用二氧化碳灭火器或干粉灭火器","立即切断所有供电，使用泡沫灭火器灭火。不得已时可用干砂灭火","立即切断所有供电，用水灭火","迅速起身逃离火场"],"a":[0],"e":"电气火灾先切断一切供电，再用二氧化碳或干粉灭火器（不导电、不留残渣）。泡沫、用水都会导电或损坏设备；只逃不救则火势蔓延。","m":"电气失火先断电，二氧化碳干粉灭","g":""}]};

<script>
/* HAM Exam — 零依赖业余无线电刷题站 */
"use strict";

/* ================= 工具 ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LETTERS = ["A", "B", "C", "D"];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmtTime(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = String(m).padStart(2, "0"), ss = String(sec).padStart(2, "0");
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 2200);
}
function confirmDialog(title, body, okText = "确定") {
  return new Promise(resolve => {
    const mask = document.createElement("div");
    mask.className = "dialog-mask";
    mask.innerHTML = `<div class="dialog"><h3>${esc(title)}</h3><p>${esc(body)}</p>
      <div class="btn-row" style="justify-content:flex-end">
        <button class="btn ghost" data-r="0">取消</button>
        <button class="btn primary" data-r="1">${esc(okText)}</button>
      </div></div>`;
    mask.addEventListener("click", e => {
      const b = e.target.closest("[data-r]");
      if (b || e.target === mask) { mask.remove(); resolve(b ? b.dataset.r === "1" : false); }
    });
    document.body.appendChild(mask);
  });
}

/* ================= 存储（按题库隔离） ================= */
const GKEY = "hamex.global.v1";
const BKEY = id => `hamex.bank.${id}.v1`;
const global = (() => {
  try { return Object.assign({ bank: "a", theme: "auto" }, JSON.parse(localStorage.getItem(GKEY) || "{}")); }
  catch { return { bank: "a", theme: "auto" }; }
})();
const saveGlobal = () => localStorage.setItem(GKEY, JSON.stringify(global));

function stateDefaults() {
  return { qstats: {}, wrong: {}, exams: [], session: null, drill: null };
}
let S = stateDefaults();
function loadState() {
  try { S = Object.assign(stateDefaults(), JSON.parse(localStorage.getItem(BKEY(global.bank)) || "{}")); }
  catch { S = stateDefaults(); }
}
const saveState = () => localStorage.setItem(BKEY(global.bank), JSON.stringify(S));

/* ================= 题库加载 ================= */
const BANKS = window.BANKS = window.BANKS || {};
const BANK_LIST = ["a", "b", "c"];
const bankLoading = {};
function loadBank(id) {
  if (BANKS[id]) return Promise.resolve(BANKS[id]);
  if (!bankLoading[id]) {
    bankLoading[id] = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = `banks/bank-${id}.js`;
      s.onload = () => (BANKS[id] ? res(BANKS[id]) : rej(new Error("题库格式异常")));
      s.onerror = () => { delete bankLoading[id]; rej(new Error("题库加载失败")); };
      document.head.appendChild(s);
    });
  }
  return bankLoading[id];
}
const bank = () => BANKS[global.bank];

function byId() {
  const b = bank();
  if (!b._map) {
    b._map = new Map(b.qs.map((q, i) => [q.i, i]));
    b._secIdx = {};
    b.qs.forEach((q, i) => (b._secIdx[q.p.slice(0, q.p.lastIndexOf("."))] ??= []).push(i));
  }
  return b;
}
const qIndex = qid => byId()._map.get(qid);

/* 统计辅助：题干记录 */
function recordAnswer(qid, correct) {
  const st = (S.qstats[qid] ??= { s: 0, c: 0, w: 0, l: 0 });
  st.s++; correct ? st.c++ : st.w++; st.l = Date.now();
  if (!correct) {
    S.wrong[qid] = { n: 0, ts: Date.now() };
  } else if (S.wrong[qid]) {
    S.wrong[qid].n++;
    if (S.wrong[qid].n >= 2) delete S.wrong[qid]; // 连对两次移出错题本
  }
  saveState();
}
function recordSeen(qid) {
  const st = (S.qstats[qid] ??= { s: 0, c: 0, w: 0, l: 0 });
  st.s++; st.l = Date.now();
  saveState();
}

/* ================= 题目渲染（选项打乱） ================= */
function questionCard(q, { mode, shuffleOpts = true }) {
  // 官方源数据单选答案恒为 A（正确项排在首位），练习时必须打乱选项。
  // 背题/查看保持原序：解析文本中的字母引用（"故D错"等）按原始顺序书写。
  const order = shuffleOpts ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3];
  const isMulti = q.a.length > 1;
  const card = document.createElement("div");
  card.className = "card";
  const sec = q.p.slice(0, q.p.lastIndexOf("."));
  const secName = bank().sections[sec] || sec;
  card.innerHTML = `
    <div class="q-head">
      <span class="chip green">${esc(q.j)}</span>
      <span class="chip">${esc(q.p)} ${esc(secName)}</span>
      ${isMulti ? '<span class="chip amber">多选</span>' : ""}
      ${mode === "exam" ? "" : ""}
    </div>
    <div class="q-text">${esc(q.q)}</div>
    ${q.g ? `<img class="q-img" src="${q.g.startsWith("data:") ? "" : "banks/"}${q.g}" alt="题目附图" loading="lazy">` : ""}
    <div class="opts"></div>
    <div class="drill-foot"></div>`;
  const optsEl = $(".opts", card);
  const footEl = $(".drill-foot", card);
  const keyMap = new Map(); // displayIdx -> originalIdx

  order.forEach((origIdx, dIdx) => keyMap.set(dIdx, origIdx));
  const correctD = order.map((o, d) => (q.a.includes(o) ? d : -1)).filter(i => i >= 0);

  order.forEach((origIdx, dIdx) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    b.dataset.d = dIdx;
    b.innerHTML = `<span class="key">${LETTERS[dIdx]}</span><span>${esc(q.o[origIdx])}</span>`;
    optsEl.appendChild(b);
  });

  function paint(pickSet, revealed) {
    $$(".opt", optsEl).forEach(b => {
      const d = +b.dataset.d;
      b.disabled = !!revealed;
      b.classList.toggle("picked", !revealed && pickSet.has(d));
      if (revealed) {
        b.classList.toggle("correct", correctD.includes(d));
        b.classList.toggle("wrong", pickSet.has(d) && !correctD.includes(d));
      } else b.classList.remove("correct", "wrong");
    });
  }
  // 原始下标 -> 展示字母
  const disp = origIdx => LETTERS[order.indexOf(origIdx)];
  // 把解析/助记里的原始选项字母重映射为当前展示字母。
  // 只处理独立的 A-D（前后非字母数字，排除 "A类/B类"、"GB8702"、"D-STAR"、"BPSK" 等）。
  const remap = text => String(text || "").replace(
    /(?<![A-Za-z0-9-])([A-D]{1,4})(?![A-Za-z0-9-]|\s*类)/g,
    run => run.split("").map(c => disp(c.charCodeAt(0) - 65)).join("")
  );
  return { card, optsEl, footEl, keyMap, correctD, isMulti, paint, disp, remap, shuffled: shuffleOpts };
}

/* ================= 路由 ================= */
const routes = [
  [/^#\/home$/, () => viewHome],
  [/^#\/chapters$/, () => viewChapters],
  [/^#\/wrong$/, () => viewWrong],
  [/^#\/exam$/, () => viewExam],
  [/^#\/stats$/, () => viewStats],
  [/^#\/search(?:\/(.*))?$/, m => () => viewSearch(decodeURIComponent(m[1] || ""))],
  [/^#\/q\/(.+)$/, m => () => viewQuestion(m[1])],
  [/^#\/drill\/(practice|recite)\/(.+)$/, m => () => viewDrill(m[1], m[2])],
];
let keyHandler = null;
let examTimer = null;

async function route() {
  const hash = location.hash || "#/home";
  if (keyHandler) { keyHandler = null; }
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  try { await loadBank(global.bank); } catch (e) {
    $("#view").innerHTML = `<div class="empty">题库加载失败：${esc(e.message)}，请刷新重试</div>`;
    return;
  }
  let view = null, name = "home";
  for (const [re, fn] of routes) {
    const m = hash.match(re);
    if (m) { view = fn(m); name = hash.slice(2, 12); break; }
  }
  if (!view) { location.hash = "#/home"; return; }
  const v = $("#view");
  v.scrollTop = 0;
  const tab = name.split("/")[0];
  setActiveTab(["home", "chapters", "wrong", "exam", "stats", "search"].includes(tab) ? tab : "");
  v.innerHTML = "";
  view();
  $("#footState").textContent = `${bank().label} · ${bank().qs.length} 题`;
}

/* ================= 范围解析 ================= */
function scopeIndexes(scope) {
  const b = byId();
  if (scope === "all") return b.qs.map((_, i) => i);
  if (scope === "wrong") return Object.keys(S.wrong).map(qIndex).filter(i => i != null);
  if (scope.startsWith("ch-")) {
    const ch = scope.slice(3);
    return b.qs.map((q, i) => (q.p.startsWith(ch + ".") ? i : -1)).filter(i => i >= 0);
  }
  if (scope.startsWith("sec-")) {
    const sec = scope.slice(4);
    return (b._secIdx[sec] || []).slice();
  }
  return [];
}
function scopeTitle(scope) {
  const b = bank();
  if (scope === "all") return "全部题目";
  if (scope === "wrong") return "错题重刷";
  if (scope.startsWith("ch-")) return `第 ${scope.slice(3)} 章 · ${b.chapters[scope.slice(3)] || ""}`;
  if (scope.startsWith("sec-")) {
    const sec = scope.slice(4);
    return `${sec} · ${b.sections[sec] || ""}`;
  }
  return scope;
}

/* ================= 刷题 / 背题 ================= */
function startDrill(mode, scope, random) {
  const idx = scopeIndexes(scope);
  if (!idx.length) { toast("该范围暂无题目"); return; }
  const order = random ? shuffle(idx) : idx;
  S.drill = { mode, scope, order, pos: 0, shuffle: !!random };
  saveState();
  location.hash = `#/drill/${mode}/${scope}`;
}

function viewDrill(mode, scope) {
  const v = $("#view");
  const b = bank();
  // 恢复或新建
  if (!S.drill || S.drill.mode !== mode || S.drill.scope !== scope) {
    const idx = scopeIndexes(scope);
    if (!idx.length) {
      v.innerHTML = `<div class="empty">该范围没有题目${scope === "wrong" ? "，错题本是空的 🎉" : ""}<div style="margin-top:14px"><a class="btn" href="#/home">回首页</a></div></div>`;
      return;
    }
    S.drill = { mode, scope, order: idx, pos: 0, shuffle: false };
    saveState();
  }
  const D = S.drill;
  if (D.pos >= D.order.length) {
    v.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="6"/><path d="M8.5 13 7 22l5-3 5 3-1.5-9"/></svg>
      ${mode === "recite" ? "过完了！" : "刷完了！"}共 ${D.order.length} 题
      <div class="btn-row" style="justify-content:center;margin-top:16px">
        <a class="btn" href="#/home">回首页</a>
        <button class="btn primary" id="againBtn">再来一轮</button>
      </div></div>`;
    $("#againBtn").onclick = () => startDrill(mode, scope, D.shuffle);
    return;
  }

  const qi = D.order[D.pos];
  const q = b.qs[qi];
  let pick = new Set();
  let done = false;

  v.innerHTML = `
    <div class="drill-bar">
      <a class="btn sm ghost" href="${scope === "wrong" ? "#/wrong" : scope === "all" ? "#/home" : "#/chapters"}">退出</a>
      <div class="meter"><i style="width:${Math.round((D.pos / D.order.length) * 100)}%"></i></div>
      <span class="pos">${D.pos + 1} / ${D.order.length}</span>
    </div>
    <div id="qbox"></div>`;

  const qc = questionCard(q, { mode, shuffleOpts: mode !== "recite" });
  $("#qbox").appendChild(qc.card);

  if (mode === "recite") {
    // 背题：直接揭示答案（空选择集 → 不标错误项，只高亮正确项）
    qc.paint(new Set(), true);
    $$(".opt", qc.optsEl).forEach(b2 => {
      const d = +b2.dataset.d;
      const orig = qc.keyMap.get(d);
      if (q.a.includes(orig)) b2.classList.add("correct");
    });
    const box = document.createElement("div");
    box.className = "explain";
    box.innerHTML = `<b>答案 ${q.a.map(i => LETTERS[i]).join("")}${q.a.length > 1 ? "（多选）" : ""}</b>${q.g ? "" : ""}
      ${q.e ? esc(q.e) : "（本题暂无解析）"}${q.m ? `<div class="mnemonic">${esc(q.m)}</div>` : ""}`;
    qc.card.insertBefore(box, qc.footEl);
    recordSeen(q.i);
    qc.footEl.innerHTML = `<span></span><button class="btn primary" id="nextBtn">下一题（Enter）</button>`;
    $("#nextBtn").onclick = next;
    keyHandler = e => { if (e.key === "Enter") next(); };
  } else {
    const submit = () => {
      if (done || !pick.size) return;
      done = true;
      const picked = [...pick].map(d => qc.keyMap.get(d)).sort();
      const correct = picked.length === q.a.length && picked.every((x, i) => x === q.a[i]);
      qc.paint(pick, true);
      recordAnswer(q.i, correct);
      const verdict = document.createElement("div");
      verdict.className = `verdict ${correct ? "ok" : "no"}`;
      verdict.textContent = correct ? "✓ 回答正确" : `✗ 答错了，正确答案 ${q.a.map(i => qc.disp(i)).join("")}`;
      qc.card.insertBefore(verdict, qc.footEl);
      const box = document.createElement("div");
      box.className = "explain";
      box.innerHTML = `<b>解析</b>${q.e ? esc(qc.remap(q.e)) : "（本题暂无解析）"}${q.m ? `<div class="mnemonic">${esc(qc.remap(q.m))}</div>` : ""}`;
      qc.card.insertBefore(box, qc.footEl);
      $("#confirmBtn")?.remove();
      const last = D.pos === D.order.length - 1;
      qc.footEl.innerHTML = `<button class="btn ghost" id="stopBtn">退出</button>
        <button class="btn primary" id="nextBtn">${last ? "完成" : "下一题（Enter）"}</button>`;
      $("#nextBtn").onclick = next;
      $("#stopBtn").onclick = () => (location.hash = "#/home");
      keyHandler = e => { if (e.key === "Enter") next(); };
    };
    const pickAt = d => {
      if (done) return;
      if (qc.isMulti) {
        pick.has(d) ? pick.delete(d) : pick.add(d);
        qc.paint(pick);
        $("#confirmBtn")?.toggleAttribute("disabled", !pick.size);
      } else {
        pick = new Set([d]);
        qc.paint(pick);
        submit();
      }
    };
    qc.optsEl.onclick = e => {
      const b2 = e.target.closest(".opt");
      if (b2) pickAt(+b2.dataset.d);
    };
    if (qc.isMulti) {
      qc.footEl.innerHTML = `<span class="chip amber">多选题：选齐后确认</span>
        <button class="btn primary" id="confirmBtn" disabled>确认（Enter）</button>`;
      $("#confirmBtn").onclick = submit;
      keyHandler = e => {
        const n = "1234".indexOf(e.key), l = "abcd".indexOf(e.key.toLowerCase());
        const d = n >= 0 ? n : l;
        if (d >= 0) pickAt(d);
        if (e.key === "Enter" && pick.size && !done) submit();
        else if (e.key === "Enter" && done) next();
      };
    } else {
      keyHandler = e => {
        const n = "1234".indexOf(e.key), l = "abcd".indexOf(e.key.toLowerCase());
        const d = n >= 0 ? n : l;
        if (d >= 0 && !done) pickAt(d);
        else if (e.key === "Enter" && done) next();
      };
    }
  }

  function next() {
    D.pos++;
    saveState();
    viewDrill(mode, scope);
    $("#view").scrollTop = 0;
  }
}

/* ================= 章节 ================= */
function sectionStat(sec) {
  const b = byId();
  const idx = b._secIdx[sec] || [];
  let seen = 0, c = 0, w = 0;
  idx.forEach(i => {
    const st = S.qstats[b.qs[i].i];
    if (st) { seen++; c += st.c; w += st.w; }
  });
  const answered = c + w;
  return { total: idx.length, seen, acc: answered ? Math.round((c / answered) * 100) : null };
}
function viewChapters() {
  const v = $("#view");
  const b = byId();
  const secs = [...new Set(b.qs.map(q => q.p.slice(0, q.p.lastIndexOf("."))))].sort();
  const byChapter = {};
  secs.forEach(s => (byChapter[s.split(".")[0]] ??= []).push(s));
  let html = `<h1 class="page-title">章节练习<small>${esc(bank().label)}</small></h1>`;
  Object.keys(b.chapters).sort().forEach(ch => {
    const list = byChapter[ch] || [];
    const total = list.reduce((n, s) => n + (b._secIdx[s] || []).length, 0);
    html += `<div class="chap-head">第 ${ch} 章 · ${esc(b.chapters[ch])}<span class="n">${total} 题</span></div><div class="list">`;
    list.forEach(sec => {
      const st = sectionStat(sec);
      html += `<a class="row" href="#/drill/practice/sec-${sec}">
        <div class="grow"><div class="name">${sec} ${esc(bank().sections[sec] || "")}</div>
        <div class="sub"><span>${st.total} 题</span><span>已练 ${st.seen}</span><span>${st.acc != null ? "正确率 " + st.acc + "%" : "未练习"}</span></div></div>
        <div class="mini-meter"><i style="width:${st.total ? Math.round((st.seen / st.total) * 100) : 0}%"></i></div>
        <span class="arrow">›</span></a>`;
    });
    html += `</div>`;
  });
  v.innerHTML = html;
}

/* ================= 错题本 ================= */
function viewWrong() {

  }
  let html = `<h1 class="page-title">错题本<small>${ids.length} 题 · 答对两次自动移除</small></h1>
    <div class="btn-row" style="margin-bottom:14px">
      <a class="btn primary" href="#/drill/practice/wrong">重刷错题</a>
      <a class="btn" href="#/drill/recite/wrong">背诵错题</a>
    </div><div class="list">`;
  ids.forEach(qid => {
    const q = b.qs[qIndex(qid)];
    if (!q) return;
    html += `<a class="row" href="#/q/${qid}">
      <div class="grow"><div class="name">${esc(q.q.slice(0, 60))}${q.q.length > 60 ? "…" : ""}</div>
      <div class="sub"><span>${esc(q.j)}</span><span>${esc(q.p)}</span><span>连对 ${S.wrong[qid].n}/2 移除</span></div></div>
      <span class="arrow">›</span></a>`;
  });
  html += `</div>`;
  v.innerHTML = html;
}

/* ================= 单题查看 ================= */
function viewQuestion(qid) {
  const v = $("#view");
  const q = bank().qs[qIndex(qid)];
  if (!q) { v.innerHTML = `<div class="empty">题目不存在</div>`; return; }
  v.innerHTML = `<div class="btn-row" style="margin-bottom:12px"><a class="btn sm ghost" href="javascript:history.back()">‹ 返回</a></div><div id="qbox"></div>`;
  const qc = questionCard(q, { mode: "recite", shuffleOpts: false });
  $("#qbox").appendChild(qc.card);
  $$(".opt", qc.optsEl).forEach(b2 => {
    const orig = qc.keyMap.get(+b2.dataset.d);
    if (q.a.includes(orig)) b2.classList.add("correct");
  });
  const box = document.createElement("div");
  box.className = "explain";
  box.innerHTML = `<b>答案 ${q.a.map(i => LETTERS[i]).join("")}${q.a.length > 1 ? "（多选）" : ""}</b>
    ${q.e ? esc(q.e) : "（本题暂无解析）"}${q.m ? `<div class="mnemonic">${esc(q.m)}</div>` : ""}`;
  qc.card.appendChild(box);
}

/* ================= 模拟考试 ================= */
function drawExam(b) {
  const singles = shuffle(b.qs.map((q, i) => (q.a.length === 1 ? i : -1)).filter(i => i >= 0)).slice(0, b.rule.singles);
  const multis = shuffle(b.qs.map((q, i) => (q.a.length > 1 ? i : -1)).filter(i => i >= 0)).slice(0, b.rule.multiples);
  return [...singles, ...multis];
}
function viewExam() {
  const v = $("#view");
  const b = bank();

  // 有未完成会话：过期则判分，否则询问是否继续
  if (S.session) {
    if (Date.now() >= S.session.endsAt) { gradeExam(true); return; }
    v.innerHTML = `<h1 class="page-title">模拟考试<small>${esc(b.label)}</small></h1>
      <div class="card">
        <h2>有一场进行中的考试</h2>
        <p style="color:var(--ink-2);font-size:14px">剩余 ${fmtTime(S.session.endsAt - Date.now())}，已答 ${Object.keys(S.session.ans).length}/${S.session.qids.length} 题。考试计时不会暂停。</p>
        <div class="btn-row"><button class="btn primary" id="resumeBtn">继续作答</button>
        <button class="btn danger" id="discardBtn">放弃这场</button></div>
      </div>`;
    $("#resumeBtn").onclick = examRun;
    $("#discardBtn").onclick = async () => {
      if (await confirmDialog("放弃考试", "本场成绩将不计入历史，确定放弃？", "放弃")) { S.session = null; saveState(); viewExam(); }
    };
    return;
  }

  const rule = b.rule;
  v.innerHTML = `<h1 class="page-title">模拟考试<small>${esc(b.label)}</small></h1>
    <div class="card">
      <h2>${esc(b.cls)} 类考核规格</h2>
      <div class="rule-note">
        试卷共 <b>${rule.total}</b> 题：单选 <b>${rule.singles}</b> + 多选 <b>${rule.multiples}</b>；限时 <b>${rule.minutes}</b> 分钟；
        答对 <b>${rule.pass}</b> 题及以上合格。<br>多选题须与标准答案<b>完全一致</b>才得分，漏选错选均不得分。选项顺序已打乱。
      </div>
      <div class="btn-row"><button class="btn primary" id="startBtn">开始考试</button></div>
    </div>
    ${S.exams.length ? `<div class="card"><h2>最近成绩</h2><div class="list">${S.exams.slice(0, 5).map(e =>
      `<div class="row"><div class="grow"><div class="name">${fmtDate(e.ts)}</div><div class="sub">单选 ${e.singleOk}/${rule.singles} · 多选 ${e.multiOk}/${rule.multiples}</div></div>
       <span class="chip ${e.passed ? "green" : "red"}">${e.score} / ${e.total} ${e.passed ? "合格" : "未过"}</span></div>`).join("")}</div></div>` : ""}`;
  $("#startBtn").onclick = () => {
    S.session = {
      qids: drawExam(b).map(i => b.qs[i].i),
      ans: {},
      pos: 0,
      endsAt: Date.now() + rule.minutes * 60000,
    };
    saveState();
    examRun();
  };
}

function examRun() {
  const v = $("#view");
  const b = bank();
  const ss = S.session;
  const qids = ss.qids;

  let pos = Math.min(ss.pos || 0, qids.length - 1);
  const renderQ = () => {
    const q = b.qs[qIndex(qids[pos])];
    const saved = ss.ans[q.i] || null;
    const isMulti = q.a.length > 1;
    const qc = questionCard(q, { mode: "exam" });
    $$(".opt", qc.optsEl).forEach(btn => {
      const orig = qc.keyMap.get(+btn.dataset.d);
      if (saved && saved.includes(orig)) btn.classList.add("picked");
    });
    qc.optsEl.onclick = e => {
      const btn = e.target.closest(".opt");
      if (!btn) return;
      const orig = qc.keyMap.get(+btn.dataset.d);
      let cur = ss.ans[q.i] || [];
      if (isMulti) {
        cur = cur.includes(orig) ? cur.filter(x => x !== orig) : [...cur, orig];
      } else {
        cur = [orig];
      }
      ss.ans[q.i] = cur.sort();
      saveState();
      $$(".opt", qc.optsEl).forEach(b2 => b2.classList.toggle("picked", (ss.ans[q.i] || []).includes(qc.keyMap.get(+b2.dataset.d))));
      if (!isMulti && pos < qids.length - 1) setTimeout(() => { pos++; ss.pos = pos; saveState(); renderAll(); }, 160);
      else updateGrid();
    };
    qc.footEl.remove();
    v.innerHTML = "";
    v.append(topBar(), qc.card, navBar());
    $("#view").scrollTop = 0;
    updateGrid();
  };
  const topBar = () => {
    const el = document.createElement("div");
    el.className = "exam-top";
    el.innerHTML = `<a class="btn sm ghost" href="#/home">退出</a>
      <span class="chip plain">第 ${pos + 1} / ${qids.length} 题</span>
      ${b.qs[qIndex(qids[pos])].a.length > 1 ? '<span class="chip amber">多选</span>' : '<span class="chip">单选</span>'}
      <span style="flex:1"></span><span class="timer" id="timer"></span>`;
    return el;
  };
  const navBar = () => {
    const el = document.createElement("div");
    el.innerHTML = `<div class="exam-grid" id="grid"></div>
      <div class="exam-nav">
        <button class="btn" id="prevBtn">‹ 上一题</button>
        <button class="btn primary" id="submitBtn">交卷</button>
        <button class="btn" id="nextBtn">下一题 ›</button>
      </div>`;
    return el;
  };
  const updateGrid = () => {
    const g = $("#grid");
    if (!g) return;
    g.innerHTML = qids.map((qid, i) => {
      const done = ss.ans[qid] && ss.ans[qid].length;
      return `<button class="${done ? "done" : ""} ${i === pos ? "cur" : ""}" data-i="${i}">${i + 1}</button>`;
    }).join("");
    g.onclick = e => {
      const btn = e.target.closest("[data-i]");
      if (btn) { pos = +btn.dataset.i; ss.pos = pos; saveState(); renderQ(); }
    };
  };
  const renderAll = () => renderQ();

  $("#view").addEventListener("click", async e => {
    if (e.target.closest("#prevBtn") && pos > 0) { pos--; ss.pos = pos; saveState(); renderQ(); }
    if (e.target.closest("#nextBtn") && pos < qids.length - 1) { pos++; ss.pos = pos; saveState(); renderQ(); }
    if (e.target.closest("#submitBtn")) {
      const unanswered = qids.filter(qid => !ss.ans[qid] || !ss.ans[qid].length).length;
      const msg = unanswered ? `还有 ${unanswered} 题未作答，确定交卷？` : "确定交卷？";
      if (await confirmDialog("交卷", msg, "交卷")) gradeExam(false);
    }
  });

  const tick = () => {
    const t = $("#timer");
    if (!t) return;
    const left = ss.endsAt - Date.now();
    t.textContent = fmtTime(left);
    t.classList.toggle("low", left < 5 * 60000);
    if (left <= 0) { gradeExam(true); return; }
  };
  tick();
  examTimer = setInterval(tick, 1000);
  keyHandler = e => {
    if (e.key === "ArrowLeft" && pos > 0) { pos--; ss.pos = pos; saveState(); renderQ(); }
    if (e.key === "ArrowRight" && pos < qids.length - 1) { pos++; ss.pos = pos; saveState(); renderQ(); }
    const n = "1234".indexOf(e.key), l = "abcd".indexOf(e.key.toLowerCase());
    const d = n >= 0 ? n : l;
    if (d >= 0) {
      const btn = $$(".opt", v)[d];
      if (btn) btn.click();
    }
  };
  renderQ();
}

function gradeExam(auto) {
  const b = bank();
  const ss = S.session;
  clearInterval(examTimer); examTimer = null;
  let score = 0, singleOk = 0, multiOk = 0;
  const wrongQids = [], byChapter = {};
  ss.qids.forEach(qid => {
    const q = b.qs[qIndex(qid)];
    const ans = ss.ans[qid] || [];
    const hasAns = ans.length > 0;
    const ok = hasAns && ans.length === q.a.length && ans.every((x, i) => x === q.a[i]);
    const ch = q.p[0];
    byChapter[ch] ??= { ok: 0, n: 0 };
    byChapter[ch].n++;
    if (ok) {
      score++; byChapter[ch].ok++;
      q.a.length === 1 ? singleOk++ : multiOk++;
      const st = (S.qstats[qid] ??= { s: 0, c: 0, w: 0, l: 0 });
      st.s++; st.c++; st.l = Date.now();
      if (S.wrong[qid]) { S.wrong[qid].n++; if (S.wrong[qid].n >= 2) delete S.wrong[qid]; }
    } else if (hasAns || auto) {
      wrongQids.push(qid);
      if (hasAns) { // 空交卷未作答的题只计错题清单，不污染练习统计
        const st = (S.qstats[qid] ??= { s: 0, c: 0, w: 0, l: 0 });
        st.s++; st.w++; st.l = Date.now();
        S.wrong[qid] = { n: 0, ts: Date.now() };
      }
    }
  });
  const passed = score >= b.rule.pass;
  S.exams.unshift({ ts: Date.now(), score, total: ss.qids.length, passed, singleOk, multiOk, byChapter, wrongQids: wrongQids.slice(0, 60) });
  S.exams = S.exams.slice(0, 30);
  S.session = null;
  saveState();
  examReport({ score, passed, singleOk, multiOk, byChapter, wrongQids, auto });
}

function examReport(r) {
  const v = $("#view");
  const b = bank();
  const rule = b.rule;
  const pct = Math.round((r.score / rule.total) * 100);
  v.innerHTML = `
    <div class="card score-hero">
      <div class="big ${r.passed ? "ok" : "no"}">${r.score} / ${rule.total}</div>
      <div class="sub">${r.passed ? "🎉 恭喜，达到合格线" : `差 ${rule.pass - r.score} 题达到合格线（${rule.pass} 题）`} · 正确率 ${pct}%${r.auto ? " · 已到时自动交卷" : ""}</div>
      <div class="kv" style="justify-content:center;margin-top:14px">
        <div class="item"><span class="k">单选</span><span class="v">${r.singleOk}<small> / ${rule.singles}</small></span></div>
        <div class="item"><span class="k">多选</span><span class="v">${r.multiOk}<small> / ${rule.multiples}</small></span></div>
      </div>
    </div>
    <div class="card"><h2>分章得分</h2><div class="bar-rows">
      ${Object.keys(b.chapters).sort().filter(ch => r.byChapter[ch]).map(ch => {
        const c = r.byChapter[ch];
        return `<div class="bar-row"><span class="nm">第${ch}章 ${esc(b.chapters[ch])}</span><span class="pc">${c.ok}/${c.n}</span>
          <div class="meter"><i style="width:${Math.round((c.ok / c.n) * 100)}%;background:${c.ok / c.n >= .6 ? "var(--accent)" : "var(--red)"}"></i></div></div>`;
      }).join("")}
    </div></div>
    ${r.wrongQids.length ? `<div class="card"><h2>错题回顾（${r.wrongQids.length}）</h2><div class="list">
      ${r.wrongQids.map(qid => {
        const q = b.qs[qIndex(qid)];
        return `<a class="row" href="#/q/${qid}"><div class="grow"><div class="name">${esc(q.q.slice(0, 52))}${q.q.length > 52 ? "…" : ""}</div>
          <div class="sub"><span>${esc(q.j)}</span><span>${esc(q.p)}</span></div></div><span class="arrow">›</span></a>`;
      }).join("")}
      <div class="btn-row" style="margin-top:10px"><a class="btn primary" href="#/drill/practice/wrong">全部加入错题重刷</a></div>
    </div></div>` : ""}
    <div class="btn-row" style="margin-top:16px">
      <button class="btn" id="againExamBtn">再考一场</button>
      <a class="btn ghost" href="#/stats">看统计</a>
    </div>`;
  $("#againExamBtn").onclick = () => viewExam();
}

/* ================= 统计 ================= */
function viewStats() {
  const v = $("#view");
  const b = byId();
  const stVals = Object.values(S.qstats);
  const seen = stVals.length;
  const answered = stVals.reduce((n, s) => n + s.c + s.w, 0);
  const correct = stVals.reduce((n, s) => n + s.c, 0);
  const acc = answered ? Math.round((correct / answered) * 100) : 0;

  const chapters = Object.keys(b.chapters).sort().map(ch => {
    let c = 0, w = 0, total = 0, s = 0;
    b.qs.forEach(q => {
      if (!q.p.startsWith(ch + ".")) return;
      total++;
      const st = S.qstats[q.i];
      if (st) { s++; c += st.c; w += st.w; }
    });
    const an = c + w;
    return { ch, total, s, acc: an ? Math.round((c / an) * 100) : null };
  });

  v.innerHTML = `<h1 class="page-title">学习统计<small>${esc(bank().label)}</small></h1>
    <div class="card"><div class="kv">
      <div class="item"><span class="k">已覆盖</span><span class="v">${seen}<small> / ${b.qs.length} 题（${Math.round((seen / b.qs.length) * 100)}%）</small></span></div>
      <div class="item"><span class="k">累计答题</span><span class="v">${answered}</span></div>
      <div class="item"><span class="k">正确率</span><span class="v">${answered ? acc + "%" : "—"}</span></div>
      <div class="item"><span class="k">错题在册</span><span class="v">${Object.keys(S.wrong).length}</span></div>
    </div></div>
    <div class="card"><h2>分章正确率</h2><div class="bar-rows">
      ${chapters.map(c => `<div class="bar-row"><span class="nm">第${c.ch}章 ${esc(b.chapters[c.ch])}（练过 ${c.s}/${c.total}）</span><span class="pc">${c.acc != null ? c.acc + "%" : "—"}</span>
        <div class="meter"><i style="width:${c.acc ?? 0}%;background:${(c.acc ?? 0) >= 75 ? "var(--accent)" : (c.acc ?? 0) >= 50 ? "var(--amber)" : "var(--red)"}"></i></div></div>`).join("")}
    </div></div>
    <div class="card"><h2>考试历史</h2>
      ${S.exams.length ? `<div class="list">${S.exams.map((e, i) =>
        `<div class="row"><div class="grow"><div class="name">${fmtDate(e.ts)}</div>
          <div class="sub">单选 ${e.singleOk} · 多选 ${e.multiOk}</div></div>
          <span class="chip ${e.passed ? "green" : "red"}">${e.score}/${e.total} ${e.passed ? "合格" : "未过"}</span></div>`).join("")}</div>`
      : `<div class="empty">还没考过模拟考试</div>`}
    </div>
    <div class="card"><h2>数据备份</h2>
      <p style="color:var(--ink-2);font-size:13px;margin:0 0 12px">学习进度存在浏览器本地。换设备/清缓存前请导出备份。</p>
      <div class="btn-row">
        <button class="btn" id="exportBtn">导出全部进度</button>
        <button class="btn" id="importBtn">导入</button>
        <input type="file" id="importFile" accept="application/json" hidden>
        <button class="btn danger" id="resetBtn">清空当前题库进度</button>
      </div>
    </div>`;

  $("#exportBtn").onclick = () => {
    const out = { app: "ham-exam", version: 1, exportedAt: new Date().toISOString(), banks: {} };
    BANK_LIST.forEach(id => {
      try { out.banks[id] = JSON.parse(localStorage.getItem(BKEY(id)) || "null"); } catch { out.banks[id] = null; }
    });
    out.global = JSON.parse(localStorage.getItem(GKEY) || "null");
    const blob = new Blob([JSON.stringify(out)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ham-exam-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $("#importBtn").onclick = () => $("#importFile").click();
  $("#importFile").onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.app !== "ham-exam" || !data.banks) throw new Error("格式不对");
      if (!(await confirmDialog("导入备份", "将覆盖所有题库的本地进度，确定？", "覆盖导入"))) return;
      Object.entries(data.banks).forEach(([id, st]) => st && localStorage.setItem(BKEY(id), JSON.stringify(st)));
      toast("导入完成");
      loadState(); route();
    } catch (err) { toast("导入失败：" + err.message); }
  };
  $("#resetBtn").onclick = async () => {
    if (await confirmDialog("清空进度", `将清空 ${esc(bank().label)}的练习记录、错题本与考试历史。`, "清空")) {
      localStorage.removeItem(BKEY(global.bank));
      loadState(); route();
      toast("已清空");
    }
  };
}

/* ================= 搜索 ================= */
function viewSearch(query) {
  const v = $("#view");
  const b = bank();
  const kw = query.trim().toLowerCase();
  const hits = kw ? b.qs.filter(q =>
    q.q.toLowerCase().includes(kw) || q.o.some(o => o.toLowerCase().includes(kw)) || q.j.toLowerCase().includes(kw)) : [];
  const mark = s => esc(s).replace(new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi"), "<mark>$1</mark>");
  v.innerHTML = `<h1 class="page-title">搜索<small>${kw ? `${hits.length} 条结果` : "题干 / 选项 / 题号"}</small></h1>
    <div class="search-bar"><input type="search" id="searchInput" placeholder="搜索题目，如：驻波比 / LK0996 / 144" value="${esc(kw)}"></div>
    ${kw && !hits.length ? `<div class="empty">没有匹配的题目</div>` : ""}
    <div class="list">${hits.slice(0, 100).map(q => {
      const st = S.qstats[q.i];
      return `<a class="row" href="#/q/${q.i}">
        <div class="grow"><div class="name">${mark(q.q.slice(0, 80))}${q.q.length > 80 ? "…" : ""}</div>
        <div class="sub"><span>${esc(q.j)}</span><span>${esc(q.p)}</span>${q.a.length > 1 ? "<span>多选</span>" : ""}${st && st.w ? `<span>错过 ${st.w} 次</span>` : ""}</div></div>
        <span class="arrow">›</span></a>`;
    }).join("")}</div>
    ${hits.length > 100 ? `<div class="empty">仅显示前 100 条</div>` : ""}`;
  const input = $("#searchInput");
  input.focus();
  let deb;
  input.oninput = () => {
    clearTimeout(deb);
    deb = setTimeout(() => {
      const val = input.value.trim();
      history.replaceState(null, "", val ? `#/search/${encodeURIComponent(val)}` : "#/search/");
      viewSearch(val);
      $("#searchInput").focus();
    }, 300);
  };
}
