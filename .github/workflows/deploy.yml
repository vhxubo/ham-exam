name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: 校验题库产物与源数据一致
        # 防止改了 data/raw 却忘跑构建脚本，把旧题库部署上线
        run: |
          python3 scripts/build_banks.py
          python3 scripts/build_standalone.py
          git diff --exit-code -- banks dist

      - name: 组装站点
        run: |
          mkdir -p _site
          cp index.html style.css app.js sw.js manifest.json icon.svg .nojekyll \
            icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png _site/
          cp -r banks _site/
          cp -r dist _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
